<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 340px; font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
  h2 { color: #4dabf7; font-size: 1.1em; margin-bottom: 12px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 0.8em; color: #888; margin-bottom: 3px; }
  .field input { width: 100%; padding: 8px 10px; border-radius: 5px; border: 1px solid #333; background: #16213e; color: #eee; font-size: 0.9em; }
  .field input:focus { outline: none; border-color: #4dabf7; }
  .btn { width: 100%; padding: 8px; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.85em; margin-bottom: 6px; }
  .btn-primary { background: #4dabf7; color: #000; }
  .btn-primary:hover { background: #339af0; }
  .btn-outline { background: transparent; color: #4dabf7; border: 1px solid #4dabf7; }
  .btn-outline:hover { background: #4dabf710; }
  .status { background: #16213e; border-radius: 6px; padding: 10px; margin-bottom: 10px; font-size: 0.8em; line-height: 1.8; }
  .row { display: flex; justify-content: space-between; }
  .row .v { font-weight: 600; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  .verde { color: #4caf50; } .vermelho { color: #f44336; } .azul { color: #4dabf7; } .amarelo { color: #ff9800; }
  .msg { font-size: 0.8em; padding: 8px; border-radius: 4px; margin-top: 8px; text-align: center; word-break: break-all; }
  .msg-ok { background: #4caf5020; color: #4caf50; }
  .msg-erro { background: #f4433620; color: #f44336; }
  .help { font-size: 0.7em; color: #555; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
  <h2>🎯 LiciteAgora Token Relay</h2>

  <div class="status">
    <div class="row"><span>Token</span><span class="v" id="sToken">--</span></div>
    <div class="row"><span>Servidor</span><span class="v" id="sServer">--</span></div>
    <div class="row"><span>Último envio</span><span class="v" id="sEnvio">--</span></div>
    <div class="row"><span>Capturados</span><span class="v azul" id="sCap">0</span></div>
    <div class="row"><span>Enviados</span><span class="v verde" id="sEnv">0</span></div>
    <div class="row"><span>Erros</span><span class="v vermelho" id="sErr">0</span></div>
    <div class="row" id="rowErro" style="display:none"><span>Último erro</span><span class="v vermelho" id="sUltErro">--</span></div>
  </div>

  <div class="field">
    <label>URL do servidor (API)</label>
    <input type="text" id="inputServer" placeholder="http://217.216.85.37:3000">
  </div>

  <button class="btn btn-primary" id="btnSalvar">💾 Salvar e Conectar</button>
  <button class="btn btn-outline" id="btnSync">🔄 Reenviar Token Agora</button>

  <div id="msgArea"></div>

  <div class="help">
    <strong>Como usar:</strong><br>
    1. Configure a URL do servidor acima<br>
    2. Navegue no Comprasnet normalmente<br>
    3. O token é capturado e enviado automaticamente<br>
    <br>
    <strong>Porta correta:</strong> use a porta da API (ex: 3000), não do site.
  </div>

<script>
  const $ = id => document.getElementById(id);

  function atualizarStatus() {
    chrome.runtime.sendMessage({ type: 'getStatus' }, (res) => {
      if (chrome.runtime.lastError) {
        showMsg('Service worker inativo: ' + chrome.runtime.lastError.message, false);
        return;
      }
      if (!res) {
        showMsg('Sem resposta do service worker', false);
        return;
      }

      $('sToken').textContent = res.ultimoToken || '❌ Nenhum';
      $('sToken').className = 'v ' + (res.ultimoToken ? 'verde' : 'vermelho');

      $('sServer').textContent = res.serverUrl || '❌ Não configurado';
      $('sServer').className = 'v ' + (res.serverUrl ? 'azul' : 'vermelho');

      $('sEnvio').textContent = res.ultimoEnvio || '--';
      $('sCap').textContent = res.stats?.capturados || 0;
      $('sEnv').textContent = res.stats?.enviados || 0;
      $('sErr').textContent = res.stats?.erros || 0;

      if (res.ultimoErro) {
        $('rowErro').style.display = 'flex';
        $('sUltErro').textContent = res.ultimoErro;
      } else {
        $('rowErro').style.display = 'none';
      }

      if (res.serverUrl) {
        $('inputServer').value = res.serverUrl;
      }
    });
  }

  function showMsg(text, ok) {
    $('msgArea').innerHTML = '<div class="msg ' + (ok ? 'msg-ok' : 'msg-erro') + '">' + text + '</div>';
    if (ok) setTimeout(() => $('msgArea').innerHTML = '', 4000);
  }

  $('btnSalvar').addEventListener('click', () => {
    const url = $('inputServer').value.trim();
    if (!url) return showMsg('Digite a URL do servidor', false);
    if (!url.startsWith('http')) return showMsg('URL deve começar com http:// ou https://', false);

    showMsg('Salvando...', true);

    chrome.runtime.sendMessage({ type: 'setServer', url }, (res) => {
      if (chrome.runtime.lastError) {
        showMsg('Erro: ' + chrome.runtime.lastError.message, false);
        return;
      }
      if (res?.ok) {
        const extra = res.enviou ? ' Token enviado!' : ' (navegue no Comprasnet para capturar token)';
        showMsg('✅ Servidor salvo!' + extra, true);
      } else {
        showMsg('Erro: ' + (res?.error || 'desconhecido'), false);
      }
      setTimeout(atualizarStatus, 500);
    });
  });

  $('btnSync').addEventListener('click', () => {
    showMsg('Enviando...', true);

    chrome.runtime.sendMessage({ type: 'forceSync' }, (res) => {
      if (chrome.runtime.lastError) {
        showMsg('Erro: ' + chrome.runtime.lastError.message, false);
        return;
      }
      if (res?.ok) showMsg('✅ Token enviado ao servidor!', true);
      else showMsg(res?.error || 'Falha ao enviar', false);
      setTimeout(atualizarStatus, 500);
    });
  });

  // Inicial + refresh periódico
  atualizarStatus();
  setInterval(atualizarStatus, 3000);
</script>
</body>
</html>
