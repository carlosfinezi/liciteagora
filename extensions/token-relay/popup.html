<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 300px; font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
  h2 { color: #4dabf7; font-size: 1.1em; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .status { background: #16213e; border-radius: 6px; padding: 10px; margin-bottom: 10px; font-size: 0.8em; line-height: 1.8; }
  .row { display: flex; justify-content: space-between; }
  .row .v { font-weight: 600; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  .verde { color: #4caf50; } .vermelho { color: #f44336; } .azul { color: #4dabf7; }
  .help { font-size: 0.75em; color: #555; line-height: 1.5; }
</style>
</head>
<body>
  <h2>🎯 Token Relay</h2>

  <div class="status">
    <div class="row"><span>Token</span><span class="v" id="sToken">--</span></div>
    <div class="row"><span>Captcha</span><span class="v" id="sCaptcha">--</span></div>
    <div class="row"><span>Servidor</span><span class="v azul" id="sServer">--</span></div>
    <div class="row"><span>Último envio</span><span class="v" id="sEnvio">--</span></div>
    <div class="row"><span>Capturados</span><span class="v azul" id="sCap">0</span></div>
    <div class="row"><span>Enviados</span><span class="v verde" id="sEnv">0</span></div>
    <div class="row"><span>Erros</span><span class="v vermelho" id="sErr">0</span></div>
    <div class="row" id="rowErro" style="display:none"><span>Último erro</span><span class="v vermelho" id="sUltErro">--</span></div>
  </div>

  <div class="help">
    Navegue no Comprasnet normalmente.<br>
    O token é capturado e enviado automaticamente.
  </div>

  <script src="popup.js"></script>
</body>
</html>
