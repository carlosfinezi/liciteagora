<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 300px;
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 15px;
    }
    h2 {
      color: #4dabf7;
      font-size: 16px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-box {
      background: #16213e;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #0f3460;
    }
    .status-row:last-child {
      border-bottom: none;
    }
    .status-label {
      color: #888;
      font-size: 12px;
    }
    .status-value {
      font-weight: 600;
      font-size: 12px;
    }
    .status-value.verde { color: #4caf50; }
    .status-value.amarelo { color: #ff9800; }
    .status-value.vermelho { color: #f44336; }
    .config-section {
      margin-bottom: 15px;
    }
    .config-section h3 {
      color: #4dabf7;
      font-size: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .config-row {
      margin-bottom: 10px;
    }
    .config-row label {
      display: block;
      color: #888;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .config-row input,
    .config-row select {
      width: 100%;
      padding: 8px;
      background: #0f3460;
      border: 1px solid #0f3460;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
    }
    .config-row input:focus,
    .config-row select:focus {
      outline: none;
      border-color: #4dabf7;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .btn-auto {
      background: #ff9800;
      color: #000;
    }
    .btn-auto.ativo {
      background: #4caf50;
      color: #fff;
    }
    .btn-auto:hover {
      opacity: 0.9;
    }
    .btn-abrir {
      background: #0f3460;
      color: #4dabf7;
    }
    .btn-abrir:hover {
      background: #16213e;
    }
    .aviso {
      background: #f4433620;
      border: 1px solid #f44336;
      padding: 10px;
      border-radius: 6px;
      font-size: 11px;
      color: #f44336;
      margin-bottom: 15px;
    }
    .aviso.conectado {
      background: #4caf5020;
      border-color: #4caf50;
      color: #4caf50;
    }
  </style>
</head>
<body>
  <h2>🎯 Lances Comprasnet</h2>

  <div id="avisoConexao" class="aviso">
    Aguardando conexão com página de disputa...
  </div>

  <div class="status-box">
    <div class="status-row">
      <span class="status-label">Status</span>
      <span class="status-value" id="statusTexto">-</span>
    </div>
    <div class="status-row">
      <span class="status-label">Itens</span>
      <span class="status-value" id="itensCount">0</span>
    </div>
    <div class="status-row">
      <span class="status-label">Modo</span>
      <span class="status-value" id="modoTexto">Manual</span>
    </div>
  </div>

  <div class="config-section">
    <h3>Configuração</h3>
    <div class="config-row">
      <label>Modo de Cobertura</label>
      <select id="modoCobertura">
        <option value="valor">Cobrir por Valor (R$)</option>
        <option value="percentual">Cobrir por Percentual (%)</option>
      </select>
    </div>
    <div class="config-row">
      <label>Valor/Percentual</label>
      <input type="number" id="valorCobertura" value="0.01" step="0.01" min="0.01">
    </div>
    <div class="config-row">
      <label>Valor Mínimo (opcional)</label>
      <input type="number" id="valorMinimo" placeholder="Sem limite" step="0.01" min="0">
    </div>
  </div>

  <button class="btn btn-auto" id="btnAuto" onclick="toggleAutomatico()">
    Ativar Automático
  </button>

  <button class="btn btn-abrir" onclick="abrirPagina()">
    Abrir Página de Lances
  </button>

  <script src="popup.js"></script>
</body>
</html>
