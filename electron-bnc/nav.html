<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; flex-direction: column; height: 100vh; font-family: -apple-system, sans-serif; }
  #navbar {
    display: flex; align-items: center; gap: 6px;
    background: #f0f0f0; padding: 4px 8px; border-bottom: 1px solid #ccc;
    height: 36px; flex-shrink: 0;
  }
  #navbar button {
    background: none; border: 1px solid #ccc; border-radius: 4px;
    cursor: pointer; padding: 2px 8px; font-size: 14px; height: 28px;
  }
  #navbar button:hover { background: #ddd; }
  #urlbar {
    flex: 1; border: 1px solid #ccc; border-radius: 4px;
    padding: 4px 8px; font-size: 13px; height: 28px;
    font-family: monospace;
  }
  #title {
    font-size: 13px; font-weight: bold; color: #d97706;
    padding: 0 4px; white-space: nowrap;
  }
  #status {
    font-size: 11px; color: #666; padding: 0 6px;
    white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis;
  }
  #status.ok { color: #15803d; font-weight: bold; }
  #status.err { color: #b91c1c; font-weight: bold; }
  #status.warn { color: #b45309; font-weight: bold; }
  webview {
    flex: 1; border: none;
  }
  #login-btn {
    background: #2563eb; color: white; border: none; border-radius: 4px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; height: 28px;
  }
  #login-btn:hover { background: #1d4ed8; }
  #login-btn:disabled { background: #94a3b8; cursor: not-allowed; }
</style>
</head>
<body>
  <div id="navbar">
    <span id="title">BNC</span>
    <button id="back" title="Voltar">&#9664;</button>
    <button id="fwd" title="Avançar">&#9654;</button>
    <button id="reload" title="Recarregar">&#8635;</button>
    <input id="urlbar" type="text" value="" />
    <button id="login-btn" title="Tentar login com credenciais salvas">Login</button>
    <span id="status">...</span>
  </div>
  <webview id="wv" src="" allowpopups partition="persist:bnc"></webview>

  <script>
    const { ipcRenderer } = require('electron');
    const wv = document.getElementById('wv');
    const urlbar = document.getElementById('urlbar');
    const statusEl = document.getElementById('status');
    const loginBtn = document.getElementById('login-btn');

    ipcRenderer.on('set-url', (e, url) => {
      wv.src = url;
      urlbar.value = url;
    });

    document.getElementById('back').onclick = () => { if (wv.canGoBack()) wv.goBack(); };
    document.getElementById('fwd').onclick = () => { if (wv.canGoForward()) wv.goForward(); };
    document.getElementById('reload').onclick = () => wv.reload();

    urlbar.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let url = urlbar.value.trim();
        if (!url.startsWith('http')) url = 'https://' + url;
        wv.src = url;
      }
    });

    wv.addEventListener('did-navigate', (e) => {
      urlbar.value = e.url;
      ipcRenderer.send('webview-navigated', e.url);
    });
    wv.addEventListener('did-navigate-in-page', (e) => {
      urlbar.value = e.url;
      ipcRenderer.send('webview-navigated', e.url);
    });

    wv.addEventListener('page-title-updated', (e) => {
      document.title = e.title + ' — LiciteAgora BNC';
    });

    ipcRenderer.on('status-update', (e, data) => {
      statusEl.textContent = data.text || '...';
      statusEl.className = data.kind || '';
    });

    loginBtn.onclick = () => {
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logando...';
      ipcRenderer.send('trigger-login');
      // re-habilitar após 35s (timeout do snippet é 30s)
      setTimeout(() => {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }, 35000);
    };

    // Pedir webContents id do webview pro main process (necessário pra
    // injetar scripts e amarrar interceptors corretamente)
    wv.addEventListener('dom-ready', () => {
      ipcRenderer.send('webview-ready', wv.getWebContentsId());
    });
  </script>
</body>
</html>
