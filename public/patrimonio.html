<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patrimônio · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div><h1>Patrimônio</h1><small>Bens, depreciação linear e movimentações</small></div>
    <div class="actions"><button class="btn btn-primary" onclick="abrirNovo()">+ Novo bem</button></div>
  </div>
  <div id="alertGlobal"></div>
  <div class="kpi-grid" id="kpis"></div>
  <div class="toolbar">
    <input type="text" id="fQ" placeholder="Buscar código, descrição, série…" oninput="debounce(carregar)" style="flex:1;min-width:240px;">
    <select id="fStatus" onchange="carregar()"><option value="ativo">Ativos</option><option value="baixado">Baixados</option><option value="">Todos</option></select>
    <input type="text" id="fCat" placeholder="Categoria…" oninput="debounce(carregar)" style="width:180px;">
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Código</th><th>Descrição</th><th>Categoria</th><th>Aquisição</th><th class="num">Valor</th><th class="num">Depreciação acum.</th><th class="num">Valor contábil</th><th class="num">% deprec.</th><th>Status</th><th></th>
      </tr></thead>
      <tbody id="tb"><tr><td colspan="10" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<div class="modal-bg" id="modal">
  <div class="modal" style="max-width:720px;">
    <div class="modal-header"><h3>Novo bem</h3><button class="btn btn-ghost btn-sm" onclick="fecharModal()">×</button></div>
    <div class="form-row">
      <div class="form-group" style="flex:2;"><label>Descrição *</label><input type="text" id="fDesc"></div>
      <div class="form-group"><label>Categoria</label><input type="text" id="fCatM" placeholder="Ex.: TI, Móveis, Veículos"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Marca</label><input type="text" id="fMarca"></div>
      <div class="form-group"><label>Modelo</label><input type="text" id="fModelo"></div>
      <div class="form-group"><label>Nº de série</label><input type="text" id="fSerie"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Valor de aquisição (R$) *</label><input type="number" id="fValor" step="0.01" min="0"></div>
      <div class="form-group"><label>Valor residual (R$)</label><input type="number" id="fResidual" step="0.01" min="0" value="0"></div>
      <div class="form-group"><label>Vida útil (meses)</label><input type="number" id="fVida" min="1" value="60"></div>
      <div class="form-group"><label>Data de aquisição *</label><input type="date" id="fData"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Localização</label><input type="text" id="fLoc"></div>
      <div class="form-group"><label>Responsável</label><input type="text" id="fResp"></div>
      <div class="form-group"><label>Centro de custo</label><select id="fCC"><option value="">—</option></select></div>
    </div>
    <div class="form-row"><div class="form-group full-width"><label>Observações</label><textarea id="fObs" rows="2"></textarea></div></div>
    <div class="actions-bar">
      <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Cadastrar</button>
    </div>
  </div>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('patrimonio');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
let debTimer; function debounce(fn){ clearTimeout(debTimer); debTimer=setTimeout(fn,300); }
function fmtBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

async function carregarCC(){
  const r = await fetch('/api/centros-custo').catch(()=>null);
  if (!r) return;
  const d = await r.json();
  if (d.success) document.getElementById('fCC').innerHTML = '<option value="">—</option>' + d.centros.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('');
}

async function carregar(){
  const p = new URLSearchParams();
  const q = document.getElementById('fQ').value.trim(); if (q) p.set('q', q);
  const st = document.getElementById('fStatus').value; if (st) p.set('status', st);
  const ct = document.getElementById('fCat').value.trim(); if (ct) p.set('categoria', ct);
  const r = await fetch('/api/patrimonio/bens?'+p);
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Total</div><div class="value">${d.kpis.total}</div></div>
    <div class="kpi success"><div class="label">Ativos</div><div class="value">${d.kpis.ativos}</div></div>
    <div class="kpi"><div class="label">Aquisição (ativos)</div><div class="value">${fmtBRL(d.kpis.valorAquisicaoTotal)}</div></div>
    <div class="kpi danger"><div class="label">Depreciação acum.</div><div class="value">${fmtBRL(d.kpis.depreciacaoAcumuladaTotal)}</div></div>
    <div class="kpi success"><div class="label">Valor contábil atual</div><div class="value">${fmtBRL(d.kpis.valorContabilTotal)}</div></div>
  `;
  document.getElementById('tb').innerHTML = d.bens.length ? d.bens.map(b=>`<tr>
    <td class="mono"><strong>${b.codigo}</strong></td>
    <td>${b.descricao}</td>
    <td>${b.categoria||'—'}</td>
    <td>${b.dataAquisicao}</td>
    <td class="num">${fmtBRL(b.valorAquisicao)}</td>
    <td class="num">${fmtBRL(b.depreciacaoAcumulada)}</td>
    <td class="num">${fmtBRL(b.valorContabil)}</td>
    <td class="num">${(b.percentualDepreciado||0).toFixed(0)}%</td>
    <td><span class="badge ${b.status==='ativo'?'entrada':'inativo'}">${b.status}</span></td>
    <td>
      ${b.status==='ativo' ? `<button class="btn btn-secondary btn-sm" onclick="transferir(${b.id})">Transferir</button>
                              <button class="btn btn-secondary btn-sm" onclick="manutencao(${b.id})">Manut.</button>
                              <button class="btn btn-danger btn-sm" onclick="baixar(${b.id})">Baixar</button>` : ''}
    </td>
  </tr>`).join('') : '<tr><td colspan="10" class="empty">Nenhum bem</td></tr>';
}

function abrirNovo(){
  ['fDesc','fCatM','fMarca','fModelo','fSerie','fValor','fLoc','fResp','fObs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fResidual').value='0'; document.getElementById('fVida').value='60';
  document.getElementById('fData').value=new Date().toISOString().slice(0,10);
  document.getElementById('fCC').value='';
  document.getElementById('modal').classList.add('open');
}
function fecharModal(){ document.getElementById('modal').classList.remove('open'); }

async function salvar(){
  const body = {
    descricao: document.getElementById('fDesc').value.trim(),
    categoria: document.getElementById('fCatM').value || null,
    marca: document.getElementById('fMarca').value || null,
    modelo: document.getElementById('fModelo').value || null,
    numeroSerie: document.getElementById('fSerie').value || null,
    valorAquisicao: Number(document.getElementById('fValor').value),
    valorResidual: Number(document.getElementById('fResidual').value)||0,
    vidaUtilMeses: Number(document.getElementById('fVida').value)||60,
    dataAquisicao: document.getElementById('fData').value,
    localizacao: document.getElementById('fLoc').value || null,
    responsavel: document.getElementById('fResp').value || null,
    centroCustoId: document.getElementById('fCC').value ? Number(document.getElementById('fCC').value) : null,
    observacoes: document.getElementById('fObs').value || null
  };
  if (!body.descricao || !body.valorAquisicao || !body.dataAquisicao) return showAlert('Descrição, valor e data obrigatórios','error');
  const r = await fetch('/api/patrimonio/bens', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  showAlert('Bem cadastrado: '+d.bem.codigo); fecharModal(); carregar();
}

async function transferir(id){
  const localizacao = prompt('Nova localização:'); if (localizacao===null) return;
  const responsavel = prompt('Novo responsável:') || null;
  const r = await fetch(`/api/patrimonio/bens/${id}/transferir`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ localizacao, responsavel }) });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  carregar();
}
async function baixar(id){
  const motivo = prompt('Motivo da baixa (mín 5 caracteres):'); if (!motivo) return;
  const valorVenda = prompt('Valor de venda (R$, opcional):');
  const r = await fetch(`/api/patrimonio/bens/${id}/baixar`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ motivo, valorVenda: valorVenda ? Number(valorVenda) : null }) });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  carregar();
}
async function manutencao(id){
  const descricao = prompt('Descrição da manutenção:'); if (!descricao) return;
  const valor = prompt('Valor (opcional):');
  const r = await fetch(`/api/patrimonio/bens/${id}/manutencao`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ descricao, valor: valor ? Number(valor) : null }) });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  showAlert('Manutenção registrada');
}

carregarCC().then(carregar);
</script>
</body></html>
