<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GNRE / DIFAL · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>GNRE / DIFAL</h1>
      <small>Diferencial de alíquota em venda interestadual a consumidor final — calcula, registra a guia e gera a conta a pagar</small>
    </div>
    <div class="actions">
      <button class="btn btn-primary btn-sm" onclick="abrirNova()">+ Nova guia</button>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="toolbar">
    <select id="filtStatus" onchange="carregar()">
      <option value="">Todos status</option>
      <option value="pendente">Pendente</option>
      <option value="paga">Paga</option>
      <option value="cancelada">Cancelada</option>
    </select>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead><tr><th>#</th><th>UF</th><th>Tipo</th><th>NF</th>
        <th style="text-align:right;">Base</th><th style="text-align:right;">DIFAL</th>
        <th style="text-align:right;">FCP</th><th style="text-align:right;">Total</th>
        <th>Vencimento</th><th>Status</th><th></th></tr></thead>
      <tbody id="tbGnre"><tr><td colspan="11" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<div class="modal-bg" id="modalNova">
  <div class="modal" style="max-width:620px;">
    <div class="modal-header">
      <h3 style="margin:0;">Nova guia GNRE/DIFAL</h3>
      <button class="btn btn-ghost btn-sm" onclick="fechar()" style="font-size:1.2em;padding:4px 10px;">×</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>UF destino *</label><input type="text" id="nUf" maxlength="2" style="text-transform:uppercase;width:70px;"></div>
      <div class="form-group"><label>Fatura/NF-e (id, opcional)</label><input type="number" id="nFatura"></div>
      <div class="form-group"><label>Vencimento</label><input type="date" id="nVenc"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Base de cálculo (R$) *</label><input type="number" id="nBase" step="0.01" oninput="calc()"></div>
      <div class="form-group"><label>Alíq. interna destino (%) *</label><input type="number" id="nAliInt" step="0.01" value="18" oninput="calc()"></div>
      <div class="form-group"><label>Alíq. interestadual (%) *</label><input type="number" id="nAliInter" step="0.01" value="12" oninput="calc()"></div>
      <div class="form-group"><label>FCP (%)</label><input type="number" id="nFcp" step="0.01" value="0" oninput="calc()"></div>
    </div>
    <div id="calcResumo" class="card card-info" style="font-size:0.92em;margin-bottom:10px;">Preencha a base e as alíquotas</div>
    <div class="form-row">
      <div class="form-group full-width">
        <label style="display:inline-flex;align-items:center;gap:8px;">
          <input type="checkbox" id="nGerarCP" checked> Gerar conta a pagar (fornecedor SEFAZ-UF)
        </label>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fechar()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Registrar guia</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('fiscal-gnre');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
function fmt(v){ return (v==null||isNaN(v))?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fechar(){ document.getElementById('modalNova').classList.remove('open'); }
const ST = { pendente:'<span class="badge saida">PENDENTE</span>', paga:'<span class="badge entrada">PAGA</span>', cancelada:'<span class="badge cancelado">CANCELADA</span>' };

async function carregar(){
  const st = document.getElementById('filtStatus').value;
  const r = await fetch('/api/gnre' + (st?'?status='+st:'')); const d = await r.json();
  if(!d.success) return showAlert(d.error,'error');
  document.getElementById('tbGnre').innerHTML = d.guias.length ? d.guias.map(g=>`<tr>
    <td>${g.id}</td><td><strong>${g.uf}</strong></td><td>${g.tipo.toUpperCase()}</td>
    <td>${g.faturaNumero||g.faturaId||'-'}</td>
    <td style="text-align:right;">${fmt(g.baseCalculo)}</td>
    <td style="text-align:right;">${fmt(g.valorDifal)}</td>
    <td style="text-align:right;">${fmt(g.valorFcp)}</td>
    <td style="text-align:right;"><strong>R$ ${fmt(g.valorTotal)}</strong></td>
    <td>${g.dataVencimento||'-'}</td>
    <td>${ST[g.status]||g.status}${g.contaPagarId?` <small class="muted">CP #${g.contaPagarId}</small>`:''}</td>
    <td style="white-space:nowrap;">
      ${g.status==='pendente' ? `<button class="btn btn-primary btn-sm" onclick="acao(${g.id},'baixar')">Baixar</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="acao(${g.id},'cancelar')">Cancelar</button>` : ''}
    </td>
  </tr>`).join('') : '<tr><td colspan="11" class="empty">Nenhuma guia</td></tr>';
}

function calc(){
  const base = Number(document.getElementById('nBase').value)||0;
  const ai = Number(document.getElementById('nAliInt').value)||0;
  const ae = Number(document.getElementById('nAliInter').value)||0;
  const fcp = Number(document.getElementById('nFcp').value)||0;
  if (!(base>0) || ai<=ae) { document.getElementById('calcResumo').textContent='Preencha a base e alíquotas (interna > interestadual)'; return; }
  const difal = base*(ai-ae)/100, vfcp = base*fcp/100;
  document.getElementById('calcResumo').innerHTML =
    `DIFAL: <strong>R$ ${fmt(difal)}</strong> (${ai}% − ${ae}% sobre ${fmt(base)})` +
    (fcp ? ` · FCP: <strong>R$ ${fmt(vfcp)}</strong>` : '') +
    ` · Total: <strong>R$ ${fmt(difal+vfcp)}</strong>`;
}

function abrirNova(){
  ['nUf','nFatura','nBase'].forEach(i=>document.getElementById(i).value='');
  const d = new Date(); d.setDate(d.getDate()+10);
  document.getElementById('nVenc').value = d.toISOString().slice(0,10);
  calc();
  document.getElementById('modalNova').classList.add('open');
}

async function salvar(){
  const body = {
    uf: document.getElementById('nUf').value.trim().toUpperCase(),
    faturaId: Number(document.getElementById('nFatura').value)||null,
    baseCalculo: Number(document.getElementById('nBase').value),
    aliquotaInterna: Number(document.getElementById('nAliInt').value),
    aliquotaInterestadual: Number(document.getElementById('nAliInter').value),
    percentualFcp: Number(document.getElementById('nFcp').value)||0,
    dataVencimento: document.getElementById('nVenc').value||null,
    gerarContaPagar: document.getElementById('nGerarCP').checked
  };
  const r = await fetch('/api/gnre', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if(!d.success) return showAlert(d.error,'error');
  fechar(); showAlert(`Guia registrada — R$ ${fmt(d.valorTotal)}${d.contaPagarId?' · CP #'+d.contaPagarId+' criada':''}`); carregar();
}

async function acao(id, verbo){
  const r = await fetch(`/api/gnre/${id}/${verbo}`, { method:'POST' }); const d = await r.json();
  if(!d.success) return showAlert(d.error,'error');
  showAlert(d.aviso || 'Atualizado'); carregar();
}

document.addEventListener('keydown', e => { if (e.key==='Escape') fechar(); });
carregar();
</script>
</body></html>
