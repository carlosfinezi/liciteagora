<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retenções em serviços tomados · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
<style>
  .rt-toolbar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
  .rt-toolbar .field { display: flex; flex-direction: column; gap: 4px; }
  .rt-toolbar label { font-size: 0.78em; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; }
  .rt-toolbar input, .rt-toolbar select { background: var(--bg-input); color: var(--text-0); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 6px 10px; }

  .rt-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .rt-kpi { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px 14px; }
  .rt-kpi .label { font-size: 0.78em; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; }
  .rt-kpi .value { font-size: 1.25em; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .rt-tbl { width: 100%; border-collapse: collapse; background: var(--bg-2); border-radius: var(--r-lg); overflow: hidden; }
  .rt-tbl th { text-align: left; font-size: 0.76em; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-2); padding: 10px 12px; background: var(--bg-1); border-bottom: 1px solid var(--border); }
  .rt-tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 0.9em; color: var(--text-0); }
  .rt-tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rt-tbl tfoot td { background: var(--bg-1); font-weight: 700; color: var(--accent); }

  .modal .form-ret { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal .form-ret label { color: var(--text-2); font-size: 0.85em; margin-bottom: 4px; display: block; }
  .modal .form-ret input { width: 100%; background: var(--bg-input); color: var(--text-0); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 6px 10px; text-align: right; font-variant-numeric: tabular-nums; }
  .modal .form-ret .full { grid-column: 1 / -1; }
  .modal .resumo { padding: 10px; background: var(--bg-1); border-radius: var(--r-md); margin: 12px 0; font-size: 0.9em; }
</style>
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Retenções em serviços tomados</h1>
      <small>INSS · IRRF · ISS · CSRF (PIS/COFINS/CSLL) — para recolhimento em DARF/GPS</small>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="rt-toolbar">
    <div class="field">
      <label>Competência</label>
      <input type="month" id="fComp" onchange="carregar()">
    </div>
    <div class="field">
      <label>Base</label>
      <select id="fBase" onchange="carregar()">
        <option value="vencimento">Vencimento</option>
        <option value="pagamento">Pagamento</option>
      </select>
    </div>
    <div class="field">
      <label>Filtro</label>
      <select id="fFiltro" onchange="carregar()">
        <option value="1">Somente com retenção</option>
        <option value="0">Todas as CPs do período</option>
      </select>
    </div>
  </div>

  <div class="rt-kpis" id="kpis"></div>

  <table class="rt-tbl">
    <thead><tr>
      <th>Data</th>
      <th>Fornecedor</th>
      <th>Descrição</th>
      <th style="text-align:right;">Bruto</th>
      <th style="text-align:right;">INSS</th>
      <th style="text-align:right;">IRRF</th>
      <th style="text-align:right;">ISS</th>
      <th style="text-align:right;">CSRF</th>
      <th style="text-align:right;">Líquido</th>
      <th style="text-align:right;">Ação</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
    <tfoot id="tfoot"></tfoot>
  </table>
</main></div>

<!-- Modal edição -->
<div class="modal-bg" id="modalRet">
  <div class="modal" style="max-width:520px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="color:var(--accent);margin:0;">Retenções desta CP</h3>
      <button class="btn btn-secondary" onclick="fecharModal()">×</button>
    </div>
    <div id="mDesc" style="color:var(--text-1);font-size:0.9em;margin-bottom:10px;"></div>
    <div class="resumo">Valor bruto: <strong id="mBruto">R$ 0,00</strong></div>
    <div class="form-ret">
      <div><label>INSS (R$)</label><input type="number" id="mInss" step="0.01" value="0" oninput="recalcModal()"></div>
      <div><label>IRRF (R$)</label><input type="number" id="mIrrf" step="0.01" value="0" oninput="recalcModal()"></div>
      <div><label>ISS (R$)</label><input type="number" id="mIss" step="0.01" value="0" oninput="recalcModal()"></div>
      <div><label>CSRF (R$)</label><input type="number" id="mCsrf" step="0.01" value="0" oninput="recalcModal()"></div>
    </div>
    <div class="resumo">
      Total retido: <strong id="mRetido">R$ 0,00</strong><br>
      Líquido a pagar ao fornecedor: <strong id="mLiquido">R$ 0,00</strong>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarModal()">Salvar</button>
    </div>
  </div>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('retencoes');</script>
<script>
let cpAtual = null;

function fmt(v){ return (v==null||isNaN(v))?'0,00':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtData(ymd){ if(!ymd)return'—'; const p=ymd.slice(0,10).split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:ymd; }
function val(id){ return document.getElementById(id).value; }
function setVal(id, v){ document.getElementById(id).value = v ?? ''; }
function showAlert(m, t='success'){
  const e = document.getElementById('alertGlobal');
  e.className = 'alert ' + t; e.textContent = m; e.style.display = 'block';
  setTimeout(()=>e.style.display='none', 5000);
}

function escape(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function hojeMes(){ return new Date().toISOString().slice(0,7); }

async function carregar(){
  const comp = val('fComp');
  const base = val('fBase');
  const somente = val('fFiltro');
  try {
    const [contas, totais] = await Promise.all([
      fetch(`/api/fiscal/retencoes/contas?competencia=${comp}&base=${base}&somenteComRetencao=${somente}`).then(r=>r.json()),
      fetch(`/api/fiscal/retencoes?competencia=${comp}&base=${base}`).then(r=>r.json())
    ]);
    if (!contas.success) throw new Error(contas.error);
    if (!totais.success) throw new Error(totais.error);
    renderKpis(totais);
    renderTabela(contas.contas);
  } catch (e) { showAlert('Erro: '+e.message, 'error'); }
}

function renderKpis(t){
  document.getElementById('kpis').innerHTML = `
    <div class="rt-kpi"><div class="label">INSS</div><div class="value">R$ ${fmt(t.totais.inss)}</div></div>
    <div class="rt-kpi"><div class="label">IRRF</div><div class="value">R$ ${fmt(t.totais.irrf)}</div></div>
    <div class="rt-kpi"><div class="label">ISS</div><div class="value">R$ ${fmt(t.totais.iss)}</div></div>
    <div class="rt-kpi"><div class="label">CSRF</div><div class="value">R$ ${fmt(t.totais.csrf)}</div></div>
    <div class="rt-kpi"><div class="label">Total retido</div><div class="value" style="color:var(--accent);">R$ ${fmt(t.totalRetido)}</div></div>
    <div class="rt-kpi"><div class="label">Contas</div><div class="value">${t.contas.length}</div></div>
  `;
}

function renderTabela(contas){
  const tb = document.getElementById('tbody');
  const tf = document.getElementById('tfoot');
  if (!contas.length) {
    tb.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-2);padding:20px;">Nenhuma conta no período.</td></tr>';
    tf.innerHTML = '';
    return;
  }
  const base = val('fBase');
  let totais = { bruto: 0, inss: 0, irrf: 0, iss: 0, csrf: 0, liquido: 0 };
  tb.innerHTML = contas.map(c => {
    const dt = base === 'pagamento' ? c.dataPagamento : c.dataVencimento;
    const inss = Number(c.valorInss) || 0;
    const irrf = Number(c.valorIrrf) || 0;
    const iss = Number(c.valorIss) || 0;
    const csrf = Number(c.valorCsrf) || 0;
    const bruto = Number(c.valor) || 0;
    const liq = Number(c.valorLiquido) || (bruto - inss - irrf - iss - csrf);
    totais.bruto += bruto; totais.inss += inss; totais.irrf += irrf; totais.iss += iss; totais.csrf += csrf; totais.liquido += liq;
    return `<tr>
      <td>${fmtData(dt)}</td>
      <td>${escape(c.fornecedorNome || '—')}<br><small style="color:var(--text-3);">${escape(c.fornecedorCnpj||'')}</small></td>
      <td>${escape(c.descricao||'')}</td>
      <td class="num">R$ ${fmt(bruto)}</td>
      <td class="num">${inss?'R$ '+fmt(inss):'<span style="color:var(--text-3);">—</span>'}</td>
      <td class="num">${irrf?'R$ '+fmt(irrf):'<span style="color:var(--text-3);">—</span>'}</td>
      <td class="num">${iss?'R$ '+fmt(iss):'<span style="color:var(--text-3);">—</span>'}</td>
      <td class="num">${csrf?'R$ '+fmt(csrf):'<span style="color:var(--text-3);">—</span>'}</td>
      <td class="num">R$ ${fmt(liq)}</td>
      <td class="num"><button class="btn btn-secondary" style="padding:4px 8px;font-size:0.8em;" onclick="abrirEdicao(${c.id})">✏️ Editar</button></td>
    </tr>`;
  }).join('');
  tf.innerHTML = `<tr>
    <td colspan="3">Totais</td>
    <td class="num">R$ ${fmt(totais.bruto)}</td>
    <td class="num">R$ ${fmt(totais.inss)}</td>
    <td class="num">R$ ${fmt(totais.irrf)}</td>
    <td class="num">R$ ${fmt(totais.iss)}</td>
    <td class="num">R$ ${fmt(totais.csrf)}</td>
    <td class="num">R$ ${fmt(totais.liquido)}</td>
    <td></td>
  </tr>`;
}

async function abrirEdicao(id){
  try {
    const r = await fetch('/api/fiscal/retencoes/cp/' + id);
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    cpAtual = d.conta;
    document.getElementById('mDesc').textContent = cpAtual.descricao || '(sem descrição)';
    document.getElementById('mBruto').textContent = 'R$ ' + fmt(cpAtual.valor);
    setVal('mInss', Number(cpAtual.valorInss) || 0);
    setVal('mIrrf', Number(cpAtual.valorIrrf) || 0);
    setVal('mIss', Number(cpAtual.valorIss) || 0);
    setVal('mCsrf', Number(cpAtual.valorCsrf) || 0);
    recalcModal();
    document.getElementById('modalRet').classList.add('open');
  } catch (e) { showAlert('Erro: '+e.message, 'error'); }
}

function fecharModal(){ document.getElementById('modalRet').classList.remove('open'); cpAtual = null; }

function recalcModal(){
  const inss = parseFloat(val('mInss')) || 0;
  const irrf = parseFloat(val('mIrrf')) || 0;
  const iss = parseFloat(val('mIss')) || 0;
  const csrf = parseFloat(val('mCsrf')) || 0;
  const bruto = Number(cpAtual?.valor) || 0;
  const ret = inss + irrf + iss + csrf;
  document.getElementById('mRetido').textContent = 'R$ ' + fmt(ret);
  document.getElementById('mLiquido').textContent = 'R$ ' + fmt(bruto - ret);
}

async function salvarModal(){
  if (!cpAtual) return;
  try {
    const body = {
      valorInss: parseFloat(val('mInss')) || 0,
      valorIrrf: parseFloat(val('mIrrf')) || 0,
      valorIss: parseFloat(val('mIss')) || 0,
      valorCsrf: parseFloat(val('mCsrf')) || 0
    };
    const r = await fetch('/api/fiscal/retencoes/cp/' + cpAtual.id, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    fecharModal();
    carregar();
    showAlert('Retenções salvas');
  } catch (e) { showAlert('Erro: '+e.message, 'error'); }
}

// Bootstrap
setVal('fComp', hojeMes());
carregar();
</script>
</body>
</html>
