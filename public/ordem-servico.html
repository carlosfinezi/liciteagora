<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
<style>
/* page-local: .tabs/.tab vêm de app-modern.css */
.tab-pane { display:none; } .tab-pane.active { display:block; }
.cards-grid { display:grid; grid-template-columns:1fr 320px; gap:14px; }
@media (max-width:980px) { .cards-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1 id="pgTitulo">OS</h1>
      <small id="pgSub"></small>
    </div>
    <div class="actions">
      <a class="btn btn-secondary" href="/ordens-servico.html">← Lista</a>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="cards-grid">
    <div class="card">
      <div class="tabs">
        <div class="tab active" onclick="trocarTab('info')">Informações</div>
        <div class="tab" onclick="trocarTab('pecas')">Peças</div>
        <div class="tab" onclick="trocarTab('servicos')">Serviços</div>
        <div class="tab" onclick="trocarTab('apont')">Apontamentos</div>
      </div>

      <div class="tab-pane active" id="tab-info">
        <div id="info">Carregando…</div>
      </div>

      <div class="tab-pane" id="tab-pecas">
        <div class="form-row">
          <div class="form-group" style="flex:2;position:relative;">
            <label>Produto *</label>
            <input type="text" id="pProdBusca" placeholder="SKU ou descrição…" oninput="acProd()" autocomplete="off">
            <input type="hidden" id="pProdId">
            <input type="hidden" id="pRastreiaLote">
            <input type="hidden" id="pRastreiaSerial">
            <div id="acProdList" class="ac-list"></div>
          </div>
          <div class="form-group">
            <label>Qtd *</label>
            <input type="number" id="pQtd" step="any" min="0.001" value="1">
          </div>
          <div class="form-group">
            <label>Valor unit. *</label>
            <input type="number" id="pValor" step="0.01" min="0" value="0">
          </div>
        </div>
        <div class="form-row" id="pRowLote" style="display:none;">
          <div class="form-group full-width">
            <label>Lote</label>
            <select id="pLote"><option value="">— escolha —</option></select>
          </div>
        </div>
        <div class="actions-bar">
          <button class="btn btn-primary btn-sm" onclick="addPeca()">+ Adicionar peça</button>
        </div>
        <table style="margin-top:10px;">
          <thead><tr><th>SKU</th><th>Descrição</th><th class="num">Qtd</th><th class="num">Valor</th><th class="num">Total</th><th>Lote</th><th></th></tr></thead>
          <tbody id="tbPecas"></tbody>
        </table>
      </div>

      <div class="tab-pane" id="tab-servicos">
        <div class="form-row">
          <div class="form-group" style="flex:3;">
            <label>Descrição *</label>
            <input type="text" id="sDesc" placeholder="Ex.: Diagnóstico técnico">
          </div>
          <div class="form-group">
            <label>Horas</label>
            <input type="number" id="sHoras" step="0.5" min="0">
          </div>
          <div class="form-group">
            <label>R$/hora</label>
            <input type="number" id="sValor" step="0.01" min="0">
          </div>
          <div class="form-group">
            <label>Total (alternativo)</label>
            <input type="number" id="sTotal" step="0.01" min="0">
          </div>
        </div>
        <div class="actions-bar">
          <button class="btn btn-primary btn-sm" onclick="addServico()">+ Adicionar serviço</button>
        </div>
        <table style="margin-top:10px;">
          <thead><tr><th>Descrição</th><th class="num">Horas</th><th class="num">R$/h</th><th class="num">Total</th><th></th></tr></thead>
          <tbody id="tbServicos"></tbody>
        </table>
      </div>

      <div class="tab-pane" id="tab-apont">
        <div class="form-row">
          <div class="form-group">
            <label>Início *</label>
            <input type="datetime-local" id="aIni">
          </div>
          <div class="form-group">
            <label>Fim</label>
            <input type="datetime-local" id="aFim">
          </div>
          <div class="form-group">
            <label>Horas (opcional)</label>
            <input type="number" id="aHoras" step="0.1" min="0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full-width">
            <label>Descrição</label>
            <input type="text" id="aDesc">
          </div>
        </div>
        <div class="actions-bar">
          <button class="btn btn-primary btn-sm" onclick="addApont()">+ Adicionar apontamento</button>
        </div>
        <table style="margin-top:10px;">
          <thead><tr><th>Início</th><th>Fim</th><th>Horas</th><th>Técnico</th><th>Descrição</th><th></th></tr></thead>
          <tbody id="tbApont"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>Resumo</h3>
      <div id="resumo" class="muted">…</div>
      <hr style="margin:14px 0;border:0;border-top:1px solid #2a3a5c;">
      <h3>Ações</h3>
      <div id="acoes"></div>
    </div>
  </div>
</main></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('ordens-servico');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
function fmtBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const id = new URLSearchParams(window.location.search).get('id');
let osData = null;

function trocarTab(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
}

async function carregar(){
  if (!id) return showAlert('ID não informado','error');
  const r = await fetch('/api/os/'+id);
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  osData = d;
  document.getElementById('pgTitulo').textContent = d.os.numero;
  document.getElementById('pgSub').textContent = d.os.titulo;
  renderInfo();
  renderPecas(d.pecas);
  renderServicos(d.servicos);
  renderApontamentos(d.apontamentos);
  renderResumo();
  renderAcoes();
  // default datetime para apontamento
  const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('aIni').value = now.toISOString().slice(0,16);
}

function renderInfo(){
  const o = osData.os;
  document.getElementById('info').innerHTML = `
    <table style="width:100%;font-size:13px;">
      <tr><td class="muted">Cliente</td><td>${o.clienteNome} <small class="muted">${o.clienteCpfCnpj||''}</small></td></tr>
      <tr><td class="muted">Técnico</td><td>${o.tecnicoNomeExibicao||o.tecnicoNome||'—'}</td></tr>
      <tr><td class="muted">Equipamento</td><td>${[o.equipamento,o.marca,o.modelo].filter(Boolean).join(' ') || '—'}</td></tr>
      <tr><td class="muted">Nº de série</td><td class="mono">${o.numeroSerieEquipamento||'—'}</td></tr>
      <tr><td class="muted">Garantia</td><td>${o.garantiaDias||0} dia(s)</td></tr>
      <tr><td class="muted">Aberta em</td><td>${o.dataAbertura}</td></tr>
      ${o.dataInicioExecucao ? `<tr><td class="muted">Iniciada em</td><td>${o.dataInicioExecucao}</td></tr>` : ''}
      ${o.dataConclusao ? `<tr><td class="muted">Concluída em</td><td>${o.dataConclusao}</td></tr>` : ''}
      ${o.dataFaturamento ? `<tr><td class="muted">Faturada em</td><td>${o.dataFaturamento} (pedido #${o.pedidoId})</td></tr>` : ''}
    </table>
    ${o.defeitoRelatado ? `<h4 style="margin-top:14px;">Defeito relatado</h4><div style="background:#0f1a30;padding:8px;border-radius:6px;font-size:13px;">${escapeHtml(o.defeitoRelatado)}</div>` : ''}
    ${o.diagnostico ? `<h4 style="margin-top:14px;">Diagnóstico</h4><div style="background:#0f1a30;padding:8px;border-radius:6px;font-size:13px;">${escapeHtml(o.diagnostico)}</div>` : ''}
    ${o.solucao ? `<h4 style="margin-top:14px;">Solução</h4><div style="background:#0f1a30;padding:8px;border-radius:6px;font-size:13px;">${escapeHtml(o.solucao)}</div>` : ''}
    ${o.observacoes ? `<h4 style="margin-top:14px;">Observações</h4><div style="background:#0f1a30;padding:8px;border-radius:6px;font-size:13px;">${escapeHtml(o.observacoes)}</div>` : ''}
  `;
}

function renderPecas(pecas){
  document.getElementById('tbPecas').innerHTML = pecas.length ? pecas.map(p=>`<tr>
    <td class="mono">${p.sku}</td>
    <td>${p.descricao}</td>
    <td class="num">${p.quantidade}</td>
    <td class="num">${fmtBRL(p.valorUnitario)}</td>
    <td class="num">${fmtBRL(p.valorTotal)}</td>
    <td>${p.loteNumero||'—'}</td>
    <td>${p.movSaidaId ? '<small class="muted">baixada</small>' : `<button class="btn btn-danger btn-sm" onclick="remPeca(${p.id})">×</button>`}</td>
  </tr>`).join('') : '<tr><td colspan="7" class="empty">Sem peças</td></tr>';
}

function renderServicos(servicos){
  document.getElementById('tbServicos').innerHTML = servicos.length ? servicos.map(s=>`<tr>
    <td>${s.descricao}</td>
    <td class="num">${s.horas||'—'}</td>
    <td class="num">${s.valorHora?fmtBRL(s.valorHora):'—'}</td>
    <td class="num">${fmtBRL(s.valorTotal)}</td>
    <td><button class="btn btn-danger btn-sm" onclick="remServico(${s.id})">×</button></td>
  </tr>`).join('') : '<tr><td colspan="5" class="empty">Sem serviços</td></tr>';
}

function renderApontamentos(ap){
  document.getElementById('tbApont').innerHTML = ap.length ? ap.map(a=>`<tr>
    <td>${a.dataInicio}</td>
    <td>${a.dataFim||'—'}</td>
    <td>${a.horas?Number(a.horas).toFixed(2):'—'}</td>
    <td>${a.tecnicoNome||'—'}</td>
    <td>${a.descricao||'—'}</td>
    <td><button class="btn btn-danger btn-sm" onclick="remApont(${a.id})">×</button></td>
  </tr>`).join('') : '<tr><td colspan="6" class="empty">Sem apontamentos</td></tr>';
}

function renderResumo(){
  const o = osData.os;
  document.getElementById('resumo').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span class="badge ${o.status==='concluida'||o.status==='faturada'?'entrada':o.status==='cancelada'?'inativo':'pendente'}">${o.status}</span>
    </div>
    <div style="font-size:13px;">
      <div style="display:flex;justify-content:space-between;padding:4px 0;"><span class="muted">Peças</span><strong>${fmtBRL(o.valorPecas)}</strong></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;"><span class="muted">Serviços</span><strong>${fmtBRL(o.valorServicos)}</strong></div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid #2a3a5c;margin-top:4px;font-size:15px;"><span><strong>Total</strong></span><strong style="color:#69db7c;">${fmtBRL(o.valorTotal)}</strong></div>
    </div>
  `;
}

function renderAcoes(){
  const o = osData.os;
  let html = '';
  if (o.status === 'aberta' || o.status === 'aguardando-peca') html += `<button class="btn btn-primary" style="width:100%;margin-bottom:6px;" onclick="iniciar()">▶ Iniciar execução</button>`;
  if (o.status === 'em-andamento' || o.status === 'aberta') html += `<button class="btn btn-secondary" style="width:100%;margin-bottom:6px;" onclick="aguardar()">⏳ Aguardando peça</button>`;
  if (['aberta','em-andamento','aguardando-peca'].includes(o.status)) html += `<button class="btn btn-success" style="width:100%;margin-bottom:6px;" onclick="concluir()">✓ Concluir</button>`;
  if (o.status === 'concluida') html += `<button class="btn btn-primary" style="width:100%;margin-bottom:6px;" onclick="faturar()">💰 Faturar (gera pedido)</button>`;
  if (!['faturada','cancelada'].includes(o.status)) html += `<button class="btn btn-danger" style="width:100%;" onclick="cancelar()">✖ Cancelar</button>`;
  if (o.status === 'faturada' && o.pedidoId) html += `<a class="btn btn-secondary" href="/pedido.html?id=${o.pedidoId}" style="display:block;text-align:center;">Ver pedido #${o.pedidoId}</a>`;
  document.getElementById('acoes').innerHTML = html || '<small class="muted">Nenhuma ação disponível</small>';
}

// Peças autocomplete + add
let acTimer;
function acProd(){
  clearTimeout(acTimer);
  const q = document.getElementById('pProdBusca').value.trim();
  if (q.length<2){ document.getElementById('acProdList').innerHTML=''; return; }
  acTimer = setTimeout(async()=>{
    const r=await fetch('/api/produtos/autocomplete?q='+encodeURIComponent(q));
    const d=await r.json();
    document.getElementById('acProdList').innerHTML = (d.produtos||[]).map(p=>
      `<div onclick='selProd(${p.id}, ${JSON.stringify(p.sku)}, ${JSON.stringify(p.descricao||"")}, ${p.precoVenda||0}, ${p.rastreiaLote||0}, ${p.rastreiaSerial||0})'>${p.sku} — ${p.descricao||''}</div>`
    ).join('');
  },200);
}
async function selProd(id, sku, descricao, preco, rL, rS){
  document.getElementById('pProdId').value=id;
  document.getElementById('pProdBusca').value=sku+' — '+descricao;
  document.getElementById('pValor').value=preco;
  document.getElementById('pRastreiaLote').value=rL;
  document.getElementById('pRastreiaSerial').value=rS;
  document.getElementById('acProdList').innerHTML='';
  if (rL) {
    document.getElementById('pRowLote').style.display='';
    const r = await fetch('/api/lotes?produtoId='+id+'&comSaldo=1');
    const d = await r.json();
    document.getElementById('pLote').innerHTML = '<option value="">— escolha —</option>' + (d.lotes||[]).map(l=>`<option value="${l.id}">${l.numero}</option>`).join('');
  } else {
    document.getElementById('pRowLote').style.display='none';
  }
}

async function addPeca(){
  const body = {
    produtoId: Number(document.getElementById('pProdId').value),
    descricao: document.getElementById('pProdBusca').value,
    quantidade: Number(document.getElementById('pQtd').value),
    valorUnitario: Number(document.getElementById('pValor').value),
    loteId: document.getElementById('pLote').value ? Number(document.getElementById('pLote').value) : null
  };
  if (!body.produtoId || !body.quantidade) return showAlert('Produto e quantidade obrigatórios','error');
  const r = await fetch('/api/os/'+id+'/pecas', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  ['pProdId','pProdBusca'].forEach(x=>document.getElementById(x).value='');
  document.getElementById('pQtd').value='1'; document.getElementById('pValor').value='0';
  carregar();
}

async function remPeca(itemId){
  if (!confirm('Remover esta peça?')) return;
  const r = await fetch('/api/os/pecas/'+itemId, { method:'DELETE' });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  carregar();
}

async function addServico(){
  const body = {
    descricao: document.getElementById('sDesc').value.trim(),
    horas: document.getElementById('sHoras').value ? Number(document.getElementById('sHoras').value) : null,
    valorHora: document.getElementById('sValor').value ? Number(document.getElementById('sValor').value) : null,
    valorTotal: document.getElementById('sTotal').value ? Number(document.getElementById('sTotal').value) : null
  };
  if (!body.descricao) return showAlert('Descrição obrigatória','error');
  const r = await fetch('/api/os/'+id+'/servicos', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  ['sDesc','sHoras','sValor','sTotal'].forEach(x=>document.getElementById(x).value='');
  carregar();
}
async function remServico(id){
  if (!confirm('Remover este serviço?')) return;
  const r = await fetch('/api/os/servicos/'+id, { method:'DELETE' });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  carregar();
}

async function addApont(){
  const body = {
    dataInicio: document.getElementById('aIni').value,
    dataFim: document.getElementById('aFim').value || null,
    horas: document.getElementById('aHoras').value ? Number(document.getElementById('aHoras').value) : null,
    descricao: document.getElementById('aDesc').value || null
  };
  if (!body.dataInicio) return showAlert('Início obrigatório','error');
  const r = await fetch('/api/os/'+id+'/apontamentos', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  document.getElementById('aDesc').value=''; document.getElementById('aHoras').value='';
  carregar();
}
async function remApont(id){
  if (!confirm('Remover apontamento?')) return;
  const r = await fetch('/api/os/apontamentos/'+id, { method:'DELETE' });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  carregar();
}

async function iniciar(){
  const r = await fetch(`/api/os/${id}/iniciar`, { method:'POST' });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  showAlert('OS em execução'); carregar();
}
async function aguardar(){
  const r = await fetch(`/api/os/${id}/aguardar-peca`, { method:'POST' });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  carregar();
}
async function concluir(){
  const solucao = prompt('Solução aplicada (opcional, mas recomendada):');
  if (solucao === null) return;
  const baixar = confirm('Baixar peças do estoque agora? (Cancelar = não baixar)');
  const r = await fetch(`/api/os/${id}/concluir`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ solucao, baixarEstoque: baixar }) });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  showAlert('OS concluída'); carregar();
}
async function cancelar(){
  const motivo = prompt('Motivo do cancelamento (mín. 5 caracteres):');
  if (!motivo) return;
  const r = await fetch(`/api/os/${id}/cancelar`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ motivo }) });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  carregar();
}
async function faturar(){
  if (!confirm('Faturar esta OS? Será criado um pedido vinculado com peças e serviços.')) return;
  const r = await fetch(`/api/os/${id}/faturar`, { method:'POST' });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  showAlert('OS faturada — pedido #'+d.pedidoId); carregar();
}

carregar();
</script>
</body></html>
