<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugestão de Compra · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Sugestão de Compra</h1>
      <small>Produtos com disponível abaixo do ponto de reposição</small>
    </div>
    <div class="actions">
      <a class="btn btn-secondary" href="/estoque.html">← Estoque</a>
      <a class="btn btn-secondary" href="/pedidos-compra.html">Pedidos de compra</a>
      <button class="btn btn-primary" onclick="gerarPedidos()">Gerar pedido(s) selecionados</button>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="toolbar">
    <label style="display:inline-flex;align-items:center;gap:6px;color:var(--text-2);">
      <input type="checkbox" id="checkTodos" onchange="toggleTodos()"> Selecionar todos
    </label>
    <input type="text" id="filtQ" placeholder="Filtrar por SKU ou descrição…" oninput="debounce(renderItens)" style="flex:1;min-width:220px;">
    <select id="filtFornec" onchange="renderItens()">
      <option value="">Todos fornecedores</option>
    </select>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th style="width:32px;"></th>
        <th>SKU</th><th>Descrição</th>
        <th style="text-align:right;">Disponível</th>
        <th style="text-align:right;">Limite</th>
        <th style="text-align:right;">Consumo diário</th>
        <th style="text-align:right;">Qtd sugerida</th>
        <th style="text-align:right;">Cobertura proj.</th>
        <th style="text-align:right;">Custo estimado</th>
        <th>Fornecedor</th>
      </tr></thead>
      <tbody id="tb"><tr><td colspan="10" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<div id="toasts"></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('estoque-sugestao-compra');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
function fmt(v){ return (v==null||isNaN(v))?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtInt(v){ return (v==null||isNaN(v))?'-':Number(v).toLocaleString('pt-BR'); }
let debTimer; function debounce(fn){ clearTimeout(debTimer); debTimer=setTimeout(fn, 300); }

let itensCache = [];

async function carregar(){
  const r=await fetch('/api/estoque/sugestao-compra');
  const d=await r.json();
  if(!d.success) return showAlert(d.error,'error');
  itensCache = d.itens;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi warn"><div class="label">Itens para comprar</div><div class="value">${d.resumo.totalItens}</div></div>
    <div class="kpi"><div class="label">Custo total estimado</div><div class="value">R$ ${fmt(d.resumo.custoTotalEstimado)}</div></div>
    <div class="kpi success"><div class="label">Fornecedores</div><div class="value">${d.resumo.fornecedoresDistintos}</div></div>
  `;

  // Popula select de fornecedores
  const fornecs = [...new Map(itensCache.filter(i=>i.fornecedorId).map(i=>[i.fornecedorId,i.fornecedorNome])).entries()];
  document.getElementById('filtFornec').innerHTML = '<option value="">Todos fornecedores</option>' +
    fornecs.map(([id,nome])=>`<option value="${id}">${nome}</option>`).join('');

  renderItens();
}

function renderItens(){
  const q = document.getElementById('filtQ').value.toLowerCase();
  const fornec = document.getElementById('filtFornec').value;
  const itens = itensCache.filter(i => {
    if (q && !((i.sku||'').toLowerCase().includes(q) || (i.descricao||'').toLowerCase().includes(q))) return false;
    if (fornec && String(i.fornecedorId||'') !== fornec) return false;
    return true;
  });

  const tb = document.getElementById('tb');
  tb.innerHTML = itens.length ? itens.map(i=>{
    const cobertura = i.coberturaProjetadaDias != null ? `${fmt(i.coberturaProjetadaDias)}d` : '—';
    return `<tr>
      <td><input type="checkbox" class="check-item" data-id="${i.id}" data-fornec="${i.fornecedorId||''}"
                 data-qtd="${i.quantidadeSugerida}" data-custo="${i.custoMedio||i.precoCusto||0}"></td>
      <td class="mono">${i.sku}</td>
      <td>${i.descricao}</td>
      <td style="text-align:right;color:var(--danger);font-weight:700;">${fmt(i.disponivel)}</td>
      <td style="text-align:right;color:var(--text-2);">${fmt(i.limite)}</td>
      <td style="text-align:right;">${fmt(i.consumoDiarioMedio)}</td>
      <td style="text-align:right;font-weight:600;">
        <input type="number" class="qtd-input" value="${i.quantidadeSugerida}" step="0.01" data-id="${i.id}"
               style="width:90px;text-align:right;font-weight:600;" onchange="atualizarCusto(${i.id})">
      </td>
      <td style="text-align:right;">${cobertura}</td>
      <td style="text-align:right;" id="custoEst-${i.id}">R$ ${fmt(i.custoSugerido)}</td>
      <td>${i.fornecedorNome||'<span class="muted">—</span>'}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="10" class="empty">Nenhum produto precisa ser comprado 🎉</td></tr>';
}

function atualizarCusto(id){
  const inp = document.querySelector(`.qtd-input[data-id="${id}"]`);
  const qtd = Number(inp.value) || 0;
  const item = itensCache.find(i => i.id === id);
  if (!item) return;
  const custoUnit = item.custoMedio || item.precoCusto || 0;
  document.getElementById('custoEst-'+id).textContent = 'R$ ' + fmt(qtd * custoUnit);
}

function toggleTodos(){
  const check = document.getElementById('checkTodos').checked;
  document.querySelectorAll('.check-item').forEach(c => c.checked = check);
}

async function gerarPedidos(){
  const checks = document.querySelectorAll('.check-item:checked');
  if (!checks.length) return showAlert('Selecione ao menos um item', 'error');

  // Agrupar por fornecedor (1 pedido por fornecedor)
  const grupos = {};
  for (const c of checks) {
    const id = Number(c.dataset.id);
    const fornec = c.dataset.fornec || '0';  // '0' = sem fornecedor
    const qtdInp = document.querySelector(`.qtd-input[data-id="${id}"]`);
    const qtd = Number(qtdInp.value) || 0;
    if (qtd <= 0) continue;
    const item = itensCache.find(i => i.id === id);
    if (!item) continue;
    if (!grupos[fornec]) grupos[fornec] = { fornecedorId: fornec==='0' ? null : Number(fornec), itens: [] };
    grupos[fornec].itens.push({
      produtoId: item.id,
      quantidade: qtd,
      custoUnitario: item.custoMedio || item.precoCusto || 0,
      observacoes: `Sugestão: disponível ${fmt(item.disponivel)} / limite ${fmt(item.limite)}`
    });
  }

  const gruposArr = Object.values(grupos);
  if (!gruposArr.length) return showAlert('Nenhum item válido selecionado','error');

  if (!confirm(`Gerar ${gruposArr.length} pedido(s) de compra com um total de ${checks.length} item(ns)?`)) return;

  const criados = [];
  for (const g of gruposArr) {
    try {
      const r = await fetch('/api/pedidos-compra', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          fornecedorId: g.fornecedorId,
          observacoes: 'Gerado automaticamente pela sugestão de compra',
          itens: g.itens
        })
      });
      const d = await r.json();
      if (!d.success) throw new Error(d.error);
      criados.push(d.pedido.numero);
    } catch(e){
      showAlert(`Erro no grupo: ${e.message}`, 'error');
      return;
    }
  }

  showAlert(`${criados.length} pedido(s) criado(s): ${criados.join(', ')}`);
  setTimeout(() => window.location.href = '/pedidos-compra.html', 1500);
}

carregar();
</script>
</body></html>
