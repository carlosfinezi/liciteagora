<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trocar senha</title>
<link rel="stylesheet" href="/portal/portal-style.css">
</head>
<body>
<header><h1>Portal do Cliente</h1><div class="user"><span id="razao">…</span><button onclick="logout()">Sair</button></div></header>
<nav>
  <a href="/portal/index.html">Início</a>
  <a href="/portal/pedidos.html">Pedidos</a>
  <a href="/portal/cobrancas.html">Cobranças</a>
  <a href="/portal/nfses.html">NF-e/NFS-e</a>
  <a href="/portal/contratos.html">Contratos</a>
  <a href="/portal/perfil.html" class="active">Trocar senha</a>
</nav>
<main>
  <h2>Trocar senha</h2>
  <div id="msg" style="margin-bottom:14px;"></div>
  <div style="max-width:420px; background:#16213e; padding:20px; border-radius:8px;">
    <label style="display:block;margin-bottom:6px;font-size:13px;color:#aaa;">Senha atual</label>
    <input type="password" id="atual" autocomplete="current-password" style="width:100%;padding:10px;border:1px solid #2a3a5c;border-radius:6px;background:#0f1a30;color:#e0e0e0;margin-bottom:14px;box-sizing:border-box;">
    <label style="display:block;margin-bottom:6px;font-size:13px;color:#aaa;">Nova senha (mín. 6 caracteres)</label>
    <input type="password" id="nova" autocomplete="new-password" style="width:100%;padding:10px;border:1px solid #2a3a5c;border-radius:6px;background:#0f1a30;color:#e0e0e0;margin-bottom:14px;box-sizing:border-box;">
    <button onclick="trocar()" style="background:#4dabf7;color:#fff;border:none;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:600;">Trocar senha</button>
  </div>
</main>
<script src="/portal/portal-common.js"></script>
<script>
async function trocar(){
  const senhaAtual = document.getElementById('atual').value;
  const senhaNova  = document.getElementById('nova').value;
  if (!senhaAtual || !senhaNova) return msg('Preencha ambos os campos','err');
  const r = await fetch('/portal/api/me/senha', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ senhaAtual, senhaNova }) });
  const d = await r.json();
  if (!d.success) return msg(d.error,'err');
  msg('Senha trocada com sucesso','ok');
  document.getElementById('atual').value=''; document.getElementById('nova').value='';
}
function msg(m,t){ const e=document.getElementById('msg'); e.textContent=m; e.style.color = t==='ok'?'#69db7c':'#ff8888'; }
initMe();
</script>
</body></html>
