<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotação de Preços</title>
<style>
  :root { --primary:#2563eb; --border:#e2e8f0; --bg:#f8fafc; --text:#0f172a; --muted:#64748b; --success:#16a34a; --danger:#dc2626; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); padding:20px; }
  .wrap { max-width:860px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:22px; margin-bottom:16px; }
  h1 { font-size:1.3em; margin-bottom:4px; }
  .muted { color:var(--muted); font-size:0.9em; }
  table { width:100%; border-collapse:collapse; margin-top:14px; }
  th, td { padding:9px 8px; border-bottom:1px solid var(--border); text-align:left; font-size:0.92em; }
  th { color:var(--muted); font-weight:600; font-size:0.82em; text-transform:uppercase; }
  input, textarea { padding:8px; border:1px solid var(--border); border-radius:8px; font:inherit; width:100%; }
  input[type=number] { text-align:right; }
  .btn { padding:11px 22px; border:0; border-radius:9px; font:inherit; font-weight:600; cursor:pointer; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-ghost { background:transparent; color:var(--muted); }
  .ok { color:var(--success); } .erro { color:var(--danger); }
  .rodape { text-align:center; color:var(--muted); font-size:0.8em; margin-top:18px; }
  @media (max-width:640px){ th:nth-child(4),td:nth-child(4){display:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="cardCabecalho">
    <h1 id="titulo">Carregando cotação…</h1>
    <div class="muted" id="subtitulo"></div>
  </div>

  <div class="card" id="cardForm" style="display:none;">
    <div class="muted" style="margin-bottom:6px;">Preencha o preço unitário dos itens que você fornece. Deixe em branco os que não atende.</div>
    <table>
      <thead><tr><th>Item</th><th style="width:90px;">Qtd</th><th style="width:130px;">Preço unit. (R$)</th><th style="width:100px;">Prazo (dias)</th><th style="width:150px;">Marca</th></tr></thead>
      <tbody id="tbItens"></tbody>
    </table>
    <div style="margin-top:14px;">
      <label class="muted">Observações (frete, validade da proposta, condições)</label>
      <textarea id="obs" rows="2"></textarea>
    </div>
    <div style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="declinar()">Não vou cotar</button>
      <button class="btn btn-primary" onclick="enviarResposta()">Enviar cotação</button>
    </div>
  </div>

  <div class="card" id="cardMsg" style="display:none;"></div>
  <div class="rodape">Cotação eletrônica · powered by <strong>Licite Agora</strong></div>
</div>

<script>
const token = new URLSearchParams(location.search).get('t');
let DADOS = null;

function msg(html, cls){ const c=document.getElementById('cardMsg'); c.style.display='block'; c.className='card '+(cls||''); c.innerHTML=html; }

async function carregar(){
  if (!token) return msg('<strong class="erro">Link inválido.</strong>');
  const r = await fetch('/api/cotacao-publica/'+token);
  const d = await r.json();
  if (!d.success) {
    document.getElementById('titulo').textContent = 'Cotação indisponível';
    return msg(`<strong class="erro">${d.error}</strong>`);
  }
  DADOS = d;
  document.getElementById('titulo').textContent = `Cotação ${d.cotacao.numero}`;
  document.getElementById('subtitulo').innerHTML =
    `${d.cotacao.descricao ? d.cotacao.descricao + ' · ' : ''}` +
    `Para: <strong>${d.fornecedor}</strong>` +
    (d.cotacao.dataLimite ? ` · responder até <strong>${d.cotacao.dataLimite.split('-').reverse().join('/')}</strong>` : '');
  if (d.jaRespondeu) msg('✅ Você já respondeu esta cotação. Pode revisar os valores abaixo e reenviar até o prazo.', '');

  const respMap = {};
  (d.respostas||[]).forEach(x => respMap[x.cotacaoItemId] = x);
  document.getElementById('tbItens').innerHTML = d.itens.map(it => {
    const r0 = respMap[it.id] || {};
    return `<tr data-item="${it.id}">
      <td>${it.descricao}</td>
      <td>${Number(it.quantidade).toLocaleString('pt-BR')} ${it.unidade||''}</td>
      <td><input type="number" class="preco" step="0.01" min="0" value="${r0.precoUnitario ?? ''}"></td>
      <td><input type="number" class="prazo" step="1" min="0" value="${r0.prazoEntregaDias ?? ''}"></td>
      <td><input type="text" class="marca" maxlength="120" value="${r0.marcaOferecida ?? ''}"></td>
    </tr>`;
  }).join('');
  document.getElementById('cardForm').style.display = 'block';
}

async function enviarResposta(){
  const respostas = [...document.querySelectorAll('#tbItens tr')].map(tr => ({
    cotacaoItemId: Number(tr.dataset.item),
    precoUnitario: Number(tr.querySelector('.preco').value) || null,
    prazoEntregaDias: tr.querySelector('.prazo').value !== '' ? Number(tr.querySelector('.prazo').value) : null,
    marcaOferecida: tr.querySelector('.marca').value.trim() || null
  })).filter(x => x.precoUnitario > 0);
  if (!respostas.length) return msg('<strong class="erro">Informe o preço de ao menos 1 item (ou use "Não vou cotar").</strong>');
  const r = await fetch('/api/cotacao-publica/'+token, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ respostas, observacao: document.getElementById('obs').value.trim() || null })
  });
  const d = await r.json();
  if (!d.success) return msg(`<strong class="erro">${d.error}</strong>`);
  document.getElementById('cardForm').style.display = 'none';
  msg(`✅ <strong>Cotação enviada com sucesso!</strong> ${d.gravadas} item(ns) cotado(s). Obrigado.`, '');
}

async function declinar(){
  if (!confirm('Confirmar que não vai participar desta cotação?')) return;
  const r = await fetch('/api/cotacao-publica/'+token, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ declinar: true, observacao: document.getElementById('obs').value.trim() || null })
  });
  const d = await r.json();
  if (!d.success) return msg(`<strong class="erro">${d.error}</strong>`);
  document.getElementById('cardForm').style.display = 'none';
  msg('Registro efetuado. Obrigado pelo retorno.', '');
}

carregar();
</script>
</body></html>
