<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordens de Serviço · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Ordens de Serviço</h1>
      <small>Assistência, manutenção e instalação</small>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="abrirNova()">+ Nova OS</button>
    </div>
  </div>

  <div id="alertGlobal"></div>
  <div class="kpi-grid" id="kpis"></div>

  <div class="toolbar">
    <input type="text" id="fQ" placeholder="Buscar nº, título, equipamento ou cliente…" oninput="debounce(carregar)" style="flex:1;min-width:240px;">
    <select id="fStatus" onchange="carregar()">
      <option value="">Todos status</option>
      <option value="aberta">Aberta</option>
      <option value="em-andamento">Em andamento</option>
      <option value="aguardando-peca">Aguardando peça</option>
      <option value="concluida">Concluída</option>
      <option value="faturada">Faturada</option>
      <option value="cancelada">Cancelada</option>
    </select>
    <select id="fTecnico" onchange="carregar()" style="min-width:160px;"><option value="">Todos técnicos</option></select>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Número</th>
        <th>Cliente</th>
        <th>Título</th>
        <th>Equipamento</th>
        <th>Técnico</th>
        <th>Status</th>
        <th>Aberta</th>
        <th class="num">Total</th>
        <th></th>
      </tr></thead>
      <tbody id="tb"><tr><td colspan="9" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<!-- Modal Nova OS -->
<div class="modal-bg" id="modalOs">
  <div class="modal" style="max-width:680px;">
    <div class="modal-header">
      <h3>Nova Ordem de Serviço</h3>
      <button class="btn btn-ghost btn-sm" onclick="fecharModal()">×</button>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1;position:relative;">
        <label>Cliente *</label>
        <input type="text" id="fCliBusca" placeholder="Razão social, CPF/CNPJ…" oninput="acCli()" autocomplete="off">
        <input type="hidden" id="fClienteId">
        <div id="acCliList" class="ac-list"></div>
      </div>
      <div class="form-group">
        <label>Técnico</label>
        <select id="fTecnicoSel"><option value="">— atribuir depois —</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Título *</label>
        <input type="text" id="fTit" placeholder="Ex.: Troca de fonte do notebook">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2;">
        <label>Equipamento</label>
        <input type="text" id="fEq" placeholder="Ex.: Notebook">
      </div>
      <div class="form-group">
        <label>Marca</label>
        <input type="text" id="fMarca">
      </div>
      <div class="form-group">
        <label>Modelo</label>
        <input type="text" id="fModelo">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2;">
        <label>Nº de série do equipamento</label>
        <input type="text" id="fSerieEq">
      </div>
      <div class="form-group">
        <label>Garantia (dias)</label>
        <input type="number" id="fGarantia" min="0" value="0">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Defeito relatado</label>
        <textarea id="fDefeito" rows="2"></textarea>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Observações</label>
        <textarea id="fObs" rows="2"></textarea>
      </div>
    </div>
    <div class="actions-bar">
      <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Criar OS</button>
    </div>
  </div>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('ordens-servico');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
let debTimer; function debounce(fn){ clearTimeout(debTimer); debTimer=setTimeout(fn,300); }
function fmtBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

async function carregarTecnicos(){
  const r = await fetch('/api/usuarios').catch(()=>null);
  if (!r) return;
  const d = await r.json();
  if (!d.success) return;
  const opts = d.usuarios.map(u=>`<option value="${u.id}">${u.nome||u.username}</option>`).join('');
  document.getElementById('fTecnico').innerHTML = '<option value="">Todos técnicos</option>' + opts;
  document.getElementById('fTecnicoSel').innerHTML = '<option value="">— atribuir depois —</option>' + opts;
}

async function carregar(){
  const p = new URLSearchParams();
  const q = document.getElementById('fQ').value.trim();   if (q) p.set('q', q);
  const s = document.getElementById('fStatus').value;     if (s) p.set('status', s);
  const t = document.getElementById('fTecnico').value;    if (t) p.set('tecnicoId', t);
  const r = await fetch('/api/os?'+p);
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Total</div><div class="value">${d.kpis.total||0}</div></div>
    <div class="kpi warn"><div class="label">Abertas</div><div class="value">${d.kpis.abertas||0}</div></div>
    <div class="kpi"><div class="label">Em andamento</div><div class="value">${d.kpis.execucao||0}</div></div>
    <div class="kpi danger"><div class="label">Aguardando peça</div><div class="value">${d.kpis.aguardandoPeca||0}</div></div>
    <div class="kpi success"><div class="label">Receita (concluída/faturada)</div><div class="value">${fmtBRL(d.kpis.receita)}</div></div>
  `;
  const tb = document.getElementById('tb');
  tb.innerHTML = d.ordens.length ? d.ordens.map(o=>`<tr>
    <td class="mono"><strong>${o.numero}</strong></td>
    <td>${o.clienteNome}</td>
    <td>${o.titulo}</td>
    <td><small>${o.equipamento||''} ${o.marca||''} ${o.modelo||''}</small></td>
    <td>${o.tecnicoNomeExibicao||o.tecnicoNome||'<small class="muted">—</small>'}</td>
    <td><span class="badge ${badgeClass(o.status)}">${o.status}</span></td>
    <td>${(o.dataAbertura||'').slice(0,10)}</td>
    <td class="num">${fmtBRL(o.valorTotal)}</td>
    <td><a class="btn btn-secondary btn-sm" href="/ordem-servico.html?id=${o.id}">Abrir</a></td>
  </tr>`).join('') : '<tr><td colspan="9" class="empty">Nenhuma OS</td></tr>';
}

function badgeClass(s){
  return ({aberta:'pendente','em-andamento':'pendente','aguardando-peca':'pendente',concluida:'entrada',faturada:'entrada',cancelada:'inativo'})[s] || '';
}

function abrirNova(){
  ['fCliBusca','fClienteId','fTit','fEq','fMarca','fModelo','fSerieEq','fDefeito','fObs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fGarantia').value='0';
  document.getElementById('fTecnicoSel').value='';
  document.getElementById('modalOs').classList.add('open');
}
function fecharModal(){ document.getElementById('modalOs').classList.remove('open'); }

let acTimer;
function acCli(){
  clearTimeout(acTimer);
  const q = document.getElementById('fCliBusca').value.trim();
  if (q.length<2){ document.getElementById('acCliList').innerHTML=''; return; }
  acTimer = setTimeout(async()=>{
    const r=await fetch('/api/pessoas?q='+encodeURIComponent(q));
    const d=await r.json();
    const lista = d.pessoas || d.data || [];
    document.getElementById('acCliList').innerHTML = lista.slice(0,10).map(p=>
      `<div onclick='selCli(${p.id}, ${JSON.stringify(p.razaoSocial)})'>${p.razaoSocial} <small class="muted">${p.cpfCnpj||""}</small></div>`
    ).join('');
  },200);
}
function selCli(id,nome){ document.getElementById('fClienteId').value=id; document.getElementById('fCliBusca').value=nome; document.getElementById('acCliList').innerHTML=''; }

async function salvar(){
  const body = {
    clienteId: Number(document.getElementById('fClienteId').value),
    tecnicoId: document.getElementById('fTecnicoSel').value ? Number(document.getElementById('fTecnicoSel').value) : null,
    titulo: document.getElementById('fTit').value.trim(),
    equipamento: document.getElementById('fEq').value || null,
    marca: document.getElementById('fMarca').value || null,
    modelo: document.getElementById('fModelo').value || null,
    numeroSerieEquipamento: document.getElementById('fSerieEq').value || null,
    defeitoRelatado: document.getElementById('fDefeito').value || null,
    garantiaDias: Number(document.getElementById('fGarantia').value)||0,
    observacoes: document.getElementById('fObs').value || null
  };
  if (!body.clienteId || !body.titulo) return showAlert('Cliente e título obrigatórios','error');
  const r = await fetch('/api/os', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  showAlert('OS criada: '+d.os.numero);
  fecharModal();
  setTimeout(()=>window.location.href='/ordem-servico.html?id='+d.os.id, 600);
}

carregarTecnicos().then(carregar);
</script>
</body></html>
