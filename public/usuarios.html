<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuários · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Usuários</h1>
      <small>Gerenciar contas de acesso e perfis</small>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="abrirNovo()">+ Novo usuário</button>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Username</th>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Perfil</th>
        <th>Status</th>
        <th>Último login</th>
        <th>Ações</th>
      </tr></thead>
      <tbody id="tb"><tr><td colspan="7" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<!-- Modal -->
<div class="modal-bg" id="modal">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header">
      <h3 id="modalTitulo">Novo usuário</h3>
      <button class="btn btn-ghost btn-sm" onclick="fecharModal()">×</button>
    </div>
    <input type="hidden" id="fId">
    <div class="form-row">
      <div class="form-group full-width">
        <label>Username * <small class="muted">(login, sem espaços)</small></label>
        <input type="text" id="fUsername" autocomplete="off">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Nome de exibição</label>
        <input type="text" id="fNome">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>E-mail</label>
        <input type="email" id="fEmail">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Perfil *</label>
        <select id="fRole">
          <option value="admin">admin — acesso total</option>
          <option value="financeiro">financeiro — fiscal + financeiro</option>
          <option value="comercial">comercial — vendas + clientes</option>
          <option value="operacional">operacional — estoque + compras</option>
          <option value="licitacoes">licitacoes — licitações</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label id="lblSenha">Senha *</label>
        <input type="password" id="fSenha" autocomplete="new-password">
        <small class="muted" id="hintSenha">Mínimo 6 caracteres. Deixe em branco ao editar para manter.</small>
      </div>
    </div>
    <div class="form-row" id="rowAtivo" style="display:none;">
      <div class="form-group full-width">
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="fAtivo" checked> Ativo
        </label>
      </div>
    </div>
    <div class="actions-bar">
      <button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('usuarios');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }

async function carregar(){
  const r=await fetch('/api/usuarios');
  const d=await r.json();
  if(!d.success) return showAlert(d.error||'Erro ao carregar','error');
  const tb=document.getElementById('tb');
  tb.innerHTML = d.usuarios.length ? d.usuarios.map(u=>`<tr>
    <td class="mono"><strong>${u.username}</strong></td>
    <td>${u.nome||'—'}</td>
    <td>${u.email||'—'}</td>
    <td><span class="badge ${u.role==='admin'?'manual':'entrada'}">${u.role}</span></td>
    <td><span class="badge ${u.ativo?'entrada':'inativo'}">${u.ativo?'ativo':'inativo'}</span></td>
    <td>${u.ultimoLogin?new Date(u.ultimoLogin).toLocaleString('pt-BR'):'—'}</td>
    <td>
      <button class="btn btn-secondary btn-sm" onclick='editar(${JSON.stringify(u)})'>Editar</button>
      ${u.ativo ? `<button class="btn btn-danger btn-sm" onclick="desativar(${u.id}, '${u.username}')">Desativar</button>` : ''}
    </td>
  </tr>`).join('') : '<tr><td colspan="7" class="empty">Nenhum usuário</td></tr>';
}

function abrirNovo(){
  document.getElementById('modalTitulo').textContent='Novo usuário';
  document.getElementById('lblSenha').textContent='Senha *';
  document.getElementById('hintSenha').textContent='Mínimo 6 caracteres.';
  document.getElementById('fId').value='';
  ['fUsername','fNome','fEmail','fSenha'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fUsername').disabled=false;
  document.getElementById('fRole').value='operacional';
  document.getElementById('rowAtivo').style.display='none';
  document.getElementById('modal').classList.add('open');
}
function editar(u){
  document.getElementById('modalTitulo').textContent='Editar '+u.username;
  document.getElementById('lblSenha').textContent='Nova senha';
  document.getElementById('hintSenha').textContent='Deixe em branco para manter a senha atual.';
  document.getElementById('fId').value=u.id;
  document.getElementById('fUsername').value=u.username;
  document.getElementById('fUsername').disabled=true;
  document.getElementById('fNome').value=u.nome||'';
  document.getElementById('fEmail').value=u.email||'';
  document.getElementById('fRole').value=u.role;
  document.getElementById('fSenha').value='';
  document.getElementById('fAtivo').checked=!!u.ativo;
  document.getElementById('rowAtivo').style.display='';
  document.getElementById('modal').classList.add('open');
}
function fecharModal(){ document.getElementById('modal').classList.remove('open'); }

async function salvar(){
  const id=document.getElementById('fId').value;
  const body={
    nome:  document.getElementById('fNome').value.trim()||null,
    email: document.getElementById('fEmail').value.trim()||null,
    role:  document.getElementById('fRole').value
  };
  const senha=document.getElementById('fSenha').value;
  if(senha) body.senha=senha;
  if(!id){
    body.username=document.getElementById('fUsername').value.trim();
    if(!body.username) return showAlert('Informe o username','error');
    if(!body.senha)    return showAlert('Informe a senha inicial','error');
  } else {
    body.ativo = document.getElementById('fAtivo').checked ? 1 : 0;
  }
  try {
    const url = id ? '/api/usuarios/'+id : '/api/usuarios';
    const r=await fetch(url, { method: id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d=await r.json();
    if(!d.success) throw new Error(d.error);
    showAlert(id?'Usuário atualizado':'Usuário criado');
    fecharModal();
    carregar();
  } catch(e){ showAlert('Erro: '+e.message,'error'); }
}

async function desativar(id, username){
  if(!confirm(`Desativar ${username}? O usuário não conseguirá mais acessar o sistema.`)) return;
  const r=await fetch('/api/usuarios/'+id, { method:'DELETE' });
  const d=await r.json();
  if(!d.success) return showAlert(d.error,'error');
  showAlert('Usuário desativado');
  carregar();
}

carregar();
</script>
</body></html>
