<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Licitações - Licite Agora</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .filters-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .filters-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .filters-title::before {
            content: '🔍';
            margin-right: 10px;
            font-size: 20px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="date"],
        select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .results-info {
            background: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-count {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .loading::after {
            content: '⏳';
            font-size: 48px;
            display: block;
            margin: 20px 0;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-grid {
            display: grid;
            gap: 15px;
        }

        .licitacao-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .licitacao-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .licitacao-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .licitacao-titulo {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .licitacao-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 15px;
        }

        .badge-modalidade {
            background: #e3f2fd;
            color: #1976d2;
        }

        .licitacao-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .licitacao-objeto {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .objeto-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .objeto-text {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        .licitacao-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .valor-estimado {
            font-size: 16px;
            font-weight: 700;
            color: #4caf50;
        }

        .btn-detalhes {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-detalhes:hover {
            background: #5568d3;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .pagination button {
            padding: 10px 20px;
            background: #f5f5f5;
            color: #666;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-weight: 600;
            color: #333;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
        }

        .empty-state {
            background: white;
            padding: 60px 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .empty-state::before {
            content: '📋';
            font-size: 64px;
            display: block;
            margin-bottom: 20px;
        }

        .empty-state-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state-text {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Portal de Consulta de Licitações - Licite Agora</h1>
            <p class="subtitle">Portal Nacional de Contratações Públicas</p>
        </header>

        <div class="filters-card">
            <div class="filters-title">Filtros de Busca</div>

            <form id="searchForm">
                <div class="filters-grid">
                    <div class="form-group">
                        <label for="palavraChave">Palavra-chave</label>
                        <input type="text" id="palavraChave" name="palavraChave"
                               placeholder="Ex: computador, obra, serviço...">
                    </div>

                    <div class="form-group">
                        <label for="modalidade">Modalidade</label>
                        <select id="modalidade" name="modalidade">
                            <option value="">Todas</option>
                            <option value="1">Concorrência</option>
                            <option value="2">Tomada de Preços</option>
                            <option value="3">Convite</option>
                            <option value="4">Concurso</option>
                            <option value="5">Leilão</option>
                            <option value="6">Pregão</option>
                            <option value="7">Dispensa de Licitação</option>
                            <option value="8">Inexigibilidade</option>
                            <option value="9">Diálogo Competitivo</option>
                        </select>
                    </div>
                </div>

                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
                    <h3 style="font-size: 16px; font-weight: 600; color: #555; margin-bottom: 15px;">Filtros de Data</h3>

                    <div class="filters-grid">
                        <div class="form-group">
                            <label for="dataPublicacaoInicial">Publicação - Data Inicial</label>
                            <input type="date" id="dataPublicacaoInicial" name="dataPublicacaoInicial">
                        </div>

                        <div class="form-group">
                            <label for="dataPublicacaoFinal">Publicação - Data Final</label>
                            <input type="date" id="dataPublicacaoFinal" name="dataPublicacaoFinal">
                        </div>

                        <div class="form-group">
                            <label for="dataAberturaInicial">Fim Propostas - De</label>
                            <input type="date" id="dataAberturaInicial" name="dataAberturaInicial">
                        </div>

                        <div class="form-group">
                            <label for="dataAberturaFinal">Fim Propostas - At�</label>
                            <input type="date" id="dataAberturaFinal" name="dataAberturaFinal">
                        </div>
                    </div>
                </div>

                <div style="margin-top: 20px; padding: 15px; background: #fff3cd; border-radius: 5px; border-left: 4px solid #ffc107;">
                    <label style="display: flex; align-items: center; cursor: pointer; font-size: 14px; color: #856404;">
                        <input type="checkbox" id="buscaDetalhada" name="buscaDetalhada" style="width: 18px; height: 18px; margin-right: 10px; cursor: pointer;">
                        <div>
                            <strong>Busca Detalhada nos Itens/Lotes</strong>
                            <div style="font-size: 12px; color: #856404; margin-top: 3px;">
                                Busca a palavra-chave também dentro dos itens de cada licitação. Mais completo, mas mais lento (pode levar até 1 minuto).
                            </div>
                        </div>
                    </label>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-secondary" onclick="limparFiltros()">
                        Limpar
                    </button>
                    <button type="submit" class="btn-primary" id="btnBuscar">
                        Buscar Licitações
                    </button>
                </div>
            </form>
        </div>

        <div id="errorContainer"></div>

        <div id="resultsInfo" style="display: none;" class="results-info">
            <div class="results-count">
                <span id="resultsCount">0</span> licitações encontradas
            </div>
            <div>Página <span id="currentPage">1</span></div>
        </div>

        <div id="loadingContainer" style="display: none;" class="loading">
            <h3>Carregando licitações...</h3>
        </div>

        <div id="resultsContainer" class="results-grid"></div>

        <div id="paginationContainer" style="display: none;" class="pagination">
            <button id="btnPrevPage">← Anterior</button>
            <div class="page-info">
                Página <span id="pageNumber">1</span>
            </div>
            <button id="btnNextPage">Próxima →</button>
        </div>

        <div id="emptyState" style="display: none;" class="empty-state">
            <div class="empty-state-title">Nenhuma licitação encontrada</div>
            <div class="empty-state-text">Tente ajustar os filtros de busca</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
