<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório de Lances - Licite Agora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/app-modern.css">
    <style>
        .main-content { padding: 20px; }

        .filtros { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }

        .resumo { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .card { min-width: 140px; padding: 16px 20px; }
        .card .label { color: var(--text-3); font-size: 0.8em; margin-bottom: 4px; }
        .card .valor { font-size: 1.4em; font-weight: 700; }
        .card .valor.verde { color: var(--success); }
        .card .valor.vermelho { color: var(--danger); }
        .card .valor.azul { color: var(--accent); }
        .card .valor.laranja { color: var(--warn); }

        .panel h3 { color: var(--accent); margin-bottom: 12px; font-size: 0.95em; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { text-align: left; padding: 8px 6px; color: var(--text-3); font-size: 0.8em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 6px; border-bottom: 1px solid #0f346030; }
        tr:hover { background: #0f346020; }
        .mono { font-family: 'Consolas', monospace; font-size: 0.9em; }
        .ok { color: var(--success); }
        .erro { color: var(--danger); }
        .badge-ok { background: #4caf5020; color: var(--success); }
        .badge-falha { background: #f4433620; color: var(--danger); }
        .badge-fonte { background: #4dabf720; color: var(--accent); }
        .empty { text-align: center; padding: 40px; color: var(--text-3); }
    </style>
</head>
<body>
<div class="app-container">
<main class="main-content">
    <h1>Relatorio de Lances</h1>
    <p class="subtitle">Historico detalhado de todos os lances enviados ao Comprasnet</p>

    <div class="filtros">
        <input type="text" id="filtCompra" placeholder="CompraId..." style="width:180px;" onkeydown="if(event.key==='Enter')carregar()">
        <input type="number" id="filtItem" placeholder="Item" style="width:70px;">
        <input type="date" id="filtDataInicio">
        <input type="date" id="filtDataFim">
        <select id="filtResultado">
            <option value="">Todos</option>
            <option value="1">Sucesso</option>
            <option value="0">Falha</option>
        </select>
        <select id="filtFonte">
            <option value="">Todas as fontes</option>
            <option value="blitz-servidor">Blitz servidor</option>
            <option value="manual-servidor">Manual</option>
            <option value="guard-servidor">Guard</option>
            <option value="continuo-servidor">Continuo</option>
            <option value="agendado-servidor">Agendado</option>
            <option value="blitz">Blitz extensao</option>
            <option value="browser">Browser</option>
        </select>
        <input type="number" id="filtLimite" value="100" min="10" max="1000" style="width:70px;" title="Limite">
        <button class="btn btn-primary" onclick="carregar()">Filtrar</button>
        <button class="btn btn-outline btn-sm" onclick="limpar()">Limpar</button>
        <button class="btn btn-outline btn-sm" onclick="exportarCSV()">CSV</button>
    </div>

    <div class="resumo" id="resumo"></div>

    <div class="panel">
        <h3>Lances <span id="totalLabel" style="font-weight:normal;color:#888"></span></h3>
        <table>
            <thead>
                <tr>
                    <th>Comprasnet</th>
                    <th>Compra</th>
                    <th>Item</th>
                    <th>Valor</th>
                    <th>Resultado</th>
                    <th>Latencia</th>
                    <th>Fonte</th>
                </tr>
            </thead>
            <tbody id="tabela"></tbody>
        </table>
        <div id="vazio" class="empty" style="display:none">Nenhum lance encontrado</div>
    </div>

    <!-- Analise por item -->
    <div class="panel" id="panelAnalise" style="display:none">
        <h3>Analise por Item</h3>
        <div id="analise"></div>
    </div>

</main>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('relatorio-lances');</script>
<script>
var lancesData = [];

async function carregar() {
    var params = new URLSearchParams();
    var compra = document.getElementById('filtCompra').value.trim();
    var item = document.getElementById('filtItem').value.trim();
    var dataInicio = document.getElementById('filtDataInicio').value;
    var dataFim = document.getElementById('filtDataFim').value;
    var resultado = document.getElementById('filtResultado').value;
    var fonte = document.getElementById('filtFonte').value;
    var limite = document.getElementById('filtLimite').value || '100';

    if (compra) params.set('compraId', compra);
    if (item) params.set('itemNumero', item);
    if (resultado) params.set('sucesso', resultado);
    if (fonte) params.set('fonte', fonte);
    if (dataInicio) params.set('dataInicio', dataInicio);
    if (dataFim) params.set('dataFim', dataFim);
    params.set('limit', limite);

    try {
        var r = await fetch('/api/relatorio-lances?' + params.toString());
        var d = await r.json();
        if (!d.success) { alert(d.error); return; }
        lancesData = d.lances || [];
        renderResumo(d.resumo);
        renderTabela(lancesData);
        renderAnalise(lancesData);
    } catch (e) {
        alert('Erro: ' + e.message);
    }
}

function renderResumo(r) {
    if (!r) { document.getElementById('resumo').innerHTML = ''; return; }
    document.getElementById('resumo').innerHTML =
        '<div class="card"><div class="label">Total</div><div class="valor azul">' + r.total + '</div></div>' +
        '<div class="card"><div class="label">Sucesso</div><div class="valor verde">' + r.ok + '</div></div>' +
        '<div class="card"><div class="label">Falha</div><div class="valor vermelho">' + r.falha + '</div></div>' +
        '<div class="card"><div class="label">Taxa</div><div class="valor ' + (r.taxa > 80 ? 'verde' : 'laranja') + '">' + r.taxa + '%</div></div>' +
        '<div class="card"><div class="label">Latencia media</div><div class="valor azul">' + r.avgMs + 'ms</div></div>' +
        '<div class="card"><div class="label">Compras</div><div class="valor azul">' + r.compras + '</div></div>' +
        '<div class="card"><div class="label">Itens</div><div class="valor azul">' + r.itens + '</div></div>';
}

function renderTabela(lances) {
    var tbody = document.getElementById('tabela');
    document.getElementById('totalLabel').textContent = '(' + lances.length + ')';
    if (lances.length === 0) {
        tbody.innerHTML = '';
        document.getElementById('vazio').style.display = '';
        return;
    }
    document.getElementById('vazio').style.display = 'none';

    tbody.innerHTML = lances.map(function(h) {
        var cor = h.sucesso ? 'ok' : 'erro';
        var horaCN = '--';
        if (h.comprasnetHora) {
            horaCN = h.comprasnetHora;
        } else if (h.resposta) {
            try {
                var resp = typeof h.resposta === 'string' ? JSON.parse(h.resposta) : h.resposta;
                var item0 = Array.isArray(resp) ? resp[0] : resp;
                if (item0 && item0.dataHoraAtualizacao) horaCN = item0.dataHoraAtualizacao.substring(11, 23);
            } catch(e) {}
        }
        var badgeRes = h.sucesso ? '<span class="badge badge-ok">OK</span>' : '<span class="badge badge-falha">' + (h.httpStatus || '--') + '</span>';
        return '<tr class="' + cor + '">' +
            '<td class="mono">' + horaCN + '</td>' +
            '<td class="mono" title="' + h.compraId + '">' + (h.compraId||'').substring(0, 6) + '...' + (h.compraId||'').slice(-4) + '</td>' +
            '<td>' + h.itemNumero + '</td>' +
            '<td class="mono">R$ ' + Number(h.valor).toFixed(2) + '</td>' +
            '<td>' + badgeRes + '</td>' +
            '<td class="mono">' + (h.tempoMs || '--') + 'ms</td>' +
            '<td><span class="badge badge-fonte">' + (h.fonte || '--') + '</span></td>' +
            '</tr>';
    }).join('');
}

function renderAnalise(lances) {
    var panel = document.getElementById('panelAnalise');
    var okLances = lances.filter(function(l) { return l.sucesso; });
    if (okLances.length < 2) { panel.style.display = 'none'; return; }
    panel.style.display = '';

    // Agrupar por compra+item
    var grupos = {};
    okLances.forEach(function(l) {
        var key = l.compraId + ' item ' + l.itemNumero;
        if (!grupos[key]) grupos[key] = [];
        grupos[key].push(l);
    });

    var html = '<table><thead><tr><th>Compra / Item</th><th>Lances</th><th>1o lance</th><th>Ultimo</th><th>Duracao</th><th>Latencia avg</th><th>Intervalo avg</th><th>Spikes</th></tr></thead><tbody>';

    for (var key in grupos) {
        var g = grupos[key];
        // Extrair tempos Comprasnet
        var cnTimes = [];
        g.forEach(function(l) {
            var t = null;
            if (l.comprasnetHora) { t = l.comprasnetHora; }
            else if (l.resposta) {
                try {
                    var resp = typeof l.resposta === 'string' ? JSON.parse(l.resposta) : l.resposta;
                    var item0 = Array.isArray(resp) ? resp[0] : resp;
                    if (item0 && item0.dataHoraAtualizacao) t = item0.dataHoraAtualizacao.substring(11, 23);
                } catch(e) {}
            }
            if (t) cnTimes.push(t);
        });

        var rtts = g.map(function(l) { return l.tempoMs || 0; });
        var avgRtt = Math.round(rtts.reduce(function(a,b){return a+b;},0) / rtts.length);
        var spikes = rtts.filter(function(r) { return r > 400; }).length;

        // Intervalos entre lances
        var intervals = [];
        if (cnTimes.length > 1) {
            for (var i = 1; i < cnTimes.length; i++) {
                var diff = parseTime(cnTimes[i]) - parseTime(cnTimes[i-1]);
                if (diff > 0) intervals.push(diff);
            }
        }
        var avgInterval = intervals.length > 0 ? Math.round(intervals.reduce(function(a,b){return a+b;},0) / intervals.length) : '--';

        var primeiro = cnTimes.length > 0 ? cnTimes[0] : '--';
        var ultimo = cnTimes.length > 0 ? cnTimes[cnTimes.length - 1] : '--';
        var duracao = cnTimes.length > 1 ? Math.round(parseTime(cnTimes[cnTimes.length-1]) - parseTime(cnTimes[0])) + 'ms' : '--';

        html += '<tr>' +
            '<td>' + key + '</td>' +
            '<td>' + g.length + '</td>' +
            '<td class="mono">' + primeiro + '</td>' +
            '<td class="mono">' + ultimo + '</td>' +
            '<td class="mono">' + duracao + '</td>' +
            '<td class="mono">' + avgRtt + 'ms</td>' +
            '<td class="mono">' + avgInterval + 'ms</td>' +
            '<td>' + (spikes > 0 ? '<span class="badge badge-falha">' + spikes + '</span>' : '0') + '</td>' +
            '</tr>';
    }
    html += '</tbody></table>';
    document.getElementById('analise').innerHTML = html;
}

function parseTime(t) {
    if (!t || t === '--') return 0;
    var p = t.split(':');
    var s = p[2] ? parseFloat(p[2]) : 0;
    return (parseInt(p[0])*3600 + parseInt(p[1])*60 + s) * 1000;
}

function limpar() {
    document.getElementById('filtCompra').value = '';
    document.getElementById('filtItem').value = '';
    document.getElementById('filtDataInicio').value = '';
    document.getElementById('filtDataFim').value = '';
    document.getElementById('filtResultado').value = '';
    document.getElementById('filtFonte').value = '';
    document.getElementById('filtLimite').value = '100';
    carregar();
}

function exportarCSV() {
    if (lancesData.length === 0) return;
    var csv = 'Comprasnet,CompraId,Item,Valor,Sucesso,Latencia_ms,Fonte,HTTP\n';
    lancesData.forEach(function(l) {
        var cn = '--';
        if (l.comprasnetHora) cn = l.comprasnetHora;
        else if (l.resposta) {
            try {
                var resp = typeof l.resposta === 'string' ? JSON.parse(l.resposta) : l.resposta;
                var item0 = Array.isArray(resp) ? resp[0] : resp;
                if (item0 && item0.dataHoraAtualizacao) cn = item0.dataHoraAtualizacao.substring(11, 23);
            } catch(e) {}
        }
        csv += cn + ',' + l.compraId + ',' + l.itemNumero + ',' + l.valor + ',' + (l.sucesso?'OK':'FALHA') + ',' + (l.tempoMs||0) + ',' + (l.fonte||'') + ',' + (l.httpStatus||'') + '\n';
    });
    var blob = new Blob([csv], {type:'text/csv'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lances-' + new Date().toISOString().substring(0,10) + '.csv';
    a.click();
}

// Carregar ao abrir
carregar();
</script>
</body>
</html>
