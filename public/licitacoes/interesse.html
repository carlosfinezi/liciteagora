<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interesses · Licite Agora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout">
  <main class="main-content">

    <div class="page-header">
      <div>
        <h1>Meus Interesses</h1>
        <small>Licitações e itens marcados para participar</small>
      </div>
      <div class="actions">
        <button class="btn btn-ghost btn-sm" onclick="verStatus()">Status sync</button>
        <button class="btn btn-secondary btn-sm" onclick="sincronizarAgora()">Sincronizar</button>
        <button class="btn btn-danger btn-sm" id="btnExcluirTodos" onclick="excluirTodosInteresses()" style="display:none;">Excluir todos</button>
      </div>
    </div>

    <div class="kpi-grid" id="totalInfo" style="display:none;">
      <div class="kpi">
        <div class="label">Licitações</div>
        <div class="value" id="totalLicitacoes">0</div>
      </div>
      <div class="kpi">
        <div class="label">Itens de interesse</div>
        <div class="value" id="totalItens">0</div>
      </div>
      <div class="kpi success">
        <div class="label">Valor total estimado</div>
        <div class="value" id="valorTotal">R$ 0,00</div>
      </div>
    </div>

    <div class="toolbar" id="filtroBar" style="display:none;">
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:0.9em;color:var(--text-2);cursor:pointer;user-select:none;">
        <input type="checkbox" id="masterCheck" onchange="toggleSelecionarTodos(this.checked)" style="width:16px;height:16px;cursor:pointer;">
        Selecionar filtrados
      </label>
      <select id="filtroPeriodo" onchange="aplicarFiltro()">
        <option value="ativas" selected>Em aberto</option>
        <option value="todas">Todos os prazos</option>
        <option value="hoje">Hoje</option>
        <option value="semana">Próximos 7 dias</option>
        <option value="mes">Próximos 30 dias</option>
        <option value="vencidas">Vencidas</option>
        <option value="personalizado">Período...</option>
      </select>
      <input type="date" id="filtroDataDe" style="display:none;width:auto;" onchange="aplicarFiltro()">
      <span id="filtroAte" style="display:none;color:var(--text-3);">até</span>
      <input type="date" id="filtroDataAte" style="display:none;width:auto;" onchange="aplicarFiltro()">
      <select id="filtroOrgao" onchange="aplicarFiltro()"><option value="">Todos os órgãos</option></select>
      <select id="filtroGrupo" onchange="aplicarFiltro()"><option value="">Todos os grupos</option></select>
      <select id="ordenacao" onchange="aplicarFiltro()">
        <option value="encerramento-asc">Encerramento ↑</option>
        <option value="encerramento-desc">Encerramento ↓</option>
        <option value="valor-desc">Maior valor</option>
        <option value="valor-asc">Menor valor</option>
        <option value="orgao-asc">Órgão A-Z</option>
        <option value="recente">Mais recentes</option>
      </select>
      <span class="spacer"></span>
      <small id="filtroInfo" style="color:var(--text-3);"></small>
    </div>

    <div id="loadingContainer" class="loading">
      <h3>Carregando interesses...</h3>
    </div>

    <div id="interessesContainer"></div>

    <div id="emptyState" class="empty" style="display:none;">
      Nenhum interesse salvo. Faça uma busca e marque itens para participar.
    </div>

  </main>
</div>

<div id="toasts"></div>

<div id="selectionBar" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg-1);border:1px solid var(--border);border-radius:8px;padding:10px 18px;box-shadow:0 4px 16px rgba(0,0,0,0.18);z-index:1000;display:none;align-items:center;gap:14px;">
  <span id="selectionCount" style="color:var(--text-1);font-weight:500;">0 selecionados</span>
  <button class="btn btn-ghost btn-sm" onclick="limparSelecao()">Limpar</button>
  <button class="btn btn-danger btn-sm" onclick="excluirSelecionados()">Excluir selecionados</button>
</div>

<script src="interesse.js"></script>
<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('interesse');</script>
<script>
async function sincronizarAgora() {
    if (!confirm('Iniciar sincronização?')) return;
    try {
        const r = await fetch('/api/sync/start', { method: 'POST' });
        const d = await r.json();
        alert(d.message || 'Sincronização iniciada!');
    } catch (e) { alert('Erro ao iniciar sincronização'); }
}

async function verStatus() {
    try {
        const r = await fetch('/api/sync/status');
        const d = await r.json();
        alert('Última sync: ' + (d.ultimaSync || 'Nunca') + '\nLicitações: ' + (d.totalLicitacoes || 0) + '\nItens: ' + (d.totalItens || 0));
    } catch (e) { alert('Erro ao obter status'); }
}
</script>
</body>
</html>
