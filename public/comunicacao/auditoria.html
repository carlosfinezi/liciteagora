<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoria · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Auditoria</h1>
      <small>Histórico de ações sensíveis no sistema</small>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="toolbar">
    <select id="fEntity" onchange="carregar()" style="width:auto;min-width:140px;"><option value="">Todas entidades</option></select>
    <select id="fAction" onchange="carregar()" style="width:auto;min-width:140px;"><option value="">Todas ações</option></select>
    <select id="fUser"   onchange="carregar()" style="width:auto;min-width:160px;"><option value="">Todos usuários</option></select>
    <input type="date" id="fIni" onchange="carregar()" title="Data inicial" style="width:auto;">
    <input type="date" id="fFim" onchange="carregar()" title="Data final" style="width:auto;">
    <input type="text" id="fQ" placeholder="Buscar em payload/usuário…" oninput="debounce(carregar)" style="flex:1;min-width:200px;">
  </div>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Quando</th>
        <th>Usuário</th>
        <th>Ação</th>
        <th>Entidade</th>
        <th>ID</th>
        <th>IP</th>
        <th>Detalhes</th>
      </tr></thead>
      <tbody id="tb"><tr><td colspan="7" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('auditoria');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
let debTimer; function debounce(fn){ clearTimeout(debTimer); debTimer=setTimeout(fn,300); }

async function popularFiltros(){
  const [r1,r2] = await Promise.all([
    fetch('/api/audit-log/entities').then(r=>r.json()),
    fetch('/api/usuarios').then(r=>r.json())
  ]);
  if (r1.success) {
    document.getElementById('fEntity').innerHTML = '<option value="">Todas entidades</option>' + r1.entities.map(e=>`<option>${e}</option>`).join('');
    document.getElementById('fAction').innerHTML = '<option value="">Todas ações</option>'    + r1.actions.map(a=>`<option>${a}</option>`).join('');
  }
  if (r2.success) {
    document.getElementById('fUser').innerHTML = '<option value="">Todos usuários</option>' + r2.usuarios.map(u=>`<option value="${u.id}">${u.username}</option>`).join('');
  }
}

async function carregar(){
  const p=new URLSearchParams();
  const map={ entity:'fEntity', action:'fAction', userId:'fUser', dataIni:'fIni', dataFim:'fFim', q:'fQ' };
  for (const [k,id] of Object.entries(map)) {
    const v=document.getElementById(id).value.trim();
    if (v) p.set(k,v);
  }
  p.set('limit','500');
  const r=await fetch('/api/audit-log?'+p);
  const d=await r.json();
  if(!d.success) return showAlert(d.error,'error');
  const tb=document.getElementById('tb');
  tb.innerHTML = d.logs.length ? d.logs.map(l=>{
    let payloadFmt = '—';
    if (l.payload) {
      try { payloadFmt = '<code style="font-size:12px;white-space:pre-wrap;">'+escapeHtml(JSON.stringify(JSON.parse(l.payload)))+'</code>'; }
      catch { payloadFmt = escapeHtml(l.payload); }
    }
    return `<tr>
      <td>${new Date(l.createdAt+'Z').toLocaleString('pt-BR')}</td>
      <td class="mono">${l.username||'—'}</td>
      <td><span class="badge ${actionBadge(l.action)}">${l.action}</span></td>
      <td>${l.entity}</td>
      <td class="mono">${l.entityId||'—'}</td>
      <td class="mono">${l.ip||'—'}</td>
      <td>${payloadFmt}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="7" class="empty">Nenhum registro</td></tr>';
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function actionBadge(action){
  const a = (action||'').toLowerCase();
  if (a.includes('delete') || a.includes('cancel') || a.includes('excluir') || a.includes('desativ')) return 'cancelado';
  if (a.includes('update') || a.includes('edit') || a.includes('alter'))                              return 'em_separacao';
  if (a.includes('create') || a.includes('insert') || a.includes('novo') || a.includes('add'))       return 'entregue';
  if (a.includes('login') || a.includes('logout'))                                                    return 'confirmado';
  return 'inativo';
}

popularFiltros().then(carregar);
</script>
</body></html>
