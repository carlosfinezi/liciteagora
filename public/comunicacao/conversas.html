<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversas · Licite Agora</title>
<script src="/js/theme-boot.js"></script>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
<style>
/* A lista de opções do <select> é desenhada pelo navegador, e CSS nenhum a
   alcança: sem `color-scheme` ela sai sempre no esquema claro, e no tema escuro
   as opções ficavam com o texto claro herdado sobre o fundo branco do sistema.
   O atributo é o mesmo que o theme-boot já escreve em <html>. */
:root { color-scheme:dark; }
[data-theme="claro"] { color-scheme:light; }

/* A tela é uma caixa só: lista, conversa e ficha dividem a MESMA moldura, em vez
   de três painéis com borda dentro de uma página que já tem borda. */
.central { display:grid; grid-template-columns: 340px 1fr 300px;
  /* O desconto é só a margem da página: o cabeçalho com o título SAIU daqui em
     02/10 e foi para dentro da caixa, então os 100px de antes deixariam uma
     faixa vazia embaixo. */
  height:calc(100vh - 40px); height:calc(100dvh - 40px); min-height:460px;
  background:var(--bg-1); border:var(--borda); border-radius:var(--raio-md); overflow:hidden; }
/* Voltar para a lista: só no celular, onde a conversa ocupa a tela toda. Fica
   ANTES das regras de tamanho de tela, para a do celular poder mostrá-lo. */
.cab .voltar { display:none; }
/* Nas regras de tamanho de tela, `.central .x` e não `.x`: a regra de `.coluna`,
   mais abaixo e com o mesmo peso, vencia. Com isso a ficha nunca sumia (no
   celular e no tablet caía embaixo da conversa) e, no celular, a conversa
   vazia dividia a altura com a lista. */
@media (max-width:1200px){ .central { grid-template-columns: 280px 1fr; } .central .ficha { display:none; } }
@media (max-width:820px){ .central { grid-template-columns: 1fr; height:calc(100dvh - 70px); } .central .ficha { display:none; }
  .central .thread { display:none; }
  .central.abriu .lista { display:none; } .central.abriu .thread { display:flex; }
  .cab .voltar { display:inline-flex; } }

/* `min-height:0` e `overflow:hidden` NÃO são enfeite: sem eles, a coluna cresce
   com o conteúdo em vez de rolar, e as 300 conversas da lista esticam a página
   para 20.595px de altura — arrastando a conversa e a ficha junto, porque as
   colunas do grid têm a mesma altura. Medido em produção em 17/09. */
.coluna { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
/* A âncora do rodapé flutuante da conversa (ver `.responder`). */
.coluna.thread { position:relative; }
.coluna + .coluna { border-left:var(--borda); }
.rolagem { overflow-y:auto; flex:1; }

/* ---- rolagem: o polegar próprio, o mesmo padrão do biturion ----
   A barra nativa do Chrome ocupa LARGURA DE LAYOUT, estilizada ou não, e fica
   ali mesmo quando não há nada rolando: numa coluna de 340px isso é texto
   perdido para uma faixa cinza. O `/js/polegar.js` esconde a nativa e desenha
   este polegar a partir de scrollTop/scrollHeight — ele flutua, não reserva
   espaço, e é invisível enquanto ninguém rola. Daqui sai só a forma; a posição
   e a altura são escritas pelo JS. */
.com-polegar { scrollbar-width:none; }
.com-polegar::-webkit-scrollbar { display:none; }
.polegar-rolagem { position:absolute; z-index:5; width:4px; border-radius:999px;
  background-color:var(--text-3); opacity:0; transition:opacity .15s ease; pointer-events:none; }
.polegar-rolagem[data-visivel='1'] { opacity:.45; pointer-events:auto; }
.polegar-rolagem[data-visivel='1']:hover,
.polegar-rolagem[data-arrastando='1'] { opacity:.75; }
@media (prefers-reduced-motion: reduce){ .polegar-rolagem { transition:none; } }


/* ---- topo da lista ----
   A busca tem a linha dela, na largura inteira. Os seletores de número e de
   segmento ficam na linha de baixo, lado a lado, e só existem quando há mais
   de um número ou quando há segmentos. Em 29/09, os dois na linha da busca
   deixaram o campo com 26 px na coluna de 320. */
.topo { padding:var(--space-3); border-bottom:var(--borda); display:flex;
  gap:var(--space-2); flex-direction:column; }

/* A busca no desenho do WhatsApp: pílula, lupa dentro, à esquerda, e o X que
   só existe com algo escrito. O campo não tem moldura própria — a pílula é a
   moldura. */
.busca-wa { display:flex; align-items:center; gap:var(--space-2);
  background:var(--bg-2, var(--superficie-hover)); border:var(--borda);
  border-radius:var(--raio-pill); padding:0 var(--space-3); height:36px; }
.busca-wa:focus-within { border-color:var(--accent); }
.busca-wa svg { width:17px; height:17px; color:var(--text-3); flex:0 0 auto; }
.busca-wa input { flex:1; min-width:0; border:0; background:transparent; box-shadow:none;
  padding:0; height:34px; color:var(--text-0); font-size:var(--text-sm); }
.busca-wa input:focus { outline:none; box-shadow:none; }
.busca-wa .limpar { display:none; border:0; background:transparent; color:var(--text-3);
  cursor:pointer; padding:0; line-height:0; }
.busca-wa.tem-texto .limpar { display:inline-flex; }

/* Os seletores dividem a linha de baixo, e cada um só aparece quando tem o que
   escolher (um número só, nenhum nicho com campanha). */
/* `flex:1 1 0` repartia a linha em partes iguais, e com dois ou três seletores
   em 250px cada um ficava com ~110px: "Todos os nichos" saía cortado em "Todos
   os nicho". Com uma base de 130px e quebra de linha, o que não cabe desce em
   vez de truncar. */
.seletores { display:flex; gap:var(--space-2); flex-wrap:wrap; }
.seletores select { flex:1 1 130px; min-width:0; padding:5px; font-size:var(--text-sm); }

/* Os filtros quebram linha. Até 29/09 rolavam para o lado, e "Campanhas" e
   "Minhas" ficavam fora da vista: filtro escondido é filtro que ninguém usa. */
.chips { display:flex; flex-wrap:wrap; gap:var(--space-1); }
.chips button { padding:3px 10px; font-size:var(--text-xs); border:var(--borda); background:transparent;
  color:var(--text-2); border-radius:var(--raio-pill); cursor:pointer; white-space:nowrap; flex:0 0 auto; }
.chips button.sel { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }

/* ---- a linha da conversa ----
   O avatar de iniciais dá ritmo à coluna, que antes era um bloco de texto só. As
   marcas ficaram só para o EXCEPCIONAL: "aberta" e "sem cadastro" apareciam em
   toda linha e viraram textura. */
.conv { padding:var(--space-3); border-bottom:var(--borda); cursor:pointer; display:flex; gap:var(--space-3); }
.conv:hover { background:var(--superficie-hover); }
.conv.sel { background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
.ini { flex:0 0 38px; height:38px; border-radius:50%; background:var(--bg-3); color:var(--text-1);
  display:flex; align-items:center; justify-content:center; font-size:var(--text-sm);
  font-weight:var(--peso-forte); position:relative; }
.ini .n { position:absolute; top:-3px; right:-3px; min-width:17px; height:17px; padding:0 4px;
  border-radius:999px; background:var(--danger); color:var(--bg-2); font-size:var(--text-xs);
  display:flex; align-items:center; justify-content:center; font-weight:var(--peso-forte); }
.conv .corpo { flex:1; min-width:0; }
.conv .l1 { display:flex; justify-content:space-between; gap:var(--space-2); align-items:baseline; }
.conv .nome { font-weight:var(--peso-forte); font-size:var(--text-base);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv .hora { font-size:var(--text-xs); color:var(--text-3); white-space:nowrap; }
/* DUAS linhas, sempre, e a altura do card não depende do que ele tem a dizer.
   Até 01/10 as marcas ficavam numa terceira linha que só existia em algumas
   conversas: a de IA desligada media 86px contra 66px da vizinha, e a coluna
   ficava com o ritmo quebrado. Agora elas dividem a linha da prévia, à direita,
   e quem cede espaço é a prévia, que já cortava com reticências. */
/* A linha tem ALTURA FIXA. Sem ela a pílula da marca é 1px mais alta que a
   prévia, e o card com marca media 69px contra 68px dos outros: pouco para o
   olho, e o bastante para a conta de "todos iguais" não fechar. */
.conv .l2 { display:flex; gap:var(--space-2); align-items:center; margin-top:2px;
  height:20px; overflow:hidden; }
.conv .previa { font-size:var(--text-sm); color:var(--text-2); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
/* 55% da linha não cabiam as três marcas que uma conversa pendente com dono
   mostra ("pendente", "IA", o nome de quem assumiu): a última era cortada pela
   metade pelo `overflow:hidden`, e o que se via era meia pílula aberta na borda.
   Em 70% as três cabem; a prévia, que já corta com reticências, cede o espaço. */
.conv .marcas { display:flex; gap:var(--space-1); flex:0 0 auto; max-width:70%;
  overflow:hidden; white-space:nowrap; }
/* O CONTORNO TEM DE FECHAR. A linha da prévia tem altura fixa de 20px com
   `overflow:hidden` (é o que mantém todo card igual), e a pílula media 22px:
   12px de fonte por 1,5 de entrelinha, mais 2 de respiro e 2 de borda. Os 2px
   que sobravam eram justamente a borda de cima e a de baixo, cortadas — o selo
   aparecia aberto nas duas pontas. A entrelinha menor é o que o faz caber. */
.pil { font-size:var(--text-xs); line-height:1.2; padding:1px 8px;
  border-radius:var(--raio-pill); border:var(--borda); color:var(--text-2); }
.pil.pendente { border-color:var(--accent); color:var(--accent); }
.pil.resolvida { border-color:var(--success); color:var(--success); }
/* A IA no card: a sigla é sempre a mesma, e quem diz o estado é a cor — verde
   responde, amarelo em pausa, cinza desligada. Escrever "IA desligada" ocupava
   metade da linha da prévia para dizer o que a cor diz. */
.pil.ia-on { border-color:var(--success); color:var(--success); }
.pil.ia-pausa { border-color:var(--warn); color:var(--warn); }
.pil.ia-off { border-color:var(--text-3); color:var(--text-3); }
.pil.dono { border-color:var(--accent); color:var(--accent); }
.pil.so-recebeu { border-color:var(--text-3); color:var(--text-3); }
.pil.numero { border-color:var(--text-3); color:var(--text-2); }

/* ---- cabeçalho da conversa ----
   Tinha dois `select` crus, "assumir" e "IA: ligada", quatro controles do mesmo
   tamanho ao lado do nome: parecia formulário, não cabeçalho. O nome voltou a
   ser a coisa maior da faixa, e os controles ficaram discretos à direita. */
/* UMA linha, sempre: com `wrap`, o selo da IA caía sozinho para baixo assim que
   o contador entrava, e o cabeçalho ganhava uma segunda fileira só para ele
   (02/10). Quem cede espaço é o nome, que já trunca. */
.cab { padding:var(--space-3) var(--space-4); border-bottom:var(--borda);
  display:flex; gap:var(--space-2); align-items:center; flex-wrap:nowrap; }
/* Só os controles ficam rígidos. Uma regra em TODOS os filhos venceria o
   `flex:0 0 38px` do avatar (mesma especificidade, declarada depois) e o
   esmagava para 8px. */
.cab > select, .cab > button { flex:0 0 auto; }
.cab .quem { min-width:0; flex:1 1 auto; overflow:hidden; }
.cab .quem strong, .cab .quem span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cab .quem strong { font-size:var(--text-md); line-height:var(--lh-densa); }
.cab .quem span { font-size:var(--text-sm); color:var(--text-2); }
/* `field-sizing:content`: o <select> nativo se mede pela opção MAIS LARGA, e
   não pela escolhida — em "aberta" sobrava o espaço de "resolvida" dentro da
   caixa. Navegador sem a propriedade continua com o `width:auto` de antes. */
.cab select { width:auto; field-sizing:content; font-size:var(--text-sm); padding:4px 8px;
  background:transparent; border-color:var(--border); color:var(--text-2); }
.cab select:hover { border-color:var(--border-strong); color:var(--text-1); }
.cab .btn { font-size:var(--text-sm); }
/* O estado da IA é informação, e só vira ação no clique. É só a sigla, com a
   cor dizendo o estado — verde responde, amarelo em pausa, cinza desligada —,
   e o tempo que falta quando a pausa está correndo.

   A largura FIXA é só da pausa: ali o texto muda a cada minuto, e "03h:09" e
   "03h:10" não ocupam o mesmo espaço em fonte proporcional, então a pílula
   crescia e encolhia sozinha. Fora da pausa não há número, e ela fica do
   tamanho da sigla — com a largura da pausa sobrava metade da caixa vazia. */
.cab .ia-estado { display:inline-flex; align-items:center; justify-content:center; gap:5px;
  padding:3px 10px; border-radius:var(--raio-pill);
  font-size:var(--text-xs); font-variant-numeric:tabular-nums;
  border:1px solid var(--success); color:var(--success); background:transparent; }
.cab .ia-estado::before { content:''; width:7px; height:7px; border-radius:50%;
  background:currentColor; flex:0 0 auto; }
.cab .ia-estado.pausada { width:92px; border-color:var(--warn); color:var(--warn); }
.cab .ia-estado.off { border-color:var(--text-3); color:var(--text-3); }
.msgs { flex:1; overflow-y:auto; padding:var(--space-4); display:flex; flex-direction:column;
  gap:var(--space-2); background:var(--bg-0); }
/* O teto em PIXELS é o que importa aqui: só com `72%`, uma tela de 1600px
   produzia balão de 640px de largura, e linha longa demais obriga o olho a
   voltar ao começo. 34em é cerca de 70 caracteres, que é onde a leitura para de
   piorar. */
.msg { max-width:min(72%, 34em); padding:var(--space-2) var(--space-3);
  border-radius:var(--raio-md); position:relative;
  font-size:var(--text-base); line-height:var(--lh-base); word-break:break-word; }
/* O tipo da mensagem que não tem texto (Contato, Localização…): é descrição do
   que chegou, e não o conteúdo. */
.msg .sem-conteudo { color:var(--text-2); font-style:italic; }
/* A reação do contato, pendurada no pé do balão reagido, como no WhatsApp. */
.msg .reacoes { position:absolute; left:var(--space-3); bottom:-10px;
  background:var(--bg-1); border:var(--borda); border-radius:999px;
  padding:0 5px; font-size:var(--text-sm); line-height:1.5; }
.msg.minha .reacoes { left:auto; right:var(--space-3); }

/* ---- a data do dia, entre os grupos de mensagens ----
   Ela traz a DATA, a pedido (01/10/2026), em vez de "Hoje" e "Ontem": num
   histórico de atendimento, saber que foi dia 17 vale mais que saber que foi
   ontem.

   Ela GRUDA NO TOPO enquanto o dia dela está passando, como no WhatsApp: a
   data do que se está lendo fica à vista, e o chip do dia seguinte empurra o
   anterior para fora quando chega.

   O que faz isso funcionar é cada dia ter o seu PRÓPRIO container (`.grupo-dia`,
   escrito pelo `pintarMensagens`). Um `sticky` preso só ao `.msgs` gruda TODOS
   os chips no mesmo ponto, e eles se empilham uns atrás dos outros — foi o que
   apareceu em 01/10 na conversa do Funprev, com 24 datas sobrepostas em
   `top: 158`, e por isso o `sticky` tinha saído. Dentro do grupo, cada chip é
   limitado pelo pai, que é justamente o que falta na versão de um container só.

   LARGURA IGUAL para todas. A fonte é proporcional, então "11/08/2026" dava
   89px e "02/09/2026" dava 94px, e a coluna de chips ficava desalinhada.
   `tabular-nums` faz todo dígito ocupar a mesma caixa, e a largura fixa fecha
   a conta. */
.grupo-dia { display:flex; flex-direction:column; gap:var(--space-2); }
.dia { align-self:center; width:106px; text-align:center;
  position:sticky; top:0; z-index:2;
  font-variant-numeric:tabular-nums; font-size:var(--text-xs); color:var(--text-2);
  background:var(--bg-1); border:var(--borda); border-radius:var(--raio-pill);
  padding:2px 0; margin:0 0 var(--space-2);
  box-shadow:0 1px 4px rgba(0,0,0,.12); }

/* ---- a hora, no canto de dentro do balão ----
   Ela era uma LINHA abaixo do texto, e cada mensagem de uma palavra ocupava a
   altura de duas. Agora mora no canto inferior direito, dentro do balão, como
   no WhatsApp, e a `vaga` reserva na última linha do texto o espaço por onde
   ela passa — sem isso a última palavra ficaria embaixo dela. */
.msg .hora-canto { position:absolute; right:var(--space-3); bottom:3px;
  font-size:var(--text-xs); color:var(--text-3); white-space:nowrap; }
/* A vaga: 6 caracteres para a hora, 14 quando ela vem com "editada" na frente.
   Na mensagem NOSSA a hora leva o tique junto, e a vaga cresce o tanto dele —
   sem isso o tique volta a cair por cima da última palavra, que é o defeito que
   a vaga existe para evitar. */
.msg .vaga { display:inline-block; width:6ch; }
.msg .vaga.larga { width:14ch; }
.msg.minha .vaga.com-ack { width:8.5ch; }
.msg.minha .vaga.larga.com-ack { width:16.5ch; }
/* Mensagem que é só mídia não tem última linha onde reservar vaga: ali a hora
   volta a ser uma linha, embaixo do arquivo e à direita. */
.msg.so-midia .hora-canto { position:static; display:block; text-align:right; }

/* ---- o balão citado, em cima da resposta ----
   Vale para os dois lados: o que respondemos citando e o que o contato cita. O
   fio à esquerda é o que diz "isto é citação", e não um parágrafo a mais. */
.msg .cita { border-left:3px solid var(--accent); background:var(--superficie-hover);
  border-radius:4px; padding:6px var(--space-2); margin-bottom:var(--space-1);
  font-size:var(--text-sm); color:var(--text-2);
  max-height:3.4em; overflow:hidden; white-space:pre-wrap; }
.msg .cita b { display:block; font-size:var(--text-xs); color:var(--accent); font-weight:var(--peso-forte); }
/* O pre-wrap é só do TEXTO, que pode ter várias linhas. No balão inteiro, ele
   preservava também a quebra e o recuo do código em volta do texto, e cada
   mensagem curta ("compra") virava um bloco com linhas vazias em cima e embaixo. */
.msg .txt { white-space:pre-wrap; }
.res-qualificado { color:var(--success); }
.res-desqualificado { color:var(--text-3); }
.msg.deles { background:var(--bg-1); border:var(--borda); align-self:flex-start; border-bottom-left-radius:3px; }
.msg.minha { background:var(--accent-soft); border:var(--borda-acento); align-self:flex-end; border-bottom-right-radius:3px; }

/* A linha de baixo juntava hora, origem e duas ações no mesmo tom e tamanho.
   A hora fica à esquerda, apagada; as ações vão para a direita, que é onde a
   mão procura. */
.msg .midia { display:block; margin-bottom:var(--space-1); }
.msg .midia img { display:block; max-width:100%; max-height:320px; border-radius:6px; cursor:zoom-in; }
.msg .midia audio, .msg .midia video { display:block; max-width:100%; }
.msg .midia video { max-height:320px; border-radius:6px; }
.msg .midia .falhou { font-size:var(--text-xs); color:var(--text-3); }

/* ---- foto e vídeo: o balão tem a LARGURA da imagem ----
   A moldura de 8px em volta e a legenda escrita na largura do texto, e não na
   da foto, faziam o balão sair torto: foto em pé de 187px dentro de um balão de
   241px, com a legenda passando por fora dela de um lado só. No WhatsApp a foto
   encosta nas bordas e é ELA que decide a largura; a legenda quebra ali dentro.

   A largura vem do `ajustarBalaoDaFoto`, no clique de carregamento: a imagem
   chega sem dimensão declarada, e só depois de carregada se sabe quanto ela
   ocupa com o teto de 320px de altura. Em CSS puro isso não se escreve — a
   largura do balão depende da foto, e a da foto depende do balão. */
.msg.com-foto { padding:3px; }
.msg.com-foto .midia { margin-bottom:0; }
.msg.com-foto .midia img, .msg.com-foto .midia video { border-radius:5px; }
.msg.com-foto .txt { padding:3px var(--space-2) 2px; }
.msg.com-foto .cita { margin:3px 3px var(--space-1); }
/* Foto sem legenda: a hora vai POR CIMA dela, no canto, como no WhatsApp. Numa
   linha própria embaixo ela abria uma faixa vazia do tamanho dela no balão que
   agora é só a foto. A sombra é o que a mantém legível sobre foto clara. */
.msg.com-foto.so-midia .hora-canto { position:absolute; right:10px; bottom:8px;
  color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.9); }
.msg.com-foto.so-midia .ack { color:#fff; }

/* ---- o visor da foto ----
   A foto abria em outra aba, e quem estava atendendo saía da conversa para ver
   uma imagem. Aqui ela abre por cima, a conversa fica atrás e fechar devolve a
   leitura onde estava. O `.modal-bg` é o do sistema, então o `dialogo.js` já
   trata foco e leitor de tela; o que muda é a caixa, que aqui não é cartão. */
.visor-bg .modal.visor { background:transparent; border:0; box-shadow:none; padding:0;
  max-width:none; width:auto; max-height:92vh; display:flex; flex-direction:column;
  align-items:flex-end; gap:var(--space-2); overflow:visible; }
.visor-bg .visor-barra { display:flex; gap:var(--space-2); align-items:center; }
.visor-bg #visorImg { display:block; max-width:92vw; max-height:84vh; border-radius:var(--raio-md);
  box-shadow:0 20px 60px rgba(0,0,0,.6); background:var(--bg-1); }

/* ---- a figurinha ----
   Ela chega em 512x512 e caía na mesma regra da foto (`max-width:100%`), que
   num balão de 34em dá quase 400px de lado: uma figurinha ocupava mais tela que
   qualquer foto do histórico. No WhatsApp ela é pequena e não tem balão em
   volta, e é esse o tamanho que vale aqui — 128px, medidos nos dois lados para
   que figurinha larga e figurinha alta fiquem na mesma caixa.

   Sem balão SÓ quando ela é o conteúdo inteiro (`so-figurinha`): com legenda, o
   texto embaixo precisa do fundo para ser lido. */
.msg .midia.figurinha img { max-width:128px; max-height:128px; border-radius:0; }
.msg.so-figurinha { background:transparent; border:0; padding:0; }
/* A hora da figurinha não tem balão onde se apoiar, então ela ganha o próprio
   fundo, como os chips de data — sem isso ela fica cinza sobre o fundo da
   conversa, que é de onde vem a cor dela. */
.msg.so-figurinha .hora-canto { background:var(--bg-1); border:var(--borda);
  border-radius:var(--raio-pill); padding:0 6px; }

/* ---- o áudio ----
   O `<audio controls>` desenha a barra do SISTEMA: no Chrome é um bloco
   cinza-escuro de 54px de altura e 300px de largura, com o alto-falante e o
   menu de três pontos, e ele não obedece ao tema nem cabe no balão. O que está
   aqui tem as mesmas peças e nada mais: tocar, a posição e o tempo.

   A barra é um `<input type="range">`, e não um desenho próprio: arrastar,
   clicar no meio e as setas do teclado já vêm dele. */
.msg .midia.som { display:flex; align-items:center; gap:var(--space-2);
  min-width:min(240px, 60vw); padding:2px 0; }
.msg .som .aud-play { flex:0 0 auto; width:32px; height:32px; border-radius:50%;
  border:0; cursor:pointer; display:grid; place-items:center; padding:0;
  background:var(--accent); color:#fff; }
.msg .som .aud-play:hover { filter:brightness(1.08); }
.msg .som .aud-play svg { width:16px; height:16px; }
.msg .som .aud-play .pausar, .msg .som.tocando .aud-play .tocar { display:none; }
.msg .som.tocando .aud-play .pausar { display:block; }
.msg .som .aud-barra { flex:1 1 auto; min-width:60px; height:4px; margin:0;
  -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer; }
.msg .som .aud-barra::-webkit-slider-runnable-track { height:4px; border-radius:2px;
  background:linear-gradient(to right, var(--accent) var(--tocado, 0%), var(--superficie-hover) var(--tocado, 0%)); }
.msg .som .aud-barra::-moz-range-track { height:4px; border-radius:2px; background:var(--superficie-hover); }
.msg .som .aud-barra::-moz-range-progress { height:4px; border-radius:2px; background:var(--accent); }
.msg .som .aud-barra::-webkit-slider-thumb { -webkit-appearance:none; appearance:none;
  width:11px; height:11px; margin-top:-3.5px; border-radius:50%; background:var(--accent); border:0; }
.msg .som .aud-barra::-moz-range-thumb { width:11px; height:11px; border:0;
  border-radius:50%; background:var(--accent); }
.msg .som .aud-tempo { flex:0 0 auto; font-size:var(--text-xs); color:var(--text-2);
  font-variant-numeric:tabular-nums; }
/* O áudio que não disse a duração (ogg sem o cabeçalho completo) não tem como
   ser arrastado: a barra sai desligada, em vez de fingir uma posição. */
.msg .som .aud-barra:disabled { opacity:.45; cursor:default; }
/* Áudio sem legenda: a hora entra na linha do player. Pela regra do `so-midia`
   ela virava uma linha própria embaixo, e o balão do áudio ficava com o dobro
   da altura e uma faixa vazia no meio. */
.msg.so-audio { display:flex; align-items:center; gap:var(--space-2); }
.msg.so-audio .midia.som { margin-bottom:0; }

/* ---- os ticks de envio, entrega e leitura ----
   Eles vão DENTRO da hora, que é onde o WhatsApp os põe, e por isso a vaga
   reservada na última linha do texto cresce nas mensagens nossas: a hora passa
   a levar o tique junto, e sem a vaga maior ela voltaria a cair por cima da
   última palavra. */
.msg .ack { display:inline-block; vertical-align:-2px; margin-left:3px; }
.msg .ack svg { width:14px; height:14px; display:block; }
/* "Lida" é o acento do TEMA, e não o azul do WhatsApp: o balão nosso já é
   `accent-soft`, e uma cor de fora dele ficaria como mancha nos dois temas. */
.msg .ack.lida { color:var(--accent); }
.msg .ack.falhou { color:var(--danger); }
/* A linha de rodapé do balão: marcas (apagada, IA, "certo", "corrigir") e a
   HORA, juntas, alinhadas pela base e à direita.

   Até 01/10 à tarde a hora era absoluta no canto e as marcas eram outra linha:
   os dois ficavam a 5px de altura um do outro, e era isso o "certo e corrigir
   desalinhado". Quando há marcas, a hora entra NESTA linha (a regra abaixo a
   desabsolutiza) e tudo divide a mesma base. Sem marcas, ela continua no canto
   de dentro do balão, que é o que mantém a mensagem curta com uma linha só. */
.msg .meta { font-size:var(--text-xs); color:var(--text-3); margin-top:var(--space-1);
  display:flex; gap:var(--space-2); align-items:baseline; justify-content:flex-end; }
.msg.tem-meta .hora-canto { position:static; }
.msg.tem-meta .vaga { display:none; }
/* O selo "IA" é o BOTÃO das ações da resposta (02/10): "certo" e "corrigir"
   eram dois links em cada balão da IA, repetidos conversa abaixo, e foram para
   o menu que o clique aqui abre. A cor diz o que já foi decidido — verde para
   a marcada como certa, vermelho para a que virou correção na base. */
.msg .meta .porIA { border:var(--borda); border-color:var(--purple, #a78bfa);
  color:var(--purple, #a78bfa); border-radius:var(--raio-pill); padding:0 6px;
  background:transparent; font:inherit; line-height:1.5; cursor:pointer; }
.msg .meta .porIA:hover { background:var(--superficie-hover); }
.msg .meta .porIA.ok { border-color:var(--success); color:var(--success); }
.msg .meta .porIA.corrigida { border-color:var(--danger); color:var(--danger); }
/* Apagada no WhatsApp: a mensagem continua inteira e legível, e a marca diz o
   que aconteceu. O texto esmaecido seria pior — quem lê o histórico depois
   precisa justamente do conteúdo que o outro lado quis tirar. */
.msg.apagada { border:var(--borda); border-color:var(--warn, #fbbf24); }
.msg .apagada-marca { color:var(--warn, #b45309); }
/* ---- a barra de escrever, no desenho do WhatsApp ----
   Uma moldura arredondada com o campo dentro, os dois ícones nas pontas de
   dentro dela (emoji à esquerda, anexo à direita) e o enviar num botão redondo
   fora, à direita. Sem figurinha, a pedido. O campo cresce com o texto até um
   teto e então rola, em vez de ter alça de redimensionar: alça obriga quem
   escreve cinco linhas a arrastar a tela. */
/* O rodapé SAI DO FLUXO e flutua sobre a conversa, como no biturion (lá é
   `absolute inset-x-0 bottom-0` com `pointer-events-none`). Enquanto ele era um
   bloco com fundo próprio, a faixa inteira da largura da coluna ficava atrás da
   pílula — era essa a caixa, e ter o mesmo fundo das mensagens não a desfazia.

   Sem fundo, o que abre o espaço para a última mensagem é o `padding-bottom` do
   `.msgs`, escrito pelo `ResizeObserver` com a altura medida do rodapé: ela
   muda com a citação, o anexo, o painel de emoji e o campo que cresce. */
.responder { position:absolute; left:0; right:0; bottom:0; z-index:3;
  background:transparent; padding:var(--space-2) var(--space-3);
  display:flex; flex-direction:column; gap:var(--space-2); pointer-events:none; }
/* O vão em volta não recebe clique: ali embaixo está a conversa, e é nela que
   o clique deve cair. Cada peça do rodapé volta a receber. */
.responder > * { pointer-events:auto; }
.linha-escrita { display:flex; gap:var(--space-2); align-items:flex-end; }
/* A pílula FLUTUA, como no WhatsApp e no biturion: o que a separa da conversa é
   a superfície mais clara e a sombra, e não um contorno. Com borda e fundo
   transparente ela aparecia como uma caixa desenhada por cima do mesmo fundo —
   o contorno era justamente o que incomodava. O foco entra na própria sombra,
   porque não há mais borda para colorir. */
.caixa-escrita { flex:1; min-width:0; display:flex; align-items:flex-end; gap:var(--space-1);
  background:var(--bg-1); border:0; border-radius:22px; padding:4px 6px;
  box-shadow:0 1px 3px rgba(0,0,0,.10), 0 4px 14px rgba(0,0,0,.06); }
.caixa-escrita:focus-within { box-shadow:0 0 0 1.5px var(--accent), 0 4px 14px rgba(0,0,0,.06); }
.caixa-escrita textarea { flex:1; min-width:0; border:0; background:transparent; box-shadow:none;
  resize:none; min-height:32px; max-height:140px; padding:6px 2px; line-height:1.35;
  font-size:var(--text-base); color:var(--text-0); }
.caixa-escrita textarea:focus { outline:none; box-shadow:none; }
.icone-barra { flex:0 0 auto; width:32px; height:32px; border:0; background:transparent;
  color:var(--text-3); border-radius:50%; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; }
.icone-barra:hover { background:var(--superficie-hover); color:var(--text-1); }
.icone-barra svg { width:19px; height:19px; }
/* Menor que a linha de escrever, e não maior: com 42px ele era o elemento mais
   alto do rodapé e puxava o olho para si, à frente do que se está escrevendo. */
.btn-enviar { flex:0 0 auto; width:34px; height:34px; margin-bottom:3px; border:0; border-radius:50%;
  background:var(--accent); color:var(--bg-2); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; }
.btn-enviar:hover { filter:brightness(1.08); }
.btn-enviar svg { width:17px; height:17px; }

/* A citação em preparo, acima do campo: é o que mostra a qual mensagem a
   resposta vai responder, e o X é a saída. */
/* Nascem escondidas pelo CSS, e não por `style="display:none"` no HTML: estilo
   inline nesta tela já foi 172 atributos, e a suíte guarda o teto. */
.citando, .anexo-preparo { display:none; }
.citando.abre, .anexo-preparo.abre { display:flex; }
.caixa-escrita input[type=file] { display:none; }
.citando { gap:var(--space-2); align-items:flex-start;
  border-left:3px solid var(--accent); background:var(--superficie-hover);
  border-radius:4px; padding:var(--space-1) var(--space-2); font-size:var(--text-sm); }
.citando .t { flex:1; min-width:0; color:var(--text-2);
  max-height:2.8em; overflow:hidden; white-space:pre-wrap; }
.citando b { display:block; font-size:var(--text-xs); color:var(--accent); }
.citando button { border:0; background:transparent; color:var(--text-3); cursor:pointer;
  font-size:1.1em; line-height:1; padding:2px 4px; }

/* Os emojis: um painel pequeno de uso comum, e não um teclado inteiro. Figurinha
   fica fora, a pedido. */
.painel-emoji { display:none; flex-wrap:wrap; gap:2px; max-height:140px; overflow-y:auto;
  border:var(--borda); border-radius:var(--raio-md); padding:var(--space-2); background:var(--bg-1); }
.painel-emoji.abre { display:flex; }
.painel-emoji button { border:0; background:transparent; cursor:pointer; font-size:1.25em;
  width:32px; height:30px; border-radius:6px; }
.painel-emoji button:hover { background:var(--superficie-hover); }

/* O arquivo escolhido, antes de sair. */
.anexo-preparo { gap:var(--space-2); align-items:center; font-size:var(--text-sm);
  border:var(--borda); border-radius:var(--raio-md); padding:var(--space-1) var(--space-2); }
.anexo-preparo .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.anexo-preparo img { max-height:40px; border-radius:4px; }
.anexo-preparo button { border:0; background:transparent; color:var(--text-3); cursor:pointer; }

/* ---- o menu do botão direito sobre a mensagem ----
   Fixo no documento, e não dentro do balão: dentro, a caixa de mensagens o
   cortaria na borda, que é justamente onde ele costuma abrir. */
.menu-msg { position:fixed; z-index:9000; display:none; min-width:168px;
  background:var(--bg-1); border:var(--borda); border-radius:var(--raio-md);
  padding:4px; box-shadow:0 8px 24px rgba(0,0,0,.18); }
.menu-msg.abre { display:block; }
.menu-msg button { display:block; width:100%; text-align:left; border:0; background:transparent;
  color:var(--text-1); font-size:var(--text-sm); padding:7px 10px; border-radius:6px; cursor:pointer; }
.menu-msg button:hover { background:var(--superficie-hover); }
.menu-msg button.perigo { color:var(--danger); }
.msg.realcada { outline:2px solid var(--accent); outline-offset:1px; }

.ficha .bloco { padding:var(--space-3) var(--space-4); border-bottom:var(--borda); }
.ficha h4 { margin:0 0 var(--space-2); font-size:var(--text-xs); text-transform:uppercase;
  letter-spacing:.06em; color:var(--text-3); }
.ficha .linha { display:flex; justify-content:space-between; font-size:var(--text-sm);
  padding:3px 0; gap:var(--space-2); }

/* Um estado vazio por região, e nenhum deles narra o que está na tela. */
.vazio-centro { display:flex; align-items:center; justify-content:center; height:100%;
  color:var(--text-3); font-size:var(--text-base); padding:var(--space-5); text-align:center; }

/* O título da tela e os dois avisos moram DENTRO da caixa (02/10), na linha de
   cima da busca: fora dela, o cabeçalho da página ocupava uma faixa inteira
   para dizer o nome do que já se está vendo.

   Os avisos são só o ÍCONE, com a cor dizendo o estado — o nome ("Som
   ligado") ocupava três vezes o espaço para a mesma informação. O que cada um
   faz continua no `data-dica`. */
.titulo-lista { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); }
.titulo-lista h1 { margin:0; font-size:var(--text-lg); line-height:1.2; }
.avisos { display:flex; gap:var(--space-1); flex:0 0 auto; }
.avisos button { display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; padding:0; font-size:var(--text-sm); line-height:1;
  border:var(--borda); background:transparent; color:var(--text-3);
  border-radius:var(--raio-md); cursor:pointer; }
.avisos button.on { border-color:var(--success); color:var(--success); }
.avisos button:hover { border-color:var(--border-strong); }

/* O balão do `data-dica`. Os ícones já traziam o atributo, e não havia nada que
   o desenhasse: passar o mouse não dizia nada. `title=` está proibido nesta base
   (Fase 3.2.1) — o balão nativo aparece branco, atrasado e por cima do nosso. */
.dica { position:fixed; z-index:1100; pointer-events:none; opacity:0;
  transition:opacity .12s; background:var(--bg-3); color:var(--text-0);
  border:1px solid var(--border-strong); border-radius:6px; padding:5px 9px;
  font-size:var(--text-xs); max-width:240px; box-shadow:0 4px 12px rgba(0,0,0,.3); }
.dica.on { opacity:1; }

/* Os avisos do sistema, no topo e ao centro. A peça (`aviso-sistema.js`) os põe
   no canto de baixo, à direita, que é onde eles ficam no resto do ERP; aqui o
   canto de baixo é a barra de escrever, e o aviso cairia em cima dela. */
#toasts { top:12px; bottom:auto; left:50%; right:auto; transform:translateX(-50%);
  flex-direction:column; align-items:center; }
</style>
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="central" id="central">
    <div class="coluna lista">
      <div class="topo">
        <div class="titulo-lista">
          <h1>Conversas</h1>
          <div class="avisos" id="avisos"></div>
        </div>
        <div class="busca-wa">
          <i data-lucide="search"></i>
          <input type="text" id="busca" placeholder="Pesquisar" oninput="renderLista()">
          <button type="button" class="limpar" id="limparBusca" onclick="limparBusca()"
            data-dica="Limpar a busca"><i data-lucide="x"></i></button>
        </div>
        <div class="seletores" id="seletores">
          <select id="selNumero" onchange="escolherNumero(this.value)"></select>
          <select id="selNicho" onchange="escolherNicho(this.value)"></select>
          <select id="selSituacao" onchange="escolherSituacao(this.value)"></select>
        </div>
        <div class="chips" id="filtros"></div>
      </div>
      <div class="rolagem" id="listaConv"><div class="vazio-centro">Carregando…</div></div>
    </div>

    <div class="coluna thread">
      <div class="cab" id="threadCab" style="display:none;"></div>
      <div class="msgs" id="msgs"><div class="vazio-centro">Escolha uma conversa na lista</div></div>
      <div class="responder" id="responder" style="display:none;">
        <div class="citando" id="citando"></div>
        <div class="anexo-preparo" id="anexoPreparo"></div>
        <div class="painel-emoji" id="painelEmoji"></div>
        <div class="linha-escrita">
          <div class="caixa-escrita">
            <button type="button" class="icone-barra" id="btnEmoji" onclick="alternarEmojis()"
              data-dica="Emojis"><i data-lucide="smile"></i></button>
            <textarea id="txtResposta" rows="1" placeholder="Escreva a mensagem"
              oninput="crescerCampo(this)"
              onkeydown="aoDigitar(event)"></textarea>
            <button type="button" class="icone-barra" onclick="document.getElementById('arqAnexo').click()"
              data-dica="Anexar imagem, vídeo ou documento"><i data-lucide="paperclip"></i></button>
            <input type="file" id="arqAnexo" onchange="escolherAnexo(this)"
              accept="image/*,video/mp4,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.xml,.zip,.rar">
          </div>
          <button class="btn btn-ghost btn-sm" id="btnAgendar" onclick="enviarConviteAgenda()"
            style="display:none;">Agendar reunião</button>
          <button type="button" class="btn-enviar" onclick="responder()"
            data-dica="Enviar (Enter)"><i data-lucide="send"></i></button>
        </div>
      </div>
    </div>

    <div class="coluna ficha"><div class="rolagem" id="fichaCorpo"></div></div>
  </div>
</main></div>

<!-- o menu do botão direito sobre uma mensagem -->
<div class="menu-msg" id="menuMsg"></div>

<!-- o balão de quem tem `data-dica` -->
<div class="dica" id="dica" role="tooltip"></div>

<!-- modal corrigir -->
<div class="modal-bg" id="modalCorrigir">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <div><h3 style="margin:0;">Corrigir a IA</h3>
        <small class="muted">A resposta certa vira item da base e passa a valer nas próximas conversas.</small></div>
      <button class="btn btn-ghost btn-sm" onclick="fechar('modalCorrigir')" style="font-size:1.2em;padding:4px 10px;">×</button>
    </div>
    <div class="form-row"><div class="form-group full-width">
      <label for="cErrada">A IA respondeu</label><textarea id="cErrada" rows="3" readonly></textarea>
    </div></div>
    <div class="form-row"><div class="form-group full-width">
      <label for="cCerta">O que ela deveria ter dito *</label><textarea id="cCerta" rows="4" placeholder="Escreva a resposta correta, com o dado real"></textarea>
    </div></div>
    <div class="form-row"><div class="form-group full-width">
      <label for="cTitulo">Título na base</label><input type="text" id="cTitulo" placeholder="ex.: Prazo de entrega para o Pará">
    </div></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fechar('modalCorrigir')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarCorrecao()">Salvar na base</button>
    </div>
  </div>
</div>
<!-- o visor da foto, aberto no clique do balão (igual ao WhatsApp: a conversa
     continua atrás, e fechar devolve a leitura onde ela estava) -->
<div class="modal-bg visor-bg" id="visorFoto" onclick="fecharVisorFora(event)">
  <div class="modal visor">
    <div class="visor-barra">
      <a class="btn btn-ghost btn-sm" id="visorBaixar" download>Baixar</a>
      <button class="btn btn-ghost btn-sm" onclick="fechar('visorFoto')" aria-label="Fechar a foto"
        style="font-size:1.2em;padding:4px 10px;">×</button>
    </div>
    <img id="visorImg" alt="Foto da conversa, em tamanho inteiro">
  </div>
</div>
<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/aviso-sistema.js"></script>
<script src="/js/polegar.js"></script>
<script>initSidebar('conversas');</script>
<script>
let CONVERSAS = [], ATUAL = null, FILTRO = '', EDITANDO = null;
// NUMERO: o número de WhatsApp filtrado ('' = todos); NUMEROS vem com a lista.
let NUMERO = '', NUMEROS = [];
// NICHO: o segmento da CAMPANHA que a pessoa recebeu ('' = todos os nichos).
// SITUACAO recorta por fora dele: todos (padrão), quem respondeu, quem não,
// e o resultado do roteiro.
// Até 01/10 este par era o segmento da FICHA mais um filtro de campanha com
// dois seletores; o nicho juntou os dois no que o dono de fato procura.
let NICHO = '', NICHOS = [], SITUACAO = 'todos';
const RECORTES = ['naoLidas', 'minhas', 'semDono'];
// Quem pode assumir conversa, e quem sou eu. Carregados uma vez: a equipe não
// muda no meio do expediente, e a lista alimenta um select por conversa aberta.
let ATENDENTES = [], EU_ID = null;
let PUBLICO = [], SEL_PUB = new Set(), MODELOS = [], LISTAS = [];

/* O aviso do sistema é um TOAST, e não uma faixa acima da lista.
 *
 * A faixa empurrava a caixa inteira para baixo a cada erro, e levava os cards
 * junto. Quem desenha é o `aviso-sistema.js`, que já tem o X e o clique para
 * fechar; daqui saem a posição (topo, ao centro) e os 3 segundos. */
function showAlert(m, t = 'success'){
  if (t === 'error') return Aviso.erro(m, 3);
  if (t === 'success') return Aviso.ok(m, 3);
  return Aviso.info(m, 3);
}
function fechar(id){ document.getElementById(id).classList.remove('open'); }
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// String para usar como argumento dentro de onclick="...": aspas SIMPLES no JS,
// e o resto escapado para HTML. JSON.stringify não serve aqui — a aspa dupla
// que ele gera encerra o atributo e o handler vira um fragmento quebrado.
const argJs = s => "'" + String(s==null?'':s)
  .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]+/g,' ')
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;') + "'";
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

function quando(v){
  if (!v) return '';
  const d = new Date(String(v).replace(' ','T') + (String(v).endsWith('Z')?'':'Z'));
  if (isNaN(d)) return '';
  const hoje = new Date();
  const mesmoDia = d.toDateString() === hoje.toDateString();
  return mesmoDia ? d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
                  : d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
}

// ---------- mídia das mensagens (wa-midia.js) ----------
// A mídia vem do servidor quando a conversa abre; o texto, quando há, fica
// embaixo dela. Imagem abre inteira em outra aba.
// O que NÃO é mídia e também não traz texto. Sem isto a conversa ficava cheia
// de "(sem texto)" sem dizer o que tinha chegado (02/10/2026).
const ROTULO_TIPO = {
  contactMessage: 'Contato', contactsArrayMessage: 'Contatos',
  locationMessage: 'Localização', liveLocationMessage: 'Localização em tempo real',
  listMessage: 'Lista de opções', buttonsMessage: 'Mensagem com botões',
  albumMessage: 'Álbum', pollCreationMessage: 'Enquete', pollUpdateMessage: 'Voto em enquete',
  // A edição que chegou cifrada e não abriu. O webhook passou a aplicá-la na
  // mensagem original (`wa-edicao.js`), então isto só aparece nas que já
  // estavam gravadas e nas nossas, editadas pelo celular, cujo segredo não
  // existe em lugar nenhum.
  secretEncryptedMessage: 'Mensagem editada',
};
const TIPOS_MIDIA = { imageMessage: 'img', stickerMessage: 'img', templateMessage: 'img',
  videoMessage: 'video', ptvMessage: 'video', audioMessage: 'audio',
  documentMessage: 'doc', documentWithCaptionMessage: 'doc' };
function midiaDa(x){
  const tipo = TIPOS_MIDIA[x.message_type];
  if (!tipo) return '';
  const url = '/api/conversas/midia/' + x.id;
  const falha = `this.closest('.midia').innerHTML='<span class=\\'falhou\\'>Mídia indisponível</span>'`;
  if (tipo === 'img') {
    // A figurinha tem outra caixa: 128px e sem balão (ver `.figurinha`, no
    // estilo), e por isso não abre no visor nem mexe na largura do balão.
    const fig = x.message_type === 'stickerMessage' ? ' figurinha' : '';
    // O `href` fica: ele é o que dá "abrir em nova guia" pelo botão do meio e
    // pelo menu do navegador. O clique comum é do visor.
    return `<a class="midia${fig}" href="${url}"${fig ? ' target="_blank" rel="noopener"' : ' onclick="abrirVisor(event, this.href)"'}>
    <img src="${url}" alt="" loading="lazy" onerror="${falha}"${fig ? '' : ' onload="ajustarBalaoDaFoto(this)"'}></a>`;
  }
  if (tipo === 'video') return `<span class="midia"><video src="${url}" controls preload="metadata" onerror="${falha}" onloadedmetadata="ajustarBalaoDaFoto(this)"></video></span>`;
  if (tipo === 'audio') return playerDeAudio(url, falha);
  return `<a class="midia" href="${url}" target="_blank" rel="noopener">Abrir documento</a>`;
}

/**
 * A largura do balão passa a ser a da foto, como no WhatsApp.
 *
 * A foto chega sem dimensão declarada e com teto de 320px de altura: uma foto
 * em pé fica com 187px de largura dentro de um balão de 241px, e a legenda
 * escrita embaixo ultrapassava a foto de um lado só. Depois de carregada, a
 * largura dela é conhecida, e é ela que o balão passa a ter — a legenda quebra
 * nessa medida, e a hora cabe no canto.
 *
 * O piso de 110px é a hora: abaixo disso ela não cabe na linha e cairia por
 * cima da legenda. Miniatura menor que isso é rara e fica com faixa de balão
 * em volta, que é o mal menor.
 */
function ajustarBalaoDaFoto(el){
  const balao = el.closest('.msg');
  if (!balao) return;
  balao.classList.add('com-foto');
  const largura = Math.round(el.getBoundingClientRect().width);
  if (largura > 0) balao.style.width = Math.max(largura, 110) + 6 + 'px';
}

/**
 * O visor: a foto abre por cima da conversa, e não em outra aba.
 *
 * Fechar devolve a conversa exatamente onde estava. O `.modal-bg` é o do
 * sistema de propósito — o `dialogo.js` cuida de foco e leitor de tela.
 */
function abrirVisor(ev, url){
  if (ev) ev.preventDefault();
  document.getElementById('visorImg').src = url;
  document.getElementById('visorBaixar').href = url;
  document.getElementById('visorFoto').classList.add('open');
}
// Clicar no fundo fecha; clicar na foto, não.
function fecharVisorFora(ev){
  if (ev.target.id === 'visorFoto') fechar('visorFoto');
}

/* ---------- o player de áudio ----------
 *
 * O `<audio controls>` desenhava o player do sistema, que no Chrome é um bloco
 * cinza com alto-falante e menu de três pontos: não acompanha o tema, não cabe
 * no balão e oferece coisas que não têm sentido aqui (baixar, velocidade).
 *
 * Este tem as três peças que se usam num áudio de atendimento: tocar, a posição
 * e o tempo. O `<audio>` continua sendo o do navegador — o que saiu foi só a
 * interface dele (`controls`).
 */
const SVG_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const SVG_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

function playerDeAudio(url, falha){
  return `<span class="midia som">
    <button type="button" class="aud-play" aria-label="Tocar áudio">
      <span class="tocar">${SVG_PLAY}</span><span class="pausar">${SVG_PAUSE}</span></button>
    <input class="aud-barra" type="range" min="0" max="1000" value="0" step="1"
      aria-label="Posição do áudio" disabled>
    <span class="aud-tempo">--:--</span>
    <audio src="${url}" preload="metadata" onerror="${falha}"></audio>
  </span>`;
}

const mmss = (s) => {
  if (!isFinite(s) || s < 0) return '--:--';
  const t = Math.floor(s);
  return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
};

// O áudio que está tocando. Dois áudios ao mesmo tempo não se entendem, e no
// WhatsApp tocar um para o outro.
let AUDIO_TOCANDO = null;

/**
 * Liga os players da conversa recém-pintada.
 *
 * Um listener por áudio, e não um delegado no `.msgs`: `timeupdate`,
 * `loadedmetadata` e `ended` não sobem na árvore, então a delegação por
 * borbulhamento não os veria.
 */
function ligarAudios(container){
  for (const som of container.querySelectorAll('.midia.som')) {
    const a = som.querySelector('audio');
    const barra = som.querySelector('.aud-barra');
    const tempo = som.querySelector('.aud-tempo');
    if (!a || a.dataset.ligado) continue;
    a.dataset.ligado = '1';

    const pintar = () => {
      const dur = a.duration;
      // Sem duração conhecida não há posição: a barra fica desligada e o tempo
      // mostra o que já tocou, em vez de uma régua inventada.
      if (!isFinite(dur) || dur <= 0) { barra.disabled = true; tempo.textContent = a.currentTime ? mmss(a.currentTime) : '--:--'; return; }
      barra.disabled = false;
      const frac = Math.min(1, a.currentTime / dur);
      if (document.activeElement !== barra) barra.value = String(Math.round(frac * 1000));
      barra.style.setProperty('--tocado', (frac * 100).toFixed(1) + '%');
      // Parado mostra quanto o áudio tem; tocando, onde está.
      tempo.textContent = mmss(a.paused && !a.currentTime ? dur : a.currentTime);
    };

    a.addEventListener('loadedmetadata', pintar);
    a.addEventListener('timeupdate', pintar);
    a.addEventListener('play', () => {
      if (AUDIO_TOCANDO && AUDIO_TOCANDO !== a) AUDIO_TOCANDO.pause();
      AUDIO_TOCANDO = a;
      som.classList.add('tocando');
    });
    a.addEventListener('pause', () => som.classList.remove('tocando'));
    a.addEventListener('ended', () => { som.classList.remove('tocando'); a.currentTime = 0; pintar(); });

    som.querySelector('.aud-play').addEventListener('click', () => {
      if (a.paused) a.play().catch(e => { tempo.textContent = 'erro'; console.error('[audio]', e.message); });
      else a.pause();
    });
    barra.addEventListener('input', () => {
      if (isFinite(a.duration) && a.duration > 0) a.currentTime = (Number(barra.value) / 1000) * a.duration;
    });
    pintar();
  }
}

/* ---------- os ticks de envio, entrega e leitura ----------
 *
 * O status vem do `messages.update` da Evolution, gravado pelo webhook em
 * `whatsapp_messages.status`. Mensagem sem status gravado (todo o histórico
 * anterior a 03/10/2026, e o envio cujo ack ainda não chegou) sai SEM tique:
 * desenhar um tique cinza ali seria afirmar que o WhatsApp aceitou a mensagem
 * sem ninguém ter medido isso.
 */
const SVG_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const SVG_CHECK2 = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>';
const SVG_RELOGIO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const SVG_ERRO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>';
const ACKS = {
  PENDING:      { svg: SVG_RELOGIO, cls: '',        titulo: 'Enviando' },
  SERVER_ACK:   { svg: SVG_CHECK,   cls: '',        titulo: 'Enviada' },
  DELIVERY_ACK: { svg: SVG_CHECK2,  cls: '',        titulo: 'Entregue no aparelho' },
  READ:         { svg: SVG_CHECK2,  cls: 'lida',    titulo: 'Lida' },
  PLAYED:       { svg: SVG_CHECK2,  cls: 'lida',    titulo: 'Ouvida' },
  ERROR:        { svg: SVG_ERRO,    cls: 'falhou',  titulo: 'Não foi entregue' },
};
function tique(x){
  if (!x.from_me) return '';
  const a = ACKS[x.status];
  if (!a) return '';
  return `<span class="ack ${a.cls}" title="${a.titulo}">${a.svg}</span>`;
}

// ---------- lista ----------
async function carregar(){
  // A campanha vai sempre no querystring, mesmo com o filtro desligado: é ela
  // que define a contagem do botão "Responderam".
  const params = new URLSearchParams();
  if (RECORTES.includes(FILTRO)) params.set('recorte', FILTRO);
  else if (FILTRO) params.set('estado', FILTRO);
  // O número vale junto de qualquer outro filtro, e as contagens o seguem.
  if (NUMERO) params.set('canal', NUMERO);
  if (NICHO) params.set('nicho', NICHO);
  // A situação vale com ou sem nicho (02/10): sem ele, recorta a caixa inteira.
  if (SITUACAO !== 'todos') params.set('situacao', SITUACAO);
  // A partir de qual mensagem recebida contar as novas (o aviso de chegada).
  if (ULTIMO_RECEBIDO !== null) params.set('desde', ULTIMO_RECEBIDO);
  const qs = params.toString() ? '?' + params : '';
  const d = await fetch('/api/conversas' + qs).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  CONVERSAS = d.conversas;
  NUMEROS = d.canais || [];
  NICHOS = d.nichos || [];
  renderSeletorNumero();

  const c = d.contagem;
  renderSeletorNicho(c);
  avisarSeChegou(d.recebidas);
  // Até 29/09 "sem nenhuma resposta", "não lidas", "sem dono" e "no total"
  // eram números grandes no alto da tela, e eram também os filtros. Saíram a
  // pedido, para limpar o visual, e os filtros vieram para cá. Clicar de novo
  // no filtro marcado volta a mostrar todas, que era o papel do "no total".
  // Sobrou UM filtro de fila, a pedido (02/10). Saíram:
  // "Sem resposta", que lia um campo que a campanha e a IA não escrevem (dizia
  // 749 no 1bit onde o fato eram 75); "Campanhas", que virou o seletor de
  // nicho; "Aguardando você", que é parecido demais com este (377 contra 159,
  // e a diferença são as 220 que alguém leu e não respondeu); e
  // "Qualificados"/"Desqualificados", que foram para o seletor de situação.
  const chips = [['naoLidas', 'Não lidas', c.naoLidas]];
  // "Minhas" é a fila de quem ASSUMIU a conversa, pelo seletor de dono no
  // cabeçalho. Enquanto ninguém assumiu nada ele vem sempre vazio (0 de 1.003
  // no 1bit), e por isso só aparece quando você tem alguma.
  if (c.minhas) chips.push(['minhas', 'Minhas', c.minhas]);
  // "Sem dono" igual ao total não filtra nada: é o caso enquanto ninguém
  // assumiu conversa, e o chip só ocuparia lugar.
  if (c.semDono !== undefined && c.semDono !== c.total) chips.push(['semDono', 'Sem dono', c.semDono]);
  // O estado só vira filtro quando alguém de fato usa: enquanto tudo estiver
  // 'aberta', "Abertas" é sinônimo de "Todas" e os outros dois são sempre zero.
  if (c.pendente || c.resolvida) chips.push(
    ['aberta','Abertas',c.aberta], ['pendente','Pendentes',c.pendente],
    ['resolvida','Resolvidas',c.resolvida]);
  const elChips = document.getElementById('filtros');
  elChips.innerHTML = chips
    .map(([v,rot,n]) => `<button class="${FILTRO===v?'sel':''}" onclick="filtrar('${v}')">${rot}${n?' '+n:''}</button>`).join('');

  renderLista();
}

function filtrar(v){ FILTRO = FILTRO === v ? '' : v; carregar(); }

/* ---------- nicho ----------
 *
 * Os nichos são os das CAMPANHAS que já enviaram, e vêm do servidor
 * (`nichosComCampanha`). Mandou campanha para alimentação e mercado? São esses
 * dois que aparecem aqui, e não o cadastro inteiro de segmentos.
 *
 * O filtro de resposta só existe com um nicho escolhido: fora dele, "não
 * responderam" seria a caixa inteira.
 */
function renderSeletorNicho(contagem){
  const sel = document.getElementById('selNicho');
  if (!NICHOS.length) { sel.style.display = 'none'; NICHO = ''; }
  else {
    sel.innerHTML = '<option value="">Todos os nichos</option>'
      + NICHOS.map(n => `<option value="${n.id}" ${String(NICHO)===String(n.id)?'selected':''}>${esc(n.nome)}</option>`).join('');
    sel.style.display = '';
  }
  renderSeletorSituacao(contagem || {});
  atualizarSeletores();
}

/* A situação da conversa, num seletor só: respondeu, não respondeu e o
 * resultado do roteiro. Ele aparece SEMPRE (02/10) — antes só existia dentro de
 * um nicho, e em "Todos os nichos" sumia da tela. O do roteiro entra quando há
 * alguém nele, pela mesma razão de antes: opção que devolve zero para sempre
 * não é filtro. */
function renderSeletorSituacao(c){
  const sel = document.getElementById('selSituacao');
  const ops = [['todos', 'Todos'], ['responderam', 'Responderam'], ['naoResponderam', 'Não responderam']];
  if (c.qualificados || SITUACAO === 'qualificados') ops.push(['qualificados', `Qualificados${c.qualificados ? ' ' + c.qualificados : ''}`]);
  if (c.desqualificados || SITUACAO === 'desqualificados') ops.push(['desqualificados', `Desqualificados${c.desqualificados ? ' ' + c.desqualificados : ''}`]);
  sel.innerHTML = ops.map(([v, rot]) => `<option value="${v}" ${SITUACAO === v ? 'selected' : ''}>${rot}</option>`).join('');
  sel.style.display = '';
}

function escolherNicho(v){ NICHO = v; carregar(); }
function escolherSituacao(v){ SITUACAO = v; carregar(); }

/** O X da busca, como no WhatsApp: só aparece com algo escrito. */
function limparBusca(){
  const campo = document.getElementById('busca');
  campo.value = ''; campo.focus();
  renderLista();
}

// ---------- números de WhatsApp ----------
// A caixa é uma só para todos os números (decisão de 28/09); o seletor recorta.
function renderSeletorNumero(){
  const sel = document.getElementById('selNumero');
  if (NUMEROS.length < 2) { sel.style.display = 'none'; NUMERO = ''; atualizarSeletores(); return; }
  sel.innerHTML = '<option value="">Todos os números</option>'
    + NUMEROS.map(n => `<option value="${n.id}" ${String(NUMERO)===String(n.id)?'selected':''}>${esc(n.nome)}</option>`).join('');
  sel.style.display = '';
  atualizarSeletores();
}
function escolherNumero(v){ NUMERO = v; carregar(); }

// A linha dos seletores só aparece com algum deles visível.
function atualizarSeletores(){
  const algum = ['selNumero', 'selNicho', 'selSituacao']
    .some(id => document.getElementById(id).style.display !== 'none');
  document.getElementById('seletores').style.display = algum ? 'flex' : 'none';
}

function renderLista(){
  const campo = document.getElementById('busca');
  const q = campo.value.toLowerCase().trim();
  campo.closest('.busca-wa').classList.toggle('tem-texto', !!campo.value);
  const lista = CONVERSAS.filter(c => !q || [c.nome,c.pessoaNome,c.telefone,c.ultimaMensagem]
    .some(v => String(v||'').toLowerCase().includes(q)));
  const el = document.getElementById('listaConv');
  if (!lista.length) { el.innerHTML = '<div class="vazio-centro">Nenhuma conversa</div>'; return; }
  el.innerHTML = lista.map(c => {
    const nome = c.pessoaNome || c.nome || c.telefone || '';
    // Quem só RECEBEU a campanha não tem conversa ainda: o clique a cria, pelo
    // telefone (`abrirDestino`). Sem isso, a linha não levaria a lugar nenhum.
    const clique = c.semConversa
      ? `abrirDestino('${esc(String(c.telefone || ''))}', ${Number(c.canalId) || 0})`
      : `abrir(${c.id})`;
    return `
    <div class="conv ${ATUAL===c.id?'sel':''}" onclick="${clique}">
      <div class="ini">${esc(iniciais(nome))}${c.naoLidas ? `<span class="n">${c.naoLidas}</span>` : ''}</div>
      <div class="corpo">
        <div class="l1">
          <span class="nome">${esc(nome)}</span>
          <span class="hora">${quando(c.ultimaEm)}</span>
        </div>
        <div class="l2">
          <span class="previa">${esc(c.ultimaMensagem || 'sem mensagem')}</span>
          ${marcas(c)}
        </div>
      </div>
    </div>`;
  }).join('');
}

/**
 * As iniciais do avatar.
 *
 * O avatar existe para dar ritmo à coluna, que era um bloco de texto corrido
 * onde toda linha parecia igual. Número sem nome vira "#", que é melhor que
 * duas iniciais tiradas de um telefone.
 */
function iniciais(nome){
  const p = String(nome).trim().split(/\s+/).filter(x => /[A-Za-zÀ-ÿ]/.test(x[0] || ''));
  if (!p.length) return '#';
  return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}

/**
 * As marcas da linha — só o EXCEPCIONAL.
 *
 * Antes toda linha trazia "aberta" e "sem cadastro". Como é o estado de quase
 * todas as 953, a marca não informava nada e virava textura; o olho aprendia a
 * pular a faixa inteira, inclusive quando ali havia algo diferente.
 *
 * O que sobrou segue uma regra só: aparece o que NÃO é o caso comum. Estado
 * diferente de aberta, IA desligada nesta conversa (ligada é o padrão), e o
 * dono, quando alguém assumiu.
 */
function marcas(c){
  const m = [];
  // Quem recebeu a campanha do nicho e nunca escreveu. Sem a marca, a linha
  // pareceria uma conversa como as outras, e ela ainda não existe.
  if (c.semConversa) m.push('<span class="pil so-recebeu">só recebeu</span>');
  if (c.estado && c.estado !== 'aberta') m.push(`<span class="pil ${c.estado}">${c.estado}</span>`);
  // A IA aparece em TODA conversa, com a cor dizendo em qual dos três estados
  // ela está (a pedido, 02/10). É a exceção à regra do parágrafo acima: o
  // estado da IA é o que se procura nesta tela, e sem a marca verde "ligada" e
  // "não sei" ficavam iguais.
  // Com o atendente em "só quem recebeu campanha", a IA não responde a quem
  // este número nunca abordou: a marca vem desligada, como ela está de fato.
  if (c.iaAtiva === 0) m.push('<span class="pil ia-off" title="Alguém desligou a IA nesta conversa">IA</span>');
  else if (c.iaForaDoEscopo) m.push('<span class="pil ia-off" title="A IA não responde nesta conversa">IA</span>');
  else if (c.iaPausada) m.push('<span class="pil ia-pausa" title="A IA está em pausa de 4 h porque alguém respondeu à mão">IA</span>');
  else m.push('<span class="pil ia-on" title="A IA responde nesta conversa">IA</span>');
  if (c.donoNome) m.push(`<span class="pil dono">${esc(c.donoNome)}</span>`);
  // Com vários números, cada conversa diz por qual número a pessoa escreveu.
  if (NUMEROS.length > 1 && c.canalNome) m.push(`<span class="pil numero">${esc(c.canalNome)}</span>`);
  // `<span>`, e não `<div>`: as marcas dividem a linha da prévia desde 01/10, e
  // é isso que mantém todo card com a mesma altura.
  return m.length ? `<span class="marcas">${m.join('')}</span>` : '';
}

/* ---------- o botão da IA, com os três estados ----------
 *
 * A IA fica calada por dois motivos diferentes: alguém a desligou nesta conversa
 * (`iaAtiva = 0`) ou alguém respondeu à mão e ela está em pausa de 4 horas. Até
 * 01/10 o segundo caso era uma FAIXA no topo da conversa, com o horário e um
 * "Retomar a IA"; ela saiu a pedido (02/10), e o botão que já existia passou a
 * mostrar os dois, com o tempo que falta correndo. Ver o botão desligado basta:
 * clicar nele religa, seja qual for o motivo.
 */
let PAUSA_ATE = 0;          // quando a pausa termina (epoch em segundos), 0 = sem pausa
let TIQUE_IA = null;

function renderBotaoIA(conversaId, iaAtiva){
  const btn = document.getElementById('btnIA');
  if (!btn) { if (TIQUE_IA) { clearInterval(TIQUE_IA); TIQUE_IA = null; } return; }
  const faltam = PAUSA_ATE ? Math.max(0, PAUSA_ATE - Math.floor(Date.now() / 1000)) : 0;
  // Desligada à mão tem precedência sobre a pausa: contar o tempo de uma pausa
  // numa IA que ninguém vai ouvir prometeria uma volta que não acontece.
  const desligada = !iaAtiva;
  const pausada = !desligada && !!faltam;
  const ligada = !desligada && !pausada;
  btn.classList.toggle('off', desligada);
  btn.classList.toggle('pausada', pausada);
  // Horas e minutos (`03h:12`), a pedido: a pausa é de 4 horas, e contar em
  // minutos dava um número de três dígitos que não diz nada de relance.
  const hh = String(Math.floor(faltam / 3600)).padStart(2, '0');
  const mm = String(Math.floor((faltam % 3600) / 60)).padStart(2, '0');
  btn.textContent = pausada ? `IA ${hh}h:${mm}` : 'IA';
  btn.title = pausada
    ? `Calada por mais ${hh}h${mm}, porque alguém respondeu à mão. Clique para ela voltar agora.`
    : (ligada ? 'A IA responde nesta conversa. Clique para desligar.' : 'A IA está desligada nesta conversa. Clique para ligar.');
  // Pausa religa pelo `retomar-ia` (que anula a espera); desligada à mão religa
  // pelo PUT. São caminhos diferentes para o mesmo botão.
  btn.onclick = () => (pausada ? retomarIA(conversaId) : alternarIA(conversaId, ligada ? 0 : 1));

  if (TIQUE_IA) { clearInterval(TIQUE_IA); TIQUE_IA = null; }
  if (pausada) TIQUE_IA = setInterval(() => renderBotaoIA(conversaId, iaAtiva), 1000);
}

// ---------- conversa ----------
function voltarLista(){ document.getElementById('central').classList.remove('abriu'); }

/**
 * Abre quem só recebeu a campanha: a conversa é criada no clique.
 *
 * A campanha grava o que SAI em `whatsapp_messages`, mas não cria conversa (no
 * 1bit seriam 27 mil). Aqui ela nasce com o histórico que já existe, e a partir
 * daí é uma conversa como qualquer outra.
 */
async function abrirDestino(telefone, canalId){
  const d = await fetch('/api/conversas/abrir-destino', { method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({ telefone, canalId }) })
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) return showAlert(d?.error || 'Não foi possível abrir','error');
  await carregar();
  abrir(d.id);
}

async function abrir(id){
  ATUAL = id;
  renderLista();
  const d = await fetch('/api/conversas/'+id).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  const c = d.conversa;

  // No celular a conversa ocupa a tela no lugar da lista (a classe `abriu`).
  // Até 29/09 nada punha essa classe, e a conversa só aparecia no celular
  // porque a regra que devia escondê-la perdia para outra.
  document.getElementById('central').classList.add('abriu');
  const cab = document.getElementById('threadCab');
  cab.style.display = 'flex';
  cab.innerHTML = `
    <button class="btn btn-ghost btn-sm voltar" onclick="voltarLista()">Voltar</button>
    <div class="ini">${esc(iniciais(c.pessoaNome || c.nome || c.telefone || ''))}</div>
    <div class="quem">
      <strong>${esc(c.pessoaNome || c.nome || c.telefone)}</strong>
      <span>${esc(c.telefone)}${NUMEROS.length > 1 && c.canalNome ? ` · pelo ${esc(c.canalNome)}` : ''}</span>
    </div>
    <span style="flex:1;"></span>
    <select onchange="mudarEstado(${c.id}, this.value)">
      ${['aberta','pendente','resolvida'].map(e=>`<option value="${e}" ${c.estado===e?'selected':''}>${e}</option>`).join('')}
    </select>
    ${ATENDENTES.length ? `
    <select id="selDono" onchange="mudarDono(${c.id}, this.value)">
      <option value="">sem dono</option>
      ${ATENDENTES.map(a=>`<option value="${a.id}" ${c.donoId===a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}
    </select>
    ${EU_ID && c.donoId !== EU_ID ? `<button class="btn btn-ghost btn-sm" onclick="mudarDono(${c.id}, ${EU_ID})">assumir</button>` : ''}` : ''}
    <button class="btn btn-ghost btn-sm ia-estado" id="btnIA"></button>
`;
  // O botão diz os TRÊS estados num lugar só: ligada, desligada à mão e calada
  // pela pausa de 4 h, esta com o tempo que falta correndo.
  PAUSA_ATE = d.pausaIA && d.pausaIA.pausada ? Number(d.pausaIA.ate) : 0;
  renderBotaoIA(c.id, c.iaAtiva);

  window.__msgs = d.mensagens;
  window.__temMais = d.temMais;
  pintarMensagens(c.id, d.mensagens, d.temMais);

  document.getElementById('responder').style.display = 'flex';
  // Citação, edição e anexo são de uma conversa só: trocar de conversa sem
  // limpá-los mandaria o arquivo (ou a citação) para a pessoa errada.
  cancelarCitacao(); sairDaEdicao(); tirarAnexo();
  renderFicha(c, d.ficha);
}

/**
 * Pinta a lista de mensagens. Usada na abertura e ao trazer o histórico antigo,
 * para os dois caminhos desenharem a mesma coisa.
 */
function pintarMensagens(convId, msgs, temMais){
  const m = document.getElementById('msgs');
  // Conversa longa chega cortada (400 por vez). Sem este botão o histórico
  // antigo não existia para quem usa: no 1bit são 15 conversas assim.
  const maisAntigas = temMais
    ? `<button class="btn btn-ghost btn-sm" id="btnMaisAntigas" style="margin:0 auto var(--space-2);display:block;"
         onclick="carregarAnteriores(${convId})">Carregar mensagens anteriores</button>` : '';
  // Um CONTAINER por dia, e o chip dentro dele. É o que faz o chip grudar no
  // topo só enquanto o dia dele passa: preso ao `.msgs`, todos grudariam no
  // mesmo ponto e se empilhariam (ver `.dia`, no estilo).
  const grupos = [];
  for (const x of msgs) {
    const d = x.timestamp ? new Date(x.timestamp * 1000) : null;
    const doDia = d ? d.toLocaleDateString('pt-BR') : '';
    const ultimo = grupos[grupos.length - 1];
    if (!ultimo || ultimo.dia !== doDia) grupos.push({ dia: doDia, msgs: [x] });
    else ultimo.msgs.push(x);
  }
  const balao = (x) => {
    const d = x.timestamp ? new Date(x.timestamp * 1000) : null;
    const hora = d ? d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
    const editada = x.editadaEm ? 'editada ' : '';
    // A vaga no fim da última linha é o espaço por onde a hora passa — e ela
    // vale também para o balão que não tem texto (Contato, Localização…), que
    // até 02/10 saía sem vaga nenhuma e deixava a hora por cima da palavra.
    // Medida em `ch`: cinco dígitos da hora, mais o "editada " quando houver.
    const ack = tique(x);
    const vaga = `<span class="vaga${editada ? ' larga' : ''}${ack ? ' com-ack' : ''}"></span>`;
    const soMidia = !x.texto && TIPOS_MIDIA[x.message_type];
    // Figurinha sozinha não leva balão, como no WhatsApp (ver `.so-figurinha`).
    const soFigurinha = !x.texto && x.message_type === 'stickerMessage';
    // Áudio sem legenda: a hora cabe na linha do player (ver `.so-audio`).
    const soAudio = !x.texto && x.message_type === 'audioMessage';
    // O conteúdo do balão citado só existe quando a citada está no histórico
    // carregado; fora disso a resposta aparece sem ele.
    const cita = x.citaTexto
      ? `<div class="cita"><b>${x.citaDeMim ? 'Você' : 'Contato'}</b>${esc(String(x.citaTexto).slice(0, 220))}</div>` : '';
    // "(sem texto)" dizia o que a tela não sabia, e aparecia em contato,
    // localização, lista, botões e mensagem protegida (02/10). Agora cada tipo
    // diz o que é; o que sobra sem nome nenhum continua com o aviso antigo.
    const corpoTexto = x.texto
      ? `<div class="txt">${esc(x.texto)}${vaga}</div>`
      : (soMidia ? '' : `<div class="txt sem-conteudo">${ROTULO_TIPO[x.message_type] || '(sem texto)'}${vaga}</div>`);
    // A reação do contato fica NO balão reagido, como no WhatsApp.
    const reacoes = x.reacoes ? `<span class="reacoes">${esc(x.reacoes)}</span>` : '';
    // As marcas que NÃO são a hora continuam numa linha própria, e só quando
    // existem: mensagem comum passou a ter a altura do próprio texto.
    const marcasMeta = [
      x.apagadaEm ? `<span class="apagada-marca" title="Apagada no WhatsApp em ${esc(new Date(x.apagadaEm).toLocaleString('pt-BR'))}">${x.from_me ? 'Você apagou' : 'Apagada pelo contato'}</span>` : '',
      x.from_bot ? selo(x) : '',
    ].filter(Boolean).join('');
    return `
    <div class="msg ${x.from_me ? 'minha' : 'deles'}${x.apagadaEm ? ' apagada' : ''}${soMidia ? ' so-midia' : ''}${soFigurinha ? ' so-figurinha' : ''}${soAudio ? ' so-audio' : ''}${marcasMeta ? ' tem-meta' : ''}"
      data-id="${x.id}" data-mine="${x.from_me ? 1 : 0}">
      ${cita}${midiaDa(x)}${corpoTexto}${reacoes}
      ${marcasMeta
        ? `<div class="meta">${marcasMeta}<span class="hora-canto">${editada}${hora}${ack}</span></div>`
        : `<span class="hora-canto">${editada}${hora}${ack}</span>`}
    </div>`;
  };
  m.innerHTML = maisAntigas + (msgs.length
    ? grupos.map(g => `<div class="grupo-dia">${g.dia ? `<div class="dia">${g.dia}</div>` : ''}`
        + g.msgs.map(balao).join('') + '</div>').join('')
    : '<div class="vazio-centro">Sem mensagens nesta conversa</div>');
  if (window.lucide && window.lucide.createIcons) { try { window.lucide.createIcons(); } catch (e) { } }
  ligarAudios(m);
  ancorarNoFim(m);
}

/**
 * O tique avançando sem repintar a conversa.
 *
 * O ack chega pelo webhook segundos depois do envio, e quem acabou de mandar é
 * exatamente quem olha o tique: sem isto ele só mudaria ao reabrir a conversa.
 * Troca só o `<span class="ack">` de cada balão, então a rolagem, o áudio
 * tocando, a citação e o texto em digitação ficam onde estão.
 */
async function atualizarTiques(){
  const id = ATUAL, msgs = window.__msgs;
  if (!id || !msgs || !msgs.length) return;
  if (document.hidden) return;   // aba escondida não precisa de tique novo
  const d = await fetch(`/api/conversas/${id}/acks?desde=${msgs[0].id}`)
    .then(r => r.json()).catch(() => null);
  // Trocou de conversa enquanto a resposta vinha: os ids são de outra.
  if (!d || !d.success || ATUAL !== id) return;
  const corpo = document.getElementById('msgs');
  for (const a of d.acks) {
    const m = msgs.find(x => x.id === a.id);
    if (!m || m.status === a.status) continue;
    m.status = a.status;
    const balao = corpo.querySelector(`.msg[data-id="${a.id}"]`);
    if (!balao) continue;
    const alvo = balao.querySelector('.hora-canto');
    const atual = alvo && alvo.querySelector('.ack');
    const novo = tique(m);
    if (!alvo || !novo) continue;
    if (atual) atual.outerHTML = novo;
    else {
      alvo.insertAdjacentHTML('beforeend', novo);
      // Primeiro tique da mensagem: a hora ficou mais larga, e a vaga da última
      // linha do texto tem de acompanhar, senão o tique cai sobre a palavra.
      const vaga = balao.querySelector('.vaga');
      if (vaga) vaga.classList.add('com-ack');
    }
  }
}

/**
 * O que CHEGOU na conversa aberta desde a última pintura.
 *
 * A conversa aberta não tinha caminho nenhum para mensagem nova: o tique só
 * troca o ack, e a lista repinta a cada 30 s sem tocar no painel. Quem
 * conversava pelo celular via o PC parado até reabrir a conversa.
 *
 * A pergunta é pelo que é mais novo que o último balão — um corte por id,
 * quase sempre devolvendo nada — e só vindo algo é que se repinta.
 */
async function mensagensNovas(){
  const id = ATUAL, msgs = window.__msgs;
  if (!id || !msgs || !msgs.length) return;
  if (document.hidden) return;
  const ultimo = msgs[msgs.length - 1].id;
  const d = await fetch(`/api/conversas/${id}/mensagens?depoisDe=${ultimo}`)
    .then(r => r.json()).catch(() => null);
  // Trocou de conversa enquanto a resposta vinha: as mensagens são de outra.
  if (!d || !d.success || ATUAL !== id || window.__msgs !== msgs) return;
  // O filtro é também a guarda contra servidor que ainda não conheça o
  // `depoisDe`: ignorado, ele devolve o histórico inteiro, e sem isto a
  // conversa dobraria de tamanho a cada tique.
  const novas = (d.mensagens || []).filter(x => x.id > ultimo);
  if (!novas.length) return;
  const corpo = document.getElementById('msgs');
  const noFim = corpo.scrollHeight - corpo.scrollTop - corpo.clientHeight < 80;
  const posAntes = corpo.scrollTop;
  window.__msgs = [...msgs, ...novas];
  pintarMensagens(id, window.__msgs, window.__temMais);
  // No pé da conversa, desce com a mensagem nova (o `pintarMensagens` ancora no
  // fim). Lendo o histórico mais atrás, fica onde estava: ser arrastado para o
  // pé no meio da leitura é pior do que não ver a mensagem chegar.
  if (!noFim) corpo.scrollTop = posAntes;
  // A prévia, a ordem da lista e a contagem de não lidas seguem a mensagem nova.
  carregar();
}

    <div class="bloco">

      <div class="linha"><span>Nome</span><strong>${esc(c.pessoaNome || c.nome || '—')}</strong></div>
      <div class="linha"><span>Telefone</span><span>${esc(c.telefone)}</span></div>
      ${c.cpfCnpj ? `<div class="linha"><span>CNPJ/CPF</span><span>${esc(c.cpfCnpj)}</span></div>` : ''}
      ${c.cidade ? `<div class="linha"><span>Cidade</span><span>${esc(c.cidade)}/${esc(c.uf||'')}</span></div>` : ''}
      ${!c.pessoaId ? '<small class="muted">Este número não está no cadastro.</small>' : ''}
    </div>
    <div class="bloco">
      <h4>Últimos pedidos</h4>
      ${f.pedidos.length ? f.pedidos.map(p=>`<div class="linha">

    </div>

        <span>vence ${esc(String(t.dataVencimento||'').slice(0,10))}</span><strong>${brl(t.valor)}</strong></div>`).join('')
        : '<small class="muted">Nada em aberto</small>'}
    </div>
