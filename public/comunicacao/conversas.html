/* ---------- qualificação pelo roteiro ----------
 *
 * A IA preenche o que consegue sustentar com trecho da conversa; o atendente
 * confirma ou corrige. A correção vence, e a próxima passada da IA só pergunta
 * o que ficou em branco.
 *
 * Cada resposta mostra o TRECHO que a sustenta. Sem isso, a nota seria um
 * número sem origem, e ninguém confia num número desses para decidir venda.
 */
let QUALIF = null;

async function carregarQualificacao(conversaId){
  const el = document.getElementById('blocoQualificacao');
  if (!el) return;
  const d = await fetch(`/api/conversas/${conversaId}/qualificacao`).then(r=>r.json()).catch(()=>null);
  // Servidor sem o roteiro: o bloco some, em vez de mostrar um formulário morto.
  if (!d?.success || !d.perguntas?.length) { el.style.display = 'none'; return; }
  el.style.display = '';
  QUALIF = d;
  const resp = d.visita?.respostas || {};
  const trechos = d.trechos || {};
  // O roteiro é da campanha que o contato recebeu, e segue em etapas: a atual
  // fica marcada, e a que um desvio pulou fica apagada (29/09).
  const idx = d.perguntas.findIndex(p => p.chave === d.etapaAtual);
  const situacao = d.resultado === 'qualificado' ? `Qualificado, ${d.pontos} ponto(s)`
    : d.resultado === 'desqualificado' ? 'Desqualificado'
    : d.visita ? `Na etapa ${idx + 1} de ${d.perguntas.length}, ${d.pontos} ponto(s)` : 'Ainda não começou';
  const noCaminho = new Set(d.caminho || []);
  el.innerHTML = `<h4>Qualificação</h4>
    <small class="muted">${esc(d.roteiro?.nome || '')}</small>
    <div class="linha"><span>situação</span><strong class="${d.resultado ? 'res-' + d.resultado : ''}">${esc(situacao)}</strong></div>
    ${d.perguntas.map(p => {
      const atual = p.chave === d.etapaAtual, fora = d.visita && !atual && !noCaminho.has(p.chave) && !resp[p.chave];
      return `
      <div style="margin:10px 0;${fora ? 'opacity:0.45;' : ''}">
        <div style="font-size:var(--text-xs);color:var(--text-2);line-height:1.3;">${atual ? '<strong style="color:var(--accent);">Etapa atual.</strong> ' : ''}${esc(p.texto)}</div>
        <select onchange="corrigirQualificacao(${conversaId}, '${esc(p.chave)}', this.value)"
          style="width:100%;margin-top:4px;font-size:var(--text-xs);">
          <option value="">— sem resposta —</option>
          ${p.opcoes.map(o => `<option value="${esc(o.id)}" ${resp[p.chave] === o.id ? 'selected' : ''}
            >${esc(o.rotulo)}</option>`).join('')}
        </select>
        ${trechos[p.chave] ? `<div style="font-size:var(--text-xs);color:var(--text-3);margin-top:3px;">“${esc(trechos[p.chave])}”</div>` : ''}
      </div>`; }).join('')}
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px;"
      onclick="pedirQualificacao(${conversaId})">Ler a conversa com a IA</button>
    <div id="qualifAviso" style="margin-top:8px;"></div>`;
}

async function pedirQualificacao(conversaId){
  const aviso = document.getElementById('qualifAviso');
  aviso.innerHTML = '<small class="muted">Lendo a conversa…</small>';
  const d = await fetch(`/api/conversas/${conversaId}/qualificar`, { method:'POST' })
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) { aviso.innerHTML = `<small style="color:var(--danger);">${esc(d?.error || 'Falhou')}</small>`; return; }
  await carregarQualificacao(conversaId);
  const el = document.getElementById('qualifAviso');
  const aceitas = Object.entries(d.aceitas || {});
  // As recusas aparecem: é o que mostra quando o modelo tentou preencher o que
  // ninguém disse, e é o que faz a nota ser confiável.
  el.innerHTML = (aceitas.length
    ? aceitas.map(([, v]) => `<div style="font-size:var(--text-xs);color:var(--text-2);margin-bottom:6px;">
        <strong>${esc(v.rotulo)}</strong><br>“${esc(v.trecho)}”</div>`).join('')
    : '<small class="muted">A IA não achou resposta sustentada na conversa.</small>')
    + ((d.recusadas || []).length
      ? `<small class="muted">${d.recusadas.length} resposta(s) recusada(s) por não estarem na conversa.</small>`
      : '');
}

async function corrigirQualificacao(conversaId, chave, valor){
  const d = await fetch(`/api/conversas/${conversaId}/qualificacao`, { method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ respostas: { [chave]: valor || null } }) })
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) return showAlert(d?.error || 'Não foi possível gravar', 'error');
  // A correção pode fechar o roteiro: a situação muda, e o qualificado ganha o
  // card no CRM.
  await carregarQualificacao(conversaId);
  if (d.oportunidadeId) { carregarOportunidade(conversaId); showAlert('Qualificado: a oportunidade foi criada no CRM'); }
}

// ---------- oportunidade no CRM ----------
// A conversa não tem funil próprio: o quadro é o de Comercial → CRM · Funil,
// que já existe e é onde a equipe acompanha venda. Aqui só se cria o card ou
// se amarra a conversa a um que já existe.
async function carregarOportunidade(conversaId){
  const el = document.getElementById('blocoOportunidade');
  if (!el) return;
  const d = await fetch(`/api/conversas/${conversaId}/oportunidade`).then(r=>r.json()).catch(()=>null);
  if (!d?.success) { el.innerHTML = '<h4>Oportunidade</h4><small class="muted">—</small>'; return; }
  const o = d.oportunidade;
  el.innerHTML = o
    ? `<h4>Oportunidade</h4>
       <div class="linha"><span>${esc(o.funilNome||'')}</span>
         <strong style="color:${esc(o.etapaCor||'var(--text-1)')};">${esc(o.etapaNome||'—')}</strong></div>
       <div class="linha"><span>${esc(String(o.titulo||'').slice(0,40))}</span>
         <strong>${o.valor ? brl(o.valor) : '—'}</strong></div>
       <div style="display:flex;gap:6px;margin-top:8px;">
         <a class="btn btn-ghost btn-sm" href="/comercial/crm-funil.html" style="flex:1;text-align:center;">ver no funil</a>
         <button class="btn btn-ghost btn-sm" onclick="desvincularOportunidade(${conversaId})">desvincular</button>
       </div>`
    : `<h4>Oportunidade</h4>
       <small class="muted">Esta conversa ainda não virou oportunidade no CRM.</small>
       <div style="display:flex;gap:6px;margin-top:8px;">
         <button class="btn btn-primary btn-sm" style="flex:1;" onclick="criarOportunidade(${conversaId})">Criar</button>
         <button class="btn btn-ghost btn-sm" onclick="vincularOportunidade(${conversaId})">Vincular</button>
       </div>`;
}

async function criarOportunidade(conversaId){
  const d = await fetch(`/api/conversas/${conversaId}/oportunidade`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: '{}' }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  showAlert('Oportunidade criada no CRM — acompanhe em Comercial → CRM · Funil');
  carregarOportunidade(conversaId);
}

async function vincularOportunidade(conversaId){
  const d = await fetch('/api/conversas/oportunidades/livres').then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  if (!d.oportunidades.length) return showAlert('Nenhuma oportunidade livre no CRM','warn');
  const lista = d.oportunidades.slice(0, 20)
    .map(o => `${o.id} — ${o.titulo}${o.clienteNome?' ('+o.clienteNome+')':''} [${o.etapaNome||''}]`).join('\n');
  const id = prompt('Número da oportunidade a vincular:\n\n' + lista);
  if (!id) return;
  const r = await fetch(`/api/conversas/${conversaId}/oportunidade`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ oportunidadeId: Number(id) }) }).then(x=>x.json());
  if (!r.success) return showAlert(r.error,'error');
  showAlert('Conversa vinculada à oportunidade #' + id);
  carregarOportunidade(conversaId);
}

async function desvincularOportunidade(conversaId){
  if (!await Aviso.confirmar('Desvincular a conversa desta oportunidade?\n\nA oportunidade continua no CRM.')) return;
  const d = await fetch(`/api/conversas/${conversaId}/oportunidade`, { method:'DELETE' }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  carregarOportunidade(conversaId);
}

/**
 * Manda o link de agendamento pela própria conversa.
 *
 * A mensagem sai como resposta normal, e não por fora: o link precisa ficar no
 * histórico, senão ninguém sabe depois que ele foi enviado nem quando.
 *
 * O botão só aparece com o agendamento ligado. Conversa sem dono é recusada
 * pelo servidor, e o motivo é mostrado como está: a reunião entra na agenda de
 * quem atende, e ninguém assumiu esta.
 */
async function enviarConviteAgenda(){
  if (!ATUAL) return;
  const d = await fetch(`/api/conversas/${ATUAL}/convite-agenda`, { method:'POST' })
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) return showAlert(d?.error || 'Não foi possível gerar o link', 'error');
  const link = location.origin + d.url;
  const texto = `Podemos marcar uma conversa? Escolha o melhor horário por aqui: ${link}`;
  const r = await fetch(`/api/conversas/${ATUAL}/responder`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ texto })
  }).then(x=>x.json()).catch(()=>null);
  if (!r?.success) return showAlert(r?.error || 'O link foi gerado, mas a mensagem não saiu', 'error');
  showAlert('Link de agendamento enviado');
  await abrir(ATUAL); await carregar();
}

/** O botão só existe se a empresa ligou o agendamento. */
async function conferirAgendaLigada(){
  const d = await fetch('/api/agenda/config').then(r=>r.json()).catch(()=>null);
  if (d?.success && d.config?.ativo && d.config?.faixas) {
    document.getElementById('btnAgendar').style.display = '';
  }
}
conferirAgendaLigada();

/* ---------- a barra de escrever ----------
 *
 * Enter envia e Shift+Enter quebra a linha, como no WhatsApp. O Ctrl+Enter de
 * antes continua valendo: era o único jeito até hoje, e quem já tem o dedo nele
 * não precisa reaprender.
 */
function aoDigitar(e){
  if (e.key !== 'Enter') return;
  if (e.shiftKey) return;                       // quebra de linha
  e.preventDefault();
  responder();
}

/** O campo cresce com o texto até o teto do CSS, e então rola. */
function crescerCampo(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

// Os emojis de uso comum. É um painel, não um teclado: figurinha fica fora, a
// pedido, e uma lista de mil emojis seria rolagem no lugar de escolha.
const EMOJIS = ['😀','😁','😂','🤣','😊','😉','😍','😘','😎','🤔','😅','🙃','😐','😴','🤗',
  '👍','👎','👏','🙏','💪','👌','✌️','🤝','👋','🫡','❤️','💙','💚','🔥','✨','🎉','🎁',
  '✅','❌','⚠️','📌','📎','📄','📷','🕒','💰','🚚','🛒','📦','😢','😡','🤷'];

function alternarEmojis(){
  const p = document.getElementById('painelEmoji');
  if (!p.innerHTML) {
    p.innerHTML = EMOJIS.map(e => `<button type="button" onclick="porEmoji('${e}')">${e}</button>`).join('');
  }
  p.classList.toggle('abre');
}

function porEmoji(e){
  const t = document.getElementById('txtResposta');
  const i = t.selectionStart ?? t.value.length;
  t.value = t.value.slice(0, i) + e + t.value.slice(t.selectionEnd ?? i);
  t.focus();
  t.selectionStart = t.selectionEnd = i + e.length;
  crescerCampo(t);
}

/* ---------- o anexo ----------
 *
 * O arquivo escolhido fica à vista antes de sair, com o nome e a prévia da
 * imagem: anexo que sobe no clique, sem confirmação, manda o arquivo errado uma
 * vez por semana. O texto do campo vai como legenda.
 */
let ANEXO = null;

function escolherAnexo(input){
  const f = input.files && input.files[0];
  input.value = '';                             // escolher o mesmo arquivo de novo dispara o change
  if (!f) return;
  // 16 MB é o teto do multer na rota; conferir aqui evita subir para receber erro.
  if (f.size > 16 * 1024 * 1024) return showAlert('Arquivo acima de 16 MB','error');
  ANEXO = f;
  const el = document.getElementById('anexoPreparo');
  const previa = f.type.startsWith('image/') ? `<img src="${URL.createObjectURL(f)}" alt="">` : '';
  el.innerHTML = `${previa}<span class="n">${esc(f.name)}</span>
    <span class="muted">${(f.size/1024).toFixed(0)} KB</span>
    <button type="button" onclick="tirarAnexo()" title="Tirar o arquivo">×</button>`;
  el.classList.add('abre');
}

function tirarAnexo(){
  ANEXO = null;
  document.getElementById('anexoPreparo').classList.remove('abre');
}

/* ---------- citar ----------
 *
 * `CITANDO` é o id local da mensagem citada, e vai no corpo do envio: é o
 * servidor que troca isso pela chave do WhatsApp (`citarDaMensagem`).
 */
let CITANDO = null;

function citarMensagem(id){
  const m = (window.__msgs || []).find(x => x.id === id);
  if (!m) return;
  CITANDO = id;
  const el = document.getElementById('citando');
  el.innerHTML = `<div class="t"><b>${m.from_me ? 'Você' : 'Contato'}</b>${esc(String(m.texto || '(mídia)').slice(0, 220))}</div>
    <button type="button" onclick="cancelarCitacao()" title="Não citar">×</button>`;
  el.classList.add('abre');
  document.getElementById('txtResposta').focus();
}

function cancelarCitacao(){
  CITANDO = null;
  document.getElementById('citando').classList.remove('abre');
}

/* ---------- editar a mensagem já enviada ----------
 *
 * A edição acontece no MESMO campo de escrever, como no WhatsApp: o texto antigo
 * vai para lá, a faixa de cima diz que é edição e o botão de enviar grava a
 * troca. Caixa do navegador (`prompt`) ficaria por cima da conversa, sem o
 * histórico à vista — e é justamente ele que se consulta para reescrever.
 */
let EDITANDO_MSG = null;

function entrarEmEdicao(m){
  EDITANDO_MSG = m.id;
  cancelarCitacao();
  tirarAnexo();
  const el = document.getElementById('citando');
  el.innerHTML = `<div class="t"><b>Editando a mensagem</b>${esc(String(m.texto || '').slice(0, 220))}</div>
    <button type="button" onclick="sairDaEdicao()" title="Cancelar a edição">×</button>`;
  el.classList.add('abre');
  const campo = document.getElementById('txtResposta');
  campo.value = m.texto || '';
  campo.focus();
  crescerCampo(campo);
}

function sairDaEdicao(){
  // Só limpa o campo quando havia edição em curso: `abrir()` chama esta função
  // a cada troca de conversa, e limpar sempre apagaria o rascunho de quem
  // estava escrevendo e foi conferir outra conversa antes de enviar.
  if (!EDITANDO_MSG) return;
  EDITANDO_MSG = null;
  document.getElementById('citando').classList.remove('abre');
  const campo = document.getElementById('txtResposta');
  campo.value = ''; crescerCampo(campo);
}

async function salvarEdicao(texto){
  const id = EDITANDO_MSG;
  const d = await fetch(`/api/conversas/${ATUAL}/mensagens/${id}`, { method:'PUT',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({ texto }) })
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) return showAlert(d?.error || 'Não foi possível editar','error');
  sairDaEdicao();
  showAlert('Mensagem editada');
  await abrir(ATUAL); await carregar();
}

async function responder(){
  const campo = document.getElementById('txtResposta');
  const t = campo.value.trim();
  if (!ATUAL) return;
  if (EDITANDO_MSG) { if (t) await salvarEdicao(t); return; }
  if (ANEXO) return enviarAnexo(t);
  if (!t) return;
  const d = await fetch(`/api/conversas/${ATUAL}/responder`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ texto: t, citarId: CITANDO })
  }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  campo.value = '';
  crescerCampo(campo);
  cancelarCitacao();
  document.getElementById('painelEmoji').classList.remove('abre');
  await abrir(ATUAL); await carregar();
}

/** Manda o arquivo escolhido, com o que estiver escrito como legenda. */
async function enviarAnexo(legenda){
  const corpo = new FormData();
  corpo.append('arquivo', ANEXO);
  if (legenda) corpo.append('texto', legenda);
  const d = await fetch(`/api/conversas/${ATUAL}/anexo`, { method:'POST', body: corpo })
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) return showAlert(d?.error || 'O arquivo não saiu','error');
  tirarAnexo();
  const campo = document.getElementById('txtResposta');
  campo.value = ''; crescerCampo(campo);
  await abrir(ATUAL); await carregar();
}

/* ---------- o menu do botão direito sobre a mensagem ----------
 *
 * As mesmas ações do WhatsApp, e com os mesmos limites: apagar para todos e
 * editar só valem no que NÓS enviamos, e editar só nos primeiros 15 minutos —
 * passado isso o WhatsApp recusa, e oferecer o item seria prometer o que não se
 * cumpre. A recusa final é do servidor; isto aqui é só o que se mostra.
 */
const EDITAR_ATE_MS = 15 * 60 * 1000;
// Apagar para todos vale por 60 horas (dois dias e meio), que é o limite atual
// do WhatsApp. Passado isso ele recusa, e o item continuava sendo oferecido:
// clicar dava um erro cru da Evolution, depois de a mensagem já ter sumido da
// nossa tela como se tivesse saído.
const APAGAR_ATE_MS = 60 * 60 * 60 * 1000;
let MENU_MSG = null;

function abrirMenuMsg(e){
  const balao = e.target.closest('.msg[data-id]');
  if (!balao) return;
  // Com texto selecionado, o menu nativo (copiar a seleção) é melhor que o nosso.
  if (String(window.getSelection() || '').trim()) return;
  e.preventDefault();
  const id = Number(balao.dataset.id);
  const m = (window.__msgs || []).find(x => x.id === id);
  if (!m) return;
  fecharMenuMsg();
  MENU_MSG = id;
  balao.classList.add('realcada');

  const minha = !!m.from_me, idade = Date.now() - (Number(m.timestamp) || 0) * 1000;
  const itens = [`<button type="button" onclick="acaoMsg('responder')">Responder</button>`];
  if (m.texto) itens.push(`<button type="button" onclick="acaoMsg('copiar')">Copiar</button>`);
  if (minha && !m.apagadaEm && idade <= EDITAR_ATE_MS) {
    itens.push(`<button type="button" onclick="acaoMsg('editar')">Editar</button>`);
  }
  if (minha && !m.apagadaEm && idade <= APAGAR_ATE_MS) {
    itens.push(`<button type="button" class="perigo" onclick="acaoMsg('apagar')">Apagar para todos</button>`);
  }
  mostrarMenu(itens, e.clientX, e.clientY);
}

/**
 * As ações de avaliar a resposta da IA, no clique sobre o selo "IA".
 *
 * Mesmo menu do botão direito, a pedido: as duas ações viviam como links na
 * linha de cada balão da IA, e repetidas conversa abaixo viravam ruído.
 */
function abrirMenuIA(e){
  const b = e.target.closest('[data-ia]');
  if (!b) return;
  e.stopPropagation();
  const id = Number(b.dataset.ia);
  const x = (window.__msgs || []).find(m => m.id === id);
  if (!x) return;
  fecharMenuMsg();
  MENU_MSG = id;
  b.closest('.msg')?.classList.add('realcada');
  // Avaliada uma vez, não se avalia de novo: o que o menu tem a dizer é o que
  // já foi decidido.
  const itens = x.veredito === 'certo' ? ['<button type="button" disabled>Marcada como certa</button>']
    : x.veredito === 'errado' ? ['<button type="button" disabled>Já corrigida na base</button>']
    : [`<button type="button" onclick="acaoMsg('certa')">Marcar como certa</button>`,
       `<button type="button" onclick="acaoMsg('corrigir')">Corrigir a IA</button>`];
  mostrarMenu(itens, e.clientX, e.clientY);
}

/** Abre o menu junto do ponteiro, e dentro da janela — na beirada, os itens de
 *  baixo ficariam fora de alcance. */
function mostrarMenu(itens, x, y){
  const el = document.getElementById('menuMsg');
  el.innerHTML = itens.join('');
  el.classList.add('abre');
  const r = el.getBoundingClientRect();
  el.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';
  el.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';
}

function fecharMenuMsg(){
  document.getElementById('menuMsg').classList.remove('abre');
  document.querySelectorAll('.msg.realcada').forEach(el => el.classList.remove('realcada'));
  MENU_MSG = null;
}

async function acaoMsg(qual){
  const id = MENU_MSG;
  fecharMenuMsg();
  if (!id || !ATUAL) return;
  const m = (window.__msgs || []).find(x => x.id === id);
  if (!m) return;

  if (qual === 'responder') return citarMensagem(id);

  if (qual === 'copiar') {
    try { await navigator.clipboard.writeText(m.texto || ''); showAlert('Texto copiado'); }
    catch { showAlert('O navegador não deixou copiar','warn'); }
    return;
  }

  if (qual === 'editar') return entrarEmEdicao(m);

  if (qual === 'certa') return aprovarResposta(id);
  if (qual === 'corrigir') return abrirCorrigir(ATUAL, id);

  if (qual === 'apagar') {
    if (!await Aviso.confirmar('Apagar esta mensagem para todos?\n\nEla sai do WhatsApp do contato e fica marcada como apagada aqui.')) return;
    const d = await fetch(`/api/conversas/${ATUAL}/mensagens/${id}`, { method:'DELETE' })
      .then(r=>r.json()).catch(()=>null);
    if (!d?.success) return showAlert(d?.error || 'Não foi possível apagar','error');
    showAlert('Mensagem apagada para todos');
    await abrir(ATUAL); await carregar();
  }
}

document.getElementById('msgs').addEventListener('contextmenu', abrirMenuMsg);
document.getElementById('msgs').addEventListener('click', abrirMenuIA);
document.addEventListener('click', e => { if (!e.target.closest('#menuMsg')) fecharMenuMsg(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { fecharMenuMsg(); fechar('visorFoto'); } });

/* O espaço que o rodapé flutuante ocupa sobre a conversa.
   Ele é medido, e não um número: a barra cresce com a citação, com o anexo, com
   o painel de emoji e com o campo de várias linhas, e um valor fixo deixaria a
   última mensagem embaixo dela em todos esses casos. */
new ResizeObserver(([e]) => {
  document.getElementById('msgs').style.paddingBottom = (e.target.offsetHeight + 10) + 'px';
}).observe(document.getElementById('responder'));

/* O balão de quem tem `data-dica`. Delegado no documento porque os ícones são
   repintados a cada clique, e o balão abre ACIMA do alvo, ou abaixo quando não
   cabe. Mesmo desenho do Catálogo Online. */
const DICA = document.getElementById('dica');
document.addEventListener('mouseover', e => {
  const alvo = e.target.closest('[data-dica]');
  if (!alvo) return DICA.classList.remove('on');
  DICA.textContent = alvo.dataset.dica;
  DICA.classList.add('on');
  const r = alvo.getBoundingClientRect(), d = DICA.getBoundingClientRect();
  DICA.style.left = Math.max(6, Math.min(r.left + r.width / 2 - d.width / 2, innerWidth - d.width - 6)) + 'px';
  DICA.style.top = (r.top - d.height - 7 < 6 ? r.bottom + 7 : r.top - d.height - 7) + 'px';
});
document.addEventListener('mouseout', e => { if (e.target.closest('[data-dica]')) DICA.classList.remove('on'); });
window.addEventListener('scroll', () => DICA.classList.remove('on'), true);

async function mudarEstado(id, estado){
  const d = await fetch('/api/conversas/'+id, { method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ estado }) }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  showAlert('Conversa marcada como ' + estado);
  await carregar();
}

/* ---------- aviso de mensagem nova ----------
 *
 * A inbox já buscava a lista de 30 em 30 segundos e não dizia nada quando algo
 * chegava: quem não estivesse olhando a tela no instante certo só descobria
 * rolando. O aviso pega carona nesse mesmo ciclo — nenhuma requisição a mais.
 *
 * O SOM nasce ligado e o POP-UP nasce desligado, e a diferença é de consentimento:
 * som é local, some com um clique e não sai da máquina; notificação precisa de
 * permissão do navegador, que só se pede quando a pessoa clica, nunca sozinho.
 *
 * O beep é sintetizado em vez de vir de arquivo: um .mp3 no repositório seria
 * um binário a versionar e a servir, para meio segundo de onda senoidal.
 */
const AVISO = {
  som: localStorage.getItem('convAvisoSom') !== '0',
  popup: localStorage.getItem('convAvisoPopup') === '1',
};
// O id da última mensagem recebida que a tela já viu. null na primeira carga,
// que NUNCA avisa: abrir a tela com 153 não lidas dispararia um alarme sobre
// mensagem que já estava lá.
let ULTIMO_RECEBIDO = null;

function renderAvisos(){
  const el = document.getElementById('avisos');
  if (!el) return;
  // Ícone com `data-dica`, e não `title`: o balão nativo do navegador aparece
  // branco, atrasado e por cima do nosso — proibido nesta base desde a Fase
  // 3.2.1. O estado continua legível sem passar o mouse, pela cor da borda.
  el.innerHTML = `
    <button class="${AVISO.som?'on':''}" onclick="alternarAviso('som')"
      data-dica="Som ${AVISO.som?'ligado':'desligado'}: toca um bipe quando chega mensagem nova">🔔</button>
    <button class="${AVISO.popup?'on':''}" onclick="alternarAviso('popup')"
      data-dica="Notificação ${AVISO.popup?'ligada':'desligada'}: aviso do computador quando chega mensagem, mesmo com outra aba aberta">🖥️</button>`;
}

async function alternarAviso(qual){
  if (qual === 'popup' && !AVISO.popup) {
    // A permissão é pedida AQUI, no clique, e não no carregamento da tela: pedido
    // automático é o que faz o navegador (e a pessoa) negar por reflexo.
    if (!('Notification' in window)) return showAlert('Este navegador não faz notificação','warn');
    if (Notification.permission !== 'granted') {
      const p = await Notification.requestPermission();
      if (p !== 'granted') return showAlert('O navegador não autorizou a notificação','warn');
    }
  }
  AVISO[qual] = !AVISO[qual];
  localStorage.setItem(qual === 'som' ? 'convAvisoSom' : 'convAvisoPopup', AVISO[qual] ? '1' : '0');
  renderAvisos();
  // Ligar o som é um clique: é a hora de o navegador liberar o áudio, e o
  // bipe de confirmação mostra que funciona.
  if (qual === 'som' && AVISO.som) beep();
}

function beep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Sem um clique dentro desta tela o navegador cria o áudio suspenso, e o
    // bipe sairia mudo. resume() libera quando já houve clique.
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const osc = ctx.createOscillator(), vol = ctx.createGain();
    osc.frequency.value = 880; vol.gain.value = 0.05;
    osc.connect(vol); vol.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.12);
    setTimeout(() => ctx.close(), 400);
  } catch (e) { /* aba sem gesto do usuário ainda: o pop-up continua valendo */ }
}

/**
 * Chamado a cada volta do ciclo com `recebidas` do servidor: o id da última
 * mensagem recebida e quantas chegaram depois da que a tela já tinha visto.
 * Até 29/09 comparava o número de conversas não lidas, e não avisava a
 * mensagem nova numa conversa que já estava não lida, nem a que chegava
 * enquanto outra era lida.
 */
function avisarSeChegou(recebidas){
  if (!recebidas) return;                         // servidor antigo, sem o campo
  const primeira = ULTIMO_RECEBIDO === null;
  ULTIMO_RECEBIDO = recebidas.ultimoId || 0;
  if (primeira || !recebidas.novas) return;
  const novas = recebidas.novas;
  if (AVISO.som) beep();
  if (AVISO.popup && 'Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification(novas === 1 ? 'Mensagem nova' : `${novas} mensagens novas`,
        { body: 'Atendimento · Conversas', tag: 'conversas-novas' });
    } catch (e) { /* alguns navegadores só deixam via service worker */ }
  }
}
/**
 * Dono da conversa.
 *
 * Dono organiza fila, não restringe acesso: todo atendente continua vendo e
 * respondendo tudo. O que muda é saber de quem é o quê, que com quase mil
 * conversas abertas era pergunta sem resposta.
 */
async function carregarAtendentes(){
  const d = await fetch('/api/conversas/atendentes').then(r=>r.json()).catch(()=>null);
  if (!d || !d.success) return;
  ATENDENTES = d.atendentes || [];
  EU_ID = d.eu || null;
}

async function mudarDono(id, valor){
  const d = await fetch('/api/conversas/'+id, { method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ donoId: valor ? Number(valor) : null }) }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  showAlert(d.conversa.donoId ? 'Conversa atribuída' : 'Conversa liberada');
  await abrir(id); await carregar();
}

async function alternarIA(id, valor){
  const d = await fetch('/api/conversas/'+id, { method:'PUT', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ iaAtiva: !!valor }) }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  await abrir(id); await carregar();
}

/**
 * Mantém a conversa no fim enquanto a altura ainda muda.
 *
 * Um `scrollTop = scrollHeight` logo depois do innerHTML não basta: a imagem tem
 * `loading="lazy"` e o vídeo carrega metadados depois, então o conteúdo cresce em
 * seguida e a conversa "sobe" — era por isso que ela abria no meio do histórico,
 * com o fim fora da vista. O observador acompanha a mudança de altura e desliga
 * assim que a pessoa rola para trás, para não arrastá-la de volta ao pé enquanto
 * ela lê o histórico.
 */
function ancorarNoFim(m){
  m.scrollTop = m.scrollHeight;
  if (m.__obs) m.__obs.disconnect();
  let ancorado = true;
  const perto = () => m.scrollHeight - m.scrollTop - m.clientHeight < 80;
  const aoRolar = () => { ancorado = perto(); };
  m.removeEventListener('scroll', m.__aoRolar || (()=>{}));
  m.__aoRolar = aoRolar;
  m.addEventListener('scroll', aoRolar);
  const obs = new ResizeObserver(() => { if (ancorado) m.scrollTop = m.scrollHeight; });
  for (const el of m.children) obs.observe(el);
  m.__obs = obs;
  // Rede de segurança para mídia que só muda de tamanho ao carregar de fato.
  for (const el of m.querySelectorAll('img, video')) {
    el.addEventListener('load', () => { if (ancorado) m.scrollTop = m.scrollHeight; }, { once: true });
    el.addEventListener('loadedmetadata', () => { if (ancorado) m.scrollTop = m.scrollHeight; }, { once: true });
  }
}

/**
 * O pedaço anterior do histórico. A posição de leitura é preservada: crescer a
 * lista por cima sem isso jogaria a pessoa para outro ponto da conversa.
 */
async function carregarAnteriores(id){
  const m = document.getElementById('msgs');
  const btn = document.getElementById('btnMaisAntigas');
  const primeira = (window.__msgs || [])[0];
  if (!primeira) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Carregando…'; }
  const d = await fetch(`/api/conversas/${id}/mensagens?antesDe=${primeira.id}`)
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) { if (btn) { btn.disabled = false; btn.textContent = 'Carregar mensagens anteriores'; } return showAlert(d?.error || 'Não foi possível carregar','error'); }
  const alturaAntes = m.scrollHeight, posAntes = m.scrollTop;
  window.__msgs = [...d.mensagens, ...(window.__msgs || [])];
  window.__temMais = d.temMais;
  pintarMensagens(id, window.__msgs, d.temMais);
  m.scrollTop = posAntes + (m.scrollHeight - alturaAntes);
}

// Anula a pausa de 4 horas que começa quando alguém responde à mão. A próxima
// mensagem do contato volta a ser atendida pela IA.
async function retomarIA(id){
  const d = await fetch('/api/conversas/'+id+'/retomar-ia', { method:'POST' })
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) return showAlert(d?.error || 'Não foi possível retomar','error');
  PAUSA_ATE = 0;
  renderBotaoIA(id, 1);
  showAlert('A IA volta a responder nesta conversa');
  await carregar();
}

// ---------- avaliar a resposta ----------
// Só nas mensagens da IA (`from_bot`), a pedido (01/10/2026). Até então aparecia
// em TODA mensagem enviada — inclusive no que o atendente escreveu à mão, onde
// não há IA nenhuma a corrigir.
//
// E desde 02/10 "certo" e "corrigir" SAÍRAM da linha do balão: eram dois links
// em cada resposta da IA, repetidos conversa abaixo. Agora o próprio selo "IA"
// é o botão, e as ações abrem no mesmo menu do botão direito. O que fica à
// vista é só o estado, pela cor do selo.
function selo(x){
  const marca = x.veredito === 'certo' ? ' ok' : x.veredito === 'errado' ? ' corrigida' : '';
  const dito = x.veredito === 'certo' ? 'Resposta marcada como certa'
    : x.veredito === 'errado' ? 'Resposta já corrigida na base'
    : 'Resposta da IA. Clique para marcar como certa ou corrigir.';
  return `<button type="button" class="porIA${marca}" data-ia="${x.id}" title="${dito}">IA</button>`;
}

async function aprovarResposta(msgId){
  const msgs = window.__msgs || [];
  const i = msgs.findIndex(m => m.id === msgId);
  if (i < 0) return;
  let pergunta = '';
  for (let k = i - 1; k >= 0; k--) if (!msgs[k].from_me) { pergunta = msgs[k].texto || ''; break; }
  const d = await fetch('/api/ia/aprovar', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ conversaId: ATUAL, mensagemId: msgId, perguntou: pergunta, respondeu: msgs[i].texto || '' })
  }).then(r=>r.json()).catch(()=>null);
  if (!d?.success) return showAlert(d?.error || 'Não foi possível marcar','error');
  msgs[i].veredito = 'certo';
  // Só o selo muda: repintar a conversa inteira para uma marca faria a rolagem
  // saltar de volta para o fim.
  const b = document.querySelector(`.porIA[data-ia="${msgId}"]`);
  if (b) { b.classList.add('ok'); b.title = 'Resposta marcada como certa'; }
  showAlert('Resposta marcada como certa');
}

// ---------- corrigir a IA ----------
function abrirCorrigir(conversaId, msgId){
  const msgs = window.__msgs || [];
  const i = msgs.findIndex(m => m.id === msgId);
  const errada = msgs[i]?.texto || '';
  // a pergunta é a última mensagem do cliente antes da resposta da IA
  let pergunta = '';
  for (let k = i - 1; k >= 0; k--) if (!msgs[k].from_me) { pergunta = msgs[k].texto || ''; break; }
  document.getElementById('cErrada').value = errada;
  document.getElementById('cCerta').value = '';
  document.getElementById('cTitulo').value = pergunta.slice(0, 80);
  document.getElementById('modalCorrigir').dataset.conversa = conversaId;
  document.getElementById('modalCorrigir').dataset.mensagem = msgId;
  document.getElementById('modalCorrigir').dataset.pergunta = pergunta;
  document.getElementById('modalCorrigir').classList.add('open');
}

async function salvarCorrecao(){
  const el = document.getElementById('modalCorrigir');
  const correta = document.getElementById('cCerta').value.trim();
  if (!correta) return showAlert('Escreva a resposta correta','error');
  const d = await fetch('/api/ia/corrigir', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      conversaId: Number(el.dataset.conversa), mensagemId: Number(el.dataset.mensagem),
      perguntou: el.dataset.pergunta,
      respondeu: document.getElementById('cErrada').value, correta,
      titulo: document.getElementById('cTitulo').value,
    }) }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  fechar('modalCorrigir');
  // Repinta a conversa para a mensagem já aparecer marcada como corrigida.
  if (ATUAL) abrir(ATUAL);
  showAlert('Correção salva na base — vale a partir da próxima conversa');
}


document.addEventListener('keydown', e => { if (e.key==='Escape') fechar('modalCorrigir'); });
renderAvisos();
carregarAtendentes();
carregar();
setInterval(carregar, 30000);
// O tique anda em segundos, e a lista só a cada 30: são dois tempos. Este é
// barato de propósito — um SELECT por id na conversa aberta, e nada quando não
// há conversa aberta nem quando a aba está escondida. A mensagem que chega vem
// no mesmo tempo, e pelo mesmo motivo: 30 s de conversa parada se nota.
setInterval(() => { atualizarTiques(); mensagensNovas(); }, 6000);
