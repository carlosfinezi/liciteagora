<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversas · Licite Agora</title>
<script src="/js/theme-boot.js"></script>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
<style>
/* A tela é uma caixa só: lista, conversa e ficha dividem a MESMA moldura, em vez
   de três painéis com borda dentro de uma página que já tem borda. */
.central { display:grid; grid-template-columns: 340px 1fr 300px;
  /* Desconta só o cabeçalho da página. Até 29/09 descontava também a faixa de
     números do topo, que saiu, e sobrava uma faixa vazia embaixo. */
  height:calc(100vh - 100px); height:calc(100dvh - 100px); min-height:460px;
  background:var(--bg-1); border:var(--borda); border-radius:var(--raio-md); overflow:hidden; }
/* Voltar para a lista: só no celular, onde a conversa ocupa a tela toda. Fica
   ANTES das regras de tamanho de tela, para a do celular poder mostrá-lo. */
.cab .voltar { display:none; }
/* Nas regras de tamanho de tela, `.central .x` e não `.x`: a regra de `.coluna`,
   mais abaixo e com o mesmo peso, vencia. Com isso a ficha nunca sumia (no
   celular e no tablet caía embaixo da conversa) e, no celular, a conversa
   vazia dividia a altura com a lista. */
@media (max-width:1200px){ .central { grid-template-columns: 280px 1fr; } .central .ficha { display:none; } }
@media (max-width:820px){ .central { grid-template-columns: 1fr; height:calc(100dvh - 130px); } .central .ficha { display:none; }
  .central .thread { display:none; }
  .central.abriu .lista { display:none; } .central.abriu .thread { display:flex; }
  .cab .voltar { display:inline-flex; } }

/* `min-height:0` e `overflow:hidden` NÃO são enfeite: sem eles, a coluna cresce
   com o conteúdo em vez de rolar, e as 300 conversas da lista esticam a página
   para 20.595px de altura — arrastando a conversa e a ficha junto, porque as
   colunas do grid têm a mesma altura. Medido em produção em 17/09. */
.coluna { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
.coluna + .coluna { border-left:var(--borda); }
.rolagem { overflow-y:auto; flex:1; }


/* ---- topo da lista ----
   A busca tem a linha dela, na largura inteira. Os seletores de número e de
   segmento ficam na linha de baixo, lado a lado, e só existem quando há mais
   de um número ou quando há segmentos. Em 29/09, os dois na linha da busca
   deixaram o campo com 26 px na coluna de 320. */
.topo { padding:var(--space-3); border-bottom:var(--borda); display:flex;
  gap:var(--space-2); flex-direction:column; }
.busca-linha { display:flex; gap:var(--space-2); align-items:center; }
.busca-linha input { flex:1; min-width:0; }
.seletores { display:flex; gap:var(--space-2); }
.seletores select { flex:1 1 0; min-width:0; padding:5px; }

/* Os filtros quebram linha. Até 29/09 rolavam para o lado, e "Campanhas" e
   "Minhas" ficavam fora da vista: filtro escondido é filtro que ninguém usa. */
.chips { display:flex; flex-wrap:wrap; gap:var(--space-1); }
.chips button { padding:3px 10px; font-size:var(--text-xs); border:var(--borda); background:transparent;
  color:var(--text-2); border-radius:var(--raio-pill); cursor:pointer; white-space:nowrap; flex:0 0 auto; }
.chips button.sel { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); }

/* ---- a linha da conversa ----
   O avatar de iniciais dá ritmo à coluna, que antes era um bloco de texto só. As
   marcas ficaram só para o EXCEPCIONAL: "aberta" e "sem cadastro" apareciam em
   toda linha e viraram textura. */
.conv { padding:var(--space-3); border-bottom:var(--borda); cursor:pointer; display:flex; gap:var(--space-3); }
.conv:hover { background:var(--superficie-hover); }
.conv.sel { background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent); }
.ini { flex:0 0 38px; height:38px; border-radius:50%; background:var(--bg-3); color:var(--text-1);
  display:flex; align-items:center; justify-content:center; font-size:var(--text-sm);
  font-weight:var(--peso-forte); position:relative; }
.ini .n { position:absolute; top:-3px; right:-3px; min-width:17px; height:17px; padding:0 4px;
  border-radius:999px; background:var(--danger); color:#fff; font-size:var(--text-xs);
  display:flex; align-items:center; justify-content:center; font-weight:var(--peso-forte); }
.conv .corpo { flex:1; min-width:0; }
.conv .l1 { display:flex; justify-content:space-between; gap:var(--space-2); align-items:baseline; }
.conv .nome { font-weight:var(--peso-forte); font-size:var(--text-base);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.conv .hora { font-size:var(--text-xs); color:var(--text-3); white-space:nowrap; }
.conv .previa { font-size:var(--text-sm); color:var(--text-2); white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.conv .marcas { display:flex; gap:var(--space-1); margin-top:var(--space-1); flex-wrap:wrap; }
.pil { font-size:var(--text-xs); padding:1px 8px; border-radius:var(--raio-pill);
  border:var(--borda); color:var(--text-2); }
.pil.pendente { border-color:var(--accent); color:var(--accent); }
.pil.resolvida { border-color:var(--success); color:var(--success); }
.pil.sem-ia { border-color:var(--warn); color:var(--warn); }
.pil.dono { border-color:var(--accent); color:var(--accent); }
.pil.numero { border-color:var(--text-3); color:var(--text-2); }

/* ---- cabeçalho da conversa ----
   Tinha dois `select` crus, "assumir" e "IA: ligada", quatro controles do mesmo
   tamanho ao lado do nome: parecia formulário, não cabeçalho. O nome voltou a
   ser a coisa maior da faixa, e os controles ficaram discretos à direita. */
.cab { padding:var(--space-3) var(--space-4); border-bottom:var(--borda);
  display:flex; gap:var(--space-2); align-items:center; flex-wrap:wrap; }
/* A pausa da IA, entre o cabeçalho e as mensagens: é ali que quem abre a
   conversa procura o motivo de a IA não ter respondido. */
.aviso-pausa { display:flex; gap:var(--space-3); align-items:center; flex-wrap:wrap;
  padding:var(--space-2) var(--space-4); border-bottom:var(--borda);
  background:var(--warn-bg, rgba(234,179,8,.10)); font-size:var(--text-sm); }
.aviso-pausa button { flex-shrink:0; }
.cab .quem { min-width:0; }
.cab .quem strong { display:block; font-size:var(--text-md); line-height:var(--lh-densa); }
.cab .quem span { font-size:var(--text-sm); color:var(--text-2); }
.cab select { width:auto; font-size:var(--text-sm); padding:4px 8px;
  background:transparent; border-color:var(--border); color:var(--text-2); }
.cab select:hover { border-color:var(--border-strong); color:var(--text-1); }
.cab .btn { font-size:var(--text-sm); }
/* O estado da IA é informação, e só vira ação no clique. Em botão sólido ele
   competia com o nome de quem está do outro lado da conversa. */
.cab .ia-estado { display:inline-flex; align-items:center; gap:6px; }
.cab .ia-estado::before { content:''; width:7px; height:7px; border-radius:50%;
  background:var(--success); }
.cab .ia-estado.off::before { background:var(--text-3); }
.msgs { flex:1; overflow-y:auto; padding:var(--space-4); display:flex; flex-direction:column;
  gap:var(--space-2); background:var(--bg-0); }
/* O teto em PIXELS é o que importa aqui: só com `72%`, uma tela de 1600px
   produzia balão de 640px de largura, e linha longa demais obriga o olho a
   voltar ao começo. 34em é cerca de 70 caracteres, que é onde a leitura para de
   piorar. */
.msg { max-width:min(72%, 34em); padding:var(--space-2) var(--space-3);
  border-radius:var(--raio-md);
  font-size:var(--text-base); line-height:var(--lh-base); word-break:break-word; }
/* O pre-wrap é só do TEXTO, que pode ter várias linhas. No balão inteiro, ele
   preservava também a quebra e o recuo do código em volta do texto, e cada
   mensagem curta ("compra") virava um bloco com linhas vazias em cima e embaixo. */
.msg .txt { white-space:pre-wrap; }
.res-qualificado { color:var(--success); }
.res-desqualificado { color:var(--text-3); }
.msg.deles { background:var(--bg-1); border:var(--borda); align-self:flex-start; border-bottom-left-radius:3px; }
.msg.minha { background:var(--accent-soft); border:var(--borda-acento); align-self:flex-end; border-bottom-right-radius:3px; }

/* A linha de baixo juntava hora, origem e duas ações no mesmo tom e tamanho.
   A hora fica à esquerda, apagada; as ações vão para a direita, que é onde a
   mão procura. */
.msg .midia { display:block; margin-bottom:var(--space-1); }
.msg .midia img { display:block; max-width:100%; max-height:320px; border-radius:6px; cursor:zoom-in; }
.msg .midia audio, .msg .midia video { display:block; max-width:100%; }
.msg .midia video { max-height:320px; border-radius:6px; }
.msg .midia .falhou { font-size:var(--text-xs); color:var(--text-3); }
.msg .meta { font-size:var(--text-xs); color:var(--text-3); margin-top:var(--space-1);
  display:flex; gap:var(--space-2); align-items:center; }
.msg .meta .quando { margin-right:auto; }
/* "IA" como marca, e não como mais um pedaço de texto solto na linha. */
.msg .meta .porIA { border:var(--borda); border-color:var(--purple, #a78bfa);
  color:var(--purple, #a78bfa); border-radius:var(--raio-pill); padding:0 6px; }
.msg .corrigir { background:none; border:0; color:var(--accent); cursor:pointer;
  font-size:var(--text-xs); padding:0; text-decoration:underline; }
.msg .aprovar { background:none; border:0; color:var(--success); cursor:pointer;
  font-size:var(--text-xs); padding:0; text-decoration:underline; }
.msg .aprovar[disabled] { opacity:0.5; cursor:default; }
/* Apagada no WhatsApp: a mensagem continua inteira e legível, e a marca diz o
   que aconteceu. O texto esmaecido seria pior — quem lê o histórico depois
   precisa justamente do conteúdo que o outro lado quis tirar. */
.msg.apagada { border:var(--borda); border-color:var(--warn, #fbbf24); }
.msg .apagada-marca { color:var(--warn, #b45309); }
.msg .veredito.ok { color:var(--success); }
.msg .veredito.erro { color:var(--danger); }
.responder { border-top:var(--borda); padding:var(--space-3); display:flex;
  gap:var(--space-2); align-items:flex-end; }
.responder textarea { flex:1; resize:vertical; min-height:44px; max-height:160px; }

.ficha .bloco { padding:var(--space-3) var(--space-4); border-bottom:var(--borda); }
.ficha h4 { margin:0 0 var(--space-2); font-size:var(--text-xs); text-transform:uppercase;
  letter-spacing:.06em; color:var(--text-3); }
.ficha .linha { display:flex; justify-content:space-between; font-size:var(--text-sm);
  padding:3px 0; gap:var(--space-2); }

/* Um estado vazio por região, e nenhum deles narra o que está na tela. */
.vazio-centro { display:flex; align-items:center; justify-content:center; height:100%;
  color:var(--text-3); font-size:var(--text-base); padding:var(--space-5); text-align:center; }

/* Som e notificação de mensagem nova, no cabeçalho da página. Até 29/09 eram
   dois emojis sem texto ao lado da busca, e ninguém sabia o que faziam. */
.page-header { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); }
.avisos { display:flex; gap:var(--space-2); flex:0 0 auto; }
.avisos button { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 10px;
  font-size:var(--text-sm); line-height:1; white-space:nowrap;
  border:var(--borda); background:transparent; color:var(--text-3);
  border-radius:var(--raio-md); cursor:pointer; }
.avisos button.on { border-color:var(--success); color:var(--success); }
.avisos button:hover { border-color:var(--border-strong); }
</style>
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div><h1>Conversas</h1></div>
    <div class="avisos" id="avisos"></div>
  </div>
  <div id="alertGlobal"></div>

  <div class="central" id="central">
    <div class="coluna lista">
      <div class="topo">
        <div class="busca-linha">
          <input type="text" id="busca" placeholder="Buscar nome ou telefone…" oninput="renderLista()">
        </div>
        <div class="seletores" id="seletores" style="display:none;">
          <select id="selNumero" style="display:none;" onchange="escolherNumero(this.value)"></select>
          <select id="selSegmento" style="display:none;" onchange="escolherSegmento(this.value)"></select>
        </div>
        <div class="chips" id="filtros"></div>
        <div id="linhaCampanha" style="display:none;gap:var(--space-2);">
          <select id="selCampanha" style="padding:5px;min-width:0;flex:1;" onchange="escolherCampanha(this.value)"></select>
          <select id="selModo" style="padding:5px;" onchange="escolherModo(this.value)">
            <option value="responderam">Responderam</option>
            <option value="receberam">Receberam</option>
          </select>
        </div>
      </div>
      <div class="rolagem" id="listaConv"><div class="vazio-centro">Carregando…</div></div>
    </div>

    <div class="coluna thread">
      <div class="cab" id="threadCab" style="display:none;"></div>
      <div id="pausaIA"></div>
      <div class="msgs" id="msgs"><div class="vazio-centro">Escolha uma conversa na lista</div></div>
      <div class="responder" id="responder" style="display:none;">
        <textarea id="txtResposta" placeholder="Escreva a resposta… (Ctrl+Enter envia)"
          onkeydown="if(event.ctrlKey&&event.key==='Enter')responder()"></textarea>
        <button class="btn btn-ghost" id="btnAgendar" onclick="enviarConviteAgenda()"
          style="display:none;">Agendar reunião</button>
        <button class="btn btn-primary" onclick="responder()">Enviar</button>
      </div>
    </div>

    <div class="coluna ficha"><div class="rolagem" id="fichaCorpo"></div></div>
  </div>
</main></div>

<!-- modal corrigir -->
<div class="modal-bg" id="modalCorrigir">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <div><h3 style="margin:0;">Corrigir a IA</h3>
        <small class="muted">A resposta certa vira item da base e passa a valer nas próximas conversas.</small></div>
      <button class="btn btn-ghost btn-sm" onclick="fechar('modalCorrigir')" style="font-size:1.2em;padding:4px 10px;">×</button>
    </div>
    <div class="form-row"><div class="form-group full-width">
      <label>A IA respondeu</label><textarea id="cErrada" rows="3" readonly></textarea>
    </div></div>
    <div class="form-row"><div class="form-group full-width">
      <label>O que ela deveria ter dito *</label><textarea id="cCerta" rows="4" placeholder="Escreva a resposta correta, com o dado real"></textarea>
    </div></div>
    <div class="form-row"><div class="form-group full-width">
      <label>Título na base</label><input type="text" id="cTitulo" placeholder="ex.: Prazo de entrega para o Pará">
    </div></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fechar('modalCorrigir')">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarCorrecao()">Salvar na base</button>
    </div>
  </div>
</div>
<script src="/js/sidebar.js"></script>
<script src="/js/aviso-sistema.js"></script>
<script>initSidebar('conversas');</script>
<script>
let CONVERSAS = [], ATUAL = null, FILTRO = '', EDITANDO = null;
// FILTRO='campanha' recorta quem respondeu; CAMPANHA diz de qual ('todas' ou id).
let CAMPANHA = 'todas', CAMPANHAS_WA = null, MODO = 'responderam';
// NUMERO: o número de WhatsApp filtrado ('' = todos); NUMEROS vem com a lista.
let NUMERO = '', NUMEROS = [];
// SEGMENTO: o da ficha ligada à conversa ('' = todos).
let SEGMENTO = '';
const RECORTES = ['naoLidas', 'aguardando', 'minhas', 'semDono', 'semResposta', 'qualificados', 'desqualificados'];
// Quem pode assumir conversa, e quem sou eu. Carregados uma vez: a equipe não
// muda no meio do expediente, e a lista alimenta um select por conversa aberta.
let ATENDENTES = [], EU_ID = null;
let PUBLICO = [], SEL_PUB = new Set(), MODELOS = [], LISTAS = [];

function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
function fechar(id){ document.getElementById(id).classList.remove('open'); }
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// String para usar como argumento dentro de onclick="...": aspas SIMPLES no JS,
// e o resto escapado para HTML. JSON.stringify não serve aqui — a aspa dupla
// que ele gera encerra o atributo e o handler vira um fragmento quebrado.
const argJs = s => "'" + String(s==null?'':s)
  .replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]+/g,' ')
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;') + "'";
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

function quando(v){
  if (!v) return '';
  const d = new Date(String(v).replace(' ','T') + (String(v).endsWith('Z')?'':'Z'));
  if (isNaN(d)) return '';
  const hoje = new Date();
  const mesmoDia = d.toDateString() === hoje.toDateString();
  return mesmoDia ? d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
                  : d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
}

// ---------- mídia das mensagens (wa-midia.js) ----------
// A mídia vem do servidor quando a conversa abre; o texto, quando há, fica
// embaixo dela. Imagem abre inteira em outra aba.
const TIPOS_MIDIA = { imageMessage: 'img', stickerMessage: 'img', templateMessage: 'img',
  videoMessage: 'video', ptvMessage: 'video', audioMessage: 'audio',
  documentMessage: 'doc', documentWithCaptionMessage: 'doc' };
function midiaDa(x){
  const tipo = TIPOS_MIDIA[x.message_type];
  if (!tipo) return '';
  const url = '/api/conversas/midia/' + x.id;
  const falha = `this.closest('.midia').innerHTML='<span class=\\'falhou\\'>Mídia indisponível</span>'`;
  if (tipo === 'img') return `<a class="midia" href="${url}" target="_blank" rel="noopener">
    <img src="${url}" alt="" loading="lazy" onerror="${falha}"></a>`;
  if (tipo === 'video') return `<span class="midia"><video src="${url}" controls preload="metadata" onerror="${falha}"></video></span>`;
  if (tipo === 'audio') return `<span class="midia"><audio src="${url}" controls preload="none" onerror="${falha}"></audio></span>`;
  return `<a class="midia" href="${url}" target="_blank" rel="noopener">Abrir documento</a>`;
}

// ---------- lista ----------
async function carregar(){
  // A campanha vai sempre no querystring, mesmo com o filtro desligado: é ela
  // que define a contagem do botão "Responderam".
  const params = new URLSearchParams();
  if (FILTRO === 'campanha') { params.set('campanha', CAMPANHA); params.set('modo', MODO); }
  else if (RECORTES.includes(FILTRO)) params.set('recorte', FILTRO);
  else if (FILTRO) params.set('estado', FILTRO);
  // O número vale junto de qualquer outro filtro, e as contagens o seguem.
  if (NUMERO) params.set('canal', NUMERO);
  if (SEGMENTO) params.set('segmento', SEGMENTO);
  // A partir de qual mensagem recebida contar as novas (o aviso de chegada).
  if (ULTIMO_RECEBIDO !== null) params.set('desde', ULTIMO_RECEBIDO);
  const qs = params.toString() ? '?' + params : '';
  const d = await fetch('/api/conversas' + qs).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  CONVERSAS = d.conversas;
  NUMEROS = d.canais || [];
  renderSeletorNumero();

  const c = d.contagem;
  avisarSeChegou(d.recebidas);
  // Até 29/09 "sem nenhuma resposta", "não lidas", "sem dono" e "no total"
  // eram números grandes no alto da tela, e eram também os filtros. Saíram a
  // pedido, para limpar o visual, e os filtros vieram para cá. Clicar de novo
  // no filtro marcado volta a mostrar todas, que era o papel do "no total".
  const chips = [
    ['aguardando', 'Aguardando você', c.aguardando],
    ['naoLidas', 'Não lidas', c.naoLidas],
  ];
  if (c.semResposta !== undefined) chips.push(['semResposta', 'Sem resposta', c.semResposta]);
  chips.push(['campanha', 'Campanhas', c.respondeuCampanha]);
  // Dono só vira filtro quando o SERVIDOR sabe recortar por dono. Esta tela é
  // estática e entra no ar ao salvar; o backend só no restart. No meio, um
  // "Minhas" que o servidor antigo ignora devolveria a fila inteira com o
  // rótulo errado — pior que não ter o filtro.
  if (c.semDono !== undefined) chips.push(['minhas', 'Minhas', c.minhas]);
  // "Sem dono" igual ao total não filtra nada: é o caso enquanto ninguém
  // assumiu conversa, e o chip só ocuparia lugar.
  if (c.semDono !== undefined && c.semDono !== c.total) chips.push(['semDono', 'Sem dono', c.semDono]);
  // Resultado do roteiro de qualificação: só aparece quando há alguém nele.
  if (c.qualificados || FILTRO === 'qualificados') chips.push(['qualificados', 'Qualificados', c.qualificados]);
  if (c.desqualificados || FILTRO === 'desqualificados') chips.push(['desqualificados', 'Desqualificados', c.desqualificados]);
  // O estado só vira filtro quando alguém de fato usa: enquanto tudo estiver
  // 'aberta', "Abertas" é sinônimo de "Todas" e os outros dois são sempre zero.
  if (c.pendente || c.resolvida) chips.push(
    ['aberta','Abertas',c.aberta], ['pendente','Pendentes',c.pendente],
    ['resolvida','Resolvidas',c.resolvida]);
  const elChips = document.getElementById('filtros');
  elChips.innerHTML = chips
    .map(([v,rot,n]) => `<button class="${FILTRO===v?'sel':''}" onclick="filtrar('${v}')">${rot}${n?' '+n:''}</button>`).join('');
  renderSeletorCampanha();

  renderLista();
}

function filtrar(v){ FILTRO = FILTRO === v ? '' : v; carregar(); }

// O seletor de campanha só existe dentro do filtro "Responderam" — fora dele
// não teria o que recortar.
// As duas origens desde 29/09: 'wa:<id>' (legado) e 'comm:<id>' (campanha
// nova de WhatsApp). "Receberam" só pode mostrar quem tem conversa: quem
// recebeu e nunca escreveu não aparece na caixa, só em Campanhas › Ver envios.
async function renderSeletorCampanha(){
  const linha = document.getElementById('linhaCampanha');
  if (FILTRO !== 'campanha') { linha.style.display = 'none'; return; }
  if (!CAMPANHAS_WA) {
    const d = await fetch('/api/conversas/campanhas').then(r=>r.json()).catch(()=>null);
    CAMPANHAS_WA = ((d && d.campanhas) || []).filter(c => c.origem === 'wa' || c.canal === 'whatsapp');
  }
  const valor = (c) => (c.origem === 'wa' ? 'wa:' : 'comm:') + c.id;
  document.getElementById('selCampanha').innerHTML = ['<option value="todas">Todas as campanhas</option>']
    .concat(CAMPANHAS_WA.map(c =>
      `<option value="${valor(c)}" ${CAMPANHA===valor(c)?'selected':''}>${esc(c.nome || ('Campanha #'+c.id))}${c.origem==='wa'?' (legado)':''}</option>`))
    .join('');
  document.getElementById('selModo').value = MODO;
  linha.style.display = 'flex';
}

function escolherCampanha(v){ CAMPANHA = v; carregar(); }
function escolherModo(v){ MODO = v; carregar(); }

function renderLista(){
  const q = document.getElementById('busca').value.toLowerCase().trim();
  const lista = CONVERSAS.filter(c => !q || [c.nome,c.pessoaNome,c.telefone,c.ultimaMensagem]
    .some(v => String(v||'').toLowerCase().includes(q)));
  const el = document.getElementById('listaConv');
  if (!lista.length) { el.innerHTML = '<div class="vazio-centro">Nenhuma conversa</div>'; return; }
  el.innerHTML = lista.map(c => {

    <div class="conv ${ATUAL===c.id?'sel':''}" onclick="abrir(${c.id})">
      <div class="ini">${esc(iniciais(nome))}${c.naoLidas ? `<span class="n">${c.naoLidas}</span>` : ''}</div>
      <div class="corpo">

          <span class="nome">${esc(nome)}</span>
          <span class="hora">${quando(c.ultimaEm)}</span>
        </div>
        <div class="previa">${esc(c.ultimaMensagem || 'sem mensagem')}</div>
        ${marcas(c)}
      </div>
    </div>`;

}

/**
 * As iniciais do avatar.
 *
 * O avatar existe para dar ritmo à coluna, que era um bloco de texto corrido
 * onde toda linha parecia igual. Número sem nome vira "#", que é melhor que
 * duas iniciais tiradas de um telefone.
 */
function iniciais(nome){
  const p = String(nome).trim().split(/\s+/).filter(x => /[A-Za-zÀ-ÿ]/.test(x[0] || ''));
  if (!p.length) return '#';
  return ((p[0][0] || '') + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}

/**
 * As marcas da linha — só o EXCEPCIONAL.
 *
 * Antes toda linha trazia "aberta" e "sem cadastro". Como é o estado de quase
 * todas as 953, a marca não informava nada e virava textura; o olho aprendia a
 * pular a faixa inteira, inclusive quando ali havia algo diferente.
 *
 * O que sobrou segue uma regra só: aparece o que NÃO é o caso comum. Estado
 * diferente de aberta, IA desligada nesta conversa (ligada é o padrão), e o
 * dono, quando alguém assumiu.
 */
function marcas(c){
  const m = [];
  if (c.estado && c.estado !== 'aberta') m.push(`<span class="pil ${c.estado}">${c.estado}</span>`);
  if (c.iaAtiva === 0) m.push('<span class="pil sem-ia">IA desligada</span>');
  if (c.donoNome) m.push(`<span class="pil dono">${esc(c.donoNome)}</span>`);
  // Com vários números, cada conversa diz por qual número a pessoa escreveu.
  if (NUMEROS.length > 1 && c.canalNome) m.push(`<span class="pil numero">${esc(c.canalNome)}</span>`);
  return m.length ? `<div class="marcas">${m.join('')}</div>` : '';
}

// ---------- conversa ----------
function voltarLista(){ document.getElementById('central').classList.remove('abriu'); }

async function abrir(id){
  ATUAL = id;
  renderLista();
  const d = await fetch('/api/conversas/'+id).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  const c = d.conversa;

  // No celular a conversa ocupa a tela no lugar da lista (a classe `abriu`).
  // Até 29/09 nada punha essa classe, e a conversa só aparecia no celular
  // porque a regra que devia escondê-la perdia para outra.
  document.getElementById('central').classList.add('abriu');
  const cab = document.getElementById('threadCab');
  cab.style.display = 'flex';
  cab.innerHTML = `
    <button class="btn btn-ghost btn-sm voltar" onclick="voltarLista()">Voltar</button>
    <div class="ini">${esc(iniciais(c.pessoaNome || c.nome || c.telefone || ''))}</div>
    <div class="quem">
      <strong>${esc(c.pessoaNome || c.nome || c.telefone)}</strong>
      <span>${esc(c.telefone)}${NUMEROS.length > 1 && c.canalNome ? ` · pelo ${esc(c.canalNome)}` : ''}</span>
    </div>
    <span style="flex:1;"></span>
    <select onchange="mudarEstado(${c.id}, this.value)">
      ${['aberta','pendente','resolvida'].map(e=>`<option value="${e}" ${c.estado===e?'selected':''}>${e}</option>`).join('')}
    </select>
    ${ATENDENTES.length ? `
    <select id="selDono" onchange="mudarDono(${c.id}, this.value)">
      <option value="">sem dono</option>
      ${ATENDENTES.map(a=>`<option value="${a.id}" ${c.donoId===a.id?'selected':''}>${esc(a.nome)}</option>`).join('')}
    </select>
    ${EU_ID && c.donoId !== EU_ID ? `<button class="btn btn-ghost btn-sm" onclick="mudarDono(${c.id}, ${EU_ID})">assumir</button>` : ''}` : ''}
    <button class="btn btn-ghost btn-sm ia-estado${c.iaAtiva ? '' : ' off'}" onclick="alternarIA(${c.id}, ${c.iaAtiva?0:1})">
      IA ${c.iaAtiva ? 'ligada' : 'desligada'}</button>
`;

  // A pausa por atendimento humano era invisível: a IA ficava calada 4 horas e
  // nada dizia isso, nem havia como anular sem esperar.
  const pausa = document.getElementById('pausaIA');
  if (d.pausaIA && d.pausaIA.pausada) {
    const ate = new Date(d.pausaIA.ate * 1000).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    pausa.innerHTML = `<div class="aviso-pausa">
      <span>A IA não responde nesta conversa até as ${ate}, porque alguém da equipe respondeu à mão.</span>
      <button class="btn btn-secondary btn-sm" onclick="retomarIA(${c.id})">Retomar a IA</button>
    </div>`;
  } else pausa.innerHTML = '';

  window.__msgs = d.mensagens;
  pintarMensagens(c.id, d.mensagens, d.temMais);

  document.getElementById('responder').style.display = 'flex';
  renderFicha(c, d.ficha);
}

/**
 * Pinta a lista de mensagens. Usada na abertura e ao trazer o histórico antigo,
 * para os dois caminhos desenharem a mesma coisa.
 */
function pintarMensagens(convId, msgs, temMais){
  const m = document.getElementById('msgs');
  // Conversa longa chega cortada (400 por vez). Sem este botão o histórico
  // antigo não existia para quem usa: no 1bit são 15 conversas assim.
  const maisAntigas = temMais
    ? `<button class="btn btn-ghost btn-sm" id="btnMaisAntigas" style="margin:0 auto var(--space-2);display:block;"
         onclick="carregarAnteriores(${convId})">Carregar mensagens anteriores</button>` : '';
  m.innerHTML = maisAntigas + (msgs.length ? msgs.map(x => `
    <div class="msg ${x.from_me ? 'minha' : 'deles'}${x.apagadaEm ? ' apagada' : ''}">
      ${midiaDa(x)}${x.texto ? `<div class="txt">${esc(x.texto)}</div>` : (TIPOS_MIDIA[x.message_type] ? '' : '<div class="txt">(sem texto)</div>')}
      <div class="meta">
        <span class="quando">${x.timestamp ? new Date(x.timestamp*1000).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}</span>
        ${x.apagadaEm ? `<span class="apagada-marca" title="Apagada no WhatsApp em ${esc(new Date(x.apagadaEm).toLocaleString('pt-BR'))}">${x.from_me ? 'Você apagou' : 'Apagada pelo contato'}</span>` : ''}
        ${x.from_bot ? '<span class="porIA">IA</span>' : ''}
        ${x.from_me ? avaliacao(convId, x) : ''}
      </div>
    </div>`).join('') : '<div class="vazio-centro">Sem mensagens nesta conversa</div>');
  ancorarNoFim(m);
}

/* ---------- qualificação pelo roteiro ----------
 *
 * A IA preenche o que consegue sustentar com trecho da conversa; o atendente
 * confirma ou corrige. A correção vence, e a próxima passada da IA só pergunta
 * o que ficou em branco.
 *
 * Cada resposta mostra o TRECHO que a sustenta. Sem isso, a nota seria um
 * número sem origem, e ninguém confia num número desses para decidir venda.
 */
let QUALIF = null;

async function carregarQualificacao(conversaId){
  const el = document.getElementById('blocoQualificacao');
  if (!el) return;
  const d = await fetch(`/api/conversas/${conversaId}/qualificacao`).then(r=>r.json()).catch(()=>null);
  // Servidor sem o roteiro: o bloco some, em vez de mostrar um formulário morto.
  if (!d?.success || !d.perguntas?.length) { el.style.display = 'none'; return; }
  el.style.display = '';
  QUALIF = d;
  const resp = d.visita?.respostas || {};
  const trechos = d.trechos || {};
  // O roteiro é da campanha que o contato recebeu, e segue em etapas: a atual
  // fica marcada, e a que um desvio pulou fica apagada (29/09).
  const idx = d.perguntas.findIndex(p => p.chave === d.etapaAtual);
  const situacao = d.resultado === 'qualificado' ? `Qualificado, ${d.pontos} ponto(s)`
    : d.resultado === 'desqualificado' ? 'Desqualificado'
    : d.visita ? `Na etapa ${idx + 1} de ${d.perguntas.length}, ${d.pontos} ponto(s)` : 'Ainda não começou';
  const noCaminho = new Set(d.caminho || []);
  el.innerHTML = `<h4>Qualificação</h4>
    <small class="muted">${esc(d.roteiro?.nome || '')}</small>
    <div class="linha"><span>situação</span><strong class="${d.resultado ? 'res-' + d.resultado : ''}">${esc(situacao)}</strong></div>
    ${d.perguntas.map(p => {
      const atual = p.chave === d.etapaAtual, fora = d.visita && !atual && !noCaminho.has(p.chave) && !resp[p.chave];
      return `
      <div style="margin:10px 0;${fora ? 'opacity:0.45;' : ''}">
        <div style="font-size:0.8em;color:var(--text-2);line-height:1.3;">${atual ? '<strong style="color:var(--accent);">Etapa atual.</strong> ' : ''}${esc(p.texto)}</div>
        <select onchange="corrigirQualificacao(${conversaId}, '${esc(p.chave)}', this.value)"
          style="width:100%;margin-top:4px;font-size:0.85em;">
          <option value="">— sem resposta —</option>
          ${p.opcoes.map(o => `<option value="${esc(o.id)}" ${resp[p.chave] === o.id ? 'selected' : ''}
            >${esc(o.rotulo)}</option>`).join('')}
        </select>
        ${trechos[p.chave] ? `<div style="font-size:0.75em;color:var(--text-3);margin-top:3px;">“${esc(trechos[p.chave])}”</div>` : ''}
      </div>`; }).join('')}
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px;"
      onclick="pedirQualificacao(${conversaId})">Ler a conversa com a IA</button>
    <div id="qualifAviso" style="margin-top:8px;"></div>`;
}

async function pedirQualificacao(conversaId){
  const aviso = document.getElementById('qualifAviso');
  aviso.innerHTML = '<small class="muted">Lendo a conversa…</small>';
  const d = await fetch(`/api/conversas/${conversaId}/qualificar`, { method:'POST' })
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) { aviso.innerHTML = `<small style="color:var(--danger);">${esc(d?.error || 'Falhou')}</small>`; return; }
  await carregarQualificacao(conversaId);
  const el = document.getElementById('qualifAviso');
  const aceitas = Object.entries(d.aceitas || {});
  // As recusas aparecem: é o que mostra quando o modelo tentou preencher o que
  // ninguém disse, e é o que faz a nota ser confiável.
  el.innerHTML = (aceitas.length
    ? aceitas.map(([, v]) => `<div style="font-size:0.78em;color:var(--text-2);margin-bottom:6px;">
        <strong>${esc(v.rotulo)}</strong><br>“${esc(v.trecho)}”</div>`).join('')
    : '<small class="muted">A IA não achou resposta sustentada na conversa.</small>')
    + ((d.recusadas || []).length
      ? `<small class="muted">${d.recusadas.length} resposta(s) recusada(s) por não estarem na conversa.</small>`
      : '');
}

async function corrigirQualificacao(conversaId, chave, valor){
  const d = await fetch(`/api/conversas/${conversaId}/qualificacao`, { method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ respostas: { [chave]: valor || null } }) })
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) return showAlert(d?.error || 'Não foi possível gravar', 'error');
  // A correção pode fechar o roteiro: a situação muda, e o qualificado ganha o
  // card no CRM.
  await carregarQualificacao(conversaId);
  if (d.oportunidadeId) { carregarOportunidade(conversaId); showAlert('Qualificado: a oportunidade foi criada no CRM'); }
}

// ---------- oportunidade no CRM ----------
// A conversa não tem funil próprio: o quadro é o de Comercial → CRM · Funil,
// que já existe e é onde a equipe acompanha venda. Aqui só se cria o card ou
// se amarra a conversa a um que já existe.
async function carregarOportunidade(conversaId){
  const el = document.getElementById('blocoOportunidade');
  if (!el) return;
  const d = await fetch(`/api/conversas/${conversaId}/oportunidade`).then(r=>r.json()).catch(()=>null);
  if (!d?.success) { el.innerHTML = '<h4>Oportunidade</h4><small class="muted">—</small>'; return; }
  const o = d.oportunidade;
  el.innerHTML = o
    ? `<h4>Oportunidade</h4>
       <div class="linha"><span>${esc(o.funilNome||'')}</span>
         <strong style="color:${esc(o.etapaCor||'var(--text-1)')};">${esc(o.etapaNome||'—')}</strong></div>
       <div class="linha"><span>${esc(String(o.titulo||'').slice(0,40))}</span>
         <strong>${o.valor ? brl(o.valor) : '—'}</strong></div>
       <div style="display:flex;gap:6px;margin-top:8px;">
         <a class="btn btn-ghost btn-sm" href="/comercial/crm-funil.html" style="flex:1;text-align:center;">ver no funil</a>
         <button class="btn btn-ghost btn-sm" onclick="desvincularOportunidade(${conversaId})">desvincular</button>
       </div>`
    : `<h4>Oportunidade</h4>
       <small class="muted">Esta conversa ainda não virou oportunidade no CRM.</small>
       <div style="display:flex;gap:6px;margin-top:8px;">
         <button class="btn btn-primary btn-sm" style="flex:1;" onclick="criarOportunidade(${conversaId})">Criar</button>
         <button class="btn btn-ghost btn-sm" onclick="vincularOportunidade(${conversaId})">Vincular</button>
       </div>`;
}

async function criarOportunidade(conversaId){
  const d = await fetch(`/api/conversas/${conversaId}/oportunidade`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: '{}' }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  showAlert('Oportunidade criada no CRM — acompanhe em Comercial → CRM · Funil');
  carregarOportunidade(conversaId);
}

async function vincularOportunidade(conversaId){
  const d = await fetch('/api/conversas/oportunidades/livres').then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  if (!d.oportunidades.length) return showAlert('Nenhuma oportunidade livre no CRM','warn');
  const lista = d.oportunidades.slice(0, 20)
    .map(o => `${o.id} — ${o.titulo}${o.clienteNome?' ('+o.clienteNome+')':''} [${o.etapaNome||''}]`).join('\n');
  const id = prompt('Número da oportunidade a vincular:\n\n' + lista);
  if (!id) return;
  const r = await fetch(`/api/conversas/${conversaId}/oportunidade`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ oportunidadeId: Number(id) }) }).then(x=>x.json());
  if (!r.success) return showAlert(r.error,'error');
  showAlert('Conversa vinculada à oportunidade #' + id);
  carregarOportunidade(conversaId);
}

async function desvincularOportunidade(conversaId){
  if (!confirm('Desvincular a conversa desta oportunidade?\n\nA oportunidade continua no CRM.')) return;
  const d = await fetch(`/api/conversas/${conversaId}/oportunidade`, { method:'DELETE' }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  carregarOportunidade(conversaId);
}

/**
 * Manda o link de agendamento pela própria conversa.
 *
 * A mensagem sai como resposta normal, e não por fora: o link precisa ficar no
 * histórico, senão ninguém sabe depois que ele foi enviado nem quando.
 *
 * O botão só aparece com o agendamento ligado. Conversa sem dono é recusada
 * pelo servidor, e o motivo é mostrado como está: a reunião entra na agenda de
 * quem atende, e ninguém assumiu esta.
 */
async function enviarConviteAgenda(){
  if (!ATUAL) return;
  const d = await fetch(`/api/conversas/${ATUAL}/convite-agenda`, { method:'POST' })
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) return showAlert(d?.error || 'Não foi possível gerar o link', 'error');
  const link = location.origin + d.url;
  const texto = `Podemos marcar uma conversa? Escolha o melhor horário por aqui: ${link}`;
  const r = await fetch(`/api/conversas/${ATUAL}/responder`, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ texto })
  }).then(x=>x.json()).catch(()=>null);

/* ---------- aviso de mensagem nova ----------
 *
 * A inbox já buscava a lista de 30 em 30 segundos e não dizia nada quando algo
 * chegava: quem não estivesse olhando a tela no instante certo só descobria
 * rolando. O aviso pega carona nesse mesmo ciclo — nenhuma requisição a mais.
 *
 * O SOM nasce ligado e o POP-UP nasce desligado, e a diferença é de consentimento:
 * som é local, some com um clique e não sai da máquina; notificação precisa de
 * permissão do navegador, que só se pede quando a pessoa clica, nunca sozinho.
 *
 * O beep é sintetizado em vez de vir de arquivo: um .mp3 no repositório seria
 * um binário a versionar e a servir, para meio segundo de onda senoidal.
 */
const AVISO = {
  som: localStorage.getItem('convAvisoSom') !== '0',
  popup: localStorage.getItem('convAvisoPopup') === '1',
};
// O id da última mensagem recebida que a tela já viu. null na primeira carga,
// que NUNCA avisa: abrir a tela com 153 não lidas dispararia um alarme sobre
// mensagem que já estava lá.
let ULTIMO_RECEBIDO = null;

function renderAvisos(){
  const el = document.getElementById('avisos');
  if (!el) return;
  // Ícone com `data-dica`, e não `title`: o balão nativo do navegador aparece
  // branco, atrasado e por cima do nosso — proibido nesta base desde a Fase
  // 3.2.1. O estado continua legível sem passar o mouse, pela cor da borda.
  el.innerHTML = `
    <button class="${AVISO.som?'on':''}" onclick="alternarAviso('som')"
      data-dica="Toca um bipe quando chega mensagem nova">🔔 Som ${AVISO.som?'ligado':'desligado'}</button>
    <button class="${AVISO.popup?'on':''}" onclick="alternarAviso('popup')"
      data-dica="Mostra um aviso do computador quando chega mensagem, mesmo com outra aba aberta">🖥️ Notificação ${AVISO.popup?'ligada':'desligada'}</button>`;
}

async function alternarAviso(qual){
  if (qual === 'popup' && !AVISO.popup) {
    // A permissão é pedida AQUI, no clique, e não no carregamento da tela: pedido
    // automático é o que faz o navegador (e a pessoa) negar por reflexo.
    if (!('Notification' in window)) return showAlert('Este navegador não faz notificação','warn');
    if (Notification.permission !== 'granted') {
      const p = await Notification.requestPermission();
      if (p !== 'granted') return showAlert('O navegador não autorizou a notificação','warn');
    }
  }
  AVISO[qual] = !AVISO[qual];
  localStorage.setItem(qual === 'som' ? 'convAvisoSom' : 'convAvisoPopup', AVISO[qual] ? '1' : '0');
  renderAvisos();
  // Ligar o som é um clique: é a hora de o navegador liberar o áudio, e o
  // bipe de confirmação mostra que funciona.
  if (qual === 'som' && AVISO.som) beep();
}

function beep(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    // Sem um clique dentro desta tela o navegador cria o áudio suspenso, e o
    // bipe sairia mudo. resume() libera quando já houve clique.
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const osc = ctx.createOscillator(), vol = ctx.createGain();
    osc.frequency.value = 880; vol.gain.value = 0.05;
    osc.connect(vol); vol.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.12);
    setTimeout(() => ctx.close(), 400);
  } catch (e) { /* aba sem gesto do usuário ainda: o pop-up continua valendo */ }
}

/**
 * Chamado a cada volta do ciclo com `recebidas` do servidor: o id da última
 * mensagem recebida e quantas chegaram depois da que a tela já tinha visto.
 * Até 29/09 comparava o número de conversas não lidas, e não avisava a
 * mensagem nova numa conversa que já estava não lida, nem a que chegava
 * enquanto outra era lida.
 */
function avisarSeChegou(recebidas){
  if (!recebidas) return;                         // servidor antigo, sem o campo
  const primeira = ULTIMO_RECEBIDO === null;
  ULTIMO_RECEBIDO = recebidas.ultimoId || 0;
  if (primeira || !recebidas.novas) return;
  const novas = recebidas.novas;
  if (AVISO.som) beep();
  if (AVISO.popup && 'Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification(novas === 1 ? 'Mensagem nova' : `${novas} mensagens novas`,
        { body: 'Atendimento · Conversas', tag: 'conversas-novas' });
    } catch (e) { /* alguns navegadores só deixam via service worker */ }
  }
}

 */

/**
 * Mantém a conversa no fim enquanto a altura ainda muda.
 *
 * Um `scrollTop = scrollHeight` logo depois do innerHTML não basta: a imagem tem
 * `loading="lazy"` e o vídeo carrega metadados depois, então o conteúdo cresce em
 * seguida e a conversa "sobe" — era por isso que ela abria no meio do histórico,
 * com o fim fora da vista. O observador acompanha a mudança de altura e desliga
 * assim que a pessoa rola para trás, para não arrastá-la de volta ao pé enquanto
 * ela lê o histórico.
 */
function ancorarNoFim(m){
  m.scrollTop = m.scrollHeight;
  if (m.__obs) m.__obs.disconnect();
  let ancorado = true;
  const perto = () => m.scrollHeight - m.scrollTop - m.clientHeight < 80;
  const aoRolar = () => { ancorado = perto(); };
  m.removeEventListener('scroll', m.__aoRolar || (()=>{}));
  m.__aoRolar = aoRolar;
  m.addEventListener('scroll', aoRolar);
  const obs = new ResizeObserver(() => { if (ancorado) m.scrollTop = m.scrollHeight; });
  for (const el of m.children) obs.observe(el);
  m.__obs = obs;
  // Rede de segurança para mídia que só muda de tamanho ao carregar de fato.
  for (const el of m.querySelectorAll('img, video')) {
    el.addEventListener('load', () => { if (ancorado) m.scrollTop = m.scrollHeight; }, { once: true });
    el.addEventListener('loadedmetadata', () => { if (ancorado) m.scrollTop = m.scrollHeight; }, { once: true });
  }
}

/**
 * O pedaço anterior do histórico. A posição de leitura é preservada: crescer a
 * lista por cima sem isso jogaria a pessoa para outro ponto da conversa.
 */
async function carregarAnteriores(id){
  const m = document.getElementById('msgs');
  const btn = document.getElementById('btnMaisAntigas');
  const primeira = (window.__msgs || [])[0];
  if (!primeira) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Carregando…'; }
  const d = await fetch(`/api/conversas/${id}/mensagens?antesDe=${primeira.id}`)
    .then(r=>r.json()).catch(()=>null);
  if (!d?.success) { if (btn) { btn.disabled = false; btn.textContent = 'Carregar mensagens anteriores'; } return showAlert(d?.error || 'Não foi possível carregar','error'); }
  const alturaAntes = m.scrollHeight, posAntes = m.scrollTop;
  window.__msgs = [...d.mensagens, ...(window.__msgs || [])];
  pintarMensagens(id, window.__msgs, d.temMais);
  m.scrollTop = posAntes + (m.scrollHeight - alturaAntes);
}

// Anula a pausa de 4 horas que começa quando alguém responde à mão. A próxima

// ---------- avaliar a resposta ----------
// O controle aparece em toda mensagem enviada, não só nas marcadas como IA: o
// histórico importado da Evolution veio sem essa distinção (ela não existe lá),
// e uma boa resposta escrita à mão é o melhor material que a base pode receber.
function avaliacao(conversaId, x){
  if (x.veredito === 'certo') return '<span class="veredito ok">✓ certo</span>';
  if (x.veredito === 'errado') return '<span class="veredito erro">corrigida</span>';
  return `<button class="aprovar" onclick="aprovarResposta(${conversaId}, ${x.id}, this)" title="Marcar esta resposta como certa">✓ certo</button>
    <button class="corrigir" onclick="abrirCorrigir(${conversaId}, ${x.id})">corrigir</button>`;
}

async function aprovarResposta(conversaId, msgId, btn){
  const msgs = window.__msgs || [];
  const i = msgs.findIndex(m => m.id === msgId);
  let pergunta = '';
  for (let k = i - 1; k >= 0; k--) if (!msgs[k].from_me) { pergunta = msgs[k].texto || ''; break; }
  btn.disabled = true;
  const d = await fetch('/api/ia/aprovar', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ conversaId, mensagemId: msgId, perguntou: pergunta, respondeu: msgs[i]?.texto || '' })
  }).then(r=>r.json());
  if (!d.success) { btn.disabled = false; return showAlert(d.error,'error'); }
  if (msgs[i]) msgs[i].veredito = 'certo';
  btn.parentNode.querySelector('.corrigir')?.remove();
  btn.outerHTML = '<span class="veredito ok">✓ certo</span>';
}

// ---------- corrigir a IA ----------
function abrirCorrigir(conversaId, msgId){
  const msgs = window.__msgs || [];
  const i = msgs.findIndex(m => m.id === msgId);
  const errada = msgs[i]?.texto || '';
  // a pergunta é a última mensagem do cliente antes da resposta da IA
  let pergunta = '';
  for (let k = i - 1; k >= 0; k--) if (!msgs[k].from_me) { pergunta = msgs[k].texto || ''; break; }
  document.getElementById('cErrada').value = errada;
  document.getElementById('cCerta').value = '';
  document.getElementById('cTitulo').value = pergunta.slice(0, 80);
  document.getElementById('modalCorrigir').dataset.conversa = conversaId;
  document.getElementById('modalCorrigir').dataset.mensagem = msgId;
  document.getElementById('modalCorrigir').dataset.pergunta = pergunta;
  document.getElementById('modalCorrigir').classList.add('open');
}

async function salvarCorrecao(){
  const el = document.getElementById('modalCorrigir');
  const correta = document.getElementById('cCerta').value.trim();
  if (!correta) return showAlert('Escreva a resposta correta','error');
  const d = await fetch('/api/ia/corrigir', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      conversaId: Number(el.dataset.conversa), mensagemId: Number(el.dataset.mensagem),
      perguntou: el.dataset.pergunta,
      respondeu: document.getElementById('cErrada').value, correta,
      titulo: document.getElementById('cTitulo').value,
    }) }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  fechar('modalCorrigir');
  // Repinta a conversa para a mensagem já aparecer marcada como corrigida.
  if (ATUAL) abrir(ATUAL);
  showAlert('Correção salva na base — vale a partir da próxima conversa');
}


document.addEventListener('keydown', e => { if (e.key==='Escape') fechar('modalCorrigir'); });
