<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban - Licite Agora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/app-modern.css">
    <style>
        .main-content { overflow-x: auto; }

        .kanban-board {
            display: flex;
            gap: 20px;
            min-height: calc(100vh - 180px);
        }
        .kanban-column {
            flex: 1;
            min-width: 300px;
            background: var(--bg-2);
            border-radius: var(--r-lg);
            display: flex;
            flex-direction: column;
        }
        .column-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .column-title {
            font-weight: 600;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .column-count {
            background: var(--bg-1);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
        }
        .column-header.analise { border-left: 4px solid var(--warn); }
        .column-header.proposta { border-left: 4px solid var(--accent); }
        .column-header.enviada { border-left: 4px solid var(--success); }
        .column-header.vencida { border-left: 4px solid #868e96; }

        .column-cards {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            min-height: 200px;
        }
        .column-cards.drag-over { background: rgba(77, 171, 247, 0.1); }

        .kanban-card {
            background: var(--bg-0);
            border-radius: var(--r-md);
            padding: 15px;
            margin-bottom: 12px;
            cursor: grab;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .kanban-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .kanban-card.dragging { opacity: 0.5; cursor: grabbing; }
        .card-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-0);
            font-size: 0.95em;
            line-height: 1.4;
        }
        .card-info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.8em;
            color: var(--text-3);
            margin-bottom: 10px;
        }
        .card-info span { display: flex; align-items: center; gap: 4px; }
        .card-date { color: var(--accent); }
        .card-date.urgente { color: var(--danger); font-weight: 600; }
        .card-date.hoje { color: var(--warn); font-weight: 600; }
        .card-actions { display: flex; gap: 8px; margin-top: 10px; }
        .card-btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: var(--r-sm);
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }
        .card-btn.abrir { background: var(--warn); color: #000; }
        .card-btn.abrir:hover { background: #ffa726; }
        .card-btn.proposta { background: var(--bg-1); color: var(--accent); }
        .card-btn.proposta:hover { background: var(--accent); color: #000; }
        .card-btn.remover { background: #495057; color: var(--text-0); }
        .card-btn.remover:hover { background: var(--danger); }

        .card-obs {
            margin-top: 10px;
            padding: 10px;
            background: var(--bg-1);
            border-radius: var(--r-sm);
            font-size: 0.85em;
            color: var(--text-2);
        }
        .card-obs-input {
            width: 100%;
            background: var(--bg-1);
            border: 1px solid var(--accent);
            color: var(--text-0);
            padding: 8px;
            border-radius: var(--r-sm);
            font-size: 0.85em;
            resize: none;
        }

        .empty-column { text-align: center; color: var(--text-3); padding: 40px 20px; }
        .loading { text-align: center; padding: 60px; color: var(--text-3); }

        .add-from-interesse { padding: 15px; border-top: 1px solid var(--border); }
        .add-from-interesse button {
            width: 100%;
            padding: 12px;
            background: var(--bg-1);
            color: var(--accent);
            border: 1px dashed var(--accent);
            border-radius: var(--r-md);
            cursor: pointer;
            font-size: 0.9em;
        }
        .add-from-interesse button:hover {
            background: var(--accent);
            color: #000;
            border-style: solid;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--bg-2);
            border-radius: var(--r-lg);
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 { color: var(--accent); margin-bottom: 20px; }
        .interesse-list { max-height: 400px; overflow-y: auto; }
        .interesse-item {
            padding: 15px;
            background: var(--bg-0);
            border-radius: var(--r-md);
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
        }
        .interesse-item:hover { border-color: var(--accent); }
        .interesse-item.added { opacity: 0.5; pointer-events: none; }
        .interesse-item h4 { color: var(--text-0); margin-bottom: 5px; font-size: 0.95em; }
        .interesse-item p { color: var(--text-3); font-size: 0.85em; }
        .modal-close {
            margin-top: 20px;
            padding: 12px 24px;
            background: #495057;
            color: var(--text-0);
            border: none;
            border-radius: var(--r-md);
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="layout">
        

        <main class="main-content">
            <h1>Kanban de Licitações</h1>
            <p class="subtitle">Arraste os cards para gerenciar o status das suas licitações de interesse</p>

            <div class="kanban-board" id="kanbanBoard">
                <div class="kanban-column" data-status="analise">
                    <div class="column-header analise">
                        <span class="column-title">Em Análise</span>
                        <span class="column-count" id="count-analise">0</span>
                    </div>
                    <div class="column-cards" id="cards-analise"
                         ondragover="allowDrop(event)" ondrop="drop(event, 'analise')">
                    </div>
                    <div class="add-from-interesse">
                        <button onclick="abrirModalInteresses()">+ Adicionar do Interesse</button>
                    </div>
                </div>

                <div class="kanban-column" data-status="proposta">
                    <div class="column-header proposta">
                        <span class="column-title">Preparando Proposta</span>
                        <span class="column-count" id="count-proposta">0</span>
                    </div>
                    <div class="column-cards" id="cards-proposta"
                         ondragover="allowDrop(event)" ondrop="drop(event, 'proposta')">
                    </div>
                </div>

                <div class="kanban-column" data-status="enviada">
                    <div class="column-header enviada">
                        <span class="column-title">Proposta Enviada</span>
                        <span class="column-count" id="count-enviada">0</span>
                    </div>
                    <div class="column-cards" id="cards-enviada"
                         ondragover="allowDrop(event)" ondrop="drop(event, 'enviada')">
                    </div>
                </div>

                <div class="kanban-column" data-status="vencida">
                    <div class="column-header vencida">
                        <span class="column-title">Encerradas</span>
                        <span class="column-count" id="count-vencida">0</span>
                    </div>
                    <div class="column-cards" id="cards-vencida"
                         ondragover="allowDrop(event)" ondrop="drop(event, 'vencida')">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal" id="interesseModal">
        <div class="modal-content">
            <h3>Adicionar Licitação ao Kanban</h3>
            <div class="interesse-list" id="interesseList">
                <!-- Lista de interesses -->
            </div>
            <button class="modal-close" onclick="fecharModal()">Fechar</button>
        </div>
    </div>

    <script src="kanban.js"></script>
    <script src="/js/menu-config.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>initSidebar('kanban');</script>
</body>
</html>
