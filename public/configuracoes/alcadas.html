<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alçadas e Aprovações · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Alçadas e Aprovações</h1>
      <small>Acima do limite, o evento fica bloqueado até um aprovador decidir; solicitante não aprova a própria solicitação</small>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <h2 style="margin:14px 0 8px;">Fila de aprovações</h2>
  <div class="toolbar">
    <select id="filtStatus" onchange="carregarFila()">
      <option value="pendente" selected>Pendentes</option>
      <option value="">Todas</option>
      <option value="aprovada">Aprovadas</option>
      <option value="reprovada">Reprovadas</option>
    </select>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>#</th><th>Evento</th><th>Referência</th><th style="text-align:right;">Valor</th>
        <th>Solicitante</th><th>Status</th><th>Decisão</th><th></th></tr></thead>
      <tbody id="tbFila"><tr><td colspan="8" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>

  <h2 style="margin:24px 0 8px;">Regras de alçada</h2>
  <div class="toolbar">
    <select id="rTipo">
      <option value="pagamento_cp">Pagamento de conta a pagar</option>
      <option value="pedido_compra">Envio de pedido de compra</option>
    </select>
    <input type="number" id="rLimite" placeholder="Limite (R$)" step="0.01" style="width:140px;">
    <input type="text" id="rPapel" placeholder="Papel aprovador (admin)" style="width:170px;">
    <button class="btn btn-primary btn-sm" onclick="addRegra()">+ Regra</button>
  </div>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>Evento</th><th style="text-align:right;">Acima de (R$)</th><th>Aprovador</th><th>Status</th><th></th></tr></thead>
      <tbody id="tbRegras"><tr><td colspan="5" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<div id="toasts"></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('config-alcadas');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
function fmt(v){ return (v==null||isNaN(v))?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
const EVENTO_TXT = { pagamento_cp: '📤 Pagamento CP', pedido_compra: '🛒 Pedido de compra' };
const ST_BADGE = { pendente:'<span class="badge saida">PENDENTE</span>', aprovada:'<span class="badge entrada">APROVADA</span>', reprovada:'<span class="badge cancelado">REPROVADA</span>' };

async function carregarFila(){
  const st = document.getElementById('filtStatus').value;
  const r = await fetch('/api/alcadas/aprovacoes' + (st?'?status='+st:'')); const d = await r.json();
  if(!d.success) return showAlert(d.error,'error');
  document.getElementById('tbFila').innerHTML = d.aprovacoes.length ? d.aprovacoes.map(a=>`<tr>
    <td>${a.id}</td>
    <td>${EVENTO_TXT[a.tipoEvento]||a.tipoEvento}</td>
    <td>#${a.referenciaId} ${a.referenciaDescricao||''}</td>
    <td style="text-align:right;"><strong>R$ ${fmt(a.valorReferencia)}</strong></td>
    <td>${a.solicitante||'-'}</td>
    <td>${ST_BADGE[a.status]||a.status}${a.consumida?' <small class="muted">(usada)</small>':''}</td>
    <td>${a.aprovador?`${a.aprovador} em ${a.dataDecisao||''}${a.motivo?'<br><small class="muted">'+a.motivo+'</small>':''}`:'-'}</td>
    <td style="white-space:nowrap;">
      ${a.status==='pendente' ? `<button class="btn btn-primary btn-sm" onclick="decidir(${a.id},'aprovar')">Aprovar</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="decidir(${a.id},'reprovar')">Reprovar</button>` : ''}
    </td>
  </tr>`).join('') : '<tr><td colspan="8" class="empty">Fila vazia</td></tr>';
}

async function decidir(id, acao){
  let motivo = null;
  if (acao === 'reprovar') { motivo = prompt('Motivo da reprovação:'); if (!motivo) return; }
  const r = await fetch(`/api/alcadas/aprovacoes/${id}/${acao}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ motivo }) });
  const d = await r.json();
  if(!d.success) return showAlert(d.error,'error');
  showAlert(acao==='aprovar'?'Aprovado — a operação pode ser repetida agora':'Reprovado'); carregarFila();
}

async function carregarRegras(){
  const r = await fetch('/api/alcadas/regras'); const d = await r.json();
  if(!d.success) return showAlert(d.error,'error');
  document.getElementById('tbRegras').innerHTML = d.regras.length ? d.regras.map(x=>`<tr${x.ativo?'':' style="opacity:0.55;"'}>
    <td>${EVENTO_TXT[x.tipoEvento]||x.tipoEvento}</td>
    <td style="text-align:right;">R$ ${fmt(x.limiteValor)}</td>
    <td>${x.papelAprovador}</td>
    <td>${x.ativo?'ativa':'inativa'}</td>
    <td><button class="btn btn-ghost btn-sm" onclick="toggleRegra(${x.id}, ${x.ativo?0:1})">${x.ativo?'Desativar':'Reativar'}</button></td>
  </tr>`).join('') : '<tr><td colspan="5" class="empty">Sem regras — tudo liberado</td></tr>';
}

async function addRegra(){
  const body = {
    tipoEvento: document.getElementById('rTipo').value,
    limiteValor: Number(document.getElementById('rLimite').value),
    papelAprovador: document.getElementById('rPapel').value.trim() || 'admin'
  };
  if (!(body.limiteValor >= 0)) return showAlert('Informe o limite','error');
  const r = await fetch('/api/alcadas/regras', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if(!d.success) return showAlert(d.error,'error');
  document.getElementById('rLimite').value=''; showAlert('Regra criada'); carregarRegras();
}

async function toggleRegra(id, ativo){
  const r = await fetch('/api/alcadas/regras/'+id, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ativo }) });
  const d = await r.json();
  if(!d.success) return showAlert(d.error,'error');
  carregarRegras();
}

carregarFila(); carregarRegras();
</script>
</body></html>
