<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Perfil · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Meu Perfil</h1>
      <small>Editar dados pessoais e trocar senha</small>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="card" style="max-width:560px;">
    <h3>Dados</h3>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Username</label>
        <input type="text" id="fUsername" disabled>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Perfil</label>
        <input type="text" id="fRole" disabled>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Nome de exibição</label>
        <input type="text" id="fNome">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>E-mail</label>
        <input type="email" id="fEmail">
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
      <button class="btn btn-primary" onclick="salvarDados()">Salvar dados</button>
    </div>
  </div>

  <div class="card" style="max-width:560px;margin-top:16px;">
    <h3>Alterar senha</h3>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Senha atual</label>
        <input type="password" id="fSenhaAtual" autocomplete="current-password">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Nova senha <small class="muted">(mínimo 6 caracteres)</small></label>
        <input type="password" id="fSenhaNova" autocomplete="new-password">
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
      <button class="btn btn-secondary" onclick="trocarSenha()">🔑 Trocar senha</button>
    </div>
  </div>
</main></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('meu-perfil');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }

async function carregar(){
  const r=await fetch('/api/usuarios/me');
  const d=await r.json();
  if(!d.success) return showAlert(d.error,'error');
  const u=d.usuario;
  document.getElementById('fUsername').value=u.username;
  document.getElementById('fRole').value=u.role;
  document.getElementById('fNome').value=u.nome||'';
  document.getElementById('fEmail').value=u.email||'';
}

async function salvarDados(){
  const body={
    nome:  document.getElementById('fNome').value.trim()||null,
    email: document.getElementById('fEmail').value.trim()||null
  };
  const r=await fetch('/api/usuarios/me', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d=await r.json();
  if(!d.success) return showAlert(d.error,'error');
  showAlert('Dados salvos');
}

async function trocarSenha(){
  const senhaAtual=document.getElementById('fSenhaAtual').value;
  const senhaNova =document.getElementById('fSenhaNova').value;
  if(!senhaAtual||!senhaNova) return showAlert('Preencha ambos os campos','error');
  const r=await fetch('/api/usuarios/me/senha', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({senhaAtual,senhaNova}) });
  const d=await r.json();
  if(!d.success) return showAlert(d.error,'error');
  showAlert('Senha alterada com sucesso');
  document.getElementById('fSenhaAtual').value='';
  document.getElementById('fSenhaNova').value='';
}

carregar();
</script>
</body></html>
