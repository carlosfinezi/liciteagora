<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Licite Agora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .layout { display: flex; min-height: 100vh; }
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        h1 { color: #4dabf7; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 20px; }

        .tabs { display: flex; gap: 0; margin-bottom: 25px; border-bottom: 2px solid #0f3460; }
        .tab { padding: 12px 24px; cursor: pointer; color: #888; font-weight: 600; border-bottom: 3px solid transparent; transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none; font-size: 1em; }
        .tab:hover { color: #4dabf7; }
        .tab.active { color: #4dabf7; border-bottom-color: #4dabf7; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .panel { background: #16213e; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .panel h3 { color: #4dabf7; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 10px; }

        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { color: #888; font-size: 0.9em; }
        .form-group input, .form-group select, .form-group textarea { background: #1a1a2e; border: 1px solid #0f3460; border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 1em; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #4dabf7; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group.full-width { grid-column: 1 / -1; }

        .btn-primary { background: #4dabf7; color: #000; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1em; display: inline-flex; align-items: center; gap: 8px; transition: background 0.3s; }
        .btn-primary:hover { background: #74c0fc; }
        .btn-primary:disabled { background: #555; cursor: not-allowed; }
        .btn-secondary { background: #0f3460; color: #4dabf7; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9em; }
        .btn-secondary:hover { background: #1a3a6e; }
        .btn-danger { background: #ff6b6b; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85em; }
        .btn-danger:hover { background: #ff8787; }
        .btn-sm { padding: 6px 12px; font-size: 0.8em; border-radius: 6px; }
        .actions-bar { display: flex; gap: 15px; justify-content: flex-end; margin-top: 20px; padding-top: 20px; border-top: 1px solid #0f3460; }

        .filtros { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
        .filtros input, .filtros select { background: #1a1a2e; border: 1px solid #0f3460; border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 0.9em; }
        .filtros input:focus, .filtros select:focus { outline: none; border-color: #4dabf7; }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #0f3460; color: #4dabf7; padding: 12px 15px; text-align: left; font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 12px 15px; border-bottom: 1px solid #0f3460; font-size: 0.9em; }
        tr:hover td { background: #1a2a4e; }

        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 0.75em; font-weight: 700; text-transform: uppercase; }
        .badge.pf { background: #1971c233; color: #4dabf7; }
        .badge.pj { background: #2b8a3e33; color: #51cf66; }

        .alert { padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; display: none; font-weight: 500; }
        .alert.success { background: #2b8a3e33; color: #51cf66; border: 1px solid #2b8a3e; display: block; }
        .alert.error { background: #c9202033; color: #ff6b6b; border: 1px solid #c92020; display: block; }

        .empty-state { text-align: center; padding: 60px 20px; color: #555; }
        .empty-state .icon { font-size: 3em; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="layout">
        <main class="main-content">
            <h1>Clientes</h1>
            <p class="subtitle">Cadastro de pessoas (clientes/tomadores)</p>

            <div id="alertGlobal"></div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('lista')">Lista</button>
                <button class="tab" onclick="switchTab('form')">Novo Cliente</button>
            </div>

            <!-- ABA LISTA -->
            <div id="tab-lista" class="tab-content active">
                <div class="filtros">
                    <input type="text" id="filtBusca" placeholder="Buscar por CPF/CNPJ ou nome..." style="flex:1; min-width: 250px;" oninput="carregarPessoas()">
                    <select id="filtAtivo" onchange="carregarPessoas()">
                        <option value="1">Ativos</option>
                        <option value="0">Inativos</option>
                        <option value="">Todos</option>
                    </select>
                    <button class="btn-primary btn-sm" onclick="switchTab('form'); limparForm();">+ Novo</button>
                </div>

                <div class="panel">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Tipo</th>
                                    <th>CPF/CNPJ</th>
                                    <th>Razão Social</th>
                                    <th>Cidade/UF</th>
                                    <th>Telefone</th>
                                    <th>Email</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaPessoas">
                            </tbody>
                        </table>
                    </div>
                    <div id="emptyState" class="empty-state" style="display:none;">
                        <div class="icon">👥</div>
                        <p>Nenhum cliente cadastrado</p>
                    </div>
                </div>
            </div>

            <!-- ABA FORM -->
            <div id="tab-form" class="tab-content">
                <div class="panel">
                    <h3 id="formTitle">Novo Cliente</h3>

                    <input type="hidden" id="pessoaId">

                    <div class="form-row">
                        <div class="form-group">
                            <label>CPF/CNPJ *</label>
                            <div style="display:flex;gap:8px;">
                                <input type="text" id="cpfCnpj" placeholder="00.000.000/0000-00" oninput="autoDetectTipo()" style="flex:1;">
                                <button class="btn-secondary btn-sm" id="btnConsultaCnpj" onclick="consultarCnpj()" title="Consultar dados publicos" style="white-space:nowrap;">Consultar</button>
                            </div>
                            <small id="cnpjStatus" style="color:#888;"></small>
                        </div>
                        <div class="form-group">
                            <label>Tipo</label>
                            <select id="tipo">
                                <option value="PJ">Pessoa Jurídica</option>
                                <option value="PF">Pessoa Física</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group" style="grid-column: 1 / -1;">
                            <label>Razão Social / Nome *</label>
                            <input type="text" id="razaoSocial" placeholder="Razão social ou nome completo">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Nome Fantasia</label>
                            <input type="text" id="nomeFantasia">
                        </div>
                        <div class="form-group">
                            <label>Inscrição Municipal</label>
                            <input type="text" id="inscricaoMunicipal">
                        </div>
                    </div>

                    <h3 style="margin-top: 10px;">Endereço</h3>

                    <div class="form-row">
                        <div class="form-group" style="flex: 3;">
                            <label>Logradouro</label>
                            <input type="text" id="endereco" placeholder="Rua, Av, etc.">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Número</label>
                            <input type="text" id="numero">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Complemento</label>
                            <input type="text" id="complemento">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Bairro</label>
                            <input type="text" id="bairro">
                        </div>
                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" id="cidade">
                        </div>
                        <div class="form-group">
                            <label>UF</label>
                            <input type="text" id="uf" maxlength="2" style="text-transform: uppercase;">
                        </div>
                        <div class="form-group">
                            <label>CEP</label>
                            <input type="text" id="cep" placeholder="00000-000">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Código Município (IBGE)</label>
                            <input type="text" id="codigoMunicipio" maxlength="7">
                        </div>
                    </div>

                    <h3 style="margin-top: 10px;">Contato</h3>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Telefone</label>
                            <input type="text" id="telefone" placeholder="(00) 00000-0000">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="email">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group full-width">
                            <label>Observações</label>
                            <textarea id="observacoes" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="actions-bar">
                        <button class="btn-secondary" onclick="switchTab('lista')">Cancelar</button>
                        <button class="btn-primary" onclick="salvarPessoa()">Salvar</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="/js/menu-config.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>initSidebar('pessoas');</script>

    <script>
    // ==================== STATE ====================
    let pessoasCache = [];

    // ==================== TABS ====================
    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        const tabs = document.querySelectorAll('.tab');
        if (tab === 'lista') { tabs[0].classList.add('active'); carregarPessoas(); }
        else { tabs[1].classList.add('active'); }
    }

    // ==================== ALERT ====================
    function showAlert(msg, type = 'success') {
        const el = document.getElementById('alertGlobal');
        el.className = 'alert ' + type;
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    // ==================== CRUD ====================
    async function carregarPessoas() {
        try {
            const q = document.getElementById('filtBusca').value;
            const ativo = document.getElementById('filtAtivo').value;
            const params = new URLSearchParams();
            if (q) params.set('q', q);
            if (ativo !== '') params.set('ativo', ativo);

            const resp = await fetch('/api/pessoas?' + params.toString());
            const data = await resp.json();
            if (!data.success) throw new Error(data.error);

            pessoasCache = data.pessoas;
            renderTabela();
        } catch (err) {
            showAlert('Erro ao carregar: ' + err.message, 'error');
        }
    }

    function renderTabela() {
        const tbody = document.getElementById('tabelaPessoas');
        const empty = document.getElementById('emptyState');

        if (!pessoasCache.length) {
            tbody.innerHTML = '';
            empty.style.display = 'block';
            return;
        }
        empty.style.display = 'none';

        tbody.innerHTML = pessoasCache.map(p => `
            <tr>
                <td><span class="badge ${p.tipo.toLowerCase()}">${p.tipo}</span></td>
                <td>${formatDoc(p.cpfCnpj)}</td>
                <td>${p.razaoSocial}</td>
                <td>${p.cidade ? p.cidade + '/' + (p.uf || '') : '-'}</td>
                <td>${p.telefone || '-'}</td>
                <td>${p.email || '-'}</td>
                <td>
                    <button class="btn-secondary btn-sm" onclick="editarPessoa(${p.id})">Editar</button>
                    ${p.ativo ? `<button class="btn-danger btn-sm" onclick="excluirPessoa(${p.id}, '${p.razaoSocial.replace(/'/g, "\\'")}')">Excluir</button>` : ''}
                </td>
            </tr>
        `).join('');
    }

    function formatDoc(doc) {
        if (!doc) return '';
        const d = doc.replace(/\D/g, '');
        if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
        if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
        return doc;
    }

    let cnpjConsultado = '';

    function autoDetectTipo() {
        const v = (document.getElementById('cpfCnpj').value || '').replace(/\D/g, '');
        document.getElementById('tipo').value = v.length <= 11 ? 'PF' : 'PJ';

        // Auto-consultar quando CNPJ completo (14 digitos) e diferente do ultimo consultado
        if (v.length === 14 && v !== cnpjConsultado && !document.getElementById('pessoaId').value) {
            consultarCnpj();
        }
    }

    async function consultarCnpj() {
        const raw = (document.getElementById('cpfCnpj').value || '').replace(/\D/g, '');
        if (raw.length !== 14) {
            showAlert('Informe um CNPJ valido (14 digitos)', 'error');
            return;
        }

        const btn = document.getElementById('btnConsultaCnpj');
        const status = document.getElementById('cnpjStatus');
        btn.disabled = true;
        status.textContent = 'Consultando...';
        status.style.color = '#4dabf7';

        try {
            const resp = await fetch('https://brasilapi.com.br/api/cnpj/v1/' + raw);
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                throw new Error(err.message || 'CNPJ nao encontrado');
            }
            const d = await resp.json();

            cnpjConsultado = raw;

            // Preencher campos
            if (d.razao_social) document.getElementById('razaoSocial').value = d.razao_social;
            if (d.nome_fantasia) document.getElementById('nomeFantasia').value = d.nome_fantasia;
            if (d.logradouro) document.getElementById('endereco').value = d.descricao_tipo_de_logradouro ? d.descricao_tipo_de_logradouro + ' ' + d.logradouro : d.logradouro;
            if (d.numero) document.getElementById('numero').value = d.numero;
            if (d.complemento) document.getElementById('complemento').value = d.complemento;
            if (d.bairro) document.getElementById('bairro').value = d.bairro;
            if (d.municipio) document.getElementById('cidade').value = d.municipio;
            if (d.uf) document.getElementById('uf').value = d.uf;
            if (d.cep) document.getElementById('cep').value = d.cep;
            if (d.codigo_municipio_ibge) document.getElementById('codigoMunicipio').value = d.codigo_municipio_ibge;
            if (d.ddd_telefone_1) document.getElementById('telefone').value = d.ddd_telefone_1;
            if (d.email) document.getElementById('email').value = d.email.toLowerCase();

            const situacao = d.descricao_situacao_cadastral || '';
            status.textContent = 'Dados preenchidos' + (situacao ? ' | Situacao: ' + situacao : '');
            status.style.color = '#51cf66';
        } catch (err) {
            status.textContent = 'Erro: ' + err.message;
            status.style.color = '#ff6b6b';
        } finally {
            btn.disabled = false;
        }
    }

    function limparForm() {
        document.getElementById('pessoaId').value = '';
        document.getElementById('formTitle').textContent = 'Novo Cliente';
        ['cpfCnpj','razaoSocial','nomeFantasia','inscricaoMunicipal',
         'endereco','numero','complemento','bairro','cidade','uf','cep','codigoMunicipio',
         'telefone','email','observacoes'].forEach(id => { document.getElementById(id).value = ''; });
        document.getElementById('tipo').value = 'PJ';
        document.getElementById('cpfCnpj').removeAttribute('readonly');
    }

    async function editarPessoa(id) {
        try {
            const resp = await fetch('/api/pessoas/' + id);
            const data = await resp.json();
            if (!data.success) throw new Error(data.error);

            const p = data.pessoa;
            document.getElementById('pessoaId').value = p.id;
            document.getElementById('formTitle').textContent = 'Editar Cliente';
            document.getElementById('cpfCnpj').value = formatDoc(p.cpfCnpj);
            document.getElementById('cpfCnpj').setAttribute('readonly', true);
            document.getElementById('tipo').value = p.tipo;
            document.getElementById('razaoSocial').value = p.razaoSocial || '';
            document.getElementById('nomeFantasia').value = p.nomeFantasia || '';
            document.getElementById('inscricaoMunicipal').value = p.inscricaoMunicipal || '';
            document.getElementById('endereco').value = p.endereco || '';
            document.getElementById('numero').value = p.numero || '';
            document.getElementById('complemento').value = p.complemento || '';
            document.getElementById('bairro').value = p.bairro || '';
            document.getElementById('cidade').value = p.cidade || '';
            document.getElementById('uf').value = p.uf || '';
            document.getElementById('cep').value = p.cep || '';
            document.getElementById('codigoMunicipio').value = p.codigoMunicipio || '';
            document.getElementById('telefone').value = p.telefone || '';
            document.getElementById('email').value = p.email || '';
            document.getElementById('observacoes').value = p.observacoes || '';

            switchTab('form');
        } catch (err) {
            showAlert('Erro ao carregar pessoa: ' + err.message, 'error');
        }
    }

    async function salvarPessoa() {
        const id = document.getElementById('pessoaId').value;
        const body = {
            cpfCnpj: document.getElementById('cpfCnpj').value,
            razaoSocial: document.getElementById('razaoSocial').value,
            nomeFantasia: document.getElementById('nomeFantasia').value,
            inscricaoMunicipal: document.getElementById('inscricaoMunicipal').value,
            endereco: document.getElementById('endereco').value,
            numero: document.getElementById('numero').value,
            complemento: document.getElementById('complemento').value,
            bairro: document.getElementById('bairro').value,
            cidade: document.getElementById('cidade').value,
            uf: document.getElementById('uf').value.toUpperCase(),
            cep: document.getElementById('cep').value,
            codigoMunicipio: document.getElementById('codigoMunicipio').value,
            telefone: document.getElementById('telefone').value,
            email: document.getElementById('email').value,
            observacoes: document.getElementById('observacoes').value,
        };

        if (!body.cpfCnpj || !body.razaoSocial) {
            return showAlert('CPF/CNPJ e Razão Social são obrigatórios', 'error');
        }

        try {
            const url = id ? '/api/pessoas/' + id : '/api/pessoas';
            const method = id ? 'PUT' : 'POST';
            const resp = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
            const data = await resp.json();

            if (!data.success) throw new Error(data.error);

            showAlert(id ? 'Cliente atualizado!' : 'Cliente cadastrado!');
            limparForm();
            switchTab('lista');
        } catch (err) {
            showAlert('Erro ao salvar: ' + err.message, 'error');
        }
    }

    async function excluirPessoa(id, nome) {
        if (!confirm(`Deseja desativar o cliente "${nome}"?`)) return;

        try {
            const resp = await fetch('/api/pessoas/' + id, { method: 'DELETE' });
            const data = await resp.json();
            if (!data.success) throw new Error(data.error);
            showAlert('Cliente desativado');
            carregarPessoas();
        } catch (err) {
            showAlert('Erro: ' + err.message, 'error');
        }
    }

    // ==================== INIT ====================
    carregarPessoas();
    </script>
</body>
</html>
