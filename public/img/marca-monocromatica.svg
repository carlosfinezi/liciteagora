<!--
  Licite Agora — VERSÃO MONOCROMÁTICA
  ============================================================================
  O mesmo símbolo, numa cor só. Para onde a marca não pode contar com cor:
  impressão em preto e branco, fundo de foto, fax de documento, marca d'água.

  Tudo é `currentColor` — quem aplica define a cor pelo CSS (`color:`). Não há
  azul nem verde escritos aqui de propósito: uma versão monocromática com cor
  fixa não seria monocromática, seria uma segunda marca para manter.

  ── O que muda em relação ao colorido, e por quê ────────────────────────────

  Sem cor, a seta e o "A" viram a MESMA mancha — o desenho perde o elemento
  central da identidade. Duas compensações:

  1. O vão em volta da seta fica mais largo (11, contra 9 no colorido). É ele
     que separa as duas formas agora que o verde não separa mais.
  2. A seta é desenhada com opacidade 0.72. Num tom só, ela continua lendo
     como elemento distinto sem precisar de uma segunda cor.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 54" role="img" aria-label="Licite Agora">
  <defs>
    <clipPath id="lamoCorte"><rect x="0" y="7" width="84" height="42.5"/></clipPath>
    <mask id="lamoVao">
      <rect width="84" height="54" fill="#fff"/>
      <path d="M43 46 L55.5 31.5" stroke="#000" stroke-width="11" stroke-linecap="round" fill="none"/>
      <path d="M64 20.5 L48.5 27 L60.5 38.5 Z" fill="#000" stroke="#000" stroke-width="7.5" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g clip-path="url(#lamoCorte)">
    <path d="M23 0 L10.5 36 Q9.5 43 17 43 L29 43 L53 7 L76 54"
          fill="none" stroke="currentColor" stroke-width="13"
          stroke-linecap="butt" stroke-linejoin="round" mask="url(#lamoVao)"/>
  </g>
  <g opacity="0.72">
    <path d="M43 46 L55.5 31.5" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M64 20.5 L48.5 27 L60.5 38.5 Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
