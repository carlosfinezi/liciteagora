<!--
  Licite Agora — MARCA HORIZONTAL
  ============================================================================
  Símbolo + "Licite Agora" + a assinatura "ERP". Usada na sidebar EXPANDIDA e
  no login. O símbolo em si é o mesmo de `marca-monograma.svg` — se um dia ele
  mudar, os dois arquivos precisam mudar juntos.

  ── Este arquivo é para uso INLINE ──────────────────────────────────────────

  Duas coisas dependem disso, e as duas quebram se ele virar `<img src=…>`:

  1. `fill="currentColor"` em "Licite" e "ERP". É o que faz a marca funcionar
     nos dois temas com UM arquivo só: no claro herda o texto escuro, no escuro
     herda o claro. Dentro de um `<img>` não existe cor herdada.
  2. A fonte. `Inter` é carregada pela página (app-modern.css), não pelo SVG.
     Num `<img>` o arquivo renderiza isolado e cairia na fonte do sistema.

  "Agora" e o verde são fixos: são cor de marca, não seguem tema.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" role="img" aria-label="Licite Agora ERP">
  <defs>
    <linearGradient id="lahAz" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <clipPath id="lahCorte"><rect x="0" y="7" width="84" height="42.5"/></clipPath>
    <mask id="lahVao">
      <rect width="84" height="54" fill="#fff"/>
      <path d="M43 46 L55.5 31.5" stroke="#000" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M64 20.5 L48.5 27 L60.5 38.5 Z" fill="#000" stroke="#000" stroke-width="5.5" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Símbolo: mesmo desenho do monograma, escalado para a altura do texto. -->
  <g transform="translate(0 6) scale(0.815)">
    <g clip-path="url(#lahCorte)">
      <path d="M23 0 L10.5 36 Q9.5 43 17 43 L29 43 L53 7 L76 54"
            fill="none" stroke="url(#lahAz)" stroke-width="13"
            stroke-linecap="butt" stroke-linejoin="round" mask="url(#lahVao)"/>
    </g>
    <path d="M43 46 L55.5 31.5" stroke="#22C55E" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M64 20.5 L48.5 27 L60.5 38.5 Z" fill="#22C55E" stroke="#22C55E" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <text x="84" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="34" font-weight="800" letter-spacing="-1.2">
    <tspan fill="currentColor">Licite</tspan><tspan fill="#2563EB"> Agora</tspan>
  </text>

  <!-- Assinatura "ERP" entre dois filetes verdes, como no manual. -->
  <line x1="84"  y1="55" x2="146" y2="55" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round"/>
  <text x="196.5" y="60" text-anchor="middle" fill="currentColor" opacity="0.85"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="600" letter-spacing="7">ERP</text>
  <line x1="240" y1="55" x2="302" y2="55" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round"/>
</svg>
