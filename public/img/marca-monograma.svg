<!--
  Licite Agora — MONOGRAMA "LA"
  ============================================================================
  Símbolo sozinho, sem texto. Usado na sidebar RECOLHIDA (64px), onde a marca
  horizontal desenhava com ~11px de altura e virava um borrão.

  ── Como o desenho é construído ─────────────────────────────────────────────

  Um traço só, em ziguezague, com a espessura vindo do `stroke`: desce (perna
  do L), curva na base, sobe até o ápice do A e desce de novo. É o "LA" ligado
  da identidade.

  Por que stroke e não contorno preenchido: `stroke-linejoin="round"` dá os
  cantos arredondados do conceito sem que ninguém precise recalcular curvas à
  mão se a espessura mudar um dia.

  `stroke-linecap="butt"` + `clipPath`: as pontas do original são cortadas na
  HORIZONTAL, não perpendicular ao traço e não arredondadas. O cap reto sozinho
  cortaria perpendicular (fica torto num traço inclinado); o retângulo de clip é
  o que dá o corte reto de verdade. Os traços são desenhados passando do corte
  de propósito — quem define a borda é o clip.

  ── A seta, e por que ela tem um vão em volta ───────────────────────────────

  A seta verde é o elemento central da identidade e atravessa a perna direita
  do A. A separação entre as duas é feita por `mask`, e não por um traço da cor
  do fundo: o fundo AQUI MUDA (claro, escuro, e a sidebar tem tom próprio).
  Máscara recorta de verdade — o vão fica transparente e mostra o que estiver
  atrás, em qualquer tema.

  ── Cores ───────────────────────────────────────────────────────────────────

  Azul #2563EB é o principal (meio do gradiente #3B82F6 → #1D4ED8) e é o mesmo
  `--btn-primary-bg` do design system. Verde #22C55E.
  São FIXAS, não tokens: marca não muda de cor com o tema do usuário.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 54" role="img" aria-label="Licite Agora">
  <defs>
    <linearGradient id="lamAz" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <clipPath id="lamCorte"><rect x="0" y="7" width="84" height="42.5"/></clipPath>
    <mask id="lamVao">
      <rect width="84" height="54" fill="#fff"/>
      <path d="M43 46 L55.5 31.5" stroke="#000" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M64 20.5 L48.5 27 L60.5 38.5 Z" fill="#000" stroke="#000" stroke-width="5.5" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g clip-path="url(#lamCorte)">
    <path d="M23 0 L10.5 36 Q9.5 43 17 43 L29 43 L53 7 L76 54"
          fill="none" stroke="url(#lamAz)" stroke-width="13"
          stroke-linecap="butt" stroke-linejoin="round" mask="url(#lamVao)"/>
  </g>
  <path d="M43 46 L55.5 31.5" stroke="#22C55E" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M64 20.5 L48.5 27 L60.5 38.5 Z" fill="#22C55E" stroke="#22C55E" stroke-width="2" stroke-linejoin="round"/>
</svg>
