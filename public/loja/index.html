<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- `viewport-fit=cover` é o que permite o `env(safe-area-inset-bottom)` da
     barra fixa funcionar no iPhone com faixa inferior. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E6B63">
<!-- Ícone vazio declarado de propósito: sem isto o navegador pede /favicon.ico
     em toda visita e recebe 404, que aparece como erro no console de quem for
     depurar a loja. O ícone real da marca entra quando houver um. -->
<link rel="icon" href="data:,">
<!-- Inter: a mesma família que o ERP já carrega em app-modern.css. Nenhuma
     fonte nova entrou no projeto — só passou a valer também no catálogo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
<title>Catálogo</title>
<style>
/* Tokens do tema. Os valores reais chegam da configuração do lojista e são
   injetados em :root pelo aplicarTema() — aqui ficam só os padrões, para a
   página nunca aparecer sem cor enquanto carrega. */
:root {
  --primaria: #0E6B63;
  --primaria-texto: #fff;
  --ground: #F7F8F8;
  --surface: #FFFFFF;
  --ink: #14201F;
  --ink-2: #5A6A68;
  --line: #E1E7E6;
  --raio: 10px;
  --fonte: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --barra-h: 68px;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--fonte); line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body.com-barra { padding-bottom: calc(var(--barra-h) + env(safe-area-inset-bottom, 0px) + 12px); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
img { max-width: 100%; }

/* ---------- capa e cabeçalho ---------- */
.capa { height: 190px; background: var(--primaria); overflow: hidden; }
.capa img { width: 100%; height: 100%; object-fit: cover; display: block;
  /* `transform-origin: center` faz o zoom do enquadramento crescer a partir do
     ponto escolhido, e o `overflow: hidden` da .capa apara o excesso. */
  transform-origin: center; }
header.topo { background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30; }
/* O cabeçalho quebra em duas linhas quando a marca e as ações não cabem lado
   a lado — em vez de espremer o nome da loja até virar "PRO…".

   Quem decide a quebra é o próprio conteúdo, não uma media query: o flexbox
   compara as larguras PEDIDAS (a da marca com sua logo e seu nome, mais a das
   ações) com a largura disponível e, não cabendo, manda as ações para a linha
   de baixo. Isso vale para qualquer nome e qualquer combinação de redes — com
   só o WhatsApp costuma sobrar espaço e tudo fica numa linha; com as três mais
   o ⓘ, em tela estreita, desce. Nenhum número aqui conhece o nome de nenhuma
   loja, e é por isso que funciona para qualquer tenant. */
header.topo .wrap { display: flex; align-items: center; gap: 10px 14px; padding: 12px 16px;
  flex-wrap: wrap; justify-content: space-between; }
/* `space-between` faz as duas coisas de uma vez: numa linha, joga as ações
   para a direita da marca; quebrada, a linha das ações tem um item só e ele
   fica no início — embaixo da marca, e não no canto oposto ao nome a que
   pertence. Não custa media query nenhuma. */
.acoes-topo { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
/* Logo circular e 1:1 nos três lugares em que ela aparece. `cover` preenche o
   círculo sem esticar; o recorte visível vem do enquadramento salvo. */
header.topo img.logo { width: 52px; height: 52px; border-radius: 50%; aspect-ratio: 1;
  object-fit: cover; background: #fff; border: 1px solid var(--line); flex-shrink: 0; }
/* A marca é o caminho de volta: link, não botão.
   `flex-basis: auto` é o que dispara a quebra do cabeçalho: a largura que a
   marca PEDE é a do seu próprio conteúdo, e não cabendo ela mais as ações, o
   flexbox manda as ações para a linha de baixo em vez de espremer o nome.
   Uma base fixa aqui foi testada e é pior: com `260px`, uma loja de nome curto
   quebrava o cabeçalho em 320px mesmo sem nenhuma rede ligada, onde caberia
   folgado. O conteúdo é quem sabe de quanto precisa.
   `min-width: 0` continua ali para o recorte do nome poder agir quando nem
   duas linhas bastam. */
.marca-loja { display: flex; align-items: center; gap: 12px; min-width: 0;
  flex: 1 1 auto; text-decoration: none; color: inherit; }
.cab-txt { min-width: 0; display: flex; flex-direction: column; }
/* O nome usa até DUAS linhas antes de recorrer às reticências.
   Numa linha só, um nome de razão social inteira ("SUPERMERCADO E
   DISTRIBUIDORA …") não cabe em largura de celular por mais espaço que se
   arranje — 610px de texto não entram em 320px de tela — e virava "SUP…".
   Com duas linhas, o mesmo nome aparece quase todo; o limite existe para o
   cabeçalho não crescer sem fim com um nome absurdo. */
.cab-nome { font-size: 19px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.cab-desc { color: var(--ink-2); font-size: 13px; font-weight: 400;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Status de atendimento — informativo. Não bloqueia nada nesta fase. */
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
  font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.status::before { content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: #B3261E; flex-shrink: 0; }
.status.aberto::before { background: #1F9D55; }

/* Ícones sociais: sem texto ao lado, com 44px de alvo mesmo desenhando 20px. */
.redes { display: flex; gap: 2px; flex-shrink: 0; align-items: center; }
/* O status é a primeira coisa a sair quando o espaço aperta: ele é informativo,
   e marca e ícones não são negociáveis. No celular ele reaparece logo abaixo,
   em linha própria, onde cabe inteiro. */
.status-linha { display: none; }
@media (max-width: 720px) {
  header.topo .status { display: none; }
  .status-linha { display: block; padding: 10px 0 0; }
  .status-linha .status { font-size: 13px; }
}
.rede { color: var(--ink-2); text-decoration: none;
  width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: background .15s, color .15s; }
.rede svg { width: 21px; height: 21px; display: block; }
.rede:hover { color: var(--primaria); background: color-mix(in srgb, var(--primaria) 10%, transparent); }
.rede:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }

/* ---------- busca e categorias ---------- */
.busca-linha { padding: 14px 0 6px; }
#busca {
  width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--raio);
  background: var(--surface); color: var(--ink); font-family: inherit;
  /* 16px impede o zoom automático do iOS ao focar o campo. */
  font-size: 16px; min-height: 46px;
}
/* Faixa horizontal rolável — no toque rola com o dedo, no desktop com a roda
   ou arrastando. Um <select> esconderia as categorias atrás de um clique, e a
   referência mostra todas de uma vez. */
.nav-cats { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 12px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
.nav-cats::-webkit-scrollbar { display: none; }
.nav-cats button {
  flex: 0 0 auto; scroll-snap-align: start;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  border-radius: 999px; padding: 10px 16px; font-size: 14px; font-family: inherit;
  cursor: pointer; white-space: nowrap; min-height: 44px;
}
.nav-cats button:hover { border-color: var(--primaria); color: var(--primaria); }

/* ---------- grade de produtos ---------- */
.secao { margin: 18px 0 26px; }
.secao h2 { font-size: 17px; margin: 0 0 12px; letter-spacing: -.01em; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px;
  align-content: start; grid-auto-rows: max-content; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--raio);
  overflow: hidden; display: flex; flex-direction: column; position: relative; cursor: pointer; }
.card:hover { border-color: var(--primaria); }
.card:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }
.card-foto { aspect-ratio: 1; background: #fff; display: flex; align-items: center;
  justify-content: center; position: relative; }
.card-foto img { width: 100%; height: 100%; object-fit: contain; }
.sem-foto { color: var(--ink-2); font-size: 12px; }
.selo { position: absolute; left: 8px; top: 8px; background: #FFF4D6; color: #8A6A12;
  border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
.card-txt { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.card-txt h3 { font-size: 14px; margin: 0; font-weight: 550; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.marca { font-size: 12px; color: var(--ink-2); margin: 0; }
.linha-preco { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
.linha-preco.grande .preco { font-size: 24px; }
.preco { font-size: 16px; font-weight: 700; }
.antes { font-size: 13px; color: var(--ink-2); text-decoration: line-through; }
.pct { font-size: 12px; font-weight: 700; color: #1F6B41; background: #E7F3EC;
  border-radius: 999px; padding: 1px 7px; }
.sob { font-size: 13px; color: var(--ink-2); }
/* O "+" é alvo de toque: 44x44 mesmo parecendo menor. */
.mais { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px;
  border-radius: 50%; border: 0; background: var(--primaria); color: var(--primaria-texto);
  font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center;
  justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; width: fit-content; margin: 0; }
.tag.disponivel { background: #E7F3EC; color: #1F6B41; }
.tag.ultimas { background: #FDF0DC; color: #8A5A12; }
.tag.sob-consulta { background: #EEF1F1; color: #5A6A68; }

.vazio-msg { text-align: center; color: var(--ink-2); padding: 56px 20px; }
.btn-linha { background: none; border: 0; color: var(--primaria); font-weight: 600;
  cursor: pointer; font-family: inherit; font-size: 15px; min-height: 44px; padding: 0 4px; }

/* ---------- página do produto ---------- */
.produto { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
  gap: 26px; padding: 16px 0 24px; }
.p-foto { background: #fff; border: 1px solid var(--line); border-radius: var(--raio);
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.p-foto img { width: 100%; height: 100%; object-fit: contain; }
.p-info { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.p-info h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.desc { font-size: 14.5px; color: var(--ink-2); white-space: pre-wrap; }
.desc.cortada { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.personalizacoes h2 { font-size: 16px; margin: 6px 0 8px; }
.grupo { border: 1px solid var(--line); border-radius: var(--raio); background: var(--surface);
  padding: 12px 14px; margin: 0 0 12px; }
.grupo legend { font-size: 14px; font-weight: 640; padding: 0 4px; }
.obrig { font-size: 11.5px; font-weight: 700; color: #8A2018; background: #FDECEA;
  border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
.ajuda { font-size: 13px; color: var(--ink-2); margin: 2px 0 8px; }
.opcao { display: flex; align-items: center; gap: 10px; padding: 11px 2px; min-height: 44px;
  border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.opcao:last-child { border-bottom: 0; }
.opcao input { width: 20px; height: 20px; accent-color: var(--primaria); flex-shrink: 0; }
.op-nome { flex: 1; min-width: 0; }
.op-mais { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.grupo textarea { width: 100%; padding: 10px; border: 1px solid var(--line);
  border-radius: var(--raio); background: var(--surface); color: var(--ink);
  font-family: inherit; font-size: 16px; resize: vertical; }
.qtd-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 6px 0; font-size: 15px; }
.qtd { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--surface); }
.qtd button { width: 44px; height: 44px; border: 0; background: none; color: var(--ink);
  font-size: 20px; cursor: pointer; border-radius: 50%; font-family: inherit; }
.qtd output { min-width: 32px; text-align: center; font-weight: 640; font-size: 16px; }
.erro { color: #B3261E; font-size: 14px; margin: 0; }

/* Botão de adicionar: fixo no rodapé, acima da área de gestos do iPhone. */
.barra-produto { position: sticky; bottom: 0; background: var(--ground);
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); }
.barra-produto .principal, .barra .ver {
  width: 100%; background: var(--primaria); color: var(--primaria-texto); border: 0;
  border-radius: var(--raio); padding: 15px; font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: inherit; min-height: 52px;
}

/* ---------- sacola ---------- */
.sacola-topo { display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; padding: 16px 0 10px; }
.sacola-topo h1 { font-size: 21px; margin: 0; }
.sacola-topo strong { font-size: 19px; }
.lista-sacola { list-style: none; margin: 0; padding: 0; }
.item-sacola { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.is-foto { width: 64px; height: 64px; flex-shrink: 0; background: #fff; border: 1px solid var(--line);
  border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.is-foto img { width: 100%; height: 100%; object-fit: contain; }
.is-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.is-op { font-size: 13px; color: var(--ink-2); }
.is-preco { font-weight: 660; margin-top: 2px; }
.is-acoes { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.excluir { background: none; border: 0; color: var(--ink-2); font-size: 13px; cursor: pointer;
  font-family: inherit; min-height: 44px; padding: 0 4px; }
.excluir:hover { color: #B3261E; }

/* "Complete seu pedido": trilho horizontal, como na referência. */
.trilho { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.trilho::-webkit-scrollbar { display: none; }
.sug { flex: 0 0 152px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--raio); padding: 10px; position: relative; cursor: pointer;
  display: flex; flex-direction: column; gap: 4px; }
.sug-foto { aspect-ratio: 1; background: #fff; display: flex; align-items: center;
  justify-content: center; overflow: hidden; border-radius: 6px; }
.sug-foto img { width: 100%; height: 100%; object-fit: contain; }
.sug-nome { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
/* O "+" do card de sugestão é absoluto no canto; sem esta folga o preço passa
   por baixo dele em telas estreitas. */
.sug-preco { font-size: 14px; font-weight: 660; padding-right: 46px; }

.servico { margin: 26px 0 30px; }
.servico h2 { font-size: 16px; margin: 0 0 10px; }
.servico-botoes { display: flex; gap: 12px; flex-wrap: wrap; }
.servico-bt { flex: 1 1 150px; background: var(--surface); border: 1px solid var(--line);
  color: var(--ink); border-radius: var(--raio); padding: 15px; font-size: 15px; font-weight: 640;
  cursor: pointer; font-family: inherit; min-height: 52px; }
.servico-bt.on { border-color: var(--primaria); color: var(--primaria);
  box-shadow: inset 0 0 0 1px var(--primaria); }

/* ---------- barra fixa do carrinho ---------- */
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.barra .dentro { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.barra .resumo { display: flex; flex-direction: column; line-height: 1.25; }
.barra .resumo span { font-size: 13px; color: var(--ink-2); }
.barra .resumo strong { font-size: 17px; }
.barra .ver { width: auto; flex: 1; max-width: 340px; margin-left: auto; }

/* ---------- botão e painel de Informações ---------- */
.info-bt { background: none; border: 0; color: var(--ink-2); cursor: pointer;
  width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; flex-shrink: 0; }
.info-bt svg { width: 22px; height: 22px; }
.info-bt:hover { color: var(--primaria); background: color-mix(in srgb, var(--primaria) 10%, transparent); }
.info-bt:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }

.info-bg { position: fixed; inset: 0; background: rgba(10,20,19,.55); z-index: 60;
  display: flex; justify-content: flex-end; }
.info-bg[hidden] { display: none; }
.info-painel { background: var(--surface); width: min(420px, 100%); height: 100%;
  display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,.2); }
.info-cab { display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.info-cab h2 { margin: 0; font-size: 18px; }
.info-fechar { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--ink-2);
  cursor: pointer; width: 44px; height: 44px; border-radius: 50%; }
.info-corpo { padding: 4px 18px 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.info-sec { padding: 16px 0; border-bottom: 1px solid var(--line); }
.info-sec:last-child { border-bottom: 0; }
.info-sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-2); margin: 0 0 10px; font-weight: 650; }
.info-marca { display: flex; align-items: center; gap: 12px; }
.info-marca img { width: 56px; height: 56px; border-radius: 50%; aspect-ratio: 1;
  object-fit: cover; background: #fff; border: 1px solid var(--line); }
.info-marca strong { font-size: 16px; }
.info-linha { font-size: 14.5px; line-height: 1.5; margin: 0 0 6px; }
.info-linha:last-child { margin-bottom: 0; }
.info-corpo a { color: var(--primaria); }
.info-tags { display: flex; flex-wrap: wrap; gap: 7px; }
.info-tag { font-size: 13px; background: var(--ground); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; }
.info-horarios { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.info-horarios dt { color: var(--ink-2); }
.info-horarios dd { margin: 0; }
.info-horarios .hoje { font-weight: 700; color: var(--ink); }
/* No celular a folha sobe de baixo: é onde o polegar alcança. */
@media (max-width: 640px) {
  .info-bg { align-items: flex-end; justify-content: center; }
  .info-painel { width: 100%; height: min(86vh, 100%); border-radius: 18px 18px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
}

/* ---------- rodapé ---------- */
footer.rodape { border-top: 1px solid var(--line); color: var(--ink-2); font-size: 14px;
  /* Fundo levemente distinto da página, sem virar bloco escuro. */
  background: color-mix(in srgb, var(--ink) 4%, var(--surface)); margin-top: 32px; }
.rodape-grade { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 28px;
  padding-top: 30px; padding-bottom: 24px; align-items: start; }
.rod-marca img { width: 54px; height: 54px; border-radius: 50%; aspect-ratio: 1;
  object-fit: cover; background: #fff; border: 1px solid var(--line); margin-bottom: 10px; display: block; }
.rod-marca strong { display: block; font-size: 15px; color: var(--ink); font-weight: 650; }
.rod-marca p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.5; max-width: 42ch; }
.rod-col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink); margin: 0 0 10px; font-weight: 650; }
.rod-col ul { list-style: none; margin: 0; padding: 0; display: flex;
  flex-direction: column; gap: 8px; }
.rod-col li { font-size: 13.5px; line-height: 1.45; }
/* Links sem o amarelo sublinhado: herdam o tom do texto e só respondem ao passar. */
.rod-col a { color: inherit; text-decoration: none; }
.rod-col a:hover { color: var(--primaria); text-decoration: underline; }
.rodape-fim { border-top: 1px solid var(--line); padding-top: 14px; padding-bottom: 18px; }
.rodape-fim small { font-size: 12.5px; }
@media (max-width: 720px) {
  .rodape-grade { grid-template-columns: 1fr; gap: 22px; }
}

@media (max-width: 860px) {
  .produto { grid-template-columns: 1fr; gap: 16px; }
  .capa { height: 140px; }
}
@media (max-width: 380px) {
  .grade { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  header.topo h1 { font-size: 17px; }
  /* Tela estreita: menos respiro em volta, para o nome ficar com o máximo de
     largura possível na linha que é dele. O alvo de 44px dos ícones e a
     presença de todos eles não entram nessa conta — quem cede é o espaço
     vazio. */
  header.topo .wrap { gap: 8px 10px; padding-left: 12px; padding-right: 12px; }
  .marca-loja { gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="capa" id="capa" hidden></div>

<header class="topo">
  <div class="wrap">
    <!-- O botão "← Voltar" saiu do cabeçalho. Quem leva de volta à home é a
         própria marca, que é onde se clica por hábito em qualquer site — e o
         botão do navegador continua funcionando, porque a navegação é por hash. -->
    <a class="marca-loja" href="#/" aria-label="Voltar ao início do catálogo">
      <img id="logo" class="logo" alt="" hidden>
      <span class="cab-txt">
        <span class="cab-nome" id="nomeLoja">Catálogo</span>
        <span class="cab-desc" id="descLoja"></span>
      </span>
    </a>
    <!-- Status, redes e ⓘ viajam juntos num grupo só. Soltos, cada um quebrava
         de linha por conta própria e o cabeçalho virava escada; agrupados, ou
         cabem todos ao lado da marca, ou descem todos de uma vez. -->
    <div class="acoes-topo">
      <span class="status" id="statusAtend" hidden></span>
      <nav class="redes" id="redes" aria-label="Redes sociais e contato"></nav>
      <button class="info-bt" id="btInfo" aria-label="Informações da loja" title="Informações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 10.5v6"/>
          <circle cx="12" cy="7.6" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="wrap" id="cabecalhoBusca">
  <div class="status-linha"><span class="status" id="statusAtendMobile" hidden></span></div>
  <div class="busca-linha">
    <input type="search" id="busca" placeholder="Buscar produto ou código…" aria-label="Buscar"
           oninput="pintarHome()">
  </div>
  <nav class="nav-cats" id="navCats" aria-label="Categorias" hidden></nav>
</div>

<main class="wrap" id="conteudo"></main>

<footer class="rodape">
  <div class="wrap rodape-grade">
    <div class="rod-marca">
      <img id="rodLogo" alt="" hidden>
      <strong id="rodNome"></strong>
      <p id="rodDesc"></p>
    </div>
    <div class="rod-col" id="rodContatoCol" hidden>
      <h2>Contato</h2>
      <ul id="rodContato"></ul>
    </div>
    <div class="rod-col" id="rodRedesCol" hidden>
      <h2>Redes sociais</h2>
      <nav class="redes" id="rodRedes" aria-label="Redes sociais"></nav>
    </div>
  </div>
  <div class="wrap rodape-fim"><small id="rodCopy"></small></div>
</footer>

<!-- Painel Informações: folha lateral no desktop, folha de baixo no celular.
     Montado só com dado real do tenant; seção sem dado não é desenhada. -->
<div class="info-bg" id="infoBg" hidden>
  <aside class="info-painel" role="dialog" aria-modal="true" aria-labelledby="infoTitulo">
    <header class="info-cab">
      <h2 id="infoTitulo">Informações</h2>
      <button class="info-fechar" id="btInfoFechar" aria-label="Fechar">×</button>
    </header>
    <div class="info-corpo" id="infoCorpo"></div>
  </aside>
</div>

<div class="barra" id="barra" hidden>
  <div class="dentro">
    <div class="resumo">
      <span id="barraQtd">0 produtos</span>
      <strong id="barraTotal">R$ 0,00</strong>
    </div>
    <button class="ver" id="barraVer">Ver meu pedido</button>
  </div>
</div>

<script src="/loja/tema.js"></script>
<script src="/loja/catalogo.js"></script>
</body>
</html>
