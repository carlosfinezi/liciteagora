<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- `viewport-fit=cover` é o que permite o `env(safe-area-inset-bottom)` da
     barra fixa funcionar no iPhone com faixa inferior. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E6B63">
<!-- Ícone vazio declarado de propósito: sem isto o navegador pede /favicon.ico
     em toda visita e recebe 404, que aparece como erro no console de quem for
     depurar a loja. O ícone real da marca entra quando houver um. -->
<link rel="icon" href="data:,">
<!-- Inter: a mesma família que o ERP já carrega em app-modern.css. Nenhuma
     fonte nova entrou no projeto — só passou a valer também no catálogo. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap">
<title>Catálogo</title>
<style>
/* Tokens do tema. Os valores reais chegam da configuração do lojista e são
   injetados em :root pelo aplicarTema() — aqui ficam só os padrões, para a
   página nunca aparecer sem cor enquanto carrega. */
:root {
  --primaria: #0E6B63;
  --primaria-texto: #fff;
  --ground: #F7F8F8;
  --surface: #FFFFFF;
  --ink: #14201F;
  --ink-2: #5A6A68;
  --line: #E1E7E6;
  --raio: 10px;
  --fonte: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --fonte-titulo: var(--fonte);
  --secundaria: var(--primaria);
  --secundaria-texto: #fff;
  --apoio: var(--primaria);
  --sombra: none;
  --sombra-forte: none;
  --barra-h: 68px;
}
* { box-sizing: border-box; }
/* `hidden` é atributo, e a regra do navegador que o obedece
   (`[hidden] { display: none }`) perde para QUALQUER regra de classe que
   declare `display`. Sem esta linha, `el.hidden = true` não escondia nada, e a
   página tinha três sintomas da mesma causa: o selo de atendimento virava uma
   bolinha vermelha muda no cabeçalho, a faixa de categorias segurava 22px
   vazios, e a logo ausente virava um círculo branco no rodapé. A página inteira
   mostra e esconde por `hidden` — não há um só `style.display` no
   `catalogo.js` —, então a autoridade tem de ser dele. */
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: var(--fonte); line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body.com-barra { padding-bottom: calc(var(--barra-h) + env(safe-area-inset-bottom, 0px) + 12px); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
img { max-width: 100%; }

/* ---------- capa e cabeçalho ---------- */
.capa { height: 190px; background: var(--primaria); overflow: hidden; }
.capa img { width: 100%; height: 100%; object-fit: cover; display: block;
  /* `transform-origin: center` faz o zoom do enquadramento crescer a partir do
     ponto escolhido, e o `overflow: hidden` da .capa apara o excesso. */
  transform-origin: center; }
header.topo { background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30; }
/* Cabeçalho de uma linha: marca à esquerda, ações à direita. Quem garante a
   linha única é o `flex-basis: 0` da marca, logo abaixo.

   O `flex-wrap: wrap` fica como último recurso, para o caso de as ações
   crescerem além do que a tela comporta: aí é melhor descer uma linha do que
   vazar pela lateral. No desenho de hoje ele não chega a disparar. */
header.topo .wrap { display: flex; align-items: center; gap: 10px 14px; padding: 12px 16px;
  flex-wrap: wrap; justify-content: space-between; }
.acoes-topo { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
/* Logo circular e 1:1 nos três lugares em que ela aparece. `cover` preenche o
   círculo sem esticar; o recorte visível vem do enquadramento salvo. */
header.topo img.logo { width: 52px; height: 52px; border-radius: 50%; aspect-ratio: 1;
  object-fit: cover; background: #fff; border: 1px solid var(--line); flex-shrink: 0; }
/* A marca é o caminho de volta: link, não botão.
   `flex-basis: 0` é o que mantém o cabeçalho numa linha só: a marca não pede
   a largura do próprio conteúdo, ela ocupa o que sobra depois do ⓘ e das
   redes. Com `auto`, a largura pedida pelo nome empurrava o ⓘ para uma
   segunda linha em 320px — o cabeçalho ia de 77px para 129px de altura, e
   isso acontecia mesmo sem nenhuma rede ligada.
   Faltando espaço, quem cede é o nome, que tem até duas linhas e depois
   reticências. `min-width: 0` é o que permite esse recorte acontecer. */
.marca-loja { display: flex; align-items: center; gap: 12px; min-width: 0;
  flex: 1 1 0; text-decoration: none; color: inherit; }
.cab-txt { min-width: 0; display: flex; flex-direction: column; }
/* O nome usa até DUAS linhas antes de recorrer às reticências.
   Numa linha só, um nome de razão social inteira ("SUPERMERCADO E
   DISTRIBUIDORA …") não cabe em largura de celular por mais espaço que se
   arranje — 610px de texto não entram em 320px de tela — e virava "SUP…".
   Com duas linhas, o mesmo nome aparece quase todo; o limite existe para o
   cabeçalho não crescer sem fim com um nome absurdo. */
.cab-nome { font-size: 19px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.cab-desc { color: var(--ink-2); font-size: 13px; font-weight: 400;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* Status de atendimento — informativo. Não bloqueia nada nesta fase. */
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
  font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.status::before { content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: #B3261E; flex-shrink: 0; }
.status.aberto::before { background: #1F9D55; }

/* Ícones sociais: sem texto ao lado, com 44px de alvo mesmo desenhando 20px. */
.redes { display: flex; gap: 2px; flex-shrink: 0; align-items: center; }
/* No celular o status sai do cabeçalho e reaparece logo abaixo, em linha
   própria.

   Os ícones de rede não têm largura fixa nesta conta: quem decide quantos
   cabem é `ajustarIconesTopo()`, no catalogo.js, que os acende um a um
   enquanto o nome da loja não perder linha. Quem sai dali tem para onde ir —
   o painel ⓘ lista WhatsApp, Instagram e Facebook com os mesmos links, e o
   botão que o abre continua no cabeçalho em qualquer largura. */
.status-linha { display: none; }
@media (max-width: 720px) {
  header.topo .status { display: none; }
  .status-linha { display: block; padding: 10px 0 0; }
  .status-linha .status { font-size: 13px; }
}
.rede { color: var(--ink-2); text-decoration: none;
  width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: background .15s, color .15s; }
.rede svg { width: 21px; height: 21px; display: block; }
.rede:hover { color: var(--primaria); background: color-mix(in srgb, var(--primaria) 10%, transparent); }
.rede:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }

/* ---------- checkout ----------
   Mobile-first: uma coluna, campos de 16px (abaixo disso o iOS dá zoom ao
   focar) e alvos de 44px. As etapas são seções empilhadas, não telas em
   sequência — no celular, oito telas custam oito esperas e escondem o que já
   foi preenchido. */
.chk { display: flex; flex-direction: column; gap: 18px; padding-bottom: 20px; }
.chk h1 { font-size: 1.35rem; margin: 18px 0 0; }
.chk-bloco { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--raio); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.chk-bloco h2 { font-size: 1rem; margin: 0; }
.chk-opcoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.chk-op { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--raio);
  padding: 12px; min-height: 60px; cursor: pointer; font: inherit; color: inherit;
  display: flex; flex-direction: column; gap: 2px; text-align: left; }
.chk-op strong { font-size: .98em; }
.chk-op span { font-size: .8em; color: var(--ink-2); }
.chk-op.on { border-color: var(--primaria); background: color-mix(in srgb, var(--primaria) 8%, transparent); }
.chk-op:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }

.chk-campo { display: flex; flex-direction: column; gap: 5px; }
.chk-campo label { font-size: .84em; font-weight: 600; color: var(--ink-2); }
.chk-op-txt { font-weight: 400; color: var(--ink-2); }
.chk-campo input, .chk-campo select, .chk-campo textarea {
  width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--raio);
  background: var(--ground); color: var(--ink); font-family: inherit;
  font-size: 16px; min-height: 46px; }
.chk-campo textarea { min-height: 76px; resize: vertical; }
.chk-linha { display: flex; gap: 10px; }
.chk-linha .chk-campo { flex: 1; }
.chk-cep { max-width: 130px; }
.chk-num { max-width: 110px; }
.chk-uf { max-width: 80px; }
.chk-check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: .92em; }
.chk-check input { width: 20px; height: 20px; accent-color: var(--primaria); }

.chk-itens { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.chk-itens li { display: flex; justify-content: space-between; gap: 12px; font-size: .9em; }
.chk-itens em { color: var(--ink-2); font-style: normal; font-size: .92em; }
.chk-totais { display: flex; flex-direction: column; gap: 6px; padding-top: 10px;
  border-top: 1px solid var(--line); font-size: .92em; }
.chk-totais > div { display: flex; justify-content: space-between; }
.chk-total { font-size: 1.05em; font-weight: 700; padding-top: 4px; }
.chk-aviso { font-size: .84em; color: var(--ink-2); margin: 0; }
.chk-erro { background: #FDECEA; color: #8A1C13; border-radius: var(--raio);
  padding: 12px 14px; margin: 0; font-size: .92em; }
[data-theme="escuro"] .chk-erro, .escuro .chk-erro { background: #3A1A16; color: #FFD9D4; }

.bt-principal { display: block; width: 100%; background: var(--primaria);
  color: var(--primaria-texto); border: 0; border-radius: var(--raio);
  padding: 15px; font: inherit; font-size: 1.02em; font-weight: 650; cursor: pointer;
  min-height: 52px; text-align: center; text-decoration: none; }
.bt-principal:disabled { opacity: .6; cursor: default; }

/* ---------- sucesso ---------- */
.ok-tela { display: flex; flex-direction: column; gap: 14px; align-items: center;
  text-align: center; padding: 30px 0 24px; }
.ok-tela h1 { font-size: 1.4rem; margin: 0; }
.ok-selo { width: 62px; height: 62px; border-radius: 50%; background: #1F9D55; color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 2rem; }
.ok-num { font-size: 1.05em; margin: 0; }
.ok-tela .chk-totais { width: 100%; max-width: 340px; text-align: left; }
.ok-linha { margin: 0; font-size: .95em; }
.ok-tela .bt-principal, .ok-tela .btn-linha { max-width: 340px; }

/* ---------- busca e categorias ---------- */
.busca-linha { padding: 14px 0 6px; }
/* A caixa existe para a lupa: ela é medida contra o campo, e não contra a
   linha, que tem padding diferente em cima e embaixo. */
.busca-caixa { position: relative; display: block; }
#busca {
  width: 100%; padding: 12px 44px 12px 14px; border: 1px solid var(--line); border-radius: var(--raio);
  background: var(--surface); color: var(--ink); font-family: inherit;
  /* 16px impede o zoom automático do iOS ao focar o campo. */
  font-size: 16px; min-height: 46px;
}
.busca-lupa { position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  width: 19px; height: 19px; color: var(--ink-2); pointer-events: none; }
/* O "×" que o Chrome desenha em `type=search` cairia em cima da lupa. Limpar
   continua sendo selecionar e apagar, como em qualquer campo de texto. */
#busca::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
/* Faixa horizontal rolável — no toque rola com o dedo, no desktop com a roda
   ou arrastando. Um <select> esconderia as categorias atrás de um clique, e a
   referência mostra todas de uma vez. */
.nav-cats { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 12px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
/* Rolagem recorta tudo o que passa da caixa, inclusive a sombra dos botões:
   era a borda reta que aparecia sob a barra do topo. A folga cabe a maior
   sombra do tema (0 18px 45px, a profunda: 27px acima, 63px abaixo) e a
   margem negativa devolve o espaço, então o layout não muda. Os lados vão até
   a borda da página. A folga não pega clique: só os botões recebem. */
.nav-cats { padding: 28px 16px 64px; margin: -18px -16px -52px; pointer-events: none;
  scroll-padding-inline: 16px; }
.nav-cats button { pointer-events: auto; }
.nav-cats::-webkit-scrollbar { display: none; }
.nav-cats button {
  flex: 0 0 auto; scroll-snap-align: start;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  border-radius: 999px; padding: 10px 16px; font-size: 14px; font-family: inherit;
  cursor: pointer; white-space: nowrap; min-height: 44px;
}
.nav-cats button:hover { border-color: var(--primaria); color: var(--primaria); }

/* ---------- grade de produtos ---------- */
.secao { margin: 18px 0 26px; }
.secao h2 { font-size: 17px; margin: 0 0 12px; letter-spacing: -.01em; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px;
  align-content: start; grid-auto-rows: max-content; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--raio);
  overflow: hidden; display: flex; flex-direction: column; position: relative; cursor: pointer; }
.card:hover { border-color: var(--primaria); }
.card:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }
.card-foto { aspect-ratio: 1; background: #fff; display: flex; align-items: center;
  justify-content: center; position: relative; }
.card-foto img { width: 100%; height: 100%; object-fit: contain; }
.sem-foto { color: var(--ink-2); font-size: 12px; }
.selo { position: absolute; left: 8px; top: 8px; background: #FFF4D6; color: #8A6A12;
  border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
/* Oferta no canto oposto ao ★, para os dois caberem no mesmo card. */
.selo-oferta { position: absolute; right: 8px; top: 8px; background: var(--secundaria); color: var(--secundaria-texto);
  border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; }
.card-txt { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.card-txt h3 { font-size: 14px; margin: 0; font-weight: 550; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.marca { font-size: 12px; color: var(--ink-2); margin: 0; }
/* A linha do preço reserva a zona do "+" (44px, a 8px do fundo e da borda):
   sem a altura mínima, um nome longo numa linha só descia até o botão e
   passava por baixo dele, como aconteceu com "Buquê mix de 5 rosas" no
   celular em 28/09. */
.linha-preco { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: auto; padding-top: 6px;
  min-height: 38px; padding-right: 46px; }
.linha-preco.grande .preco { font-size: 24px; }
.preco { font-size: 16px; font-weight: 700; }
.antes { font-size: 13px; color: var(--ink-2); text-decoration: line-through; }
.pct { font-size: 12px; font-weight: 700; color: #1F6B41; background: #E7F3EC;
  border-radius: 999px; padding: 1px 7px; }
.sob { font-size: 13px; color: var(--ink-2); }
/* O "+" é alvo de toque: 44x44 mesmo parecendo menor. */
.mais { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px;
  border-radius: 50%; border: 0; background: var(--primaria); color: var(--primaria-texto);
  font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center;
  justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; width: fit-content; margin: 0; }
.tag.disponivel { background: #E7F3EC; color: #1F6B41; }
.tag.ultimas { background: #FDF0DC; color: #8A5A12; }
.tag.sob-consulta { background: #EEF1F1; color: #5A6A68; }

.vazio-msg { text-align: center; color: var(--ink-2); padding: 56px 20px; }
.btn-linha { background: none; border: 0; color: var(--primaria); font-weight: 600;
  cursor: pointer; font-family: inherit; font-size: 15px; min-height: 44px; padding: 0 4px; }

/* ---------- página do produto ---------- */
.produto { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
  gap: 26px; padding: 16px 0 24px; }
.p-foto { background: #fff; border: 1px solid var(--line); border-radius: var(--raio);
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.p-foto img { width: 100%; height: 100%; object-fit: contain; }
.p-info { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.p-info h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.desc { font-size: 14.5px; color: var(--ink-2); white-space: pre-wrap; }
.desc.cortada { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.personalizacoes h2 { font-size: 16px; margin: 6px 0 8px; }
.grupo { border: 1px solid var(--line); border-radius: var(--raio); background: var(--surface);
  padding: 12px 14px; margin: 0 0 12px; }
.grupo legend { font-size: 14px; font-weight: 640; padding: 0 4px; }
.obrig { font-size: 11.5px; font-weight: 700; color: #8A2018; background: #FDECEA;
  border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
.ajuda { font-size: 13px; color: var(--ink-2); margin: 2px 0 8px; }
.opcao { display: flex; align-items: center; gap: 10px; padding: 11px 2px; min-height: 44px;
  border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.opcao:last-child { border-bottom: 0; }
.opcao input { width: 20px; height: 20px; accent-color: var(--primaria); flex-shrink: 0; }
.op-nome { flex: 1; min-width: 0; }
.op-mais { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.grupo textarea { width: 100%; padding: 10px; border: 1px solid var(--line);
  border-radius: var(--raio); background: var(--surface); color: var(--ink);
  font-family: inherit; font-size: 16px; resize: vertical; }
.qtd-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 6px 0; font-size: 15px; }
.qtd { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line);
  border-radius: 999px; background: var(--surface); }
.qtd button { width: 44px; height: 44px; border: 0; background: none; color: var(--ink);
  font-size: 20px; cursor: pointer; border-radius: 50%; font-family: inherit; }
.qtd output { min-width: 32px; text-align: center; font-weight: 640; font-size: 16px; }
.erro { color: #B3261E; font-size: 14px; margin: 0; }

/* Botão de adicionar: fixo no rodapé, acima da área de gestos do iPhone. */
.barra-produto { position: sticky; bottom: 0; background: var(--ground);
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); }
.barra-produto .principal, .barra .ver {
  width: 100%; background: var(--primaria); color: var(--primaria-texto); border: 0;
  border-radius: var(--raio); padding: 15px; font-size: 16px; font-weight: 700;
  cursor: pointer; font-family: inherit; min-height: 52px;
}

/* ---------- sacola ---------- */
.sacola-topo { display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; padding: 16px 0 10px; }
.sacola-topo h1 { font-size: 21px; margin: 0; }
.sacola-topo strong { font-size: 19px; }
.lista-sacola { list-style: none; margin: 0; padding: 0; }
.item-sacola { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.is-foto { width: 64px; height: 64px; flex-shrink: 0; background: #fff; border: 1px solid var(--line);
  border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.is-foto img { width: 100%; height: 100%; object-fit: contain; }
.is-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.is-op { font-size: 13px; color: var(--ink-2); }
.is-preco { font-weight: 660; margin-top: 2px; }
.is-acoes { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.excluir { background: none; border: 0; color: var(--ink-2); font-size: 13px; cursor: pointer;
  font-family: inherit; min-height: 44px; padding: 0 4px; }
.excluir:hover { color: #B3261E; }

/* ---------- barra fixa do carrinho ---------- */
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.barra .dentro { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.barra .resumo { display: flex; flex-direction: column; line-height: 1.25; }
.barra .resumo span { font-size: 13px; color: var(--ink-2); }
.barra .resumo strong { font-size: 17px; }
.barra .ver { width: auto; flex: 1; max-width: 340px; margin-left: auto; }

/* ---------- "como você quer receber" (sacola) ----------
   Bloco no fluxo da página, logo abaixo dos itens: é o passo seguinte da
   sacola, e como tal ele rola junto com o resto. Presa no rodapé da janela,
   como era até 29/09, a faixa empurrava o rodapé da loja para o meio da
   página no desktop e escondia o fim da sacola. */
.barra-atend { margin-top: 18px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--raio);
  box-shadow: var(--sombra); padding: 16px; }

/* estado 1: ainda escolhendo */
.atend-titulo { font-size: 15px; font-weight: 660; margin: 0 0 10px; }
.atend-ops { display: flex; gap: 10px; }
.atend-op { flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface); border: 1.5px solid var(--line); color: var(--ink);
  border-radius: var(--raio); padding: 14px 12px; font-size: 15px; font-weight: 640;
  font-family: inherit; cursor: pointer; min-height: 56px; }
.atend-op .ic { font-size: 20px; line-height: 1; }
.atend-op:hover { border-color: var(--primaria); color: var(--primaria); }
.atend-op:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }
.atend-op.on { border-color: var(--primaria); color: var(--primaria);
  background: color-mix(in srgb, var(--primaria) 8%, var(--surface)); }

/* estado 2: já escolhido — compacto */
.atend-feito { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.atend-resumo { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 200px; }
.atend-resumo .ic { font-size: 22px; line-height: 1; flex-shrink: 0; }
.atend-txt { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.atend-txt strong { font-size: 15px; font-weight: 660; }
.atend-txt span { font-size: 13px; color: var(--ink-2); }
/* `--ink`, e não `--primaria`: a cor primária é a da LOJA, e em tenant de
   marca clara ela some no fundo branco da barra. Medido no
   produtosbomgosto, cujo amarelo dá contraste de 1.12:1 — o mínimo legível
   é 4.5:1. O sublinhado é o que mantém o "Alterar" com cara de ação sem
   depender da cor. */
.atend-alterar { background: none; border: 0; color: var(--ink); font-size: 14px;
  font-weight: 640; font-family: inherit; cursor: pointer; padding: 10px 8px;
  min-height: 44px; text-decoration: underline; flex-shrink: 0; }
.atend-alterar:hover { color: var(--ink-2); }
.atend-alterar:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }
.atend-seguir { background: var(--primaria); color: var(--primaria-texto); border: 0;
  border-radius: var(--raio); padding: 15px 22px; font-size: 16px; font-weight: 700;
  font-family: inherit; cursor: pointer; min-height: 52px; flex: 0 1 220px; margin-left: auto; }
.atend-seguir:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.atend-seguir:disabled { opacity: .5; cursor: default; }

/* Celular estreito: nada de espremer. O Continuar desce e ocupa a linha
   inteira, que é o alvo mais fácil de acertar com o polegar. */
@media (max-width: 480px) {
  .atend-feito { gap: 8px; }
  .atend-seguir { flex: 1 1 100%; margin-left: 0; width: 100%; }
}

/* Desktop: o `max-width` do `.dentro` já impede a faixa de atravessar a
   tela, mas os botões esticavam para ~570px cada dentro dela — largura de
   banner, não de escolha. Aqui eles ganham tamanho de botão e a linha fica
   alinhada à esquerda, como o resto do conteúdo da loja. */
@media (min-width: 720px) {
  .atend-ops { max-width: 560px; }
  .atend-op { flex: 0 1 260px; }
}

/* ---------- botão e painel de Informações ---------- */
.info-bt { background: none; border: 0; color: var(--ink-2); cursor: pointer;
  width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; flex-shrink: 0; }
.info-bt svg { width: 22px; height: 22px; }
.info-bt:hover { color: var(--primaria); background: color-mix(in srgb, var(--primaria) 10%, transparent); }
.info-bt:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }

.info-bg { position: fixed; inset: 0; background: rgba(10,20,19,.55); z-index: 60;
  display: flex; justify-content: flex-end; }
.info-bg[hidden] { display: none; }
.info-painel { background: var(--surface); width: min(420px, 100%); height: 100%;
  display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,.2); }
.info-cab { display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.info-cab h2 { margin: 0; font-size: 18px; }
.info-fechar { background: none; border: 0; font-size: 26px; line-height: 1; color: var(--ink-2);
  cursor: pointer; width: 44px; height: 44px; border-radius: 50%; }
.info-corpo { padding: 4px 18px 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.info-sec { padding: 16px 0; border-bottom: 1px solid var(--line); }
.info-sec:last-child { border-bottom: 0; }
.info-sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-2); margin: 0 0 10px; font-weight: 650; }
.info-marca { display: flex; align-items: center; gap: 12px; }
.info-marca img { width: 56px; height: 56px; border-radius: 50%; aspect-ratio: 1;
  object-fit: cover; background: #fff; border: 1px solid var(--line); }
.info-marca strong { font-size: 16px; }
.info-linha { font-size: 14.5px; line-height: 1.5; margin: 0 0 6px; }
.info-linha:last-child { margin-bottom: 0; }
.info-corpo a { color: var(--primaria); }
.info-tags { display: flex; flex-wrap: wrap; gap: 7px; }
.info-tag { font-size: 13px; background: var(--ground); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 12px; }
.info-horarios { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.info-horarios dt { color: var(--ink-2); }
.info-horarios dd { margin: 0; }
.info-horarios .hoje { font-weight: 700; color: var(--ink); }
/* No celular a folha sobe de baixo: é onde o polegar alcança. */
@media (max-width: 640px) {
  .info-bg { align-items: flex-end; justify-content: center; }
  .info-painel { width: 100%; height: min(86vh, 100%); border-radius: 18px 18px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0px); }
}

/* ---------- fonte dos títulos e faixa de aviso ---------- */
/* Só títulos: nome da loja, seções, produto, sacola e rodapé. O nome do
   produto no card fica na fonte do texto, porque em 14px uma manuscrita
   deixa de ser lida. */
.cab-nome, .secao h2, .p-info h1, .sacola-topo h1, .chk h1, .ok-tela h1,
.rod-marca strong, .info-cab h2 { font-family: var(--fonte-titulo); }
.faixa { background: var(--secundaria); color: var(--secundaria-texto); text-align: center;
  font-size: 13.5px; font-weight: 600; padding: 7px 16px; line-height: 1.4; }

/* ---------- acabamento: fundo, sombra, topo, sigla e destaque ----------
   Tudo aqui depende de escolhas do tema (tema.js grava os marcadores em
   <html>). Sem escolha, nada muda: a loja fica como era antes de 28/09. */
html[data-fundo-efeito="aquarela"] body {
  background:
    radial-gradient(circle at 8% 10%, color-mix(in srgb, var(--secundaria) 9%, transparent), transparent 30%),
    radial-gradient(circle at 92% 15%, color-mix(in srgb, var(--apoio) 11%, transparent), transparent 32%),
    var(--ground);
}
html[data-sombra="suave"] {
  --sombra: 0 12px 35px color-mix(in srgb, var(--primaria) 9%, transparent);
  --sombra-forte: 0 24px 70px color-mix(in srgb, var(--primaria) 13%, transparent);
}
html[data-sombra="profunda"] {
  --sombra: 0 18px 45px color-mix(in srgb, var(--primaria) 14%, transparent);
  --sombra-forte: 0 30px 80px color-mix(in srgb, var(--primaria) 20%, transparent);
}
.card, #busca, .nav-cats button { box-shadow: var(--sombra); }
.bt-principal, .mais, .barra .ver { box-shadow: var(--sombra); }
/* Topo translúcido: sem fundo branco nem linha, a página aparece por trás. */
html[data-topo="translucido"] header.topo {
  background: linear-gradient(to bottom, color-mix(in srgb, var(--ground) 96%, transparent),
    color-mix(in srgb, var(--ground) 84%, transparent));
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 0;
}
/* Topo em degradê: a regra .topbar do protótipo do Cantinho Verde, com a cor
   fixa (255,250,249) trocada pela cor de fundo do tema e as mesmas opacidades.
   Sem máscara: o desfoque cobre a barra inteira, e é ele que deixa ilegível o
   que passa por baixo. */
html[data-topo="degrade"] header.topo {
  background: linear-gradient(to bottom, color-mix(in srgb, var(--ground) 96%, transparent),
    color-mix(in srgb, var(--ground) 78%, transparent), color-mix(in srgb, var(--ground) 0%, transparent));
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 0;
}
/* Iniciais num círculo, no lugar da logo, para quem ainda não tem uma. */
.sigla { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; display: grid;
  place-items: center; background: var(--primaria); color: var(--primaria-texto);
  font-weight: 800; letter-spacing: -.04em; font-size: 16px;
  box-shadow: 0 8px 20px color-mix(in srgb, var(--primaria) 18%, transparent); }
.cab-desc.slogan { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; margin-top: 3px; }

.destaque { display: grid; grid-template-columns: 1.05fr .95fr; gap: 24px; padding-top: 18px; padding-bottom: 8px; }
.destaque.sem-imagem { grid-template-columns: 1fr; }
.dq-texto, .dq-imagem { border: 1px solid color-mix(in srgb, var(--primaria) 8%, transparent);
  border-radius: calc(var(--raio) + 10px); overflow: hidden; box-shadow: var(--sombra-forte); }
.dq-texto { padding: 52px 50px; display: flex; flex-direction: column; justify-content: center; min-height: 420px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--surface) 88%, transparent),
    color-mix(in srgb, var(--secundaria) 10%, var(--surface))); }
.dq-selo { display: inline-flex; align-items: center; gap: 9px; width: max-content; max-width: 100%;
  padding: 8px 12px; border-radius: 999px; background: color-mix(in srgb, var(--primaria) 8%, transparent);
  color: var(--primaria); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
.dq-selo i { width: 7px; height: 7px; border-radius: 50%; background: var(--secundaria); flex-shrink: 0;
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--secundaria) 10%, transparent); }
.dq-titulo { font-family: var(--fonte-titulo); font-size: clamp(40px, 5.6vw, 76px); line-height: .98;
  letter-spacing: -.05em; margin: 20px 0; font-weight: 500; color: var(--ink); }
.dq-texto p { font-size: 17px; line-height: 1.65; color: var(--ink-2); max-width: 600px; margin: 0 0 26px; }
.dq-acoes { display: flex; gap: 12px; flex-wrap: wrap; }
.dq-acoes a { border-radius: calc(var(--raio) * .65); padding: 15px 21px; font-weight: 800; text-decoration: none;
  font-size: 15px; min-height: 48px; display: inline-flex; align-items: center; }
.dq-bt1 { background: var(--primaria); color: var(--primaria-texto);
  box-shadow: 0 12px 24px color-mix(in srgb, var(--primaria) 18%, transparent); }
.dq-bt2 { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.dq-imagem { position: relative; min-height: 420px;
  background: radial-gradient(circle at 50% 42%, var(--surface), color-mix(in srgb, var(--secundaria) 12%, var(--surface)) 48%,
    color-mix(in srgb, var(--secundaria) 20%, var(--surface)) 100%); }
.dq-imagem img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dq-etiqueta { position: absolute; top: 22px; left: 22px; z-index: 2; padding: 9px 12px; border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 78%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font-size: 12px; font-weight: 800; color: var(--primaria); }
@media (max-width: 900px) {
  .destaque { grid-template-columns: 1fr; gap: 14px; }
  .dq-texto { min-height: auto; padding: 38px 28px; }
  .dq-imagem { min-height: 340px; }
}
@media (max-width: 620px) {
  .dq-texto { padding: 30px 22px; border-radius: calc(var(--raio) + 2px); }
  .dq-imagem { border-radius: calc(var(--raio) + 2px); min-height: 300px; }
  .dq-titulo { font-size: 44px; }
  .dq-texto p { font-size: 15px; }
}

/* ---------- rodapé ---------- */
footer.rodape { border-top: 1px solid var(--line); color: var(--ink-2); font-size: 14px;
  /* Fundo levemente distinto da página, sem virar bloco escuro. */
  background: color-mix(in srgb, var(--ink) 4%, var(--surface)); margin-top: 32px; }
.rodape-grade { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 28px;
  padding-top: 30px; padding-bottom: 24px; align-items: start; }
.rod-marca img { width: 54px; height: 54px; border-radius: 50%; aspect-ratio: 1;
  object-fit: cover; background: #fff; border: 1px solid var(--line); margin-bottom: 10px; display: block; }
.rod-marca strong { display: block; font-size: 15px; color: var(--ink); font-weight: 650; }
.rod-marca p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.5; max-width: 42ch; }
.rod-col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink); margin: 0 0 10px; font-weight: 650; }
.rod-col ul { list-style: none; margin: 0; padding: 0; display: flex;
  flex-direction: column; gap: 8px; }
.rod-col li { font-size: 13.5px; line-height: 1.45; }
/* Links sem o amarelo sublinhado: herdam o tom do texto e só respondem ao passar. */
.rod-col a { color: inherit; text-decoration: none; }
.rod-col a:hover { color: var(--primaria); text-decoration: underline; }
.rodape-fim { border-top: 1px solid var(--line); padding-top: 14px; padding-bottom: 18px; }
.rodape-fim small { font-size: 12.5px; }
@media (max-width: 720px) {
  .rodape-grade { grid-template-columns: 1fr; gap: 22px; }
}

@media (max-width: 860px) {
  .produto { grid-template-columns: 1fr; gap: 16px; }
  .capa { height: 140px; }
}
@media (max-width: 380px) {
  .grade { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  header.topo h1 { font-size: 17px; }
  /* Tela estreita: menos respiro em volta, para o nome ficar com o máximo de
     largura possível na linha que é dele. O alvo de 44px dos ícones e a
     presença de todos eles não entram nessa conta — quem cede é o espaço
     vazio. */
  header.topo .wrap { gap: 8px 10px; padding-left: 12px; padding-right: 12px; }
  .marca-loja { gap: 10px; }
}
/* ---------- montador (#/montar) ----------
   Passos à esquerda, prévia e resumo à direita, que acompanham a rolagem. No
   celular tudo empilha: prévia, passos, resumo, e uma barra com o total. */
.mt { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 22px; align-items: start; padding: 18px 0 28px; }
.mt-cab { grid-column: 1 / -1; display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.mt-cab h1 { font-family: var(--fonte-titulo); font-size: clamp(30px, 4vw, 46px); font-weight: 500;
  letter-spacing: -.04em; margin: 0; line-height: 1.05; }
.mt-passos { background: color-mix(in srgb, var(--surface) 80%, transparent); border: 1px solid var(--line);
  border-radius: calc(var(--raio) + 4px); padding: 22px; box-shadow: var(--sombra); min-width: 0; }
.mt-passo { padding: 18px 0; border-bottom: 1px solid var(--line); }
.mt-passo:first-child { padding-top: 0; }
.mt-passo:last-child { border-bottom: 0; padding-bottom: 0; }
.mt-tit { display: flex; gap: 11px; align-items: center; margin-bottom: 14px; }
.mt-num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
  background: color-mix(in srgb, var(--secundaria) 14%, var(--surface)); color: var(--primaria); font-weight: 800; font-size: 12.5px; }
.mt-tit h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.mt-ops { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.mt-op { border: 1.5px solid var(--line); background: var(--surface); border-radius: calc(var(--raio) * .7);
  padding: 13px 14px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; min-height: 64px;
  display: flex; flex-direction: column; gap: 3px; position: relative; transition: .2s ease; }
.mt-op strong { font-size: 14.5px; }
.mt-op small { color: var(--ink-2); font-size: 12.5px; line-height: 1.3; }
/* Sobe 1px com sombra, como a .choice do protótipo. */
.mt-op:hover:not(:disabled) { border-color: color-mix(in srgb, var(--primaria) 45%, var(--line));
  transform: translateY(-1px); box-shadow: 0 8px 20px color-mix(in srgb, var(--primaria) 6%, transparent); }
.mt-op.on { border-color: var(--primaria); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primaria) 10%, transparent);
  background: color-mix(in srgb, var(--primaria) 4%, var(--surface)); }
.mt-op:disabled { opacity: .38; cursor: not-allowed; }
.mt-op:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }
.mt-qtds { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.mt-qtds .mt-op { min-height: 58px; padding: 10px 12px; align-items: flex-start; }
.mt-qtds .mt-op strong { font-size: 15px; }
.amostra { width: 22px; height: 22px; border-radius: 50%; display: inline-block; margin-bottom: 6px;
  border: 1.5px solid color-mix(in srgb, var(--ink) 22%, transparent); }
.mt-aviso { font-size: 13px; color: var(--ink-2); margin: 10px 0 0; }
.mt-aviso.forte { background: color-mix(in srgb, var(--secundaria) 9%, var(--surface)); color: var(--ink);
  border-radius: calc(var(--raio) * .6); padding: 10px 12px; }
.mt-grupo + .mt-grupo { margin-top: 16px; }
.mt-grupo h3 { font-size: 14px; margin: 0 0 8px; }
.mt-campo { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.mt-campo label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.mt-campo input, .mt-campo textarea { width: 100%; border: 1px solid var(--line); background: var(--surface);
  border-radius: calc(var(--raio) * .6); padding: 12px 13px; font: inherit; font-size: 16px; color: var(--ink); }
.mt-campo textarea { min-height: 52px; resize: vertical; }
.mt-campo textarea[rows="3"] { min-height: 88px; }
/* A prévia e o resumo acompanham a rolagem, mas cada um por si.
   Juntos eles passam de 800px e não cabem na tela abaixo da barra: com o
   bloco inteiro preso, o fim do resumo ficava fora do alcance, e ao chegar ao
   pé da coluna ele era empurrado para cima, com o título entrando por baixo do
   cabeçalho. Presos separadamente, os dois param no mesmo ponto — logo abaixo
   da barra — e o resumo, que é opaco, cobre a prévia quando alcança. */
.mt-lado { align-self: stretch; display: flex; flex-direction: column; gap: 14px; }
.mt-resumo-wrap { position: sticky; top: 88px; z-index: 2; }
.mt-previa { position: sticky; top: 88px; z-index: 1; height: 330px; border-radius: calc(var(--raio) + 6px); overflow: hidden;
  border: 1px solid color-mix(in srgb, var(--primaria) 8%, transparent); box-shadow: var(--sombra-forte);
  background: radial-gradient(circle at 50% 42%, var(--surface), color-mix(in srgb, var(--secundaria) 12%, var(--surface)) 50%,
    color-mix(in srgb, var(--secundaria) 22%, var(--surface)) 100%); }
.mt-etq { position: absolute; top: 16px; left: 16px; z-index: 6; padding: 7px 11px; border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 78%, transparent); font-size: 12px; font-weight: 800; color: var(--primaria); }
.mt-preco { position: absolute; right: 16px; bottom: 16px; z-index: 6; background: var(--primaria); color: var(--primaria-texto);
  border-radius: calc(var(--raio) * .8); padding: 10px 15px; box-shadow: 0 14px 26px color-mix(in srgb, var(--primaria) 22%, transparent); }
.mt-preco small { display: block; opacity: .82; font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; }
.mt-preco strong { font-size: 22px; letter-spacing: -.03em; }
/* O buquê: embrulho, hastes e flores posicionadas pelo JS. */
.bq { position: absolute; left: 50%; bottom: 8px; width: 300px; height: 300px; transform: translateX(-50%); }
.bq-emb { position: absolute; left: 14%; right: 14%; bottom: 2%; height: 56%; border-radius: 16px;
  background: linear-gradient(140deg, #f5e5e3, #fff7f4 52%, #eecfd4);
  clip-path: polygon(6% 0, 94% 0, 70% 100%, 30% 100%); filter: drop-shadow(0 16px 20px rgba(63,24,37,.14));
  transition: left .35s, right .35s, clip-path .35s, opacity .3s; }
.bq.cone .bq-emb { left: 28%; right: 28%; clip-path: polygon(0 0, 100% 0, 54% 100%, 46% 100%); background: linear-gradient(150deg, #efe3d2, #fffaf2 55%, #e7d6bd); }
.bq.avulsa .bq-emb { opacity: 0; }
.bq-haste { position: absolute; left: 50%; bottom: 14%; width: 5px; height: 50%; border-radius: 8px; z-index: 1;
  background: linear-gradient(#77926f, #3d6348); transform-origin: bottom; }
.bq-folha { position: absolute; width: 36px; height: 17px; background: #75906f; border-radius: 80% 10% 80% 10%; z-index: 1; }
.fl { position: absolute; width: 58px; height: 58px; border-radius: 50%; z-index: 4;
  transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 8px 10px rgba(80,24,42,.2));
  transition: opacity .28s ease, transform .38s cubic-bezier(.2,.8,.2,1), filter .25s ease, left .38s, top .38s;
  background:
    radial-gradient(circle at 50% 50%, var(--pe-esc) 0 9%, transparent 10%),
    radial-gradient(ellipse at 44% 40%, var(--pe-cla) 0 20%, transparent 21%),
    radial-gradient(ellipse at 65% 43%, var(--pe) 0 24%, transparent 25%),
    radial-gradient(ellipse at 48% 63%, var(--pe) 0 27%, transparent 28%),
    radial-gradient(ellipse at 28% 57%, var(--pe-esc) 0 23%, transparent 24%),
    radial-gradient(circle, var(--pe) 0 61%, var(--pe-esc) 62% 68%, transparent 69%); }
.fl.fora { opacity: 0; transform: translate(-50%, -44%) scale(.2); }
.fl.girassol { background:
    radial-gradient(circle, #4a2e14 0 22%, #6b4320 23% 30%, transparent 31%),
    repeating-conic-gradient(#f7c51e 0 12deg, #eaa70c 12deg 22deg, #f7c51e 22deg 30deg);
  -webkit-mask: radial-gradient(circle, #000 64%, transparent 66%); mask: radial-gradient(circle, #000 64%, transparent 66%); }
.mt-mais-fl { position: absolute; left: 16px; bottom: 16px; z-index: 6; font-size: 12px; font-weight: 700;
  background: color-mix(in srgb, var(--surface) 80%, transparent); border-radius: 999px; padding: 6px 10px; }
.mt-resumo { border-radius: calc(var(--raio) + 4px); background: var(--ink); color: #fff; padding: 22px; position: relative; overflow: hidden;
  box-shadow: var(--sombra-forte); }
.mt-resumo h2 { font-family: var(--fonte-titulo); font-size: 24px; font-weight: 500; margin: 0 0 12px; }
.mt-linha { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; font-size: 13.5px;
  border-bottom: 1px solid rgba(255,255,255,.1); }
.mt-linha span:first-child { opacity: .66; }
.mt-linha b { text-align: right; font-weight: 650; }
.mt-nota { font-size: 12px; opacity: .72; margin: 4px 0 0; line-height: 1.45; }
.mt-total { display: flex; align-items: end; justify-content: space-between; padding: 16px 0 12px; }
.mt-total span { font-size: 12px; opacity: .7; text-transform: uppercase; letter-spacing: .1em; }
.mt-total strong { font-size: 32px; letter-spacing: -.05em; }
.mt-bt { width: 100%; border: 0; border-radius: calc(var(--raio) * .7); padding: 15px; font: inherit; font-weight: 800;
  font-size: 15.5px; cursor: pointer; min-height: 52px; }
.mt-bt.claro { background: #fff; color: var(--ink); }
.mt-bt.linha { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.22); margin-top: 10px; font-weight: 700; }
.mt-bt:disabled { opacity: .5; cursor: default; }
.mt-erro { background: #FDECEA; color: #8A1C13; border-radius: calc(var(--raio) * .6); padding: 10px 12px; font-size: 13.5px; margin: 10px 0 0; }
.mt-barra { display: none; }
@media (max-width: 900px) {
  .mt { grid-template-columns: 1fr; }
  /* No celular a prévia vai para o alto e o resumo para depois dos passos:
     o aside deixa de ser caixa, e cada filho entra na ordem da grade. */
  .mt-lado { display: contents; }
  .mt-cab { order: -2; }
  /* A prévia fica presa sob o cabeçalho enquanto a pessoa escolhe: é ali que
     ela vê o buquê mudar. Mais baixa, para não tomar a tela. */
  .mt-previa { order: -1; position: sticky; top: var(--topo-h, 72px); z-index: 5; height: 200px; }
  .mt-previa .bq { transform: translateX(-50%) scale(.66); transform-origin: bottom center; }
  .mt-previa .mt-preco { padding: 8px 12px; }
  .mt-previa .mt-preco strong { font-size: 19px; }
  /* Aqui o resumo é o último bloco da página, e não uma coluna ao lado: preso
     ao topo ele cobriria os passos. */
  .mt-resumo-wrap { order: 3; position: static; }
  .mt-barra { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 42; align-items: center; gap: 12px;
    background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,.06);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .mt-barra div { display: flex; flex-direction: column; line-height: 1.2; }
  .mt-barra span { font-size: 12.5px; color: var(--ink-2); }
  .mt-barra strong { font-size: 19px; }
  .mt-barra button { margin-left: auto; flex: 0 1 220px; background: var(--primaria); color: var(--primaria-texto); border: 0;
    border-radius: var(--raio); min-height: 50px; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; }
  body.com-mt { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 620px) {
  .mt-passos { padding: 16px; }
  .mt-ops { grid-template-columns: 1fr 1fr; }
  .mt-qtds { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .bq { transform: translateX(-50%) scale(.9); transform-origin: bottom center; }
}

/* ---------- pagamento pelo Pix (#/pagar) ---------- */
.pg { max-width: 460px; margin: 0 auto; padding: 26px 0 30px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.pg h1 { font-size: 1.4rem; margin: 0; }
.pg-valor { font-size: 34px; font-weight: 800; letter-spacing: -.04em; margin: 0; }
.pg-qr { background: #fff; border: 1px solid var(--line); border-radius: var(--raio); padding: 14px; width: 240px; max-width: 100%;
  margin: 0 auto; box-shadow: var(--sombra); }
.pg-qr img { width: 100%; display: block; image-rendering: pixelated; }
.pg-cc { width: 100%; font: inherit; font-size: 13px; padding: 10px; border: 1px solid var(--line); border-radius: var(--raio);
  background: var(--ground); color: var(--ink); resize: none; min-height: 84px; word-break: break-all; }
.pg-espera { display: inline-flex; align-items: center; justify-content: center; gap: 9px; font-size: 14px; color: var(--ink-2); }
.pg-espera::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #E0A10B;
  animation: pulsa 1.4s ease-in-out infinite; }
@keyframes pulsa { 50% { opacity: .25; } }
.pg .chk-totais { text-align: left; }
.pg .bt-principal { text-decoration: none; }
/* Campos de texto, com a transição e o foco do protótipo: borda na cor
   principal a 50% e um anel de 4px. */
#busca, .chk-campo input, .chk-campo textarea, .grupo textarea, .mt-campo input, .mt-campo textarea {
  outline: 0; transition: border-color .2s, box-shadow .2s; }
#busca:focus, .chk-campo input:focus, .chk-campo textarea:focus, .grupo textarea:focus,
.mt-campo input:focus, .mt-campo textarea:focus {
  border-color: color-mix(in srgb, var(--primaria) 50%, transparent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--primaria) 6%, transparent); }
/* Redução de movimento: nada anima, e nada se desloca no hover. A cor e a
   borda da escolha continuam mudando, sem transição. */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  .mt-op:hover:not(:disabled) { transform: none; }
}
</style>
</head>
<body>

<div class="faixa" id="faixa" hidden></div>
<div class="capa" id="capa" hidden></div>

<header class="topo">
  <div class="wrap">
    <!-- O botão "← Voltar" saiu do cabeçalho. Quem leva de volta à home é a
         própria marca, que é onde se clica por hábito em qualquer site — e o
         botão do navegador continua funcionando, porque a navegação é por hash. -->
    <a class="marca-loja" href="#/" aria-label="Voltar ao início do catálogo">
      <img id="logo" class="logo" alt="" hidden>
      <span class="sigla" id="sigla" hidden aria-hidden="true"></span>
      <span class="cab-txt">
        <span class="cab-nome" id="nomeLoja">Catálogo</span>
        <span class="cab-desc" id="descLoja"></span>
      </span>
    </a>
    <!-- Status, redes e ⓘ viajam juntos num grupo só. Soltos, cada um quebrava
         de linha por conta própria e o cabeçalho virava escada; agrupados, ou
         cabem todos ao lado da marca, ou descem todos de uma vez. -->
    <div class="acoes-topo">
      <span class="status" id="statusAtend" hidden></span>
      <nav class="redes" id="redes" aria-label="Redes sociais e contato"></nav>
      <button class="info-bt" id="btInfo" aria-label="Informações da loja" title="Informações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 10.5v6"/>
          <circle cx="12" cy="7.6" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<section class="wrap destaque" id="destaque" hidden>
  <div class="dq-texto">
    <span class="dq-selo" id="dqSelo" hidden><i></i><span></span></span>
    <h2 class="dq-titulo" id="dqTitulo"></h2>
    <p id="dqTexto" hidden></p>
    <div class="dq-acoes">
      <a class="dq-bt1" id="dqBt1" href="#/" hidden></a>
      <a class="dq-bt2" id="dqBt2" target="_blank" rel="noopener noreferrer" hidden></a>
    </div>
  </div>
  <div class="dq-imagem" id="dqImagem" hidden>
    <span class="dq-etiqueta" id="dqEtiqueta" hidden></span>
    <img id="dqImg" alt="">
  </div>
</section>

<div class="wrap" id="cabecalhoBusca">
  <div class="status-linha"><span class="status" id="statusAtendMobile" hidden></span></div>
  <div class="busca-linha">
    <span class="busca-caixa">
      <input type="search" id="busca" placeholder="Buscar produto" aria-label="Buscar"
             oninput="pintarHome()">
      <svg class="busca-lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    </span>
  </div>
  <nav class="nav-cats" id="navCats" aria-label="Categorias" hidden></nav>
</div>

<main class="wrap" id="conteudo"></main>

<!-- Como receber: a escolha do serviço e o Continuar, no fluxo da página,
     logo abaixo dos itens da sacola.

     Fica FORA de #conteudo de propósito. `pintarSacola` reescreve o
     innerHTML do conteúdo a cada mudança de quantidade, e a barra aqui
     dentro seria recriada junto — perdendo o foco de quem navega por
     teclado no meio de um ajuste. O conteúdo dela é montado por
     `pintarBarraAtendimento`, que troca só o que mudou. -->
<div class="wrap">
  <div class="barra-atend" id="barraAtend" hidden>
    <div class="dentro" id="barraAtendDentro"></div>
  </div>
</div>

<!-- As sugestões vêm DEPOIS da escolha de receber: acima dela, pareciam
     parte do caminho até o pagamento. Fora de #conteudo pelo mesmo motivo da
     barra — e porque é este o lugar delas na página. -->
<section class="wrap secao" id="secSugestoes" hidden>
  <h2>Aproveite e leve também</h2>
  <div class="grade" id="sugestoes"></div>
</section>

<footer class="rodape">
  <div class="wrap rodape-grade">
    <div class="rod-marca">
      <img id="rodLogo" alt="" hidden>
      <strong id="rodNome"></strong>
      <p id="rodDesc"></p>
    </div>
    <div class="rod-col" id="rodContatoCol" hidden>
      <h2>Contato</h2>
      <ul id="rodContato"></ul>
    </div>
    <div class="rod-col" id="rodRedesCol" hidden>
      <h2>Redes sociais</h2>
      <nav class="redes" id="rodRedes" aria-label="Redes sociais"></nav>
    </div>
  </div>
  <div class="wrap rodape-fim"><small id="rodCopy"></small></div>
</footer>

<!-- Painel Informações: folha lateral no desktop, folha de baixo no celular.
     Montado só com dado real do tenant; seção sem dado não é desenhada. -->
<div class="info-bg" id="infoBg" hidden>
  <aside class="info-painel" role="dialog" aria-modal="true" aria-labelledby="infoTitulo">
    <header class="info-cab">
      <h2 id="infoTitulo">Informações</h2>
      <button class="info-fechar" id="btInfoFechar" aria-label="Fechar">×</button>
    </header>
    <div class="info-corpo" id="infoCorpo"></div>
  </aside>
</div>

<div class="barra" id="barra" hidden>
  <div class="dentro">
    <div class="resumo">
      <span id="barraQtd">0 produtos</span>
      <strong id="barraTotal">R$ 0,00</strong>
    </div>
    <button class="ver" id="barraVer">Ver meu pedido</button>
  </div>
</div>

<script src="/loja/tema.js"></script>
<script src="/loja/catalogo.js"></script>
</body>
</html>
