<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fornecedores · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Fornecedores</h1>
      <small>Cadastro de fornecedores — usado em <a href="/compras/pedidos.html">Pedidos de Compra</a> e na entrada de <a href="/catalogo/produtos.html">Produtos</a></small>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="abrirNovo()">+ Novo fornecedor</button>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="panel">
    <div class="toolbar">
      <input type="text" id="filtBusca" placeholder="Buscar por CNPJ, razão social ou nome fantasia…" oninput="render()" style="flex:1;min-width:240px;">
      <select id="filtAtivo" onchange="render()">
        <option value="1">Apenas ativos</option>
        <option value="">Ativos e inativos</option>
        <option value="0">Apenas inativos</option>
      </select>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>CNPJ/CPF</th>
          <th>Razão social</th>
          <th>Nome fantasia</th>
          <th>Cidade/UF</th>
          <th>Telefone</th>
          <th>Status</th>
          <th></th>
        </tr></thead>
        <tbody id="tb"><tr><td colspan="7" class="empty">Carregando…</td></tr></tbody>
      </table>
    </div>
  </div>
</main></div>

<div class="modal-bg" id="modal">
  <div class="modal" style="max-width:760px;">
    <div class="modal-header">
      <div>
        <h3 style="margin:0;" id="mTitulo">Novo fornecedor</h3>
        <small class="muted">Identificação, endereço e contato</small>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="fecharModal()" title="Fechar" style="font-size:1.2em;line-height:1;padding:4px 10px;">×</button>
    </div>

    <input type="hidden" id="fId">

    <h4 style="margin:8px 0 4px;">Identificação</h4>
    <div class="form-row">
      <div class="form-group" style="flex:0 0 200px;">
        <label>CNPJ/CPF *</label>
        <input type="text" id="fCpfCnpj" placeholder="00.000.000/0000-00">
      </div>
      <div class="form-group" style="flex:0 0 140px;">
        <label>Tipo</label>
        <select id="fTipo">
          <option value="J">Pessoa Jurídica</option>
          <option value="F">Pessoa Física</option>
        </select>
      </div>
      <div class="form-group" style="flex:1;min-width:240px;">
        <label>Razão social / Nome *</label>
        <input type="text" id="fRazaoSocial" placeholder="Nome jurídico">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1;min-width:240px;">
        <label>Nome fantasia</label>
        <input type="text" id="fNomeFantasia">
      </div>
      <div class="form-group" style="flex:0 0 180px;">
        <label>Inscrição estadual</label>
        <input type="text" id="fInscricaoEstadual">
      </div>
      <div class="form-group" style="flex:0 0 180px;">
        <label>Inscrição municipal</label>
        <input type="text" id="fInscricaoMunicipal">
      </div>
    </div>

    <h4 style="margin:14px 0 4px;">Endereço</h4>
    <div class="form-row">
      <div class="form-group" style="flex:0 0 140px;">
        <label>CEP</label>
        <input type="text" id="fCep">
      </div>
      <div class="form-group" style="flex:1;min-width:200px;">
        <label>Logradouro</label>
        <input type="text" id="fEndereco">
      </div>
      <div class="form-group" style="flex:0 0 100px;">
        <label>Número</label>
        <input type="text" id="fNumero">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1;min-width:160px;">
        <label>Complemento</label>
        <input type="text" id="fComplemento">
      </div>
      <div class="form-group" style="flex:1;min-width:160px;">
        <label>Bairro</label>
        <input type="text" id="fBairro">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1;min-width:200px;">
        <label>Cidade</label>
        <input type="text" id="fCidade">
      </div>
      <div class="form-group" style="flex:0 0 80px;">
        <label>UF</label>
        <input type="text" id="fUf" maxlength="2" style="text-transform:uppercase;">
      </div>
      <div class="form-group" style="flex:0 0 140px;">
        <label>Cód. município</label>
        <input type="text" id="fCodigoMunicipio">
      </div>
    </div>

    <h4 style="margin:14px 0 4px;">Contato</h4>
    <div class="form-row">
      <div class="form-group" style="flex:0 0 200px;">
        <label>Telefone</label>
        <input type="text" id="fTelefone">
      </div>
      <div class="form-group" style="flex:1;min-width:200px;">
        <label>E-mail</label>
        <input type="email" id="fEmail">
      </div>
      <div class="form-group" style="flex:1;min-width:160px;">
        <label>Pessoa de contato</label>
        <input type="text" id="fContato">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Observações</label>
        <textarea id="fObservacoes" rows="2"></textarea>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('fornecedores');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
function escTxt(s){ const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }
function fmtCnpj(s){
  const v = String(s||'').replace(/\D/g,'');
  if (v.length === 14) return v.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
  if (v.length === 11) return v.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
  return s || '';
}

let cache = [];

async function carregar(){
  const tb = document.getElementById('tb');
  tb.innerHTML = '<tr><td colspan="7" class="empty">Carregando…</td></tr>';
  try {
    const ativo = document.getElementById('filtAtivo').value;
    const url = ativo === '' ? '/api/fornecedores?ativo=1&_all=1' : '/api/fornecedores?ativo=' + ativo;
    const r = await fetch(ativo === '' ? '/api/fornecedores' : '/api/fornecedores?ativo=' + ativo);
    if (r.status === 401) { window.location.href = '/login.html'; return; }
    const d = await r.json();
    if (!d.success) throw new Error(d.error||'falha');
    cache = d.fornecedores || [];
    render();
  } catch (e) { tb.innerHTML = '<tr><td colspan="7" class="empty">Erro: '+escTxt(e.message)+'</td></tr>'; }
}

function render(){
  const q = (document.getElementById('filtBusca').value || '').toLowerCase().trim();
  const lista = q
    ? cache.filter(f =>
        (f.cpfCnpj||'').toLowerCase().includes(q) ||
        (f.razaoSocial||'').toLowerCase().includes(q) ||
        (f.nomeFantasia||'').toLowerCase().includes(q))
    : cache;
  const tb = document.getElementById('tb');
  if (!lista.length) { tb.innerHTML = '<tr><td colspan="7" class="empty">Nenhum fornecedor</td></tr>'; return; }
  tb.innerHTML = lista.map(f => {
    const ativo = Number(f.ativo) === 1;
    const cidUf = [f.cidade, f.uf].filter(Boolean).join('/');
    const acoes = ativo
      ? `<button class="btn btn-ghost btn-sm" onclick='editar(${f.id})'>Editar</button>
         <button class="btn btn-ghost btn-sm" onclick='inativar(${f.id})'>Inativar</button>`
      : `<button class="btn btn-ghost btn-sm" onclick='editar(${f.id})'>Ver</button>`;
    return `<tr>
      <td class="mono">${escTxt(fmtCnpj(f.cpfCnpj))}</td>
      <td><strong>${escTxt(f.razaoSocial)}</strong></td>
      <td>${escTxt(f.nomeFantasia||'—')}</td>
      <td>${escTxt(cidUf||'—')}</td>
      <td>${escTxt(f.telefone||'—')}</td>
      <td>${ativo ? '<span class="badge success">ativo</span>' : '<span class="badge muted">inativo</span>'}</td>
      <td style="white-space:nowrap;">${acoes}</td>
    </tr>`;
  }).join('');
}

function setForm(f){
  document.getElementById('fId').value = f.id || '';
  document.getElementById('fCpfCnpj').value = f.cpfCnpj || '';
  document.getElementById('fTipo').value = f.tipo || 'J';
  document.getElementById('fRazaoSocial').value = f.razaoSocial || '';
  document.getElementById('fNomeFantasia').value = f.nomeFantasia || '';
  document.getElementById('fInscricaoEstadual').value = f.inscricaoEstadual || '';
  document.getElementById('fInscricaoMunicipal').value = f.inscricaoMunicipal || '';
  document.getElementById('fCep').value = f.cep || '';
  document.getElementById('fEndereco').value = f.endereco || '';
  document.getElementById('fNumero').value = f.numero || '';
  document.getElementById('fComplemento').value = f.complemento || '';
  document.getElementById('fBairro').value = f.bairro || '';
  document.getElementById('fCidade').value = f.cidade || '';
  document.getElementById('fUf').value = f.uf || '';
  document.getElementById('fCodigoMunicipio').value = f.codigoMunicipio || '';
  document.getElementById('fTelefone').value = f.telefone || '';
  document.getElementById('fEmail').value = f.email || '';
  document.getElementById('fContato').value = f.contato || '';
  document.getElementById('fObservacoes').value = f.observacoes || '';
}

function abrirNovo(){
  setForm({});
  document.getElementById('mTitulo').textContent = 'Novo fornecedor';
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('fCpfCnpj').focus(), 50);
}

async function editar(id){
  try {
    const r = await fetch('/api/fornecedores/' + id);
    const d = await r.json();
    if (!d.success) throw new Error(d.error||'falha');
    setForm(d.fornecedor);
    document.getElementById('mTitulo').textContent = 'Editar fornecedor';
    document.getElementById('modal').classList.add('open');
  } catch (e) { showAlert('Erro: '+e.message,'error'); }
}

function fecharModal(){ document.getElementById('modal').classList.remove('open'); }

function lerForm(){
  return {
    cpfCnpj: document.getElementById('fCpfCnpj').value.trim(),
    tipo: document.getElementById('fTipo').value,
    razaoSocial: document.getElementById('fRazaoSocial').value.trim(),
    nomeFantasia: document.getElementById('fNomeFantasia').value.trim() || null,
    inscricaoEstadual: document.getElementById('fInscricaoEstadual').value.trim() || null,
    inscricaoMunicipal: document.getElementById('fInscricaoMunicipal').value.trim() || null,
    cep: document.getElementById('fCep').value.trim() || null,
    endereco: document.getElementById('fEndereco').value.trim() || null,
    numero: document.getElementById('fNumero').value.trim() || null,
    complemento: document.getElementById('fComplemento').value.trim() || null,
    bairro: document.getElementById('fBairro').value.trim() || null,
    cidade: document.getElementById('fCidade').value.trim() || null,
    uf: (document.getElementById('fUf').value.trim() || null)?.toUpperCase() || null,
    codigoMunicipio: document.getElementById('fCodigoMunicipio').value.trim() || null,
    telefone: document.getElementById('fTelefone').value.trim() || null,
    email: document.getElementById('fEmail').value.trim() || null,
    contato: document.getElementById('fContato').value.trim() || null,
    observacoes: document.getElementById('fObservacoes').value.trim() || null
  };
}

async function salvar(){
  const id = document.getElementById('fId').value;
  const dados = lerForm();
  if (!dados.cpfCnpj) return showAlert('CNPJ/CPF obrigatório', 'error');
  if (!dados.razaoSocial) return showAlert('Razão social obrigatória', 'error');
  try {
    const url = id ? '/api/fornecedores/' + id : '/api/fornecedores';
    const method = id ? 'PUT' : 'POST';
    const r = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(dados) });
    const d = await r.json();
    if (!d.success) {
      if (d.fornecedor) return showAlert('CNPJ já cadastrado para "'+d.fornecedor.razaoSocial+'"','error');
      throw new Error(d.error||'falha');
    }
    showAlert(id ? 'Fornecedor atualizado' : 'Fornecedor cadastrado');
    fecharModal();
    await carregar();
  } catch (e) { showAlert('Erro: '+e.message,'error'); }
}

async function inativar(id){
  if (!confirm('Inativar este fornecedor?')) return;
  try {
    const r = await fetch('/api/fornecedores/' + id, { method:'DELETE' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error||'falha');
    showAlert('Fornecedor inativado');
    await carregar();
  } catch (e) { showAlert('Erro: '+e.message,'error'); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('open')) fecharModal();
});

carregar();
</script>
</body>
</html>
