<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faturas - Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Faturas</h1>
      <small>Faturamento comercial (sem valor fiscal — Fase 1 de NF-e)</small>
    </div>
  </div>
  <div id="alertGlobal"></div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="filtros">
    <input type="text" id="filtBusca" placeholder="Buscar por nº fatura, pedido, cliente..." oninput="carregar()" style="flex:1;min-width:250px;">
    <select id="filtStatus" onchange="carregar()">
      <option value="">Todos status fatura</option>
      <option value="emitida">Emitidas</option>
      <option value="cancelada">Canceladas</option>
    </select>
    <select id="filtNFe" onchange="carregar()" title="Status fiscal SEFAZ">
      <option value="">Todas NF-e</option>
      <option value="autorizada">✓ Com NF-e autorizada</option>
      <option value="sem">Sem NF-e emitida</option>
      <option value="rejeitada">Rejeitada SEFAZ</option>
      <option value="cancelada_sefaz">Cancelada SEFAZ</option>
    </select>
    <input type="date" id="filtDataInicio" onchange="carregar()" title="Emissão de">
    <input type="date" id="filtDataFim" onchange="carregar()" title="Emissão até">
    <button class="btn btn-secondary btn-sm" onclick="baixarZip()" title="Baixa ZIP com XMLs + DANFEs do filtro atual">Baixar ZIP do período</button>
  </div>

  <div class="panel"><div class="table-container">
    <table>
      <thead><tr>
        <th>Nº Fatura</th><th>Pedido</th><th>Cliente</th><th>Emissão</th>
        <th>Total</th><th>Fatura</th><th>CR</th><th>NF-e</th><th></th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div></div>
</main></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('faturas');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
function fmt(v){ return (v==null||isNaN(v))?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function val(id){ return document.getElementById(id).value; }

async function carregar(){
  const p = new URLSearchParams();
  if(val('filtBusca')) p.set('busca', val('filtBusca'));
  if(val('filtStatus')) p.set('status', val('filtStatus'));
  if(val('filtDataInicio')) p.set('dataInicio', val('filtDataInicio'));
  if(val('filtDataFim')) p.set('dataFim', val('filtDataFim'));
  try {
    const r = await fetch('/api/faturas?'+p);
    const d = await r.json();
    if(!d.success) throw new Error(d.error);
    // Filtro cliente-side por status NF-e
    const filtNFe = val('filtNFe');
    let faturas = d.faturas;
    if (filtNFe === 'sem') faturas = faturas.filter(f => !f.statusSefaz);
    else if (filtNFe === 'autorizada') faturas = faturas.filter(f => f.statusSefaz === 'autorizada');
    else if (filtNFe === 'rejeitada') faturas = faturas.filter(f => f.statusSefaz === 'rejeitada');
    else if (filtNFe === 'cancelada_sefaz') faturas = faturas.filter(f => f.statusSefaz === 'cancelada_sefaz');
    window.__faturasCache = faturas;
    render(faturas);
    renderKpis(faturas);
  } catch(e){ showAlert('Erro: '+e.message,'error'); }
}

function renderKpis(faturas){
  const emitidas = faturas.filter(f=>f.status==='emitida');
  const totalEmitido = emitidas.reduce((s,f)=>s+(f.valorTotal||0),0);
  const pagas = emitidas.filter(f=>f.contaReceberStatus==='paga');
  const recebido = pagas.reduce((s,f)=>s+(f.valorTotal||0),0);
  const aReceber = totalEmitido - recebido;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Total Faturas</div><div class="value">${faturas.length}</div></div>
    <div class="kpi"><div class="label">Emitidas</div><div class="value">${emitidas.length}</div></div>
    <div class="kpi"><div class="label">Valor Emitido</div><div class="value">R$ ${fmt(totalEmitido)}</div></div>
    <div class="kpi"><div class="label">Recebido</div><div class="value">R$ ${fmt(recebido)}</div></div>
    <div class="kpi"><div class="label">A Receber</div><div class="value">R$ ${fmt(aReceber)}</div></div>`;
}

function render(faturas){
  const tb = document.getElementById('tb');
  if(!faturas.length){
    tb.innerHTML = '<tr><td colspan="9" class="empty">Nenhuma fatura</td></tr>';
    return;
  }
  tb.innerHTML = faturas.map(f=>{
    // Operação não-fiscal (Natureza de Operação com emiteNFe=0) → badge "interna",
    // independente de statusSefaz. Cobre OS-INTERNA, OS-GARANTIA e quaisquer
    // tipos de operação com emiteNFe=0 cadastrados em Tipos de Operação.
    const ehInterna = f.tipoOperacaoEmiteNFe === 0;
    let nfeBadge;
    if (ehInterna) {
      nfeBadge = `<span class="badge" title="Natureza de Operação não emite NF-e (${f.tipoOperacaoCodigo||'interna'})">interna</span>`;
    } else if (!f.statusSefaz) {
      nfeBadge = '<span class="muted">—</span>';
    } else {
      nfeBadge = `<span class="badge ${f.statusSefaz==='autorizada'?'pago':f.statusSefaz==='cancelada_sefaz'?'cancelada':'vencida'}">${f.statusSefaz==='autorizada'?'autorizada':f.statusSefaz==='cancelada_sefaz'?'cancel. SEFAZ':'rejeitada'}</span>${f.numeroNFe?' <small class="muted">#'+f.numeroNFe+'</small>':''}`;
    }
    const acoesNFe = f.statusSefaz==='autorizada'
      ? ` <a href="/api/faturas/${f.id}/danfe" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none;">DANFE</a> <a href="/api/faturas/${f.id}/xml" class="btn btn-ghost btn-sm" style="text-decoration:none;">XML</a>`
      : '';
    return `<tr>
    <td><strong>${f.numero}</strong></td>
    <td>${f.pedidoNumero || '-'}</td>
    <td>${f.clienteNome || '-'}</td>
    <td>${f.dataEmissao}</td>
    <td>R$ ${fmt(f.valorTotal)}</td>
    <td><span class="badge ${f.status}">${f.status}</span></td>
    <td>${f.contaReceberStatus ? `<span class="badge ${f.contaReceberStatus}">${f.contaReceberStatus}</span>` : '-'}</td>
    <td>${nfeBadge}</td>
    <td style="text-align:right;white-space:nowrap;">
      <a href="/api/faturas/${f.id}/pdf" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none;">Fatura PDF</a>${acoesNFe}
      ${(f.status==='emitida' || (f.statusSefaz==='autorizada' && f.chaveAcesso)) ? ` <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="cancelarFatura(${f.id})">Cancelar</button>` : ''}
    </td>
  </tr>`;}).join('');
}

function baixarZip(){
  const p = new URLSearchParams();
  if(val('filtDataInicio')) p.set('dataInicio', val('filtDataInicio'));
  if(val('filtDataFim')) p.set('dataFim', val('filtDataFim'));
  const filtNFe = val('filtNFe');
  if (filtNFe === 'autorizada' || filtNFe === 'cancelada_sefaz' || filtNFe === 'rejeitada') p.set('status', filtNFe);
  window.open('/api/nfe/export-zip?'+p.toString(), '_blank');
}

// Cancelamento de fatura — botão único cobre 3 casos (backend separa funções):
//   A) só fatura local (sem NF-e autorizada)         → confirm padrão
//   B) fatura local + NF-e autorizada                → prompt motivo, cancela ambas
//   C) só NF-e autorizada (fatura local já cancelada) → prompt motivo, cancela só na SEFAZ
async function cancelarFatura(id){
  const f = (window.__faturasCache || []).find(x => x.id === id);
  const temNFe = f && f.statusSefaz === 'autorizada' && f.chaveAcesso;
  const faturaJaCancelada = f && f.status === 'cancelada';

  let motivo = null;
  let mensagemSucesso = 'Fatura cancelada';

  if (faturaJaCancelada && temNFe) {
    // Caso C: só NF-e
    motivo = prompt('A fatura já está cancelada localmente, mas a NF-e ainda está autorizada na SEFAZ. Informe o motivo do cancelamento da NF-e (mínimo 15 caracteres):');
    if (motivo === null) return;
    mensagemSucesso = 'NF-e cancelada na SEFAZ';
  } else if (temNFe) {
    // Caso B: fatura + NF-e
    motivo = prompt('Esta fatura tem NF-e autorizada na SEFAZ. A NF-e será cancelada junto com a fatura. Informe o motivo (mínimo 15 caracteres):');
    if (motivo === null) return;
    mensagemSucesso = 'Fatura e NF-e canceladas';
  } else {
    // Caso A: só fatura
    if (!confirm('Cancelar fatura? A conta a receber também será cancelada e o pedido voltará para "rascunho".')) return;
  }

  if (motivo !== null && motivo.trim().length < 15) {
    showAlert('Motivo precisa ter pelo menos 15 caracteres', 'error');
    return;
  }

  try {
    const r = await fetch('/api/faturas/'+id+'/cancelar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ motivo: motivo || undefined }),
    });
    const d = await r.json();
    if (!d.success) {
      // Backend pediu motivo (cache local desatualizado)
      if (d.requerMotivo) {
        const m2 = prompt('Esta fatura tem NF-e autorizada. Informe o motivo (mín. 15 caracteres):');
        if (m2 === null || m2.trim().length < 15) return;
        const r2 = await fetch('/api/faturas/'+id+'/cancelar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ motivo: m2 }),
        });
        const d2 = await r2.json();
        if (!d2.success) throw new Error(d2.error);
        showAlert(mensagemSucesso);
        carregar();
        return;
      }
      throw new Error(d.error);
    }
    showAlert(mensagemSucesso);
    carregar();
  } catch (e) { showAlert('Erro: ' + e.message, 'error'); }
}

carregar();
</script>
</body></html>
