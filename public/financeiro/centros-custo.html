<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centros de Custo · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Centros de Custo</h1>
      <small>Departamentos e projetos para classificar lançamentos</small>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="abrirNovo()">+ Novo centro</button>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="tbl-wrap">
    <table>
      <thead><tr><th>Código</th><th>Nome</th><th>Descrição</th><th></th></tr></thead>
      <tbody id="tb"><tr><td colspan="4" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<div class="modal-bg" id="modal">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <div>
        <h3 id="mTit" style="margin:0;">Novo centro</h3>
        <small class="muted">Departamento ou projeto para classificar lançamentos</small>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="fecharModal()" title="Fechar" style="font-size:1.2em;line-height:1;padding:4px 10px;">×</button>
    </div>
    <input type="hidden" id="fId">
    <div class="form-row">
      <div class="form-group" style="flex:1;"><label>Código</label><input type="text" id="fCod" placeholder="Ex.: 01"></div>
      <div class="form-group" style="flex:2;"><label>Nome *</label><input type="text" id="fNome"></div>
    </div>
    <div class="form-row">
      <div class="form-group full-width"><label>Descrição</label><textarea id="fDesc" rows="2"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('centros-custo');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }

async function carregar(){
  const r = await fetch('/api/centros-custo');
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  const tb = document.getElementById('tb');
  tb.innerHTML = d.centros.length ? d.centros.map(c=>`<tr>
    <td class="mono">${c.codigo||'—'}</td>
    <td><strong>${c.nome}</strong></td>
    <td>${c.descricao||'—'}</td>
    <td style="text-align:right;white-space:nowrap;">
      <button class="btn btn-ghost btn-sm" onclick='editar(${JSON.stringify(c)})'>Editar</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="excluir(${c.id})">Desativar</button>
    </td>
  </tr>`).join('') : '<tr><td colspan="4" class="empty">Nenhum centro</td></tr>';
}
function abrirNovo(){
  document.getElementById('mTit').textContent='Novo centro';
  document.getElementById('fId').value='';
  ['fCod','fNome','fDesc'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('modal').classList.add('open');
}
function editar(c){
  document.getElementById('mTit').textContent='Editar centro';
  document.getElementById('fId').value=c.id;
  document.getElementById('fCod').value=c.codigo||'';
  document.getElementById('fNome').value=c.nome;
  document.getElementById('fDesc').value=c.descricao||'';
  document.getElementById('modal').classList.add('open');
}
function fecharModal(){ document.getElementById('modal').classList.remove('open'); }
async function salvar(){
  const id = document.getElementById('fId').value;
  const body = {
    codigo: document.getElementById('fCod').value.trim() || null,
    nome:   document.getElementById('fNome').value.trim(),
    descricao: document.getElementById('fDesc').value.trim() || null
  };
  if (!body.nome) return showAlert('Informe o nome','error');
  const url = id ? '/api/centros-custo/'+id : '/api/centros-custo';
  const r = await fetch(url, { method: id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  showAlert(id?'Centro atualizado':'Centro criado');
  fecharModal();
  carregar();
}
async function excluir(id){
  if (!confirm('Desativar este centro?')) return;
  const r = await fetch('/api/centros-custo/'+id, { method:'DELETE' });
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  carregar();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('open')) fecharModal();
});

carregar();
</script>
</body></html>
