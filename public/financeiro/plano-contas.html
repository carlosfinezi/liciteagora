<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plano de Contas · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
<style>
.tree-row { padding:6px 10px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.tree-row:last-child { border-bottom:none; }
.tree-row .codigo { font-family:'SF Mono', Menlo, Monaco, 'Courier New', monospace; color:var(--text-2); min-width:60px; font-size:0.88em; }
.tree-row .acoes { margin-left:auto; display:flex; gap:6px; }
.tree-nivel-2 { padding-left:32px; }
.tree-nivel-3 { padding-left:64px; }
.tree-nivel-4 { padding-left:96px; }
.tipo-tag { font-size:0.72em; padding:2px 8px; border-radius:999px; background:var(--bg-3); color:var(--text-2); text-transform:uppercase; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Plano de Contas</h1>
      <small>Estrutura hierárquica do plano gerencial usado no DRE</small>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="abrirNovo()">+ Nova conta</button>
    </div>
  </div>

  <div id="alertGlobal"></div>
  <div id="treeContainer" class="card">Carregando…</div>
</main></div>

<!-- Modal -->
<div class="modal-bg" id="modal">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header">
      <div>
        <h3 id="mTit" style="margin:0;">Nova conta</h3>
        <small class="muted">Código, nome, tipo e posição hierárquica</small>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="fecharModal()" title="Fechar" style="font-size:1.2em;line-height:1;padding:4px 10px;">×</button>
    </div>
    <input type="hidden" id="fId">
    <div class="form-row">
      <div class="form-group" style="flex:1;">
        <label>Código *</label>
        <input type="text" id="fCodigo" placeholder="Ex.: 4.6">
      </div>
      <div class="form-group" style="flex:1;">
        <label>Tipo *</label>
        <select id="fTipo"></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Nome *</label>
        <input type="text" id="fNome">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Conta-pai (opcional)</label>
        <select id="fParent"><option value="">— raiz —</option></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Ordem</label>
        <input type="number" id="fOrdem" value="0">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('plano-contas');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
let TIPOS = [];
let PLANO = [];

async function carregar(){
  const r = await fetch('/api/plano-contas');
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  TIPOS = d.tipos; PLANO = d.plano;
  document.getElementById('fTipo').innerHTML = TIPOS.map(t=>`<option>${t}</option>`).join('');
  document.getElementById('fParent').innerHTML = '<option value="">— raiz —</option>' + d.plano.map(c=>`<option value="${c.id}">${c.codigo} ${c.nome}</option>`).join('');
  let html = '';
  function row(n) {
    html += `<div class="tree-row tree-nivel-${n.nivel}">
      <span class="codigo">${n.codigo}</span>
      <span>${n.nome}</span>
      <span class="tipo-tag">${n.tipo}</span>
      <span class="acoes">
        <button class="btn btn-ghost btn-sm" onclick='editar(${JSON.stringify(n)})'>Editar</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="excluir(${n.id})">Desativar</button>
      </span>
    </div>`;
    n.children.forEach(row);
  }
  d.arvore.forEach(row);
  document.getElementById('treeContainer').innerHTML = html || '<div class="muted" style="padding:20px;">Nenhuma conta</div>';
}

function abrirNovo(){
  document.getElementById('mTit').textContent='Nova conta';
  document.getElementById('fId').value='';
  ['fCodigo','fNome'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fOrdem').value='0';
  document.getElementById('fParent').value='';
  document.getElementById('modal').classList.add('open');
}
function editar(n){
  document.getElementById('mTit').textContent='Editar conta';
  document.getElementById('fId').value=n.id;
  document.getElementById('fCodigo').value=n.codigo;
  document.getElementById('fNome').value=n.nome;
  document.getElementById('fTipo').value=n.tipo;
  document.getElementById('fOrdem').value=n.ordem;
  document.getElementById('fParent').value=n.parentId||'';
  document.getElementById('fParent').disabled = true; // não permite mudar pai por simplicidade
  document.getElementById('modal').classList.add('open');
}
function fecharModal(){ document.getElementById('modal').classList.remove('open'); document.getElementById('fParent').disabled = false; }

async function salvar(){
  const id = document.getElementById('fId').value;
  const body = {
    codigo: document.getElementById('fCodigo').value.trim(),
    nome: document.getElementById('fNome').value.trim(),
    tipo: document.getElementById('fTipo').value,
    ordem: Number(document.getElementById('fOrdem').value)||0
  };
  if (!body.codigo || !body.nome) return showAlert('Código e nome obrigatórios','error');
  if (!id) {
    const parent = document.getElementById('fParent').value;
    body.parentId = parent ? Number(parent) : null;
  }
  try {
    const url = id ? '/api/plano-contas/'+id : '/api/plano-contas';
    const r = await fetch(url, { method: id?'PUT':'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    showAlert(id?'Conta atualizada':'Conta criada');
    fecharModal();
    carregar();
  } catch(e) { showAlert('Erro: '+e.message,'error'); }
}

async function excluir(id){
  if (!confirm('Desativar esta conta?')) return;
  const r = await fetch('/api/plano-contas/'+id, { method:'DELETE' });
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  showAlert('Desativada');
  carregar();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('open')) fecharModal();
});

carregar();
</script>
</body></html>
