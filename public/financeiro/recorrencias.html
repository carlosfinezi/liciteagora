<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorrencias NFSe - Licite Agora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/app-modern.css">
    <style>
        .valor-display { font-size: 1.1em; font-weight: 700; color: var(--accent); }
    </style>
</head>
<body>
<div class="layout">
    <main class="main-content">
        <div class="page-header">
          <div>
            <h1>Recorrências NFS-e</h1>
            <small>Emissão automática mensal de NFS-e + boleto + e-mail</small>
          </div>
          <div class="actions">
            <button class="btn btn-primary btn-sm" onclick="abrirNova()">+ Nova recorrência</button>
            <button class="btn btn-secondary btn-sm" onclick="executarTodas()">⚡ Executar todas (mês atual)</button>
          </div>
        </div>

        <div id="alertBox"></div>

        <div class="tabs">
            <button class="tab active" data-tab="lista">Recorrências</button>
        </div>

        <!-- ABA: LISTA -->
        <div id="tab-lista" class="tab-content active">
            <div class="panel">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Servico</th>
                                <th>Valor</th>
                                <th>Boleto</th>
                                <th>Email</th>
                                <th>Ultima Emissao</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tabelaRecorrencias"></tbody>
                    </table>
                </div>
                <div id="listaVazia" class="empty-state" style="display:none;">
                    <div class="icon">🔄</div>
                    <p>Nenhuma recorrencia cadastrada</p>
                </div>
            </div>
        </div>

    </main>
</div>

<div class="modal-bg" id="modalRec">
  <div class="modal" style="max-width:760px;">
    <div class="modal-header">
      <div><h3 style="margin:0;" id="recTitulo">Nova recorrência</h3>
        <small class="muted">Emite NFS-e todo mês para o mesmo cliente</small></div>
      <button class="btn btn-ghost btn-sm" onclick="fecharRec()" style="font-size:1.2em;padding:4px 10px;">×</button>
    </div>
    <input type="hidden" id="rId">

    <div class="form-row">
      <div class="form-group full-width"><label>Cliente *</label>
        <select id="rPessoa"></select></div>
    </div>
    <div class="form-row">
      <div class="form-group full-width"><label>Descrição do serviço *</label>
        <textarea id="rDescricao" rows="2" placeholder="Ex.: Mensalidade de suporte técnico"></textarea></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Valor do serviço (R$) *</label>
        <input type="number" id="rValor" step="0.01" min="0.01"></div>
      <div class="form-group"><label>Código de tributação nacional *</label>
        <input type="text" id="rCodTrib" placeholder="Ex.: 010101"></div>
      <div class="form-group"><label>Item da lista de serviço</label>
        <input type="text" id="rCodLista" placeholder="Ex.: 01.01"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Alíquota (%)</label><input type="number" id="rAliquota" step="0.01" min="0"></div>
      <div class="form-group"><label>Deduções (R$)</label><input type="number" id="rDeducoes" step="0.01" min="0"></div>
      <div class="form-group"><label>Dia de vencimento</label>
        <input type="number" id="rDiaVenc" min="1" max="31" value="10"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="rGerarBoleto" style="width:auto;"> Gerar boleto</label>
      </div>
      <div class="form-group">
        <label style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="rEnviarEmail" style="width:auto;"> Enviar por e-mail</label>
      </div>
      <div class="form-group">
        <label style="display:flex;gap:6px;align-items:center;">
          <input type="checkbox" id="rAtivo" style="width:auto;" checked> Ativa</label>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width"><label>Observações</label>
        <textarea id="rObs" rows="2"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharRec()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarRec()">Salvar</button>
    </div>
  </div>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('recorrencias');</script>

<script>
// ==================== TABS ====================
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
});

// ==================== ALERT ====================
function showAlert(msg, type = 'info') {
    const box = document.getElementById('alertBox');
    box.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => { box.innerHTML = ''; }, 5000);
}

// ==================== RECORRENCIAS ====================
async function carregarRecorrencias() {
    try {
        const resp = await fetch('/api/recorrencias');
        const data = await resp.json();
        if (!data.success) throw new Error(data.error);

        const tbody = document.getElementById('tabelaRecorrencias');
        const vazio = document.getElementById('listaVazia');

        if (!data.recorrencias.length) {
            tbody.innerHTML = '';
            vazio.style.display = 'block';
            return;
        }

        vazio.style.display = 'none';
        tbody.innerHTML = data.recorrencias.map(r => `
            <tr>
                <td>
                    <div style="font-weight:600;">${esc(r.pessoaNome)}</div>
                    <div style="color:#888;font-size:0.85em;">${formatDoc(r.pessoaCpfCnpj)}</div>
                </td>
                <td>${esc(r.descricao.substring(0, 50))}${r.descricao.length > 50 ? '...' : ''}</td>
                <td class="valor-display">${formatMoney(r.valorServico)}</td>
                <td><span class="badge ${r.gerarBoleto ? 'sim' : 'nao'}">${r.gerarBoleto ? 'Sim' : 'Nao'}</span></td>
                <td><span class="badge ${r.enviarEmail ? 'sim' : 'nao'}">${r.enviarEmail ? 'Sim' : 'Nao'}</span></td>
                <td>${r.ultimaEmissao || '-'}</td>
                <td><span class="badge ${r.ativo ? 'ativo' : 'inativo'}">${r.ativo ? 'Ativo' : 'Inativo'}</span></td>
                <td style="text-align:right;white-space:nowrap;">
                    <button class="btn btn-ghost btn-sm" style="color:var(--success);" onclick="executarUma(${r.id})" title="Executar agora">▶</button>
                    <button class="btn btn-ghost btn-sm" onclick="editar(${r.id})" title="Editar">✏️</button>
                    ${r.ativo
                        ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="desativar(${r.id}, ${JSON.stringify(r.descricao)})" title="Desativar">⏸</button>`
                        : `<button class="btn btn-ghost btn-sm" style="color:var(--success);" onclick="reativar(${r.id})" title="Reativar">↻</button>`}
                </td>
            </tr>
        `).join('');
    } catch (err) {
        showAlert('Erro ao carregar: ' + err.message, 'error');
    }
}

async function executarUma(id) {
    if (!confirm('Executar esta recorrencia para o mes atual?')) return;
    try {
        showAlert('Executando...', 'info');
        const resp = await fetch(`/api/recorrencias/${id}/executar`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const data = await resp.json();
        if (!data.success) throw new Error(data.error);
        showAlert('Execucao concluida!', 'success');
        carregarRecorrencias();
    } catch (err) {
        showAlert('Erro: ' + err.message, 'error');
    }
}

async function executarTodas() {
    if (!confirm('Executar TODAS as recorrencias ativas para o mes atual?')) return;
    try {
        showAlert('Executando todas...', 'info');
        const resp = await fetch('/api/recorrencias/executar', { method: 'POST' });
        const data = await resp.json();
        if (!data.success) throw new Error(data.error);
        showAlert('Execucao concluida!', 'success');
        carregarRecorrencias();
    } catch (err) {
        showAlert('Erro: ' + err.message, 'error');
    }
}


// ==================== UTILS ====================
function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function formatMoney(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function formatDoc(d) {
    if (!d) return '';
    d = d.replace(/\D/g, '');
    if (d.length === 11) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
    if (d.length === 14) return d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
    return d;
}

// ==================== INIT ====================
carregarRecorrencias();
// ==================== CRIAR / EDITAR / EXCLUIR ====================
// A tela so executava. O backend ja tinha POST/PUT/DELETE, e o contrato
// mandava "Criar nova" para ca — sem botao nenhum aqui, o caminho morria.
let PESSOAS = [];

async function carregarPessoas() {
    if (PESSOAS.length) return PESSOAS;
    try {
        // /api/pessoas nao filtra por tipo — pedir ?tipo=cliente sugeriria um
        // filtro inexistente e devolveria a lista toda do mesmo jeito.
        const d = await fetch('/api/pessoas').then(r => r.json());
        PESSOAS = d.pessoas || [];
    } catch { PESSOAS = []; }
    return PESSOAS;
}

function fecharRec() { document.getElementById('modalRec').classList.remove('open'); }

async function abrirNova() {
    await carregarPessoas();
    document.getElementById('rPessoa').innerHTML = '<option value="">Selecione…</option>' +
        PESSOAS.map(p => `<option value="${p.id}">${esc(p.razaoSocial || p.nome || '')}</option>`).join('');
    document.getElementById('recTitulo').textContent = 'Nova recorrência';
    ['rId','rDescricao','rValor','rCodTrib','rCodLista','rAliquota','rDeducoes','rObs']
        .forEach(x => document.getElementById(x).value = '');
    document.getElementById('rDiaVenc').value = 10;
    document.getElementById('rGerarBoleto').checked = false;
    document.getElementById('rEnviarEmail').checked = false;
    document.getElementById('rAtivo').checked = true;
    document.getElementById('modalRec').classList.add('open');
}

async function editar(id) {
    await carregarPessoas();
    const d = await fetch('/api/recorrencias/' + id).then(r => r.json());
    if (!d.success) return showAlert(d.error, 'error');
    const r = d.recorrencia || d.rec || d;
    document.getElementById('rPessoa').innerHTML = '<option value="">Selecione…</option>' +
        PESSOAS.map(p => `<option value="${p.id}"${p.id === r.pessoaId ? ' selected' : ''}>${esc(p.razaoSocial || p.nome || '')}</option>`).join('');
    document.getElementById('recTitulo').textContent = 'Editar recorrência';
    document.getElementById('rId').value = r.id;
    document.getElementById('rDescricao').value = r.descricao || '';
    document.getElementById('rValor').value = r.valorServico ?? '';
    document.getElementById('rCodTrib').value = r.codigoTributacaoNacional || '';
    document.getElementById('rCodLista').value = r.codigoListaServico || '';
    document.getElementById('rAliquota').value = r.aliquota ?? '';
    document.getElementById('rDeducoes').value = r.valorDeducoes ?? '';
    document.getElementById('rDiaVenc').value = r.diaVencimentoBoleto ?? 10;
    document.getElementById('rGerarBoleto').checked = !!r.gerarBoleto;
    document.getElementById('rEnviarEmail').checked = !!r.enviarEmail;
    document.getElementById('rAtivo').checked = !!r.ativo;
    document.getElementById('rObs').value = r.observacoes || '';
    document.getElementById('modalRec').classList.add('open');
}

async function salvarRec() {
    const id = document.getElementById('rId').value;
    const num = (v) => v === '' ? null : Number(v);
    const corpo = {
        pessoaId: Number(document.getElementById('rPessoa').value) || null,
        descricao: document.getElementById('rDescricao').value.trim(),
        valorServico: num(document.getElementById('rValor').value),
        codigoTributacaoNacional: document.getElementById('rCodTrib').value.trim(),
        codigoListaServico: document.getElementById('rCodLista').value.trim() || null,
        aliquota: num(document.getElementById('rAliquota').value),
        valorDeducoes: num(document.getElementById('rDeducoes').value),
        diaVencimentoBoleto: num(document.getElementById('rDiaVenc').value) || 10,
        gerarBoleto: document.getElementById('rGerarBoleto').checked,
        enviarEmail: document.getElementById('rEnviarEmail').checked,
        ativo: document.getElementById('rAtivo').checked,
        observacoes: document.getElementById('rObs').value.trim() || null,
    };
    // Mesma exigencia do backend, dita antes de o servidor recusar.
    if (!corpo.pessoaId) return showAlert('Selecione o cliente', 'error');
    if (!corpo.descricao) return showAlert('Descrição do serviço obrigatória', 'error');
    if (!(corpo.valorServico > 0)) return showAlert('Valor do serviço deve ser maior que zero', 'error');
    if (!corpo.codigoTributacaoNacional) return showAlert('Código de tributação nacional obrigatório', 'error');

    const d = await fetch(id ? '/api/recorrencias/' + id : '/api/recorrencias', {
        method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo)
    }).then(r => r.json());
    if (!d.success) return showAlert(d.error, 'error');
    fecharRec();
    showAlert(id ? 'Recorrência atualizada' : 'Recorrência criada');
    carregarRecorrencias();
}

// O DELETE do backend DESATIVA, nao apaga — e correto: a recorrencia tem
// historico de emissao atras dela. O botao diz o que acontece de verdade.
async function desativar(id, descricao) {
    if (!confirm(`Desativar a recorrência "${descricao}"?\n\nEla para de emitir nos próximos meses. O histórico e as NFS-e já emitidas continuam.`)) return;
    const d = await fetch('/api/recorrencias/' + id, { method: 'DELETE' }).then(r => r.json());
    if (!d.success) return showAlert(d.error, 'error');
    showAlert('Recorrência desativada — volta a emitir se você reativar');
    carregarRecorrencias();
}

async function reativar(id) {
    const d = await fetch('/api/recorrencias/' + id, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ativo: 1 })
    }).then(r => r.json());
    if (!d.success) return showAlert(d.error, 'error');
    showAlert('Recorrência reativada');
    carregarRecorrencias();
}

// O contrato manda "/financeiro/recorrencias.html?id=N" para ver a recorrencia
// completa; sem isto o id chegava e era ignorado.
document.addEventListener('DOMContentLoaded', () => {
    const id = new URLSearchParams(location.search).get('id');
    if (id) setTimeout(() => editar(Number(id)), 300);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharRec(); });

</script>
</body>
</html>
