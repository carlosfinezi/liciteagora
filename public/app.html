<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg-0); }

    position: fixed;
    top: 0;
    left: 250px;
    width: calc(100% - 250px);

    background: var(--bg-0);
  }
  @media (max-width: 768px) {
    #conteudo { left: 0; width: 100%; }
  }
</style>
</head>

<!-- A flag precisa existir ANTES de sidebar.js: é ela que impede o redirect do shell -->

</body>
