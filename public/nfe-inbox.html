<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NF-e Recebidas (SEFAZ) — Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>NF-e Recebidas (SEFAZ)</h1>
      <small>Documentos fiscais emitidos contra seu CNPJ, obtidos pela Distribuição DFe.</small>
    </div>
  </div>

  <div class="panel">
    <div class="filtros">
      <button class="btn-primary" id="btnSync" onclick="sincronizar()">🔄 Buscar novidades na SEFAZ</button>
      <select id="filtSituacao" onchange="carregar()">
        <option value="">Todas</option>
        <option value="pendente" selected>Pendentes</option>
        <option value="importada">Importadas</option>
        <option value="ignorada">Ignoradas</option>
      </select>
      <input type="text" id="filtBusca" placeholder="CNPJ, razão social, nº…" oninput="debounce(carregar)" style="flex:1;min-width:200px;">
    </div>
    <div class="cursor" id="cursorInfo"></div>
  </div>

  <div class="panel">
    <table>
      <thead><tr>
        <th>Emissão</th><th>Emitente</th><th>Nº / Série</th><th>Chave</th><th>Valor</th><th>Status</th><th>Manifestação</th><th>Ações</th>
      </tr></thead>
      <tbody id="tb"><tr><td colspan="8" style="text-align:center;color:#555;padding:25px;">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('nfe-inbox');</script>
<script>
let tm;
function debounce(fn){ clearTimeout(tm); tm=setTimeout(fn, 300); }
function fmt(v){ return (v==null||isNaN(v))?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtData(iso){ if(!iso) return '-'; const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR').slice(0,5); }
function chaveFmt(k){ return k ? k.slice(0,8)+'…'+k.slice(-8) : ''; }

async function sincronizar(){
  const btn = document.getElementById('btnSync');
  btn.disabled = true; btn.textContent = '⏳ Consultando SEFAZ…';
  try {
    const r = await fetch('/api/nfe-entrada/inbox/sincronizar', { method:'POST' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error || d.xMotivo || 'erro');
    alert(`Sincronização concluída.\n\nNovos: ${d.novos}\nÚlt. NSU: ${d.ultNSU}\nMax NSU: ${d.maxNSU}\nStatus SEFAZ: ${d.cStat} ${d.xMotivo||''}`);
    await carregar();
  } catch (e) { alert('Erro: '+e.message); }
  finally { btn.disabled = false; btn.textContent = '🔄 Buscar novidades na SEFAZ'; }
}

async function carregar(){
  const p = new URLSearchParams();
  const situacao = document.getElementById('filtSituacao').value;
  const busca = document.getElementById('filtBusca').value.trim();
  if (situacao) p.set('situacao', situacao);
  if (busca) p.set('busca', busca);
  try {
    const r = await fetch('/api/nfe-entrada/inbox?'+p);
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    const c = d.cursor || {};
    document.getElementById('cursorInfo').textContent = `NSU atual: ${c.ultNSU||'0'} · Max SEFAZ: ${c.maxNSU||'—'} · Última sync: ${c.ultimaSincronizacao||'nunca'}`;
    render(d.items);
  } catch(e){ alert('Erro: '+e.message); }
}

function render(items){
  const tb = document.getElementById('tb');
  if (!items.length) { tb.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#555;padding:25px;">Nenhuma NF-e. Clique em "Buscar novidades" para consultar a SEFAZ.</td></tr>'; return; }
  tb.innerHTML = items.map(i => {
    const man = i.statusManifestacao;
    const manBadge = man
      ? `<span class="badge ${man}">${man.replace('_',' ')}</span>`
      : '<small style="color:#888;">sem evento</small>';
    const manDate = i.dataUltimoEvento ? `<br><small style="color:#666;">${fmtData(i.dataUltimoEvento)}</small>` : '';
    const podeManifestarMais = i.situacao !== 'ignorada';
    return `<tr>
    <td>${fmtData(i.dataEmissao)}</td>
    <td><strong>${i.emitenteRazaoSocial||'—'}</strong><br><small style="color:#888;">CNPJ ${i.emitenteCnpj||'—'}</small></td>
    <td>${i.numeroNF||'-'} / ${i.serie||'-'}</td>
    <td class="mono" style="font-family:monospace;font-size:0.78em;" title="${i.chaveAcesso}">${chaveFmt(i.chaveAcesso)}</td>
    <td>R$ ${fmt(i.valorTotal)}</td>
    <td><span class="badge ${i.situacao}">${i.situacao}</span>${i.temXmlCompleto?' <small style="color:#51cf66;">✓ XML</small>':' <small style="color:#888;">só resumo</small>'}</td>
    <td>${manBadge}${manDate}</td>
    <td>
      <a href="/api/nfe-entrada/inbox/${i.chaveAcesso}/xml" target="_blank" class="btn-secondary" style="text-decoration:none;">XML</a>
      ${i.situacao==='pendente' && i.temXmlCompleto ? `<button class="btn-primary" style="padding:6px 10px;font-size:0.8em;" onclick="importar('${i.chaveAcesso}')">Importar</button>` : ''}
      ${i.situacao==='pendente' && !i.temXmlCompleto ? `<button class="btn-secondary" onclick="manifestar('${i.chaveAcesso}')" title="Manifesta Ciência (210210) e tenta baixar o XML completo">Ciência + XML</button>` : ''}
      ${podeManifestarMais && man !== 'confirmada' ? `<button class="btn-secondary" style="padding:6px 10px;font-size:0.8em;" onclick="manifestarEvento('${i.chaveAcesso}','210200')" title="Confirmação da Operação (210200)">Confirmar</button>` : ''}
      ${podeManifestarMais && man !== 'desconhecida' ? `<button class="btn-secondary" style="padding:6px 10px;font-size:0.8em;" onclick="manifestarEvento('${i.chaveAcesso}','210220')" title="Desconhecimento da Operação (210220)">Desconhecer</button>` : ''}
      ${podeManifestarMais && man !== 'nao_realizada' ? `<button class="btn-secondary" style="padding:6px 10px;font-size:0.8em;" onclick="manifestarNaoRealizada('${i.chaveAcesso}')" title="Operação Não Realizada (210240)">Não realizada</button>` : ''}
      ${i.situacao==='pendente' ? `<button class="btn-warn" onclick="ignorar('${i.chaveAcesso}')">Ignorar</button>` : ''}
      ${i.situacao==='importada' ? `<a href="/nfe-entrada-detalhe.html?chave=${i.chaveAcesso}" class="btn-secondary" style="text-decoration:none;">Abrir</a>` : ''}
    </td>
  </tr>`;
  }).join('');
}

async function manifestar(chave){
  if (!confirm('Manifestar Ciência na SEFAZ para esta NF-e? Isso libera o download do XML completo.')) return;
  try {
    const r = await fetch('/api/nfe-entrada/inbox/'+chave+'/manifestar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ tpEvento: '210210' })
    });
    const d = await r.json();
    if (!d.success) throw new Error(`Ciência falhou: ${d.cStat||''} ${d.xMotivo||d.error||''}`);
    // Após ciência OK, tenta baixar o XML (com retry no backend)
    const r2 = await fetch('/api/nfe-entrada/inbox/'+chave+'/baixar-xml', { method:'POST' });
    const d2 = await r2.json();
    if (d2.success) {
      alert('Ciência registrada e XML completo baixado. Clique em Importar.');
    } else {
      const schemas = (d2.schemasEncontrados||[]).join(', ') || '(nenhum)';
      alert(`Ciência registrada ✓\n\nO XML completo (procNFe) ainda não está disponível na SEFAZ.\nSchemas recebidos: ${schemas}\n\n${d2.aviso||'Aguarde 1-5 minutos e clique em "🔄 Buscar novidades na SEFAZ" — o procNFe virá pelo fluxo NSU.'}`);
    }
    carregar();
  } catch(e){ alert('Erro: '+e.message); }
}

async function importar(chave){
  try {
    const r = await fetch('/api/nfe-entrada/inbox/'+chave+'/importar', { method:'POST' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    alert(`Importada!\nItens: ${d.itens}\nDuplicatas: ${d.duplicatas}`);
    location.href = '/nfe-entrada-detalhe.html?id=' + d.nfeId;
  } catch (e) { alert('Erro: '+e.message); }
}

async function ignorar(chave){
  if (!confirm('Marcar esta NF-e como ignorada? (não será importada ao estoque nem contas a pagar)')) return;
  await fetch('/api/nfe-entrada/inbox/'+chave+'/ignorar', { method:'POST' });
  carregar();
}

const EVENTO_LABEL = { '210210': 'Ciência', '210200': 'Confirmação', '210220': 'Desconhecimento', '210240': 'Operação não realizada' };

async function manifestarEvento(chave, tpEvento){
  const label = EVENTO_LABEL[tpEvento] || tpEvento;
  if (!confirm(`Registrar ${label} (${tpEvento}) na SEFAZ para esta NF-e?`)) return;
  try {
    const r = await fetch('/api/nfe-entrada/inbox/'+chave+'/manifestar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ tpEvento })
    });
    const d = await r.json();
    if (!d.success) throw new Error(`${label} falhou: cStat ${d.cStat||'?'} ${d.xMotivo||d.error||''}`);
    alert(`${label} registrada. cStat: ${d.cStat} · ${d.xMotivo||''}`);
    carregar();
  } catch(e){ alert('Erro: '+e.message); }
}

async function manifestarNaoRealizada(chave){
  const just = prompt('Informe a justificativa (mínimo 15 caracteres) para "Operação Não Realizada":');
  if (!just) return;
  if (just.trim().length < 15) return alert('Justificativa precisa ter pelo menos 15 caracteres.');
  try {
    const r = await fetch('/api/nfe-entrada/inbox/'+chave+'/manifestar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ tpEvento: '210240', xJust: just })
    });
    const d = await r.json();
    if (!d.success) throw new Error(`Evento falhou: cStat ${d.cStat||'?'} ${d.xMotivo||d.error||''}`);
    alert(`Operação não realizada registrada. cStat: ${d.cStat} · ${d.xMotivo||''}`);
    carregar();
  } catch(e){ alert('Erro: '+e.message); }
}

carregar();
</script>
</body></html>
