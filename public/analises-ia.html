<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análises IA - LiciteAgora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; min-height: 100vh; color: #e0e0e0; }
        .container { max-width: 1800px; margin: 0 auto; }

        .header { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 25px 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .header h1 { color: #4fc3f7; font-size: 24px; margin-bottom: 5px; }
        .header p { color: #90a4ae; font-size: 13px; }

        /* Stats */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-value.cyan { color: #4fc3f7; }
        .stat-value.green { color: #66bb6a; }
        .stat-value.yellow { color: #ffb74d; }
        .stat-value.red { color: #ef5350; }
        .stat-label { font-size: 11px; color: #78909c; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Filters */
        .filters-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .filters-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 11px; color: #78909c; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .filter-group input, .filter-group select {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); color: white;
            padding: 9px 12px; border-radius: 8px; font-size: 13px; min-width: 140px;
        }
        .filter-group input:focus, .filter-group select:focus { outline: none; border-color: #4fc3f7; }
        .filter-group input[type=text] { min-width: 250px; }
        .filter-group select option { background: #1a1a2e; color: white; }
        .btn { padding: 9px 20px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #4fc3f7, #0288d1); color: white; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(79,195,247,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #b0bec5; }
        .btn-secondary:hover { background: rgba(255,255,255,0.15); }

        /* Score range slider */
        .score-range { display: flex; align-items: center; gap: 8px; }
        .score-range input[type=number] { width: 60px; min-width: 60px; text-align: center; }

        /* Results */
        .results-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
        .results-header { padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; }
        .results-header h3 { color: #b0bec5; font-size: 14px; }
        .results-count { color: #78909c; font-size: 12px; }

        /* Cards grid */
        .cards-grid { padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .analise-card {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px; padding: 18px; cursor: pointer; transition: all 0.2s;
        }
        .analise-card:hover { background: rgba(79,195,247,0.05); border-color: rgba(79,195,247,0.15); }
        .analise-card.expanded { background: rgba(255,255,255,0.05); border-color: rgba(79,195,247,0.2); }

        .card-top { display: flex; gap: 15px; align-items: flex-start; }
        .card-score {
            min-width: 60px; height: 60px; border-radius: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; font-weight: 700; font-size: 22px;
        }
        .card-score .score-label { font-size: 9px; font-weight: 400; opacity: 0.8; text-transform: uppercase; }
        .score-alto { background: rgba(46,125,50,0.2); color: #66bb6a; border: 1px solid rgba(102,187,106,0.3); }
        .score-medio { background: rgba(245,127,23,0.15); color: #ffb74d; border: 1px solid rgba(255,183,77,0.3); }
        .score-baixo { background: rgba(198,40,40,0.15); color: #ef5350; border: 1px solid rgba(239,83,80,0.3); }

        .card-info { flex: 1; min-width: 0; }
        .card-objeto { font-size: 14px; color: #e0e0e0; line-height: 1.4; margin-bottom: 6px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .analise-card.expanded .card-objeto { -webkit-line-clamp: unset; }
        .card-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .card-tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.06); color: #90a4ae; }
        .card-tag.segmento { background: rgba(79,195,247,0.12); color: #4fc3f7; }
        .card-tag.complexidade-alta { background: rgba(239,83,80,0.12); color: #ef5350; }
        .card-tag.complexidade-media { background: rgba(255,183,77,0.12); color: #ffb74d; }
        .card-tag.complexidade-baixa { background: rgba(102,187,106,0.12); color: #66bb6a; }
        .card-tag.encerrada { background: rgba(239,83,80,0.1); color: #e57373; }
        .card-tag.aberta { background: rgba(102,187,106,0.1); color: #81c784; }

        .card-right { text-align: right; min-width: 130px; }
        .card-valor { font-size: 15px; font-weight: 600; color: #66bb6a; font-family: 'Consolas', monospace; }
        .card-orgao { font-size: 11px; color: #78909c; margin-top: 4px; }
        .card-uf { font-size: 11px; color: #90a4ae; }

        /* Expanded detail */
        .card-detail { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.06); }
        .analise-card.expanded .card-detail { display: block; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 800px) { .detail-grid { grid-template-columns: 1fr; } }

        .detail-section h4 { font-size: 12px; color: #4fc3f7; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .detail-section p { font-size: 13px; color: #b0bec5; line-height: 1.5; }
        .detail-section ul { list-style: none; padding: 0; }
        .detail-section ul li { font-size: 13px; color: #b0bec5; padding: 4px 0; padding-left: 16px; position: relative; line-height: 1.4; }
        .detail-section ul li::before { content: ''; position: absolute; left: 0; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: #4fc3f7; }
        .detail-section.atencao ul li::before { background: #ffb74d; }

        .detail-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-top: 12px; }
        .detail-meta-item { font-size: 12px; }
        .detail-meta-item .meta-label { color: #78909c; }
        .detail-meta-item .meta-value { color: #e0e0e0; font-weight: 500; }

        .detail-justificativa { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 12px; margin-top: 12px; }
        .detail-justificativa p { font-size: 13px; color: #90a4ae; font-style: italic; }

        .btn-link-comprasnet { display: inline-block; margin-top: 10px; padding: 6px 14px; background: rgba(79,195,247,0.1); color: #4fc3f7; border-radius: 6px; font-size: 12px; text-decoration: none; }
        .btn-link-comprasnet:hover { background: rgba(79,195,247,0.2); }

        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 16px; }
        .pagination .btn { min-width: 36px; padding: 8px 14px; }
        .pagination .page-info { color: #78909c; font-size: 13px; }

        /* Loading */
        .loading { text-align: center; padding: 60px; color: #78909c; }
        .loading .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid rgba(79,195,247,0.2); border-top-color: #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 60px; color: #78909c; }
        .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="main-content">
            <div class="container">
                <div class="header">
                    <h1>Análises IA</h1>
                    <p>Resultados das análises automáticas de licitações por inteligência artificial</p>
                </div>

                <div class="stats-row" id="statsRow">
                    <div class="stat-card"><div class="stat-value cyan" id="statTotal">-</div><div class="stat-label">Total Analisadas</div></div>
                    <div class="stat-card"><div class="stat-value green" id="statAlta">-</div><div class="stat-label">Score Alto (70+)</div></div>
                    <div class="stat-card"><div class="stat-value yellow" id="statMedia">-</div><div class="stat-label">Score Médio (40-69)</div></div>
                    <div class="stat-card"><div class="stat-value red" id="statBaixa">-</div><div class="stat-label">Score Baixo (&lt;40)</div></div>
                </div>

                <div class="filters-card">
                    <div class="filters-row">
                        <div class="filter-group">
                            <label>Buscar</label>
                            <input type="text" id="filtBusca" placeholder="Objeto, resumo ou orgao..." onkeydown="if(event.key==='Enter')carregarAnalises()">
                        </div>
                        <div class="filter-group">
                            <label>Segmento</label>
                            <select id="filtSegmento"><option value="">Todos</option></select>
                        </div>
                        <div class="filter-group">
                            <label>Complexidade</label>
                            <select id="filtComplexidade">
                                <option value="">Todas</option>
                                <option value="baixa">Baixa</option>
                                <option value="média">Média</option>
                                <option value="alta">Alta</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label>Score</label>
                            <div class="score-range">
                                <input type="number" id="filtScoreMin" placeholder="0" min="0" max="100">
                                <span style="color:#78909c">a</span>
                                <input type="number" id="filtScoreMax" placeholder="100" min="0" max="100">
                            </div>
                        </div>
                        <div class="filter-group">
                            <label>Ordenar por</label>
                            <select id="filtOrdem">
                                <option value="score_desc">Maior Score</option>
                                <option value="score_asc">Menor Score</option>
                                <option value="data_desc">Mais Recente</option>
                                <option value="data_asc">Mais Antiga</option>
                                <option value="encerramento">Encerramento</option>
                                <option value="valor_desc">Maior Valor</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" onclick="carregarAnalises()">Filtrar</button>
                        <button class="btn btn-secondary" onclick="limparFiltros()">Limpar</button>
                    </div>
                </div>

                <div class="results-card">
                    <div class="results-header">
                        <h3>Resultados</h3>
                        <span class="results-count" id="resultsCount"></span>
                    </div>
                    <div id="resultsArea">
                        <div class="loading"><div class="spinner"></div><p style="margin-top:12px">Carregando análises...</p></div>
                    </div>
                    <div class="pagination" id="pagination" style="display:none"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/menu-config.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>initSidebar('analises-ia');</script>
    <script>
        let paginaAtual = 1;
        const LIMITE = 30;

        async function carregarAnalises(pagina = 1) {
            paginaAtual = pagina;
            const params = new URLSearchParams();
            params.set('pagina', pagina);
            params.set('limite', LIMITE);

            const busca = document.getElementById('filtBusca').value.trim();
            const segmento = document.getElementById('filtSegmento').value;
            const complexidade = document.getElementById('filtComplexidade').value;
            const scoreMin = document.getElementById('filtScoreMin').value;
            const scoreMax = document.getElementById('filtScoreMax').value;
            const ordem = document.getElementById('filtOrdem').value;

            if (busca) params.set('busca', busca);
            if (segmento) params.set('segmento', segmento);
            if (complexidade) params.set('complexidade', complexidade);
            if (scoreMin) params.set('scoreMin', scoreMin);
            if (scoreMax) params.set('scoreMax', scoreMax);
            if (ordem) params.set('ordem', ordem);

            document.getElementById('resultsArea').innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px">Carregando...</p></div>';

            try {
                const resp = await fetch('/api/analise/lista?' + params.toString());
                const data = await resp.json();
                if (!data.success) throw new Error(data.error);

                renderStats(data);
                renderSegmentos(data.segmentos);
                renderCards(data.analises);
                renderPagination(data.total, data.pagina, data.limite);
                document.getElementById('resultsCount').textContent = `${data.total} análise${data.total !== 1 ? 's' : ''} encontrada${data.total !== 1 ? 's' : ''}`;
            } catch (err) {
                document.getElementById('resultsArea').innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><p>Erro: ${err.message}</p></div>`;
            }
        }

        function renderStats(data) {
            document.getElementById('statTotal').textContent = data.total;
            // Count by score range from visible data (approximate from total)
            const analises = data.analises || [];
            // We'll update these from a separate stats call
            fetch('/api/analise/lista?limite=9999&scoreMin=70').then(r => r.json()).then(d => {
                if (d.success) document.getElementById('statAlta').textContent = d.total;
            });
            fetch('/api/analise/lista?limite=1&scoreMin=40&scoreMax=69').then(r => r.json()).then(d => {
                if (d.success) document.getElementById('statMedia').textContent = d.total;
            });
            fetch('/api/analise/lista?limite=1&scoreMax=39').then(r => r.json()).then(d => {
                if (d.success) document.getElementById('statBaixa').textContent = d.total;
            });
        }

        let segmentosCarregados = false;
        function renderSegmentos(segmentos) {
            if (segmentosCarregados) return;
            segmentosCarregados = true;
            const sel = document.getElementById('filtSegmento');
            for (const s of segmentos) {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                sel.appendChild(opt);
            }
        }

        function getScoreClass(score) {
            if (score >= 70) return 'score-alto';
            if (score >= 40) return 'score-medio';
            return 'score-baixo';
        }

        function getComplexidadeClass(c) {
            if (c === 'alta') return 'complexidade-alta';
            if (c === 'baixa') return 'complexidade-baixa';
            return 'complexidade-media';
        }

        function fmtValor(v) {
            if (!v) return '-';
            return Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function fmtData(d) {
            if (!d) return '-';
            try { return new Date(d).toLocaleDateString('pt-BR'); } catch { return d; }
        }

        function isEncerrada(dataEnc) {
            if (!dataEnc) return false;
            return new Date(dataEnc) < new Date();
        }

        function renderCards(analises) {
            if (!analises.length) {
                document.getElementById('resultsArea').innerHTML = '<div class="empty-state"><div class="emoji">🔍</div><p>Nenhuma análise encontrada com esses filtros</p></div>';
                return;
            }

            const html = analises.map((a, i) => {
                const scoreCls = getScoreClass(a.viabilidade_score || 0);
                const complexCls = getComplexidadeClass(a.complexidade);
                const encerrada = isEncerrada(a.dataEncerramentoProposta);

                const itensList = (a.itens_destaque || []).map(it => `<li>${esc(typeof it === 'string' ? it : it.descricao || JSON.stringify(it))}</li>`).join('');
                const reqList = (a.requisitos || []).map(r => `<li>${esc(typeof r === 'string' ? r : JSON.stringify(r))}</li>`).join('');
                const atencaoList = (a.atencao || []).map(at => `<li>${esc(typeof at === 'string' ? at : JSON.stringify(at))}</li>`).join('');

                return `
                <div class="analise-card" onclick="this.classList.toggle('expanded')">
                    <div class="card-top">
                        <div class="card-score ${scoreCls}">
                            ${a.viabilidade_score || 0}
                            <span class="score-label">score</span>
                        </div>
                        <div class="card-info">
                            <div class="card-objeto">${esc(a.objetoCompra || a.resumo || 'Sem descrição')}</div>
                            <div class="card-meta">
                                ${a.segmento ? `<span class="card-tag segmento">${esc(a.segmento)}</span>` : ''}
                                ${a.complexidade ? `<span class="card-tag ${complexCls}">${esc(a.complexidade)}</span>` : ''}
                                ${a.modalidadeNome ? `<span class="card-tag">${esc(a.modalidadeNome)}</span>` : ''}
                                <span class="card-tag ${encerrada ? 'encerrada' : 'aberta'}">${encerrada ? 'Encerrada' : 'Aberta'} ${fmtData(a.dataEncerramentoProposta)}</span>
                            </div>
                        </div>
                        <div class="card-right">
                            <div class="card-valor">${fmtValor(a.valorTotalEstimado)}</div>
                            <div class="card-orgao">${esc(a.nomeUnidade || '')}</div>
                            <div class="card-uf">${esc(a.municipioNome || '')}${a.ufSigla ? '/' + a.ufSigla : ''}</div>
                        </div>
                    </div>
                    <div class="card-detail">
                        ${a.resumo ? `<div class="detail-section" style="margin-bottom:14px"><h4>Resumo da IA</h4><p>${esc(a.resumo)}</p></div>` : ''}

                        ${a.viabilidade_justificativa ? `<div class="detail-justificativa"><p>${esc(a.viabilidade_justificativa)}</p></div>` : ''}

                        <div class="detail-grid" style="margin-top:14px">
                            ${itensList ? `<div class="detail-section"><h4>Itens em Destaque</h4><ul>${itensList}</ul></div>` : ''}
                            ${reqList ? `<div class="detail-section"><h4>Requisitos Técnicos</h4><ul>${reqList}</ul></div>` : ''}
                        </div>
                        ${atencaoList ? `<div class="detail-section atencao" style="margin-top:14px"><h4>Pontos de Atenção</h4><ul>${atencaoList}</ul></div>` : ''}

                        <div class="detail-meta-grid">
                            ${a.criterio_julgamento ? `<div class="detail-meta-item"><span class="meta-label">Critério: </span><span class="meta-value">${esc(a.criterio_julgamento)}</span></div>` : ''}
                            ${a.prazo_entrega ? `<div class="detail-meta-item"><span class="meta-label">Prazo: </span><span class="meta-value">${esc(a.prazo_entrega)}</span></div>` : ''}
                            ${a.local_entrega ? `<div class="detail-meta-item"><span class="meta-label">Local: </span><span class="meta-value">${esc(a.local_entrega)}</span></div>` : ''}
                            <div class="detail-meta-item"><span class="meta-label">Vistoria: </span><span class="meta-value">${a.vistoria_obrigatoria ? 'Sim' : 'Não'}</span></div>
                            <div class="detail-meta-item"><span class="meta-label">Exclusivo ME/EPP: </span><span class="meta-value">${a.exclusivo_mei_epp ? 'Sim' : 'Não'}</span></div>
                            ${a.textos_extraidos ? `<div class="detail-meta-item"><span class="meta-label">Docs analisados: </span><span class="meta-value">${a.textos_extraidos}</span></div>` : ''}
                            <div class="detail-meta-item"><span class="meta-label">Analisada em: </span><span class="meta-value">${fmtData(a.dataAnalise)}</span></div>
                        </div>

                        ${a.linkSistemaOrigem ? `<a href="${esc(a.linkSistemaOrigem)}" target="_blank" class="btn-link-comprasnet" onclick="event.stopPropagation()">Abrir no Comprasnet</a>` : ''}
                    </div>
                </div>`;
            }).join('');

            document.getElementById('resultsArea').innerHTML = `<div class="cards-grid">${html}</div>`;
        }

        function renderPagination(total, pagina, limite) {
            const totalPags = Math.ceil(total / limite);
            const pag = document.getElementById('pagination');
            if (totalPags <= 1) { pag.style.display = 'none'; return; }

            pag.style.display = 'flex';
            let html = '';
            if (pagina > 1) html += `<button class="btn btn-secondary" onclick="carregarAnalises(${pagina - 1})">&#9664;</button>`;

            const start = Math.max(1, pagina - 3);
            const end = Math.min(totalPags, pagina + 3);
            for (let i = start; i <= end; i++) {
                html += `<button class="btn ${i === pagina ? 'btn-primary' : 'btn-secondary'}" onclick="carregarAnalises(${i})">${i}</button>`;
            }

            if (pagina < totalPags) html += `<button class="btn btn-secondary" onclick="carregarAnalises(${pagina + 1})">&#9654;</button>`;
            html += `<span class="page-info">${pagina} de ${totalPags}</span>`;
            pag.innerHTML = html;
        }

        function limparFiltros() {
            document.getElementById('filtBusca').value = '';
            document.getElementById('filtSegmento').value = '';
            document.getElementById('filtComplexidade').value = '';
            document.getElementById('filtScoreMin').value = '';
            document.getElementById('filtScoreMax').value = '';
            document.getElementById('filtOrdem').value = 'score_desc';
            carregarAnalises();
        }

        function esc(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // Init
        carregarAnalises();
    </script>
</body>
</html>
