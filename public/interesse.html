<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Interesses - Licite Agora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/app-modern.css">
    <style>
        .main-content { padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }

        header { background: var(--bg-2); padding: 30px; border-radius: var(--r-lg); border: 1px solid var(--border); margin-bottom: 20px; }

        .interesse-card { background: var(--bg-2); padding: 20px; border-radius: var(--r-lg); border: 1px solid var(--border); margin-bottom: 15px; }
        .interesse-header { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 2px solid var(--border); }
        .interesse-titulo { font-size: 18px; font-weight: 600; color: var(--text-0); }
        .interesse-info { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 15px; }
        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 12px; color: var(--text-3); text-transform: uppercase; }
        .info-value { font-size: 14px; color: var(--text-0); font-weight: 500; }
        .itens-lista { margin-top: 15px; }
        .itens-lista h4 { font-size: 14px; color: var(--text-2); margin-bottom: 10px; }
        .item-interesse { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: var(--bg-1); border-radius: var(--r-sm); margin-bottom: 8px; }
        .item-info { flex: 1; }
        .item-numero { font-weight: 600; color: var(--accent); margin-right: 10px; }
        .item-descricao { font-size: 14px; color: var(--text-0); }
        .item-valor { font-weight: 600; color: var(--success); margin-left: 15px; }
        .btn-remover { padding: 5px 12px; background: var(--danger); color: var(--text-0); border: none; border-radius: 3px; font-size: 12px; cursor: pointer; margin-left: 10px; }
        .btn-remover:hover { background: #d32f2f; }
        .empty-state { background: var(--bg-2); padding: 60px 20px; border-radius: var(--r-lg); border: 1px solid var(--border); text-align: center; }
        .empty-state-title { font-size: 20px; color: var(--text-0); margin-bottom: 10px; }
        .empty-state-text { font-size: 14px; color: var(--text-2); }
        .loading { text-align: center; padding: 40px; background: var(--bg-2); border-radius: var(--r-lg); }
        .total-info { background: var(--bg-2); padding: 15px 25px; border-radius: var(--r-lg); border: 1px solid var(--border); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .filtro-bar { background: var(--bg-2); padding: 15px 25px; border-radius: var(--r-lg); border: 1px solid var(--border); margin-bottom: 20px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .filtro-bar label { font-size: 14px; color: var(--text-2); font-weight: 600; }
        .filtro-bar select, .filtro-bar input[type="date"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-sm); font-size: 14px; color: var(--text-0); background: var(--bg-input); max-width: 220px; }
        .filtro-bar .filtro-info { margin-left: auto; font-size: 13px; color: var(--text-3); }
        .data-abertura-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-left: 10px; }
        .data-abertura-badge.futuro { background: #e3f2fd; color: #1565c0; }
        .data-abertura-badge.hoje { background: #e8f5e9; color: #2e7d32; }
        .data-abertura-badge.passado { background: #fce4ec; color: #c62828; }
        .data-abertura-badge.sem-data { background: #f5f5f5; color: #999; }
        .total-count { font-size: 16px; color: var(--text-0); font-weight: 600; }
        .total-valor { font-size: 18px; color: var(--success); font-weight: 700; }
        .btn-excluir-todos { padding: 10px 20px; background: var(--danger); color: var(--text-0); border: none; border-radius: var(--r-sm); font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn-excluir-todos:hover { background: #c0392b; }
        .btn-detalhes { padding: 8px 15px; background: var(--accent); color: #000; border: none; border-radius: var(--r-sm); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
        .btn-detalhes:hover { background: var(--accent-strong); }

        .btn-kanban { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: var(--r-md); cursor: pointer; font-weight: 600; margin-left: 10px; transition: all 0.3s; }
        .btn-kanban:hover { background: #74c0fc; }
        .interesse-footer { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; padding-top: 15px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="app-container">
        

        <main class="main-content">
            <div class="container">
                <header>
                    <h1>⭐ Meus Interesses</h1>
                    <p class="subtitle">Licitações e itens marcados para participar</p>
                </header>

                <div id="filtroBar" class="filtro-bar" style="display: none;">
                    <label>Prazo:</label>
                    <select id="filtroPeriodo" onchange="aplicarFiltro()">
                        <option value="todas">Todas</option>
                        <option value="hoje">Hoje</option>
                        <option value="semana">Próximos 7 dias</option>
                        <option value="mes">Próximos 30 dias</option>
                        <option value="vencidas">Vencidas</option>
                        <option value="personalizado">Período...</option>
                    </select>
                    <input type="date" id="filtroDataDe" style="display:none;" onchange="aplicarFiltro()">
                    <span id="filtroAte" style="display:none;">até</span>
                    <input type="date" id="filtroDataAte" style="display:none;" onchange="aplicarFiltro()">
                    <select id="filtroOrgao" onchange="aplicarFiltro()"><option value="">Todos os órgãos</option></select>
                    <select id="filtroGrupo" onchange="aplicarFiltro()"><option value="">Todos os grupos</option></select>
                    <label>Ordenar:</label>
                    <select id="ordenacao" onchange="aplicarFiltro()">
                        <option value="encerramento-asc">Encerramento (mais próximo)</option>
                        <option value="encerramento-desc">Encerramento (mais distante)</option>
                        <option value="valor-desc">Maior valor</option>
                        <option value="valor-asc">Menor valor</option>
                        <option value="orgao-asc">Órgão (A-Z)</option>
                        <option value="recente">Adicionado recentemente</option>
                    </select>
                    <span id="filtroInfo" class="filtro-info"></span>
                </div>

                <div id="totalInfo" class="total-info" style="display: none;">
                    <div class="total-count"><span id="totalLicitacoes">0</span> licitações com <span id="totalItens">0</span> itens de interesse</div>
                    <div class="total-valor">Valor Total Estimado: <span id="valorTotal">R$ 0,00</span></div>
                    <button class="btn-excluir-todos" onclick="excluirTodosInteresses()">🗑️ Excluir Todos</button>
                </div>

                <div id="loadingContainer" class="loading">
                    <h3>Carregando interesses...</h3>
                </div>

                <div id="interessesContainer"></div>

                <div id="emptyState" style="display: none;" class="empty-state">
                    <div class="empty-state-title">Nenhum interesse salvo</div>
                    <div class="empty-state-text">Faça uma busca e marque itens de interesse para participar</div>
                </div>
            </div>
        </main>
    </div>

    <script src="interesse.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function sincronizarAgora() {
            if (!confirm('Iniciar sincronização?')) return;
            try {
                const response = await fetch('/api/sync/start', { method: 'POST' });
                const data = await response.json();
                alert(data.message || 'Sincronização iniciada!');
            } catch (e) {
                alert('Erro ao iniciar sincronização');
            }
        }

        async function verStatus() {
            try {
                const response = await fetch('/api/sync/status');
                const data = await response.json();
                alert('Última sync: ' + (data.ultimaSync || 'Nunca') + '\nLicitações: ' + (data.totalLicitacoes || 0) + '\nItens: ' + (data.totalItens || 0));
            } catch (e) {
                alert('Erro ao obter status');
            }
        }
    </script>
    <script src="/js/menu-config.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>initSidebar('interesse');</script>
</body>
</html>
