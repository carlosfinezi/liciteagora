<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo de Caixa · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
<style>
  .fc-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 16px; }
  .fc-toolbar .field { display: flex; flex-direction: column; gap: 4px; }
  .fc-toolbar label { font-size: 0.78em; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; }
  .fc-toolbar input, .fc-toolbar select { background: var(--bg-input); color: var(--text-0); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 6px 10px; }
  .fc-contas-pick { position: relative; }
  .fc-contas-btn { background: var(--bg-input); color: var(--text-0); border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 6px 10px; cursor: pointer; min-width: 220px; text-align: left; }
  .fc-contas-menu { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: var(--r-md); margin-top: 4px; z-index: 10; max-height: 260px; overflow: auto; padding: 6px; }
  .fc-contas-menu.open { display: block; }
  .fc-contas-menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r-sm); cursor: pointer; color: var(--text-0); text-transform: none; font-size: 0.92em; letter-spacing: 0; }
  .fc-contas-menu label:hover { background: var(--bg-hover); }

  .fc-grafico-wrap { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; margin-bottom: 16px; height: 320px; position: relative; }

  .fc-tbl { width: 100%; border-collapse: collapse; background: var(--bg-2); border-radius: var(--r-lg); overflow: hidden; }
  .fc-tbl th { text-align: left; font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-2); padding: 10px 12px; background: var(--bg-1); border-bottom: 1px solid var(--border); }
  .fc-tbl td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.93em; color: var(--text-0); }
  .fc-tbl tr.row-dia { cursor: pointer; }
  .fc-tbl tr.row-dia:hover { background: var(--bg-hover); }
  .fc-tbl tr.row-dia.open { background: var(--bg-hover); }
  .fc-tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .fc-tbl td.num .real { color: var(--text-0); }
  .fc-tbl td.num .prev { color: var(--text-2); font-size: 0.85em; }
  .fc-tbl td.saldo.neg { color: var(--danger); font-weight: 700; }
  .fc-tbl td.saldo.pos { color: var(--success); font-weight: 700; }
  .fc-tbl .toggle { display: inline-block; width: 14px; color: var(--text-2); transition: transform 0.15s; }
  .fc-tbl tr.row-dia.open .toggle { transform: rotate(90deg); }
  .fc-itens { background: var(--bg-1); }
  .fc-itens td { padding: 0; }
  .fc-itens-inner { padding: 10px 24px; }
  .fc-item { display: grid; grid-template-columns: 100px 90px 1fr 140px auto; gap: 12px; padding: 6px 0; align-items: center; border-top: 1px dashed var(--border); font-size: 0.9em; }
  .fc-item:first-child { border-top: 0; }
  .fc-item .valor { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .fc-item .valor.ent { color: var(--success); }
  .fc-item .valor.sai { color: var(--danger); }
  .fc-item a { color: var(--accent); text-decoration: none; }
  .fc-item a:hover { text-decoration: underline; }
  .badge.realizado { background: var(--success-soft); color: var(--success); }
  .badge.previsto { background: var(--warn-soft); color: var(--warn); }

  .fc-empty { text-align: center; color: var(--text-2); padding: 40px; }
  .kpi .sub { font-size: 0.78em; color: var(--text-2); margin-top: 2px; }
</style>
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Fluxo de Caixa</h1>
      <small>Realizado + Projetado — consolidação diária</small>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="atualizar()">↻ Atualizar</button>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="fc-toolbar">
    <div class="field">
      <label>Data inicial</label>
      <input type="date" id="fDataInicio" onchange="atualizar()">
    </div>
    <div class="field">
      <label>Data final</label>
      <input type="date" id="fDataFim" onchange="atualizar()">
    </div>
    <div class="field fc-contas-pick">
      <label>Contas</label>
      <button class="fc-contas-btn" id="btnContas" onclick="toggleContasMenu()">Todas as contas</button>
      <div class="fc-contas-menu" id="contasMenu"></div>
    </div>
  </div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="fc-grafico-wrap">
    <canvas id="grafico"></canvas>
  </div>

  <div id="tabelaWrap">
    <table class="fc-tbl">
      <thead>
        <tr>
          <th style="width:24px;"></th>
          <th>Data</th>
          <th style="text-align:right;">Entradas</th>
          <th style="text-align:right;">Saídas</th>
          <th style="text-align:right;">Saldo final</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('fluxo-caixa');</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
let contasDisponiveis = [];
let contasSelecionadas = new Set();
let todasSelecionadas = true;
let chart = null;

function fmt(v){ return (v==null||isNaN(v))?'0,00':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtData(ymd){ if(!ymd)return''; const p=ymd.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:ymd; }
function val(id){ return document.getElementById(id).value; }
function showAlert(m,t='success'){
  const e=document.getElementById('alertGlobal');
  e.className='alert '+t; e.textContent=m; e.style.display='block';
  setTimeout(()=>e.style.display='none',5000);
}

function addDias(ymd, dias) {
  const d = new Date(ymd + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + dias);
  return d.toISOString().slice(0, 10);
}
function hojeISO() { return new Date().toISOString().slice(0, 10); }

async function carregarContas() {
  try {
    const r = await fetch('/api/contas-financeiras');
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    contasDisponiveis = d.contas || [];
    renderContasMenu();
  } catch (e) {
    showAlert('Erro ao carregar contas: ' + e.message, 'error');
  }
}

function renderContasMenu() {
  const menu = document.getElementById('contasMenu');
  const header = `<label style="border-bottom:1px solid var(--border);margin-bottom:4px;padding-bottom:8px;">
    <input type="checkbox" id="chkAll" ${todasSelecionadas?'checked':''} onchange="toggleTodas(this.checked)">
    <strong>Todas as contas</strong></label>`;
  const items = contasDisponiveis.map(c => `
    <label>
      <input type="checkbox" value="${c.id}" ${todasSelecionadas||contasSelecionadas.has(c.id)?'checked':''} onchange="toggleConta(${c.id}, this.checked)">
      ${c.nome} <small style="color:var(--text-2);">(${c.tipo})</small>
    </label>`).join('');
  menu.innerHTML = header + items;
  atualizarBtnContas();
}

function atualizarBtnContas() {
  const btn = document.getElementById('btnContas');
  if (todasSelecionadas) btn.textContent = `Todas as contas (${contasDisponiveis.length})`;
  else if (contasSelecionadas.size === 0) btn.textContent = 'Nenhuma selecionada';
  else if (contasSelecionadas.size === 1) {
    const c = contasDisponiveis.find(x => x.id === [...contasSelecionadas][0]);
    btn.textContent = c ? c.nome : '1 conta';
  }
  else btn.textContent = `${contasSelecionadas.size} contas`;
}

function toggleContasMenu() {
  document.getElementById('contasMenu').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.fc-contas-pick')) {
    document.getElementById('contasMenu')?.classList.remove('open');
  }
});

function toggleTodas(checked) {
  todasSelecionadas = checked;
  contasSelecionadas.clear();
  renderContasMenu();
  atualizar();
}
function toggleConta(id, checked) {
  todasSelecionadas = false;
  if (checked) contasSelecionadas.add(id);
  else contasSelecionadas.delete(id);
  if (contasSelecionadas.size === contasDisponiveis.length) {
    todasSelecionadas = true;
    contasSelecionadas.clear();
  }
  renderContasMenu();
  atualizar();
}

async function atualizar() {
  const dataInicio = val('fDataInicio');
  const dataFim = val('fDataFim');
  if (!dataInicio || !dataFim) return;
  const params = new URLSearchParams();
  params.set('dataInicio', dataInicio);
  params.set('dataFim', dataFim);
  if (!todasSelecionadas && contasSelecionadas.size > 0) {
    params.set('contas', [...contasSelecionadas].join(','));
  }
  try {
    const r = await fetch('/api/fluxo-caixa?' + params.toString());
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    renderKpis(d);
    renderGrafico(d);
    renderTabela(d);
  } catch (e) {
    showAlert('Erro: ' + e.message, 'error');
  }
}

function renderKpis(d) {
  const t = d.totais;
  const entradasTotal = t.entradasRealizadas + t.entradasPrevistas;
  const saidasTotal = t.saidasRealizadas + t.saidasPrevistas;
  const saldoFinalClass = t.saldoFinal < 0 ? 'red' : 'green';
  const saldoMinClass = t.saldoMinimo && t.saldoMinimo.valor < 0 ? 'red' : '';
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Saldo Inicial</div><div class="value">R$ ${fmt(d.saldoInicial)}</div></div>
    <div class="kpi green">
      <div class="label">Entradas</div>
      <div class="value">R$ ${fmt(entradasTotal)}</div>
      <div class="sub">Real: R$ ${fmt(t.entradasRealizadas)} · Prev: R$ ${fmt(t.entradasPrevistas)}</div>
    </div>
    <div class="kpi red">
      <div class="label">Saídas</div>
      <div class="value">R$ ${fmt(saidasTotal)}</div>
      <div class="sub">Real: R$ ${fmt(t.saidasRealizadas)} · Prev: R$ ${fmt(t.saidasPrevistas)}</div>
    </div>
    <div class="kpi ${saldoFinalClass}">
      <div class="label">Saldo Final</div>
      <div class="value">R$ ${fmt(t.saldoFinal)}</div>
    </div>
    <div class="kpi ${saldoMinClass}">
      <div class="label">Menor Saldo</div>
      <div class="value">R$ ${fmt(t.saldoMinimo?.valor)}</div>
      <div class="sub">${t.saldoMinimo?.data ? fmtData(t.saldoMinimo.data) : '—'}</div>
    </div>
  `;
}

function renderGrafico(d) {
  const ctx = document.getElementById('grafico').getContext('2d');
  const labels = d.dias.map(x => fmtData(x.data));
  const saldos = d.dias.map(x => x.saldoFinal);
  const styles = getComputedStyle(document.documentElement);
  const accent = styles.getPropertyValue('--accent').trim() || '#60a5fa';
  const accentSoft = styles.getPropertyValue('--accent-soft').trim() || 'rgba(96,165,250,0.25)';
  const danger = styles.getPropertyValue('--danger').trim() || '#f87171';
  const textColor = styles.getPropertyValue('--text-2').trim() || '#94a3b8';
  const borderColor = styles.getPropertyValue('--border').trim() || '#1e293b';

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Saldo projetado',
        data: saldos,
        borderColor: accent,
        backgroundColor: accentSoft,
        fill: true,
        tension: 0.2,
        pointRadius: 2,
        pointHoverRadius: 5,
        segment: {
          borderColor: ctx => ctx.p1.parsed.y < 0 ? danger : accent
        }
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (c) => 'R$ ' + fmt(c.parsed.y)
          }
        }
      },
      scales: {
        x: {
          ticks: { color: textColor, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 },
          grid: { color: borderColor }
        },
        y: {
          ticks: { color: textColor, callback: v => 'R$ ' + fmt(v) },
          grid: {
            color: (c) => c.tick.value === 0 ? danger : borderColor,
            lineWidth: (c) => c.tick.value === 0 ? 1.5 : 1
          }
        }
      }
    }
  });
}

function renderTabela(d) {
  const tb = document.getElementById('tbody');
  if (!d.dias.length) {
    tb.innerHTML = '<tr><td colspan="5" class="fc-empty">Nenhum dia no período.</td></tr>';
    return;
  }
  tb.innerHTML = d.dias.map((x, i) => {
    const saldoClass = x.saldoFinal < 0 ? 'neg' : 'pos';
    const temItens = x.itens.length > 0;
    return `
      <tr class="row-dia" data-idx="${i}" onclick="toggleDia(${i})">
        <td><span class="toggle">${temItens?'▸':''}</span></td>
        <td>${fmtData(x.data)}</td>
        <td class="num">
          ${x.entradas.realizado ? `<div class="real">R$ ${fmt(x.entradas.realizado)}</div>` : ''}
          ${x.entradas.previsto ? `<div class="prev">prev: R$ ${fmt(x.entradas.previsto)}</div>` : ''}
          ${!x.entradas.realizado && !x.entradas.previsto ? '<span style="color:var(--text-3);">—</span>' : ''}
        </td>
        <td class="num">
          ${x.saidas.realizado ? `<div class="real">R$ ${fmt(x.saidas.realizado)}</div>` : ''}
          ${x.saidas.previsto ? `<div class="prev">prev: R$ ${fmt(x.saidas.previsto)}</div>` : ''}
          ${!x.saidas.realizado && !x.saidas.previsto ? '<span style="color:var(--text-3);">—</span>' : ''}
        </td>
        <td class="num saldo ${saldoClass}">R$ ${fmt(x.saldoFinal)}</td>
      </tr>
      <tr class="fc-itens" id="itens-${i}" style="display:none;">
        <td colspan="5"><div class="fc-itens-inner">${renderItens(x.itens)}</div></td>
      </tr>
    `;
  }).join('');
}

function renderItens(itens) {
  if (!itens.length) return '<div style="color:var(--text-2);padding:6px 0;">Sem lançamentos.</div>';
  return itens.map(it => {
    const valorClass = it.tipo === 'entrada' ? 'ent' : 'sai';
    const sinal = it.tipo === 'entrada' ? '+' : '−';
    const link = linkOrigem(it);
    return `
      <div class="fc-item">
        <span class="badge ${it.status}">${it.status}</span>
        <span class="badge ${it.tipo}">${it.tipo}</span>
        <span>${escapeHtml(it.descricao || '')}</span>
        <span style="color:var(--text-2);font-size:0.88em;">${escapeHtml(it.origem || '')}${it.categoria?' · '+escapeHtml(it.categoria):''}</span>
        <span class="valor ${valorClass}">${sinal} R$ ${fmt(it.valor)}${link}</span>
      </div>`;
  }).join('');
}

function linkOrigem(it) {
  if (it.origem === 'cr' && it.origemId) return ` <a href="/contas-a-receber.html#${it.origemId}" title="Abrir CR">↗</a>`;
  if (it.origem === 'cp' && it.origemId) return ` <a href="/contas-a-pagar.html#${it.origemId}" title="Abrir CP">↗</a>`;
  return '';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toggleDia(i) {
  const tr = document.querySelector(`tr.row-dia[data-idx="${i}"]`);
  const itens = document.getElementById(`itens-${i}`);
  if (!tr || !itens) return;
  const aberto = tr.classList.toggle('open');
  itens.style.display = aberto ? 'table-row' : 'none';
}

// Bootstrap
(async function init() {
  document.getElementById('fDataInicio').value = hojeISO();
  document.getElementById('fDataFim').value = addDias(hojeISO(), 90);
  await carregarContas();
  atualizar();
})();
</script>
</body>
</html>
