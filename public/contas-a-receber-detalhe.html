<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conta a Receber · Detalhe</title>
  <link rel="stylesheet" href="/css/sidebar.css">
  <link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout">
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Conta a receber</h1>
        <small><a class="back" href="/contas-a-receber.html">← Voltar para Contas a Receber</a></small>
      </div>
    </div>
    <div id="conteudo">Carregando…</div>
  </main>
</div>

<!-- Modal Receber -->
<div class="modal-bg" id="modalReceber">
  <div class="modal">
    <h2>Registrar recebimento</h2>
    <div class="resumo-pag" id="resumoPag"></div>
    <div class="row"><label>Conta financeira (entrada) *</label><select id="pContaFin"></select></div>
    <div class="row-2">
      <div class="row"><label>Data recebimento</label><input type="date" id="pData"></div>
      <div class="row">
        <label>Forma</label>
        <select id="pForma">
          <option value="">—</option>
          <option value="pix">PIX</option><option value="boleto">Boleto</option>
          <option value="transferencia">Transferência</option>
          <option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option>
        </select>
      </div>
    </div>
    <div class="row-2">
      <div class="row"><label>Valor base</label><input type="number" step="0.01" id="pBase" oninput="recalc()"></div>
      <div class="row">
        <label style="display:flex;align-items:center;gap:6px;font-size:0.85em;">
          <input type="checkbox" id="pParcial" onchange="recalc()"> Recebimento parcial
        </label>
      </div>
    </div>
    <div class="row-2">
      <div class="row"><label>+ Juros</label><input type="number" step="0.01" id="pJuros" value="0" oninput="recalc()"></div>
      <div class="row"><label>+ Multa</label><input type="number" step="0.01" id="pMulta" value="0" oninput="recalc()"></div>
    </div>
    <div class="row-2">
      <div class="row"><label>− Desconto</label><input type="number" step="0.01" id="pDesc" value="0" oninput="recalc()"></div>
      <div class="row"><label>&nbsp;</label>
        <div class="resumo-pag" style="margin:0;"><div class="linha total">Total: <span id="pTotal">R$ 0,00</span></div></div>
      </div>
    </div>
    <div class="row"><label>Observações</label><textarea id="pObs" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="fecharReceber()">Cancelar</button>
      <button class="btn btn-success" onclick="confirmarReceber()">Confirmar recebimento</button>
    </div>
  </div>
</div>

<!-- Modal Editar -->
<div class="modal-bg" id="modalEditar">
  <div class="modal">
    <h2>Editar conta</h2>
    <div class="row"><label>Descrição</label><input type="text" id="eDesc"></div>
    <div class="row-2">
      <div class="row"><label>Valor</label><input type="number" step="0.01" id="eValor"></div>
      <div class="row"><label>Vencimento</label><input type="date" id="eVenc"></div>
    </div>
    <div class="row-2">
      <div class="row"><label>Categoria</label><select id="eCategoria"></select></div>
      <div class="row">
        <label>Forma de pagamento</label>
        <select id="eForma">
          <option value="">—</option>
          <option value="pix">PIX</option><option value="boleto">Boleto</option>
          <option value="transferencia">Transferência</option>
          <option value="dinheiro">Dinheiro</option><option value="cartao">Cartão</option>
        </select>
      </div>
    </div>
    <div class="row"><label>Observações</label><textarea id="eObs" rows="2"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="fecharEditar()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarEdicao()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Cobrar -->
<div class="modal-bg" id="modalCobrar">
  <div class="modal">
    <h2>Enviar cobrança</h2>
    <p id="cobrarResumo" style="color:var(--text-2);margin-bottom:10px;"></p>
    <div class="row">
      <label>Canais</label>
      <div style="display:flex;gap:15px;flex-wrap:wrap;">
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="cobrarEmail" checked> E‑mail</label>
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="cobrarWa" checked> WhatsApp</label>
      </div>
    </div>
    <div class="row">
      <label>Etapa da régua</label>
      <select id="cobrarEtapa"></select>
    </div>
    <div id="cobrarPreview" style="background:rgba(255,255,255,0.04);border-radius:6px;padding:10px;margin-top:10px;font-size:0.88em;color:var(--text-2);white-space:pre-wrap;max-height:200px;overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="fecharCobrar()">Cancelar</button>
      <button class="btn btn-primary" id="btnCobrarConfirmar" onclick="confirmarCobrar()">Enviar cobrança</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" style="display:none;" accept="application/pdf,image/*" onchange="enviarAnexo(this.files[0])">

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('contas-a-receber');</script>
<script>
let CR_ID = null, DADOS = null;
function fmt(v){ return (v==null||isNaN(v))?'0,00':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtData(iso){ if(!iso) return '-'; const d = new Date((iso||'').length===10?iso+'T12:00:00':iso); return isNaN(d)?iso:d.toLocaleDateString('pt-BR'); }
function hoje(){ const d = new Date(Date.now() - 3*60*60*1000); return d.toISOString().slice(0,10); }

async function carregar(){
  CR_ID = new URLSearchParams(location.search).get('id');
  if (!CR_ID) { document.getElementById('conteudo').textContent = 'id obrigatório'; return; }
  try {
    const r = await fetch('/api/contas-a-receber/'+CR_ID);
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    DADOS = d;
    render();
  } catch(e){ document.getElementById('conteudo').textContent = 'Erro: '+e.message; }
}

function render(){
  const c = DADOS.conta, pagtos = DADOS.pagamentos, anexos = DADOS.anexos, parcelas = DADOS.parcelas, boletos = DADOS.boletos;
  const h = hoje();
  const vencida = ['aberta','parcial'].includes(c.status) && c.dataVencimento < h;
  const statusDisplay = vencida ? 'vencida' : c.status;
  const boletoAtivo = boletos.find(b => ['pendente','registrado'].includes(b.status));

  let html = `
    <div class="header-card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;">
        <div>
          <h1>${c.descricao}</h1>
          <div class="cliente"><strong>${c.pessoaNome||'—'}</strong> · ${c.pessoaCpfCnpj||''}${c.pessoaEmail?` · ${c.pessoaEmail}`:''}</div>
          <span class="badge ${statusDisplay}">${statusDisplay}</span>
          ${c.parcelaNumero ? `<span style="margin-left:8px;color:var(--text-2);font-size:0.88em;">Parcela ${c.parcelaNumero}/${c.totalParcelas}</span>` : ''}
          ${c.nfseId ? `<span style="margin-left:8px;color:var(--purple);font-size:0.88em;">📄 NFSe ${c.nfseNumero||c.nfseId}</span>` : ''}
        </div>
        <div class="actions">
          ${['aberta','parcial'].includes(c.status) ? `<button class="btn btn-success" onclick="abrirReceber()">💰 Receber</button>` : ''}
          ${vencida ? `<button class="btn btn-primary" onclick="abrirCobrar()">📣 Enviar cobrança</button>` : ''}
          ${['aberta','parcial'].includes(c.status) ? `<button class="btn btn-secondary" onclick="abrirEditar()">✏️ Editar</button>` : ''}
          <button class="btn btn-secondary" onclick="duplicar()">📋 Duplicar</button>
          ${['aberta','parcial'].includes(c.status) ? `<button class="btn btn-danger" onclick="cancelar()">Cancelar</button>` : ''}
          ${c.status === 'cancelada' ? `<button class="btn btn-secondary" onclick="reabrir()">Reabrir</button>` : ''}
        </div>
      </div>

      <div class="grid-info">
        <div class="info-item"><div class="lbl">Categoria</div><div class="val">${c.categoriaNome ? (c.categoriaIcone||'')+' '+c.categoriaNome : '—'}</div></div>
        <div class="info-item"><div class="lbl">Vencimento</div><div class="val ${vencida?'danger':''}">${fmtData(c.dataVencimento)}</div></div>
        <div class="info-item"><div class="lbl">Valor total</div><div class="val big">R$ ${fmt(c.valor)}</div></div>
        <div class="info-item"><div class="lbl">Recebido</div><div class="val success">R$ ${fmt(c.totalPago)}</div></div>
        <div class="info-item"><div class="lbl">Saldo</div><div class="val ${c.saldoRestante>0?'warn':'success'} big">R$ ${fmt(c.saldoRestante)}</div></div>
        <div class="info-item"><div class="lbl">Forma</div><div class="val">${c.formaPagamento||'—'}</div></div>
      </div>

      ${c.observacoes ? `<p style="margin-top:14px;padding:10px;background:var(--bg-1);border-radius:var(--r-sm);color:var(--text-1);font-size:0.88em;">${c.observacoes}</p>` : ''}
    </div>

    <div class="panel">
      <h3>Histórico de recebimentos <span style="color:var(--text-3);font-size:0.85em;font-weight:normal;">(${pagtos.length})</span></h3>
      ${pagtos.length ? `
        <table>
          <thead><tr><th>Data</th><th>Conta financeira</th><th>Forma</th><th style="text-align:right;">Base</th><th style="text-align:right;">Juros</th><th style="text-align:right;">Multa</th><th style="text-align:right;">Desc.</th><th style="text-align:right;">Total</th><th>Origem</th><th>Status</th><th></th></tr></thead>
          <tbody>${pagtos.map(p => `
            <tr style="${p.estornado?'opacity:0.55;':''}">
              <td>${fmtData(p.dataPagamento)}</td>
              <td>${p.contaFinanceiraNome||'—'}</td>
              <td>${p.formaPagamento||'—'}</td>
              <td style="text-align:right;">R$ ${fmt(p.valorBase)}</td>
              <td style="text-align:right;color:var(--warn);">R$ ${fmt(p.juros)}</td>
              <td style="text-align:right;color:var(--warn);">R$ ${fmt(p.multa)}</td>
              <td style="text-align:right;color:var(--success);">R$ ${fmt(p.desconto)}</td>
              <td style="text-align:right;"><strong>R$ ${fmt(p.valorPago)}</strong></td>
              <td><small style="color:var(--text-3);">${p.origem||'manual'}</small></td>
              <td><span class="badge ${p.estornado?'estornado':'paga'}">${p.estornado?'estornado':'pago'}</span></td>
              <td>${!p.estornado ? `<button class="btn btn-warn btn-sm" onclick="estornar(${p.id})">Estornar</button>` : ''}</td>
            </tr>`).join('')}</tbody>
        </table>` : '<p style="color:var(--text-3);">Nenhum recebimento registrado.</p>'}
    </div>

    ${boletos.length ? `
      <div class="panel">
        <h3>Boletos MercadoPago <span style="color:var(--text-3);font-size:0.85em;font-weight:normal;">(${boletos.length})</span></h3>
        ${boletos.map(b => `
          <div class="boleto-card">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
              <div>
                <span class="badge ${b.status}">${b.status}</span>
                <strong style="margin-left:8px;">R$ ${fmt(b.amount/100)}</strong>
                <span style="color:var(--text-3);margin-left:8px;">venc ${fmtData(b.expirationDate)}</span>
              </div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${b.externalUrl ? `<a href="${b.externalUrl}" target="_blank" class="btn btn-secondary btn-sm" style="text-decoration:none;">📄 Ver</a>` : ''}
                ${['pendente','registrado'].includes(b.status) ? `<button class="btn btn-secondary btn-sm" onclick="consultarBoleto(${b.id})">Consultar</button>` : ''}
                ${['pendente','registrado'].includes(b.status) ? `<button class="btn btn-secondary btn-sm" onclick="enviarEmailBoleto(${b.id})">📧 Email</button>` : ''}
                ${['pendente','registrado'].includes(b.status) ? `<button class="btn btn-secondary btn-sm" onclick="compartilharBoleto(${b.id})">💬 Compartilhar</button>` : ''}
                ${['pendente','registrado'].includes(b.status) ? `<button class="btn btn-danger btn-sm" onclick="cancelarBoleto(${b.id})">Cancelar</button>` : ''}
              </div>
            </div>
            ${b.writableLine ? `<div class="boleto-linha">${b.writableLine}</div>` : ''}
          </div>`).join('')}
        ${['aberta','parcial'].includes(c.status) && !boletoAtivo ? `<button class="btn btn-primary btn-sm" onclick="gerarBoleto()">+ Gerar novo boleto</button>` : ''}
      </div>` : (['aberta','parcial'].includes(c.status) ? `
      <div class="panel">
        <h3>Boleto MercadoPago</h3>
        <button class="btn btn-primary btn-sm" onclick="gerarBoleto()">+ Gerar boleto</button>
      </div>` : '')}

    <div class="panel">
      <h3>Anexos <span style="color:var(--text-3);font-size:0.85em;font-weight:normal;">(${anexos.length})</span></h3>
      <div class="dropzone" onclick="document.getElementById('fileInput').click()">📎 Clique para enviar um PDF ou imagem (contrato, comprovante…)</div>
      ${anexos.length ? `<div class="anexos-grid">${anexos.map(a => `
        <div class="anexo-card">
          <div class="nome">${a.tipo==='contrato'?'📜':a.tipo==='comprovante'?'🧾':'📎'} ${a.nomeOriginal}</div>
          <div class="meta">${a.mimeType||''} · ${((a.tamanho||0)/1024).toFixed(0)} KB · ${fmtData(a.dataUpload)}</div>
          <div class="acoes">
            <a class="btn btn-secondary btn-sm" href="/api/contas-a-receber/anexos/${a.id}/download" style="text-decoration:none;">⤓ Baixar</a>
            <button class="btn btn-danger btn-sm" onclick="excluirAnexo(${a.id})">Excluir</button>
          </div>
        </div>`).join('')}</div>` : ''}
    </div>

    ${parcelas.length > 1 ? `
      <div class="panel">
        <h3>Parcelas desta cobrança <span style="color:var(--text-3);font-size:0.85em;font-weight:normal;">(${parcelas.length})</span></h3>
        <table>
          <thead><tr><th>#</th><th>Descrição</th><th>Vencimento</th><th style="text-align:right;">Valor</th><th>Status</th><th></th></tr></thead>
          <tbody>${parcelas.map(p => `
            <tr style="${p.id == c.id ? 'background:var(--accent-soft);' : ''}">
              <td>${p.parcelaNumero}/${parcelas.length}</td>
              <td>${p.descricao}</td>
              <td>${fmtData(p.dataVencimento)}</td>
              <td style="text-align:right;">R$ ${fmt(p.valor)}</td>
              <td><span class="badge ${p.status}">${p.status}</span></td>
              <td>${p.id != c.id ? `<a href="/contas-a-receber-detalhe.html?id=${p.id}" style="color:var(--accent);font-size:0.85em;">abrir</a>` : '<em style="color:var(--text-3);">atual</em>'}</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>` : ''}

    ${c.nfseId ? `
      <div class="panel">
        <h3>NFSe vinculada</h3>
        <p>NFSe ${c.nfseNumero || ''} · status <span class="badge">${c.nfseStatus||'—'}</span></p>
        <a href="/nfse.html?aba=emitidas" class="btn btn-secondary btn-sm" style="text-decoration:none;display:inline-block;margin-top:8px;">Abrir NFSe</a>
      </div>` : ''}
  `;
  document.getElementById('conteudo').innerHTML = html;
}

// ===== Receber =====
async function abrirReceber(){
  const c = DADOS.conta;
  document.getElementById('resumoPag').innerHTML = `
    <div class="linha"><span>Valor total</span><strong>R$ ${fmt(c.valor)}</strong></div>
    <div class="linha"><span>Já recebido</span><strong style="color:var(--success);">R$ ${fmt(c.totalPago)}</strong></div>
    <div class="linha total"><span>Saldo restante</span><span>R$ ${fmt(c.saldoRestante)}</span></div>
  `;
  document.getElementById('pBase').value = c.saldoRestante.toFixed(2);
  document.getElementById('pJuros').value = 0;
  document.getElementById('pMulta').value = 0;
  document.getElementById('pDesc').value = 0;
  document.getElementById('pData').value = hoje();
  document.getElementById('pParcial').checked = false;
  document.getElementById('pForma').value = c.formaPagamento || '';
  recalc();
  try {
    const r = await fetch('/api/contas-financeiras');
    const d = await r.json();
    document.getElementById('pContaFin').innerHTML = (d.contas || []).filter(c => c.ativo).map(c => `<option value="${c.id}">${c.nome} (${c.tipo})</option>`).join('');
  } catch(e){}
  document.getElementById('modalReceber').classList.add('open');
}
function fecharReceber(){ document.getElementById('modalReceber').classList.remove('open'); }
function recalc(){
  const b = Number(document.getElementById('pBase').value) || 0;
  const j = Number(document.getElementById('pJuros').value) || 0;
  const m = Number(document.getElementById('pMulta').value) || 0;
  const d = Number(document.getElementById('pDesc').value) || 0;
  document.getElementById('pTotal').textContent = 'R$ ' + fmt(b + j + m - d);
}
async function confirmarReceber(){
  const body = {
    contaFinanceiraId: Number(document.getElementById('pContaFin').value),
    dataPagamento: document.getElementById('pData').value,
    valorBase: Number(document.getElementById('pBase').value),
    juros: Number(document.getElementById('pJuros').value) || 0,
    multa: Number(document.getElementById('pMulta').value) || 0,
    desconto: Number(document.getElementById('pDesc').value) || 0,
    parcial: document.getElementById('pParcial').checked,
    formaPagamento: document.getElementById('pForma').value || null,
    observacoes: document.getElementById('pObs').value || null
  };
  if (!body.contaFinanceiraId) { alert('Selecione conta financeira'); return; }
  if (!body.valorBase || body.valorBase <= 0) { alert('Valor base inválido'); return; }
  try {
    const r = await fetch('/api/contas-a-receber/'+CR_ID+'/baixar', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    fecharReceber(); carregar();
  } catch(e){ alert('Erro: '+e.message); }
}

async function estornar(pagamentoId){
  if (!confirm('Estornar este recebimento?\n\nO registro fica marcado como estornado (histórico preservado) e a movimentação financeira será removida.')) return;
  try {
    const r = await fetch('/api/contas-a-receber/'+CR_ID+'/estornar-baixa', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ pagamentoId }) });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    carregar();
  } catch(e){ alert('Erro: '+e.message); }
}

// ===== Editar =====
async function abrirEditar(){
  const c = DADOS.conta;
  document.getElementById('eDesc').value = c.descricao || '';
  document.getElementById('eValor').value = Number(c.valor).toFixed(2);
  document.getElementById('eVenc').value = (c.dataVencimento||'').slice(0,10);
  document.getElementById('eForma').value = c.formaPagamento || '';
  document.getElementById('eObs').value = c.observacoes || '';
  try {
    const r = await fetch('/api/cr-categorias');
    const d = await r.json();
    document.getElementById('eCategoria').innerHTML = '<option value="">— sem —</option>' + (d.categorias||[]).map(x => `<option value="${x.id}" ${x.id==c.categoriaId?'selected':''}>${x.icone||''} ${x.nome}</option>`).join('');
  } catch(e){}
  document.getElementById('modalEditar').classList.add('open');
}
function fecharEditar(){ document.getElementById('modalEditar').classList.remove('open'); }
async function salvarEdicao(){
  const body = {
    descricao: document.getElementById('eDesc').value.trim(),
    valor: Number(document.getElementById('eValor').value),
    dataVencimento: document.getElementById('eVenc').value,
    categoriaId: document.getElementById('eCategoria').value || null,
    formaPagamento: document.getElementById('eForma').value || null,
    observacoes: document.getElementById('eObs').value || null
  };
  try {
    const r = await fetch('/api/contas-a-receber/'+CR_ID, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    fecharEditar(); carregar();
  } catch(e){ alert('Erro: '+e.message); }
}

async function duplicar(){
  if (!confirm('Duplicar esta conta? Será criada uma nova aberta com vencimento para daqui 30 dias.')) return;
  try {
    const r = await fetch('/api/contas-a-receber/'+CR_ID+'/duplicar', { method:'POST' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    location.href = '/contas-a-receber-detalhe.html?id=' + d.id;
  } catch(e){ alert('Erro: '+e.message); }
}
async function cancelar(){
  if (!confirm('Cancelar esta conta?')) return;
  try {
    const r = await fetch('/api/contas-a-receber/'+CR_ID+'/cancelar', { method:'POST' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    carregar();
  } catch(e){ alert('Erro: '+e.message); }
}
async function reabrir(){
  if (!confirm('Reabrir esta conta cancelada?')) return;
  try {
    const r = await fetch('/api/contas-a-receber/'+CR_ID+'/reabrir', { method:'POST' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    carregar();
  } catch(e){ alert('Erro: '+e.message); }
}

// ===== Boletos MP =====
async function gerarBoleto(){
  if (!confirm('Gerar um novo boleto no MercadoPago para esta cobrança?')) return;
  try {
    const r = await fetch('/api/contas-a-receber/'+CR_ID+'/gerar-boleto', { method:'POST' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    carregar();
  } catch(e){ alert('Erro: '+e.message); }
}
async function consultarBoleto(id){
  try {
    const r = await fetch('/api/boletos/'+id+'/consultar', { method:'POST' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    carregar();
  } catch(e){ alert('Erro: '+e.message); }
}
async function cancelarBoleto(id){
  if (!confirm('Cancelar este boleto?')) return;
  try {
    const r = await fetch('/api/boletos/'+id+'/cancelar', { method:'POST' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    carregar();
  } catch(e){ alert('Erro: '+e.message); }
}
async function enviarEmailBoleto(id){
  try {
    const r = await fetch('/api/boletos/'+id+'/enviar-email', { method:'POST' });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    alert('Email enviado.');
  } catch(e){ alert('Erro: '+e.message); }
}
async function compartilharBoleto(id){
  try {
    const r = await fetch('/api/boletos/'+id+'/compartilhar');
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    if (d.whatsapp) window.open(d.whatsapp, '_blank');
    else if (d.texto) { await navigator.clipboard.writeText(d.texto); alert('Texto copiado para área de transferência.'); }
  } catch(e){ alert('Erro: '+e.message); }
}

// ===== Anexos =====
async function enviarAnexo(file){
  if (!file) return;
  const tipo = prompt('Tipo do anexo? (contrato, comprovante, boleto ou outro)', 'contrato') || 'outro';
  const fd = new FormData();
  fd.append('arquivo', file); fd.append('tipo', tipo);
  try {
    const r = await fetch('/api/contas-a-receber/'+CR_ID+'/anexos', { method:'POST', body: fd });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    document.getElementById('fileInput').value = '';
    carregar();
  } catch(e){ alert('Erro: '+e.message); }
}
async function excluirAnexo(id){
  if (!confirm('Excluir este anexo?')) return;
  await fetch('/api/contas-a-receber/anexos/'+id, { method:'DELETE' });
  carregar();
}

// ==================== COBRAR ====================
let COBRANCA_CFG = null;

async function abrirCobrar(){
  const c = DADOS.conta;
  try {
    if (!COBRANCA_CFG) {
      const r = await fetch('/api/cobrancas/config');
      const d = await r.json();
      if (!d.success) throw new Error(d.error);
      COBRANCA_CFG = d.config;
    }

    const diasAtraso = diffDias(c.dataVencimento);
    const ultimaEnviada = await buscarUltimaEtapa(c.id);

    const etapas = COBRANCA_CFG.regua.filter(e => e.canais && e.canais.length > 0);
    const sel = document.getElementById('cobrarEtapa');
    sel.innerHTML = etapas.map(e => {
      const mark = (e.etapa === (ultimaEnviada || 0) + 1) ? ' (sugerida)' : '';
      return `<option value="${e.etapa}">Etapa ${e.etapa} — D+${e.diasApos}${mark}</option>`;
    }).join('');
    const sugerida = etapas.find(e => e.etapa === (ultimaEnviada || 0) + 1) || etapas[0];
    sel.value = sugerida.etapa;

    document.getElementById('cobrarResumo').textContent =
      `Conta: ${c.descricao} — R$ ${Number(c.valor).toFixed(2)} — ${diasAtraso} dias de atraso` +
      (ultimaEnviada ? ` · Última cobrança enviada: etapa ${ultimaEnviada}` : '');

    atualizarPreviewCobrar();
    sel.onchange = atualizarPreviewCobrar;

    document.getElementById('modalCobrar').classList.add('open');
  } catch (err) {
    alert('Erro: ' + err.message);
  }
}

function fecharCobrar(){ document.getElementById('modalCobrar').classList.remove('open'); }

function atualizarPreviewCobrar(){
  const c = DADOS.conta;
  const etapaNum = Number(document.getElementById('cobrarEtapa').value);
  const etapa = COBRANCA_CFG.regua.find(e => e.etapa === etapaNum);
  if (!etapa) return;
  const ctx = {
    nome: c.pessoaNome || '', descricao: c.descricao || '',
    valor: 'R$ ' + Number(c.valor).toFixed(2).replace('.',','),
    vencimento: fmtData(c.dataVencimento),
    diasAtraso: String(diffDias(c.dataVencimento)),
    linhaDigitavel: '(linha do boleto)', linkBoleto: '(link do boleto)',
    nfseNumero: c.nfseNumero || '',
  };
  const subst = (t) => (t || '').replace(/\{\{(\w+)\}\}/g, (_, k) => ctx[k] !== undefined ? ctx[k] : '');
  let preview = '';
  if (document.getElementById('cobrarEmail').checked && etapa.emailTexto) {
    preview += 'E-MAIL\nAssunto: ' + subst(etapa.assunto) + '\n\n' + subst(etapa.emailTexto) + '\n\n';
  }
  if (document.getElementById('cobrarWa').checked && etapa.whatsappTexto) {
    preview += 'WHATSAPP\n' + subst(etapa.whatsappTexto);
  }
  document.getElementById('cobrarPreview').textContent = preview || '(canal vazio)';
}

async function buscarUltimaEtapa(contaId){
  try {
    const r = await fetch('/api/cobrancas/log?contaId=' + contaId + '&status=enviado&limite=1');
    const d = await r.json();
    if (d.success && d.logs?.length) return d.logs[0].etapa;
  } catch {}
  return 0;
}

async function confirmarCobrar(){
  const etapa = Number(document.getElementById('cobrarEtapa').value);
  const canais = [];
  if (document.getElementById('cobrarEmail').checked) canais.push('email');
  if (document.getElementById('cobrarWa').checked) canais.push('whatsapp');
  if (!canais.length) { alert('Selecione ao menos um canal'); return; }

  const btn = document.getElementById('btnCobrarConfirmar');
  btn.disabled = true;
  try {
    const resp = await fetch('/api/cobrancas/enviar/' + DADOS.conta.id, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ etapa, canais, forcar: true }),
    });
    const data = await resp.json();
    if (data.success) {
      const partes = Object.entries(data.canais || {}).map(([k,v]) =>
        `${k}: ${v.success ? 'enviado' : (v.queued ? 'em fila' : 'erro — ' + v.error)}`
      ).join(' | ');
      alert('Cobrança processada.\n' + partes);
      fecharCobrar();
      carregar();
    } else {
      alert('Erro: ' + (data.error || 'desconhecido'));
    }
  } catch (err) {
    alert('Erro: ' + err.message);
  } finally {
    btn.disabled = false;
  }
}

function diffDias(dataVenc){
  if (!dataVenc) return 0;
  const h = new Date(hoje() + 'T12:00:00Z');
  const v = new Date(String(dataVenc).slice(0,10) + 'T12:00:00Z');
  return Math.floor((h - v) / 86400000);
}
