<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romaneio · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div><h1 id="pgTitulo">Romaneio</h1><small id="pgSub"></small></div>
    <div class="actions">
      <a class="btn btn-secondary" href="/varejo/romaneios.html">← Lista</a>
      <button class="btn btn-primary" id="btnIniciar" onclick="iniciar()">Iniciar rota</button>
      <button class="btn btn-success" id="btnConcluir" onclick="concluir()">Concluir</button>
      <button class="btn btn-danger" id="btnCancelar" onclick="cancelar()">Cancelar</button>
    </div>
  </div>
  <div id="alertGlobal"></div>

  <div class="card">
    <div id="info">Carregando…</div>
  </div>

  <div class="card" style="margin-top:14px;">
    <h3>Adicionar parada</h3>
    <div class="form-row">
      <div class="form-group" style="flex:1;position:relative;">
        <label>De pedido (opcional — preenche endereço auto)</label>
        <input type="text" id="parPedidoBusca" placeholder="Número do pedido…" oninput="acPedido()">
        <input type="hidden" id="parPedidoId">
        <div id="acPedidoList" class="ac-list"></div>
      </div>
      <div class="form-group"><label>Hora prevista</label><input type="time" id="parHora"></div>
    </div>
    <div class="form-row">
      <div class="form-group full-width"><label>Endereço (manual se sem pedido)</label><input type="text" id="parEnd"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Cidade</label><input type="text" id="parCidade"></div>
      <div class="form-group"><label>UF</label><input type="text" id="parUf" maxlength="2" style="text-transform:uppercase"></div>
      <div class="form-group"><label>Contato</label><input type="text" id="parContato"></div>
      <div class="form-group"><label>Telefone</label><input type="text" id="parTel"></div>
    </div>
    <div class="actions-bar"><button class="btn btn-primary btn-sm" onclick="addParada()">+ Adicionar parada</button></div>
  </div>

  <div class="tbl-wrap" style="margin-top:14px;">
    <table>
      <thead><tr><th>#</th><th>Cliente / Pedido</th><th>Endereço</th><th>Cidade/UF</th><th>Contato</th><th>Hora prev.</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody id="tbPar"></tbody>
    </table>
  </div>
</main></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('romaneios');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
const id = new URLSearchParams(window.location.search).get('id');
let romData = null;

async function carregar(){
  const r = await fetch('/api/romaneios/'+id);
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  romData = d;
  const ro = d.romaneio;
  document.getElementById('pgTitulo').textContent=ro.numero;
  document.getElementById('pgSub').textContent=`${ro.data} · ${ro.motoristaNomeFunc||ro.motoristaNome||'sem motorista'} · ${ro.placa||'sem placa'}`;
  document.getElementById('info').innerHTML = `
    <table style="width:100%;font-size:13px;">
      <tr><td class="muted">Status</td><td><span class="badge ${ro.status==='concluido'?'entrada':ro.status==='cancelado'?'inativo':'pendente'}">${ro.status}</span></td>
      <td class="muted">UFs</td><td>${ro.ufOrigem||'—'} → ${ro.ufDestino||'—'}</td>
      <td class="muted">KM ini/fim</td><td>${ro.kmInicial||'—'} / ${ro.kmFinal||'—'}</td></tr>
      ${ro.observacoes ? `<tr><td class="muted">Obs</td><td colspan="5">${ro.observacoes}</td></tr>` : ''}
    </table>
  `;
  document.getElementById('btnIniciar').style.display = ro.status==='rascunho' ? '' : 'none';
  document.getElementById('btnConcluir').style.display = ro.status==='em-rota' ? '' : 'none';
  document.getElementById('btnCancelar').style.display = ro.status!=='concluido'&&ro.status!=='cancelado' ? '' : 'none';
  document.getElementById('tbPar').innerHTML = d.paradas.length ? d.paradas.map(p=>`<tr>
    <td>${p.sequencia}</td>
    <td>${p.clienteNome||'—'}${p.pedidoNumero?` <small class="muted">#${p.pedidoNumero}</small>`:''}</td>
    <td><small>${p.enderecoCompleto||'—'}</small></td>
    <td>${p.cidade||'—'}/${p.uf||'—'}</td>
    <td>${p.contato||'—'}${p.telefone?' · '+p.telefone:''}</td>
    <td>${p.horaPrevista||'—'}</td>
    <td><span class="badge ${p.status==='entregue'?'entrada':p.status==='nao-entregue'?'inativo':'pendente'}">${p.status}</span></td>
    <td>
      ${p.status==='pendente' ? `<button class="btn btn-success btn-sm" onclick="entregar(${p.id})">✓</button>
                                  <button class="btn btn-danger btn-sm" onclick="naoEntregar(${p.id})">✗</button>` : ''}
      <button class="btn btn-secondary btn-sm" onclick="mudarSeq(${p.id}, ${p.sequencia})">↕</button>
      <button class="btn btn-danger btn-sm" onclick="remParada(${p.id})">×</button>
    </td>
  </tr>`).join('') : '<tr><td colspan="8" class="empty">Sem paradas</td></tr>';
}

let acTimer;
function acPedido(){
  clearTimeout(acTimer);
  const q = document.getElementById('parPedidoBusca').value.trim();
  if (q.length<1){ document.getElementById('acPedidoList').innerHTML=''; return; }
  acTimer = setTimeout(async()=>{
    const r=await fetch('/api/pedidos?q='+encodeURIComponent(q));
    const d=await r.json();
    const lista = d.pedidos || [];
    document.getElementById('acPedidoList').innerHTML = lista.slice(0,10).map(p=>
      `<div onclick="selPedido(${p.id}, '${p.numero}', ${JSON.stringify(p.clienteNome||'').replace(/"/g,'&quot;')})">${p.numero} <small class="muted">${p.clienteNome||''}</small></div>`
    ).join('');
  },200);
}
function selPedido(id, num, cli){
  document.getElementById('parPedidoId').value=id;
  document.getElementById('parPedidoBusca').value=num+' — '+cli;
  document.getElementById('acPedidoList').innerHTML='';
}

async function addParada(){
  const body = {
    pedidoId: document.getElementById('parPedidoId').value ? Number(document.getElementById('parPedidoId').value) : null,
    horaPrevista: document.getElementById('parHora').value || null,
    enderecoCompleto: document.getElementById('parEnd').value || null,
    cidade: document.getElementById('parCidade').value || null,
    uf: document.getElementById('parUf').value.toUpperCase() || null,
    contato: document.getElementById('parContato').value || null,
    telefone: document.getElementById('parTel').value || null
  };
  const r = await fetch(`/api/romaneios/${id}/paradas`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  ['parPedidoId','parPedidoBusca','parHora','parEnd','parCidade','parUf','parContato','parTel'].forEach(x=>document.getElementById(x).value='');
  carregar();
}

async function iniciar(){ await fetch(`/api/romaneios/${id}/iniciar`,{method:'POST'}); carregar(); }
async function concluir(){ const km = prompt('KM final (opcional):'); await fetch(`/api/romaneios/${id}/concluir`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kmFinal: km?Number(km):null})}); carregar(); }
async function cancelar(){ if(!confirm('Cancelar romaneio?'))return; await fetch(`/api/romaneios/${id}/cancelar`,{method:'POST'}); carregar(); }
async function entregar(pid){ const a = prompt('Quem assinou?'); await fetch(`/api/romaneios/paradas/${pid}/entregar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assinante: a||null})}); carregar(); }
async function naoEntregar(pid){ const m = prompt('Motivo (mín 3 chars):'); if(!m||m.length<3)return; await fetch(`/api/romaneios/paradas/${pid}/nao-entregar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({motivo:m})}); carregar(); }
async function mudarSeq(pid, atual){ const novo = prompt('Nova sequência:', atual); if(!novo)return; await fetch(`/api/romaneios/paradas/${pid}/sequencia`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({sequencia:Number(novo)})}); carregar(); }
async function remParada(pid){ if(!confirm('Remover parada?'))return; await fetch(`/api/romaneios/paradas/${pid}`,{method:'DELETE'}); carregar(); }

carregar();
</script>
</body></html>
