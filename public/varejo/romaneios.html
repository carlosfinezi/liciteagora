<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romaneios · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div><h1>Romaneios de Entrega</h1><small>Roteiro de paradas para entregas</small></div>
    <div class="actions"><button class="btn btn-primary" onclick="abrirNovo()">+ Novo romaneio</button></div>
  </div>
  <div id="alertGlobal"></div>
  <div class="toolbar">
    <input type="text" id="fQ" placeholder="Buscar nº, placa ou motorista…" oninput="debounce(carregar)" style="flex:1;min-width:240px;">
    <select id="fStatus" onchange="carregar()"><option value="">Todos</option><option value="rascunho">Rascunho</option><option value="em-rota">Em rota</option><option value="concluido">Concluído</option><option value="cancelado">Cancelado</option></select>
  </div>
  <div class="tbl-wrap" data-grid="romaneios">
    <table>
      <thead><tr><th class="col-editar"></th><th>Número</th><th>Data</th><th>Motorista</th><th>Placa</th><th>UFs</th><th>Paradas</th><th>Status</th><th></th></tr></thead>
      <tbody id="tb"><tr><td colspan="9" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<div class="modal-bg" id="modal">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <div>
        <h3 style="margin:0;">Novo romaneio</h3>
        <small class="muted">Roteiro de entregas — motorista, placa e paradas</small>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="fecharModal()" title="Fechar" style="font-size:1.2em;line-height:1;padding:4px 10px;">×</button>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Data *</label><input type="date" id="fData"></div>
      <div class="form-group"><label>Placa</label><input type="text" id="fPlaca"></div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1;"><label>Motorista (funcionário)</label><select id="fMot"><option value="">— ou texto livre abaixo —</option></select></div>
      <div class="form-group" style="flex:1;"><label>Motorista (texto)</label><input type="text" id="fMotNome"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>UF Origem</label><input type="text" id="fUfO" maxlength="2" style="text-transform:uppercase"></div>
      <div class="form-group"><label>UF Destino</label><input type="text" id="fUfD" maxlength="2" style="text-transform:uppercase"></div>
      <div class="form-group"><label>KM inicial</label><input type="number" id="fKmI"></div>
    </div>
    <div class="form-row"><div class="form-group full-width"><label>Observações</label><textarea id="fObs" rows="2"></textarea></div></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Criar</button>
    </div>
  </div>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/grid.js"></script>
<script>initSidebar('romaneios');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
let debTimer; function debounce(fn){ clearTimeout(debTimer); debTimer=setTimeout(fn,300); }
function badgeRomaneio(s){
  return ({rascunho:'rascunho','em-rota':'em_separacao',concluido:'entregue',cancelado:'cancelado'})[s] || 'pendente';
}

async function carregarMotoristas(){
  const r = await fetch('/api/funcionarios?ativo=1').catch(()=>null);
  if (!r) return;
  const d = await r.json();
  if (d.success) document.getElementById('fMot').innerHTML = '<option value="">— ou texto livre abaixo —</option>' + d.funcionarios.map(f=>`<option value="${f.id}">${f.nome}</option>`).join('');
}

async function carregar(){
  const p = new URLSearchParams();
  const q = document.getElementById('fQ').value.trim(); if (q) p.set('q',q);
  const s = document.getElementById('fStatus').value; if (s) p.set('status',s);
  const r = await fetch('/api/romaneios?'+p);
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  document.getElementById('tb').innerHTML = d.romaneios.length ? d.romaneios.map(r=>`<tr>
    <td class="col-editar"><a class="btn btn-ghost btn-sm btn-icon-only" title="Abrir romaneio" href="/varejo/romaneio.html?id=${r.id}"><svg class="ic-sm"><use href="#i-edit"/></svg></a></td>
    <td class="mono"><strong>${r.numero}</strong></td>
    <td>${r.data}</td>
    <td>${r.motoristaNomeFunc||r.motoristaNome||'—'}</td>
    <td class="mono">${r.placa||'—'}</td>
    <td>${r.ufOrigem||'—'} → ${r.ufDestino||'—'}</td>
    <td><small>${r.paradas.entregues||0}/${r.paradas.total||0} entregues${r.paradas.naoEntregues?', '+r.paradas.naoEntregues+' não':''}</small></td>
    <td><span class="badge ${badgeRomaneio(r.status)}">${r.status}</span></td>
    <td></td>
  </tr>`).join('') : '<tr><td colspan="9" class="empty">Nenhum romaneio</td></tr>';
}

function abrirNovo(){
  ['fPlaca','fMotNome','fUfO','fUfD','fKmI','fObs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fData').value=new Date().toISOString().slice(0,10);
  document.getElementById('fMot').value='';
  document.getElementById('modal').classList.add('open');
}
function fecharModal(){ document.getElementById('modal').classList.remove('open'); }

async function salvar(){
  const body = {
    data: document.getElementById('fData').value,
    motoristaId: document.getElementById('fMot').value ? Number(document.getElementById('fMot').value) : null,
    motoristaNome: document.getElementById('fMotNome').value || null,
    placa: document.getElementById('fPlaca').value.toUpperCase() || null,
    ufOrigem: document.getElementById('fUfO').value.toUpperCase() || null,
    ufDestino: document.getElementById('fUfD').value.toUpperCase() || null,
    kmInicial: document.getElementById('fKmI').value ? Number(document.getElementById('fKmI').value) : null,
    observacoes: document.getElementById('fObs').value || null
  };
  if (!body.data) return showAlert('Data obrigatória','error');
  const r = await fetch('/api/romaneios', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json(); if (!d.success) return showAlert(d.error,'error');
  showAlert('Romaneio criado'); fecharModal();
  setTimeout(()=>window.location.href='/varejo/romaneio.html?id='+d.romaneio.id, 600);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('open')) fecharModal();
});

carregarMotoristas().then(carregar);
</script>
</body></html>
