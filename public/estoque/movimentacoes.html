<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movimentações de Estoque · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
<style>
  /* .num não existe no app-modern.css — sem isto a coluna numérica fica
     alinhada à esquerda. */
  .num { text-align:right; white-space:nowrap; }
  .sub { display:block; color:var(--text-3); font-size:.78em; }
</style>
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Movimentações de Estoque</h1>
      <small>Histórico de entradas, saídas e ajustes</small>
    </div>
    <div class="actions">
      <a class="btn btn-ghost btn-sm" href="/estoque/estoque.html" style="text-decoration:none;">← Saldo</a>
      <a class="btn btn-primary btn-sm" href="/estoque/movimentacao-nova.html">+ Nova movimentação</a>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="kpi-grid" id="kpis"></div>
  <div id="avisoTrunc"></div>

  <div class="toolbar">
    <input type="text" id="filtQ" placeholder="Buscar por SKU ou descrição…" oninput="debounce(carregarMov)" style="flex:1;min-width:220px;">
    <label style="display:flex;align-items:center;gap:6px;">De <input type="date" id="filtDe" onchange="carregarMov()"></label>
    <label style="display:flex;align-items:center;gap:6px;">Até <input type="date" id="filtAte" onchange="carregarMov()"></label>
    <select id="filtTipo" onchange="carregarMov()">
      <option value="">Todos os tipos</option>
      <option value="entrada">Entrada</option>
      <option value="saida">Saída</option>
      <option value="ajuste">Ajuste</option>
    </select>
    <select id="filtOrigem" onchange="carregarMov()">
      <option value="">Todas origens</option>
    </select>
    <select id="filtDeposito" onchange="carregarMov()" style="display:none;">
      <option value="">Todos os depósitos</option>
    </select>
    <select id="filtLimite" onchange="carregarMov()">
      <option value="200">200 linhas</option>
      <option value="500">500</option>
      <option value="1000">1000</option>
      <option value="2000">2000</option>
    </select>
  </div>

  <div class="tbl-wrap" data-grid="estoque-movimentacoes">
    <table>
      <thead><tr>
        <th>Data</th><th>SKU</th><th>Descrição</th><th>Tipo</th>
        <th class="num">Qtd</th>
        <th class="num" title="Custo unitário registrado na movimentação">Custo un.</th>
        <th class="num" title="Saldo do produto logo após esta movimentação">Saldo depois</th>
        <th>Origem</th><th>Depósito</th><th>Status</th><th>Observação</th><th></th>
      </tr></thead>
      <tbody id="tbMov"><tr><td colspan="12" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<div class="modal-bg" id="modalEstorno">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header">
      <div>
        <h3 style="margin:0;">Estornar movimentação</h3>
        <small class="muted">Cria uma movimentação contrária para anular o impacto no saldo</small>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="fecharModal()" title="Fechar" style="font-size:1.2em;line-height:1;padding:4px 10px;">×</button>
    </div>
    <div id="modalEstornoResumo" class="card card-info" style="margin-bottom:14px;font-size:0.88em;"></div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Motivo <span style="color:var(--danger);">*</span></label>
        <textarea id="motivoEstorno" rows="3" placeholder="Descreva o motivo do estorno (mín. 5 caracteres)"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmarEstorno()">Confirmar estorno</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/grid.js"></script>
<script>initSidebar('estoque-movimentacoes');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
function fmt(v){ return (v==null||isNaN(v))?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

let movAtual = null;

let debT; function debounce(fn){ clearTimeout(debT); debT=setTimeout(fn,300); }
const val = id => document.getElementById(id).value;

async function carregarMov(){
  const p=new URLSearchParams();
  for (const [param,id] of Object.entries({q:'filtQ', de:'filtDe', ate:'filtAte',
      tipo:'filtTipo', origem:'filtOrigem', depositoId:'filtDeposito', limit:'filtLimite'})) {
    const v = val(id); if (v) p.set(param, v);
  }
  const r=await fetch('/api/estoque/movimentacoes?'+p); const d=await r.json();
  if(!d.success) return showAlert(d.error,'error');

  const t = d.totais || {};
  const saldo = (t.qtdEntrada||0) - (t.qtdSaida||0) + (t.qtdAjuste||0);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Movimentações</div><div class="value">${t.registros||0}</div>
      <small class="muted">${t.estornadas||0} estornada(s)</small></div>
    <div class="kpi success"><div class="label">Entradas</div><div class="value">${fmt(t.qtdEntrada)}</div>
      <small class="muted">R$ ${fmt(t.valorEntrada)}</small></div>
    <div class="kpi danger"><div class="label">Saídas</div><div class="value">${fmt(t.qtdSaida)}</div>
      <small class="muted">R$ ${fmt(t.valorSaida)}</small></div>
    <div class="kpi ${saldo>=0?'':'warn'}"><div class="label">Variação no período</div>
      <div class="value">${saldo>=0?'+':''}${fmt(saldo)}</div>
      <small class="muted">entradas − saídas ± ajustes</small></div>`;

  // O LIMIT cortava as mais antigas em silêncio.
  document.getElementById('avisoTrunc').innerHTML = d.truncado
    ? `<div class="alert warn" style="display:block;">Mostrando ${d.movimentacoes.length} de
       <strong>${t.registros}</strong> movimentações. Refine o período ou aumente o limite.</div>` : '';

  const tb=document.getElementById('tbMov');
  tb.innerHTML = d.movimentacoes.length ? d.movimentacoes.map(m=>{
    const estornada = m.estornada === 1 || m.estornada === true;
    const statusBadge = estornada
      ? `<span class="badge cancelado" title="Estornada pela mov #${m.movEstornoId}">ESTORNADA</span>`
      : (String(m.origem||'').startsWith('estorno') ? `<span class="badge saida" title="Estorno da mov #${m.movOriginalId}">ESTORNO</span>` : '<span class="badge entrada">OK</span>');
    const podeEstornar = !estornada && !['pedido','estorno','transferencia'].includes(m.origem);
    const acao = podeEstornar
      ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick='abrirModalEstorno(${JSON.stringify(m).replace(/'/g,"&#39;")})'>Estornar</button>`
      : '';
    return `<tr${estornada?' style="opacity:0.6;"':''}>
      <td>${(m.data||'').slice(0,10)}</td><td class="mono">${m.sku}</td><td>${m.descricao}</td>
      <td><span class="badge ${m.tipo}">${m.tipo}</span></td>
      <td class="num">${fmt(m.quantidade)}</td>
      <td class="num">${m.custoUnitario!=null?('R$ '+fmt(m.custoUnitario)):'—'}</td>
      <td class="num">${m.saldoPosterior!=null?fmt(m.saldoPosterior):'—'}</td>
      <td>${m.origem||'-'}</td>
      <td>${m.depositoNome||'<span class="muted">padrão</span>'}</td>
      <td>${statusBadge}</td>
      <td>${m.observacao||'-'}</td>
      <td>${acao}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="12" class="empty">Sem movimentações no filtro</td></tr>';
}

async function carregarOrigens(){
  // Vem do banco: a lista fixa no HTML oferecia origens inexistentes e
  // escondia as reais.
  try {
    const d = await fetch('/api/estoque/movimentacoes/origens').then(r=>r.json());
    if (!d.success) return;
    document.getElementById('filtOrigem').innerHTML = '<option value="">Todas origens</option>' +
      d.origens.map(o=>`<option value="${o.origem}">${o.origem} (${o.n})</option>`).join('');
  } catch { /* mantém só "Todas origens" */ }
}

(async function initDepositos(){
  try {
    const r = await fetch('/api/depositos'); const d = await r.json();
    if (d.success && d.depositos && d.depositos.length > 1) {
      const sel = document.getElementById('filtDeposito');
      sel.innerHTML = '<option value="">Todos os depósitos</option>' +
        d.depositos.map(x=>`<option value="${x.id}">${x.nome}</option>`).join('');
      sel.style.display = '';
    }
  } catch { /* sem multi-depósito */ }
})();

function abrirModalEstorno(m){
  movAtual = m;
  const sinal = m.tipo === 'entrada' ? '-' : (m.tipo === 'saida' ? '+' : '-');
  document.getElementById('modalEstornoResumo').innerHTML =
    `<strong>${m.sku}</strong> — ${m.descricao}<br>` +
    `Tipo: <strong>${m.tipo}</strong> · Qtd: <strong>${fmt(m.quantidade)}</strong> · Data: ${m.data}<br>` +
    `<small>Impacto no saldo: <strong>${sinal}${fmt(Math.abs(m.quantidade))}</strong></small>`;
  document.getElementById('motivoEstorno').value = '';
  document.getElementById('modalEstorno').classList.add('open');
}

function fecharModal(){
  movAtual = null;
  document.getElementById('modalEstorno').classList.remove('open');
}

async function confirmarEstorno(){
  if (!movAtual) return;
  const motivo = document.getElementById('motivoEstorno').value.trim();
  if (motivo.length < 5) return showAlert('Motivo obrigatório (mín. 5 caracteres)', 'error');
  const r = await fetch('/api/estoque/movimentacoes/'+movAtual.id+'/estornar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ motivo })
  });
  const d = await r.json();
  if (!d.success) return showAlert(d.error, 'error');
  fecharModal();
  showAlert('Movimentação estornada');
  carregarMov();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modalEstorno').classList.contains('open')) fecharModal();
});

(async function iniciar(){
  const hoje = new Date();
  const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  document.getElementById('filtDe').value  = ini.toISOString().slice(0,10);
  document.getElementById('filtAte').value = hoje.toISOString().slice(0,10);
  await carregarOrigens();
  await carregarMov();
})();
</script>
</body></html>
