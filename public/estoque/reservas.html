<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas de Estoque · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Reservas de Estoque</h1>
      <small>Saldo reservado por pedidos confirmados aguardando entrega</small>
    </div>
    <div class="actions">
      <a class="btn btn-ghost btn-sm" href="/estoque/estoque.html" style="text-decoration:none;">← Estoque</a>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="kpi-grid" id="kpis"></div>
  <div id="semReserva"></div>
  <div id="avisoTrunc"></div>

  <div class="toolbar">
    <select id="filtStatus" onchange="carregar()">
      <option value="ativa" selected>Ativas (aguardando entrega)</option>
      <option value="consumida">Consumidas (já entregues)</option>
      <option value="cancelada">Canceladas</option>
      <option value="">Todas</option>
    </select>
    <input type="text" id="filtQ" placeholder="Buscar por SKU, produto, nº do pedido ou cliente…"
           oninput="debounce(carregar)" style="flex:1;min-width:260px;">
    <select id="filtLimite" onchange="carregar()">
      <option value="200">200 linhas</option>
      <option value="500">500</option>
      <option value="2000">2000</option>
    </select>
  </div>

  <div class="tbl-wrap" data-grid="estoque-reservas">
    <table>
      <thead><tr>
        <th>Data reserva</th>
        <th>Pedido</th>
        <th>Cliente</th>
        <th>Produto</th>
        <th>Lote</th>
        <th style="text-align:right;">Qtd reservada</th>
        <th>Status</th>
        <th></th>
      </tr></thead>
      <tbody id="tb"><tr><td colspan="8" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<div id="toasts"></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/grid.js"></script>
<script>initSidebar('estoque-reservas');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
function fmt(v){ return (v==null||isNaN(v))?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtData(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR').slice(0,5); }
let debTimer; function debounce(fn){ clearTimeout(debTimer); debTimer=setTimeout(fn, 300); }

async function carregar(){
  const status=document.getElementById('filtStatus').value;
  const p=new URLSearchParams();
  if(status) p.set('status',status);
  const q=document.getElementById('filtQ').value.trim();
  if(q) p.set('q',q);
  p.set('limit',document.getElementById('filtLimite').value);
  const r=await fetch('/api/reservas?'+p);
  const d=await r.json();
  if(!d.success) return showAlert(d.error,'error');

  const reservas = d.reservas;
  // Totais vêm do backend: calcular sobre a página errava a partir do limite.
  const t = d.totais || { registros:0, quantidade:0, pedidos:0, produtos:0 };
  const rotulo = status==='ativa' ? 'ativas' : status==='consumida' ? 'consumidas'
               : status==='cancelada' ? 'canceladas' : 'no filtro';

  document.getElementById('kpis').innerHTML = `
    <div class="kpi ${status==='ativa'?'warn':''}"><div class="label">Reservas ${rotulo}</div>
      <div class="value">${t.registros}</div></div>
    <div class="kpi"><div class="label">Qtd reservada</div><div class="value">${fmt(t.quantidade)}</div></div>
    <div class="kpi"><div class="label">Pedidos</div><div class="value">${t.pedidos}</div></div>
    <div class="kpi success"><div class="label">Produtos</div><div class="value">${t.produtos}</div></div>
  `;
  document.getElementById('avisoTrunc').innerHTML = d.truncado
    ? `<div class="alert warn" style="display:block;">Mostrando ${reservas.length} de <strong>${t.registros}</strong>.
       Refine a busca ou aumente o limite.</div>` : '';

  const tb=document.getElementById('tb');
  tb.innerHTML = reservas.length ? reservas.map(r=>{
    const statusBadge = r.status==='ativa' ? 'em_separacao' : r.status==='consumida' ? 'entregue' : 'cancelado';
    const podeCancelar = r.status === 'ativa';
    return `<tr>
      <td>${fmtData(r.dataCriacao)}</td>
      <td><a href="/comercial/pedido.html?id=${r.pedidoId}" class="mono"><strong>${r.pedidoNumero||'#'+r.pedidoId}</strong></a> <small class="muted">(${r.pedidoStatus||'—'})</small></td>
      <td>${r.clienteNome||'—'}</td>
      <td><strong>${r.sku}</strong> <small class="muted">${r.descricao||''}</small></td>
      <td>${r.loteNumero||'—'}${r.loteValidade?' <small class="muted">(val '+r.loteValidade+')</small>':''}</td>
      <td style="text-align:right;font-weight:600;">${fmt(r.quantidade)}</td>
      <td><span class="badge ${statusBadge}">${r.status}</span></td>
      <td style="text-align:right;white-space:nowrap;">
        ${podeCancelar ? `<button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="cancelar(${r.id})">Liberar</button>` : ''}
      </td>
    </tr>`;
  }).join('') : '<tr><td colspan="8" class="empty">Nenhuma reserva</td></tr>';
}

/**
 * Pedido confirmado sem reserva ativa. Antes isso era invisível: o pedido
 * simplesmente não aparecia na lista, então dava para ter venda confirmada
 * sem estoque comprometido e ninguém perceber.
 */
async function carregarSemReserva(){
  const box = document.getElementById('semReserva');
  const d = await fetch('/api/reservas/pedidos-sem-reserva').then(r=>r.json()).catch(()=>({}));
  if (!d || !d.success || !d.pedidos.length) { box.innerHTML=''; return; }
  box.innerHTML = `
    <div class="alert warn" style="display:block;">
      <strong>${d.pedidos.length} pedido(s) confirmado(s) sem reserva de estoque.</strong>
      A mercadoria deles não está comprometida — outro pedido pode consumir o mesmo saldo.
      <div class="tbl-wrap" style="margin-top:10px;">
        <table><thead><tr>
          <th>Pedido</th><th>Cliente</th><th>Status</th><th>Itens</th><th>Motivo</th><th></th>
        </tr></thead><tbody>
        ${d.pedidos.map(p=>`<tr>
          <td><a href="/comercial/pedido.html?id=${p.id}"><strong>${p.numero}</strong></a>
            <small class="muted"> ${p.tipo}</small></td>
          <td>${p.clienteNome||'—'}</td>
          <td><span class="badge ${p.status}">${p.status}</span></td>
          <td>${p.itens}${p.itensSemProduto?` <small class="muted">(${p.itensSemProduto} sem produto)</small>`:''}</td>
          <td><small>${p.motivo}</small></td>
          <td style="text-align:right;">${p.itensSemProduto===p.itens
            ? '<small class="muted">vincule o produto nos itens</small>'
            : `<button class="btn btn-ghost btn-sm" onclick="reservarPedido(${p.id})">Reservar agora</button>`}</td>
        </tr>`).join('')}
        </tbody></table>
      </div>
    </div>`;
}

async function reservarPedido(pedidoId){
  const d = await fetch('/api/reservas/pedidos/'+pedidoId+'/reservar', { method:'POST' }).then(r=>r.json());
  if (!d.success) return showAlert(d.error,'error');
  let msg = `${d.reservasCriadas} reserva(s) criada(s)`;
  if (d.insuficiencias && d.insuficiencias.length) {
    msg += ` — ${d.insuficiencias.length} item(ns) sem saldo suficiente`;
  }
  showAlert(msg);
  carregar(); carregarSemReserva();
}

async function cancelar(id){
  const motivo = prompt('Motivo para liberar esta reserva:');
  if (motivo == null) return;
  const r = await fetch('/api/reservas/'+id+'/cancelar', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ motivo: motivo || 'liberação manual' })
  });
  const d = await r.json();
  if(!d.success) return showAlert(d.error,'error');
  showAlert('Reserva liberada');
  carregar();
}

carregar();
carregarSemReserva();
</script>
</body></html>
