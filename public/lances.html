<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper de Lances - LiciteAgora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .main-content { background: #1a1a2e; padding: 20px; }
        h1 { color: #4dabf7; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 20px; }
        .status-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .status-item { background: #16213e; padding: 12px 16px; border-radius: 8px; flex: 1; min-width: 110px; text-align: center; }
        .status-item .label { color: #888; font-size: 0.8em; margin-bottom: 4px; }
        .status-item .value { font-size: 1.1em; font-weight: 600; }
        .verde { color: #4caf50; } .vermelho { color: #f44336; } .amarelo { color: #ff9800; } .azul { color: #4dabf7; }
        .panel { background: #16213e; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
        .panel h3 { color: #4dabf7; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid #0f3460; font-size: 1em; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; color: #aaa; font-size: 0.85em; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 0.95em; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #4dabf7; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .form-row .form-group { flex: 1; min-width: 120px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9em; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #4dabf7; color: #000; } .btn-primary:hover { background: #339af0; }
        .btn-danger { background: #f44336; color: #fff; } .btn-danger:hover { background: #d32f2f; }
        .btn-success { background: #4caf50; color: #fff; } .btn-success:hover { background: #388e3c; }
        .btn-outline { background: transparent; color: #4dabf7; border: 1px solid #4dabf7; } .btn-outline:hover { background: #4dabf722; }
        .btn-sm { padding: 4px 10px; font-size: 0.8em; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #0f3460; }
        th { color: #4dabf7; font-size: 0.85em; text-transform: uppercase; }
        tr:hover { background: #0f346044; }
        .result-card { padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.9em; }
        .result-card.sucesso { background: #1b5e20; } .result-card.erro { background: #b71c1c; }
        .log-container { max-height: 200px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 0.8em; background: #0d1117; border-radius: 6px; padding: 10px; }
        .log-ok { color: #4caf50; } .log-erro { color: #f44336; } .log-alerta { color: #ff9800; } .log-info { color: #888; } .log-sniper { color: #e040fb; font-weight: 600; }
        .agendamento-card { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-radius: 6px; background: #0f346055; margin-bottom: 8px; }
        .agendamento-card.executado { opacity: 0.7; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; font-weight: 600; }
        .badge-ok { background: #1b5e20; color: #4caf50; } .badge-erro { background: #b71c1c; color: #f44336; } .badge-aguardando { background: #e65100; color: #ff9800; }
        .lic-card { padding: 10px; border-radius: 6px; background: #0f346055; margin-bottom: 6px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .lic-card:hover { background: #0f3460; } .lic-card.selecionado { border-color: #4dabf7; background: #0f3460; }
        .lic-card .orgao { font-size: 0.85em; color: #aaa; }
        .lic-card .objeto { font-size: 0.8em; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lic-list { max-height: 300px; overflow-y: auto; }
        .info-msg { padding: 10px; color: #888; text-align: center; font-size: 0.9em; }
        .mt-10 { margin-top: 10px; } .mb-10 { margin-bottom: 10px; }
        .text-center { text-align: center; } .text-muted { color: #666; } .text-sm { font-size: 0.85em; }
        .part-card {
            background: #1a1a2e; border-radius: 8px; padding: 10px 14px;
            margin-bottom: 6px; cursor: pointer; transition: all 0.2s;
            border-left: 3px solid #333; display: flex; justify-content: space-between; align-items: center;
        }
        .part-card:hover { background: #0f3460; border-left-color: #4dabf7; }
        .part-card.selecionada { background: #0f3460; border-left-color: #4dabf7; }
        .part-card.em-disputa { border-left-color: #4caf50; background: #16213e; }
        .part-card .part-obj { font-size: 0.85em; max-width: 550px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .part-card .part-org { font-size: 0.75em; color: #888; margin-top: 2px; }
        .part-card .part-id { font-size: 0.75em; color: #4dabf7; font-family: monospace; }
        .part-card .part-right { text-align: right; white-space: nowrap; }
        .part-card .part-fase { font-size: 0.75em; padding: 2px 6px; border-radius: 3px; }
        .disputa-badge { background: #4caf5030; color: #4caf50; padding: 2px 8px; border-radius: 4px; font-size: 0.75em; font-weight: 600; }
        .disputa-itens { margin-top: 4px; font-size: 0.8em; color: #aaa; }
        .disputa-itens .item-val { color: #4caf50; font-weight: 600; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #4dabf7; border-top: 2px solid transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="app-container">
<main class="main-content">
    <h1>🎯 Sniper de Lances</h1>
    <p class="subtitle">Envio automatizado via API — Token da extensão Chrome</p>

    <div class="status-bar">
        <div class="status-item"><div class="label">Bearer Token</div><div class="value" id="statusToken">--</div></div>
        <div class="status-item"><div class="label">Origem</div><div class="value" id="statusOrigem">--</div></div>
        <div class="status-item"><div class="label">Hora Brasília</div><div class="value azul" id="horaServidor">--:--:--</div></div>
        <div class="status-item"><div class="label">Offset</div><div class="value" id="statusOffset">--</div></div>
        <div class="status-item"><div class="label">Agendamentos</div><div class="value azul" id="statusAgendamentos">0</div></div>
        <div class="status-item"><div class="label">Lances</div><div class="value azul" id="statusLances">0</div></div>
    </div>

    <div class="btn-group mb-10">
        <button class="btn btn-outline" onclick="calibrar()">🕐 Calibrar Relógio</button>
        <button class="btn btn-outline" onclick="atualizarTudo()">🔄 Atualizar</button>
        <button class="btn btn-outline" onclick="enviarTokenManual()">🔑 Colar Token Manual</button>
    </div>

    <!-- Painel de Seleção de Licitação -->
    <div class="panel">
        <h3>📋 Selecionar Licitação</h3>
        <div class="form-row" style="align-items:flex-end">
            <div class="form-group" style="flex:3">
                <label>Buscar (objeto, órgão ou compraId)</label>
                <input type="text" id="buscaParticipacao" placeholder="Digite para filtrar..." oninput="filtrarParticipacoes()">
            </div>
            <div class="form-group" style="flex:0">
                <button class="btn btn-outline" onclick="carregarParticipacoes()">Atualizar Lista</button>
            </div>
            <div class="form-group" style="flex:0">
                <button class="btn btn-primary" onclick="buscarDisputasAtivas()" id="btnDisputas">🔥 Buscar em Disputa</button>
            </div>
        </div>
        <div id="listaParticipacoes" style="max-height:300px; overflow-y:auto;">
            <p class="text-muted text-center">Carregando...</p>
        </div>
    </div>

    <!-- Seletor de Licitação -->
    <div class="grid-2">
        <div>
            <div class="panel">
                <h3>🚀 Enviar Lance</h3>
                <div class="form-row">
                    <div class="form-group" style="flex:2"><label>CompraId</label><input type="text" id="compraId" placeholder="93119906000012026"></div>
                    <div class="form-group" style="flex:0;align-self:flex-end"><button class="btn btn-outline" onclick="consultarItens()">🔍 Consultar Itens</button></div>
                </div>
                <div id="itensDisputa" style="display:none; margin-bottom:12px;"></div>
                <div class="form-row">
                    <div class="form-group"><label>Item</label><input type="number" id="itemNumero" value="1" min="1"></div>
                    <div class="form-group"><label>Valor (R$)</label><input type="number" id="valorLance" step="0.01" min="0" placeholder="1600.00"></div>
                </div>
                <div class="btn-group"><button class="btn btn-success" onclick="enviarLanceAgora()">⚡ Enviar Agora</button></div>
                <div id="resultadoLance"></div>
            </div>
            <div class="panel">
                <h3>⏱️ Agendar Sniper</h3>
                <div class="form-row">
                    <div class="form-group"><label>Horário Alvo (Brasília)</label><input type="time" id="horarioAlvo" step="1" value="16:00:00"></div>
                    <div class="form-group"><label>Data</label><input type="date" id="dataAlvo"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Antecedência (ms)</label><input type="number" id="antecedenciaMs" value="300" min="50" max="5000"></div>
                    <div class="form-group"><label>Tentativas</label><input type="number" id="tentativas" value="5" min="1" max="20"></div>
                    <div class="form-group"><label>Intervalo (ms)</label><input type="number" id="intervaloMs" value="50" min="10" max="2000"></div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="agendarSniper()">⏱️ Agendar</button>
                    <button class="btn btn-danger" onclick="cancelarTodos()">🛑 Cancelar Todos</button>
                </div>
                <div id="listaAgendamentos"></div>
            </div>
        </div>
        <div>
            <div class="panel"><h3>📊 Histórico de Lances</h3><div id="historicoLances"><p class="text-muted text-center">Nenhum</p></div></div>
            <div class="panel"><h3>📝 Logs do Sniper</h3><div class="log-container" id="logsContainer"><div class="text-muted">Sem logs</div></div></div>
        </div>
    </div>

<script>
const API = '';

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('dataAlvo').value = new Date().toISOString().split('T')[0];
    atualizarTudo();
    carregarParticipacoes();
    setInterval(atualizarTudo, 5000);
    setInterval(() => {
        // Relógio Brasília simples
        document.getElementById('horaServidor').textContent =
            new Date().toLocaleTimeString('pt-BR', {timeZone:'America/Sao_Paulo'});
        // Countdowns
        document.querySelectorAll('[data-countdown]').forEach(el => {
            const alvo = el.getAttribute('data-alvo');
            if (!alvo) return;
            const diff = new Date(alvo).getTime() - Date.now();
            if (diff <= 0) { el.textContent = '🔥 AGORA'; el.style.color = '#f44336'; }
            else {
                const min = Math.floor(diff/60000);
                const sec = Math.floor((diff%60000)/1000);
                el.textContent = min + 'm ' + sec + 's';
                el.style.color = diff < 60000 ? '#f44336' : '#ff9800';
            }
        });
    }, 500);
});

async function atualizarTudo() {
    try {
        const sniper = await fetch(`${API}/api/sniper/status`).then(r=>r.json()).catch(()=>({}));

        // Token status
        const tokenEl = document.getElementById('statusToken');
        if (sniper.temToken) {
            tokenEl.textContent = '✅ ' + (sniper.tokenIdade || 'OK');
            tokenEl.className = 'value verde';
        } else {
            tokenEl.textContent = '❌ Sem token';
            tokenEl.className = 'value vermelho';
        }

        // Origem
        const origemEl = document.getElementById('statusOrigem');
        origemEl.textContent = sniper.tokenSource || '--';
        origemEl.className = 'value ' + (sniper.tokenSource ? 'azul' : 'text-muted');

        // Offset / Agendamentos / Lances
        if (sniper.ativo) {
            const off = sniper.offsetServidorMs;
            document.getElementById('statusOffset').textContent = off != null ? off + 'ms' : '--';
            document.getElementById('statusAgendamentos').textContent = sniper.agendamentosAtivos || 0;
            document.getElementById('statusLances').textContent = sniper.lancesEnviados || 0;
        }
    } catch(e){}
    carregarAgendamentos();
    carregarHistorico();
    carregarLogs();
}

let todasParticipacoes = [];
let disputasAtivas = []; // cache de disputas ativas

async function carregarParticipacoes() {
    const div = document.getElementById('listaParticipacoes');
    div.innerHTML = '<p class="info-msg"><span class="spinner"></span> Carregando...</p>';
    try {
        const r = await fetch(`${API}/api/sniper/participacoes`);
        const d = await r.json();
        if (!d.success) { div.innerHTML = '<div class="result-card erro">❌ '+esc(d.error||'Erro')+'</div>'; return; }
        todasParticipacoes = d.participacoes || [];
        renderParticipacoes(todasParticipacoes);
    } catch(e) { div.innerHTML = '<div class="result-card erro">❌ '+esc(e.message)+'</div>'; }
}

function filtrarParticipacoes() {
    const busca = document.getElementById('buscaParticipacao').value.toLowerCase().trim();
    if (!busca) { renderParticipacoes(todasParticipacoes); return; }
    const filtradas = todasParticipacoes.filter(p =>
        (p.objeto||'').toLowerCase().includes(busca) ||
        (p.orgao||'').toLowerCase().includes(busca) ||
        (p.compraId||'').toLowerCase().includes(busca)
    );
    renderParticipacoes(filtradas);
}

function renderParticipacoes(lista) {
    const div = document.getElementById('listaParticipacoes');
    if (!lista.length) { div.innerHTML = '<p class="info-msg">Nenhuma participação encontrada</p>'; return; }

    div.innerHTML = lista.map(p => {
        const dispAtiva = disputasAtivas.find(d => d.compraId === p.compraId);
        const clsDisputa = dispAtiva ? ' em-disputa' : '';
        const sel = document.getElementById('compraId')?.value === p.compraId ? ' selecionada' : '';

        let infoDisputa = '';
        if (dispAtiva) {
            infoDisputa = '<div class="disputa-itens">' +
                dispAtiva.itens.map(i =>
                    '▸ Item ' + i.numero + ': <span class="item-val">R$ ' + fmtVal(i.melhorValor) + '</span>' +
                    (i.podeEnviar ? ' ✅' : ' 🔒') +
                    (i.fimContagem ? ' ⏰' + i.fimContagem.substring(11,16) : '')
                ).join('<br>') +
                '</div>';
        }

        let faseBadge = '';
        if (dispAtiva) faseBadge = '<span class="disputa-badge">🔥 EM DISPUTA</span>';
        else if (p.faseCompra) faseBadge = '<span class="text-sm text-muted">' + esc(p.faseCompra) + '</span>';

        return '<div class="part-card' + clsDisputa + sel + '" onclick="selecionarLic(\'' + p.compraId + '\')">'
            + '<div style="flex:1;min-width:0">'
            + '<div class="part-id">' + p.compraId + ' ' + faseBadge + '</div>'
            + '<div class="part-obj" title="' + esc(p.objeto||'') + '">' + esc(p.objeto||'(sem objeto)') + '</div>'
            + '<div class="part-org">' + esc(p.orgao||'') + '</div>'
            + infoDisputa
            + '</div>'
            + '<div class="part-right">'
            + (p.dataSessao ? '<div class="text-sm text-muted">' + p.dataSessao.substring(0,10) + '</div>' : '')
            + '</div></div>';
    }).join('');
}

function selecionarLic(id) {
    document.querySelectorAll('.part-card.selecionada').forEach(el=>el.classList.remove('selecionada'));
    document.getElementById('compraId').value = id;
    const el = document.querySelector('.part-card[onclick*="'+id+'"]');
    if (el) el.classList.add('selecionada');
    consultarItens(); // auto-consultar
}

async function consultarItens(tentativa) {
    tentativa = tentativa || 1;
    const compraId = document.getElementById('compraId').value.trim();
    if (!compraId) { alert('Informe o CompraId'); return; }
    const div = document.getElementById('itensDisputa');
    div.style.display = 'block';
    if (tentativa === 1) {
        div.innerHTML = '<p style="color:#888"><span class="spinner"></span> Consultando itens de ' + compraId + '...</p>';
    }

    try {
        const r = await fetch(`${API}/api/sniper/consultar-itens?compraId=${compraId}`);
        const d = await r.json();

        if (d.success && d.itens?.length > 0) {
            const fonte = d.fonte || 'desconhecida';
            const idade = d.idadeSegundos ? ` (${d.idadeSegundos}s atrás)` : '';
            div.innerHTML = '<div style="color:#4caf50;margin-bottom:8px;font-size:0.85em">✅ ' + d.itens.length + ' itens — fonte: ' + fonte + idade + '</div>' +
                '<table style="width:100%;border-collapse:collapse;font-size:0.85em">' +
                '<tr style="color:#888;text-align:left;border-bottom:1px solid #0f3460"><th style="padding:4px">Item</th><th>Descrição</th><th>Fase</th><th>Melhor R$</th><th>Nosso R$</th><th>Pode Enviar</th><th></th></tr>' +
                d.itens.map(i => {
                    const fase = i.fase || '--';
                    const faseColor = (fase === 'LA' || fase === 'D1' || fase === 'D2') ? '#4caf50' : '#888';
                    const pode = i.podeEnviar ? '✅' : '🔒';
                    const countdown = i.fimContagem ? '<div style="font-size:0.8em;color:#ff9800" data-countdown data-alvo="'+i.fimContagem+'">⏰</div>' : '';
                    return '<tr style="border-bottom:1px solid #0f346030">' +
                        '<td style="padding:4px;font-weight:600;color:#4dabf7">' + (i.numero || '--') + '</td>' +
                        '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(i.descricao||'')+'">' + esc((i.descricao||'').substring(0,60)) + '</td>' +
                        '<td style="color:'+faseColor+';font-weight:600">' + fase + '</td>' +
                        '<td style="color:#ff9800">' + fmtVal(i.melhorValor) + '</td>' +
                        '<td style="color:#4dabf7">' + fmtVal(i.nossoValor) + '</td>' +
                        '<td>' + pode + countdown + '</td>' +
                        '<td><button class="btn btn-primary" style="padding:2px 8px;font-size:0.8em" onclick="preencherLance('+(i.numero||1)+','+JSON.stringify(i.melhorValor)+')">Selecionar</button></td>' +
                        '</tr>';
                }).join('') +
                '</table>';
        } else if (d.fonte === 'aguardando-extensao' && tentativa <= 6) {
            // Extensão vai consultar, retry em 5s
            div.innerHTML = '<p style="color:#ff9800"><span class="spinner"></span> Aguardando extensão consultar itens (tentativa ' + tentativa + '/6)...</p>';
            setTimeout(() => consultarItens(tentativa + 1), 5000);
        } else {
            div.innerHTML = '<div style="color:#ff9800;font-size:0.9em">⚠️ Nenhum item encontrado.' +
                (d.error ? ' ' + d.error : '') +
                '<br><button class="btn btn-outline" style="margin-top:8px;font-size:0.8em" onclick="consultarItens(1)">🔄 Tentar novamente</button></div>';
        }
    } catch(e) {
        div.innerHTML = '<div style="color:#f44336">❌ Erro: ' + esc(e.message) + '</div>';
    }
}

function preencherLance(item, melhorValor) {
    document.getElementById('itemNumero').value = item;
    if (melhorValor && melhorValor > 0) {
        // Sugerir valor 1 centavo menor
        document.getElementById('valorLance').value = (melhorValor - 0.01).toFixed(2);
    }
    document.getElementById('valorLance').focus();
}

async function buscarDisputasAtivas() {
    const btn = document.getElementById('btnDisputas');
    const oldText = btn.textContent;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Buscando...';

    try {
        const r = await fetch(`${API}/api/sniper/disputas-ativas`);
        const d = await r.json();
        if (d.success) {
            disputasAtivas = d.disputas || [];
            const ativas = disputasAtivas.filter(x => x.itensAtivos > 0);
            let msg = '';
            if (d.fonte === 'sem-dados') {
                msg = '⚠️ Sem dados de disputas.\n\n' +
                    'A extensão Chrome precisa estar sincronizando.\n' +
                    'Verifique: Chrome aberto + Comprasnet logado + extensão ativa.\n\n' +
                    'Clique "🔄 Forçar Sync" no popup da extensão.';
            } else if (ativas.length === 0) {
                msg = 'Nenhuma disputa com itens ativos.\n' +
                    (d.idadeMinutos != null ? '(dados de ' + d.idadeMinutos + ' min atrás)' : '');
            } else {
                msg = '🔥 ' + ativas.length + ' disputa(s) com itens ativos!' +
                    (d.idadeMinutos != null ? '\n(dados de ' + d.idadeMinutos + ' min atrás)' : '');
                // Ordenar: disputas ativas primeiro
                todasParticipacoes.sort((a,b) => {
                    const aAtiva = disputasAtivas.some(d=>d.compraId===a.compraId && d.itensAtivos>0) ? 0 : 1;
                    const bAtiva = disputasAtivas.some(d=>d.compraId===b.compraId && d.itensAtivos>0) ? 0 : 1;
                    return aAtiva - bAtiva;
                });
            }
            alert(msg);
            renderParticipacoes(todasParticipacoes);
        } else {
            alert('❌ ' + (d.error || 'Erro'));
        }
    } catch(e) {
        alert('❌ Erro: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = oldText;
    }
}

async function enviarTokenManual() {
    const token = prompt('Cole o Bearer token aqui:\n\n(Abra o Comprasnet no Chrome, F12 > Network > qualquer requisição > copie o header Authorization)');
    if (!token) return;
    try {
        const r = await fetch(`${API}/api/auth/token`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ token: token.trim(), source: 'manual' }),
        });
        const d = await r.json();
        if (d.success) alert('✅ Token recebido!');
        else alert('❌ ' + d.error);
    } catch(e) { alert('❌ ' + e.message); }
    atualizarTudo();
}

async function calibrar() {
    try {
        const r = await fetch(`${API}/api/sniper/calibrar`,{method:'POST'});
        const d = await r.json();
        if (d.success) {
            document.getElementById('statusOffset').textContent = d.offset+'ms';
            alert('✅ Calibrado!\nHora servidor: '+d.tempoServidor+'\nOffset: '+d.offset+'ms\nLatência: '+d.latencia+'ms');
        } else alert('❌ '+d.error);
    } catch(e) { alert('❌ '+e.message); }
    atualizarTudo();
}

function getForm() {
    return {
        compraId: document.getElementById('compraId').value.trim(),
        itemNumero: parseInt(document.getElementById('itemNumero').value)||1,
        valor: parseFloat(document.getElementById('valorLance').value)||0,
    };
}

async function enviarLanceAgora() {
    const {compraId,itemNumero,valor} = getForm();
    if (!compraId||!valor) return alert('Preencha CompraId e Valor!');
    if (!confirm('Enviar R$ '+valor.toFixed(2)+' no item '+itemNumero+'?\n\n(Lance será enviado pela extensão via browser)')) return;
    const div = document.getElementById('resultadoLance');
    div.innerHTML = '<div class="result-card" style="background:#333"><span class="spinner"></span> Enviando via extensão (fila)...</div>';
    try {
        const r = await fetch(`${API}/api/sniper/lance`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({compraId,itemNumero,valor})});
        const data = await r.json();
        if (data.success) {
            div.innerHTML = '<div class="result-card" style="background:#1a3a5c">⏳ Lance na fila (id: '+data.id+'). Extensão processará em ~5s...<br><span class="spinner"></span> Aguardando resultado...</div>';
            // Poll for result
            const lanceId = data.id;
            let tentativas = 0;
            const pollInterval = setInterval(async () => {
                tentativas++;
                try {
                    const sr = await fetch(`${API}/api/sniper/fila-status`);
                    const sd = await sr.json();
                    const lance = sd.fila.find(l => l.id === lanceId);
                    const resultado = sd.resultados.find(r => r.id === lanceId);
                    if (lance && lance.status === 'sucesso') {
                        clearInterval(pollInterval);
                        div.innerHTML = '<div class="result-card sucesso">✅ LANCE ENVIADO! R$ '+valor.toFixed(2)+' item '+itemNumero+' ('+lance.tempoMs+'ms via browser)</div>';
                        atualizarTudo();
                    } else if (lance && lance.status === 'falha') {
                        clearInterval(pollInterval);
                        div.innerHTML = '<div class="result-card erro">❌ Lance falhou: HTTP '+(lance.httpStatus||'?')+' — '+(lance.resposta||'').substring(0,200)+'</div>';
                        atualizarTudo();
                    } else if (tentativas > 30) { // 30 * 2s = 60s timeout
                        clearInterval(pollInterval);
                        div.innerHTML = '<div class="result-card" style="background:#5c3a1a">⚠️ Timeout aguardando resultado. Verifique logs e se a extensão está rodando.</div>';
                    }
                } catch(e) {}
            }, 2000);
        } else div.innerHTML = '<div class="result-card erro">❌ '+(data.error||'Erro')+'</div>';
    } catch(e) { div.innerHTML = '<div class="result-card erro">❌ '+e.message+'</div>'; }
}

async function agendarSniper() {
    const {compraId,itemNumero,valor} = getForm();
    if (!compraId||!valor) return alert('Preencha CompraId e Valor!');
    const data = document.getElementById('dataAlvo').value;
    const hora = document.getElementById('horarioAlvo').value;
    if (!data||!hora) return alert('Preencha Data e Horário!');
    const localDate = new Date(data+'T'+hora);
    const utcDate = new Date(localDate.getTime()+3*3600000);
    const horarioAlvoUTC = utcDate.toISOString();
    const minutos = Math.floor((utcDate.getTime()-Date.now())/60000);
    const antecedenciaMs = parseInt(document.getElementById('antecedenciaMs').value)||300;
    const tentativas = parseInt(document.getElementById('tentativas').value)||5;
    const intervaloMs = parseInt(document.getElementById('intervaloMs').value)||50;
    if (!confirm('Agendar sniper:\n\nCompra: '+compraId+'\nItem: '+itemNumero+'\nValor: R$ '+valor.toFixed(2)+'\nAlvo: '+hora+' BRT (em ~'+minutos+' min)\nAntecedência: '+antecedenciaMs+'ms\nTentativas: '+tentativas+' x '+intervaloMs+'ms')) return;
    try {
        const r = await fetch(`${API}/api/sniper/agendar`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({compraId,itemNumero,valor,horarioAlvo:horarioAlvoUTC,antecedenciaMs,tentativas,intervaloTentativasMs:intervaloMs})});
        const d = await r.json();
        if (d.success) alert('✅ Agendado!\nDisparo: '+fmtHoraBRT(d.disparoEm)+' BRT\nEm '+d.delaySegundos+'s');
        else alert('❌ '+d.error);
    } catch(e) { alert('❌ '+e.message); }
    atualizarTudo();
}

async function cancelarTodos() {
    if (!confirm('Cancelar TODOS?')) return;
    try { const d=await fetch(`${API}/api/sniper/cancelar-todos`,{method:'POST'}).then(r=>r.json()); alert('Cancelados: '+(d.cancelados||0)); } catch(e){ alert(e.message); }
    atualizarTudo();
}

async function cancelarUm(id) {
    await fetch(`${API}/api/sniper/cancelar/${id}`,{method:'POST'}).catch(()=>{});
    atualizarTudo();
}

async function carregarAgendamentos() {
    try {
        const d = await fetch(`${API}/api/sniper/agendamentos`).then(r=>r.json());
        const div = document.getElementById('listaAgendamentos');
        if (!d.agendamentos?.length) { div.innerHTML='<p class="text-muted text-center mt-10">Nenhum agendamento</p>'; return; }
        div.innerHTML = d.agendamentos.map(ag => {
            const exec=ag.executado, ok=ag.resultados?.some(r=>r.sucesso);
            const badge = exec?(ok?'<span class="badge badge-ok">✅</span>':'<span class="badge badge-erro">❌</span>'):'<span class="badge badge-aguardando">⏳</span>';
            return '<div class="agendamento-card'+(exec?' executado':'')+'"><div>'
                +'<strong>Item '+ag.item+'</strong> — R$ '+(ag.valor?.toFixed(2)||'?')+'<br>'
                +'<span class="text-sm text-muted">'+ag.compraId+'</span><br>'
                +badge+' <span class="text-sm" data-countdown data-alvo="'+ag.alvo+'"></span>'
                +'</div><div style="text-align:right">'
                +'<div class="text-sm text-muted">Alvo: '+fmtHoraBRT(ag.alvo)+'</div>'
                +(!exec?'<button class="btn btn-danger btn-sm mt-10" onclick="cancelarUm(\''+ag.id+'\')">Cancelar</button>':'')
                +'</div></div>';
        }).join('');
    } catch(e){}
}

async function carregarHistorico() {
    try {
        const d = await fetch(`${API}/api/sniper/historico`).then(r=>r.json());
        const div = document.getElementById('historicoLances');
        if (!d.historico?.length) { div.innerHTML='<p class="text-muted text-center">Nenhum</p>'; return; }
        div.innerHTML = '<table><thead><tr><th>Hora</th><th>Item</th><th>Valor</th><th>Status</th><th>Ms</th></tr></thead><tbody>'
            +d.historico.slice(0,20).map(l=>'<tr><td>'+fmtHoraBRT(l.timestamp)+'</td><td>'+l.itemNumero+'</td><td>R$ '+fmtVal(l.valor)+'</td><td class="'+(l.sucesso?'verde':'vermelho')+'">'+(l.sucesso?'✅':'❌ '+l.status)+'</td><td>'+l.tempoMs+'</td></tr>').join('')
            +'</tbody></table>';
    } catch(e){}
}

async function carregarLogs() {
    try {
        const d = await fetch(`${API}/api/sniper/logs`).then(r=>r.json());
        const div = document.getElementById('logsContainer');
        if (!d.logs?.length) { div.innerHTML='<div class="text-muted">Sem logs</div>'; return; }
        div.innerHTML = d.logs.slice(-30).map(log=>{
            let c='log-info'; if(log.includes('✅'))c='log-ok'; else if(log.includes('❌')||log.includes('Erro'))c='log-erro'; else if(log.includes('⚠️'))c='log-alerta'; else if(log.includes('🎯')||log.includes('🚀'))c='log-sniper';
            return '<div class="'+c+'">'+esc(log)+'</div>';
        }).join('');
        div.scrollTop = div.scrollHeight;
    } catch(e){}
}

function fmtVal(v){return v==null?'--':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtHoraBRT(iso){if(!iso)return'--';return new Date(iso).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo'});}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
