<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper de Lances - LiciteAgora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .main-content { background: #1a1a2e; padding: 20px; }
        h1 { color: #4dabf7; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 20px; }

        /* Status bar */
        .status-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .status-item { background: #16213e; padding: 10px 14px; border-radius: 8px; flex: 1; min-width: 100px; text-align: center; }
        .status-item .label { color: #888; font-size: 0.75em; margin-bottom: 3px; }
        .status-item .value { font-size: 1em; font-weight: 600; }
        .verde { color: #4caf50; } .vermelho { color: #f44336; } .amarelo { color: #ff9800; } .azul { color: #4dabf7; }

        /* Panel */
        .panel { background: #16213e; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .panel h3 { color: #4dabf7; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #0f3460; font-size: 1em; }

        /* Filters */
        .filtros { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .filtros label { font-size: 0.85em; cursor: pointer; display: flex; align-items: center; gap: 4px; color: #ccc; }
        .filtros label:hover { color: #4dabf7; }
        .filtros input[type=text] { flex: 1; min-width: 200px; padding: 6px 10px; border-radius: 6px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 0.85em; }
        .filtros input[type=text]:focus { outline: none; border-color: #4dabf7; }

        /* Licitação rows */
        .lic-row { border: 1px solid #0f3460; border-radius: 6px; margin-bottom: 4px; overflow: hidden; }
        .lic-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; transition: background 0.15s; }
        .lic-header:hover { background: #0f346040; }
        .lic-header.aberta { background: #0f346060; border-bottom: 1px solid #0f3460; }
        .lic-left { flex: 1; min-width: 0; }
        .lic-id { font-size: 0.85em; font-weight: 600; color: #4dabf7; }
        .lic-obj { font-size: 0.8em; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 550px; margin-top: 2px; }
        .lic-org { font-size: 0.72em; color: #888; margin-top: 1px; }
        .lic-right { text-align: right; flex-shrink: 0; margin-left: 12px; }
        .lic-etapa { font-size: 0.8em; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
        .etapa-disputa { background: #4caf5025; color: #4caf50; }
        .etapa-encerrada { background: #88888825; color: #888; }
        .etapa-outra { background: #ff980025; color: #ff9800; }
        .lic-data { font-size: 0.72em; color: #888; margin-top: 3px; }
        .lic-body { display: none; padding: 12px 14px; background: #1a1a2e; }
        .lic-body.aberta { display: block; }
        .lic-arrow { color: #888; font-size: 0.8em; transition: transform 0.2s; margin-left: 8px; }
        .lic-arrow.aberta { transform: rotate(180deg); }

        /* Item table */
        .itens-table { width: 100%; border-collapse: collapse; font-size: 0.82em; table-layout: auto; }
        .itens-table th { color: #888; text-align: left; padding: 4px 5px; border-bottom: 1px solid #0f3460; font-weight: 500; white-space: nowrap; font-size: 0.9em; }
        .itens-table td { padding: 4px 5px; border-bottom: 1px solid #0f346030; vertical-align: middle; }
        .itens-table tr:hover { background: #0f346020; }
        .itens-table input[type=number] { width: 72px; padding: 3px 4px; border-radius: 4px; border: 1px solid #0f3460; background: #16213e; color: #eee; font-size: 0.9em; }
        .itens-table input:focus { outline: none; border-color: #4dabf7; }
        .itens-table .desc-cell { max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stacked-cell { line-height: 1.5; }
        .stacked-cell .sub { color: #888; font-size: 0.85em; }
        .blitz-row { display: flex; align-items: center; gap: 3px; margin-top: 3px; }
        .blitz-row input[type=text] { width: 85px; }
        .valor-melhor { color: #4caf50; font-weight: 600; }
        .valor-nosso { color: #4dabf7; font-weight: 600; }
        .valor-nosso.melhor { color: #ffd700; }
        .badge-sit { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 0.75em; font-weight: 600; margin-left: 4px; }
        .badge-G { background: #4caf5030; color: #4caf50; }
        .badge-P { background: #4dabf730; color: #4dabf7; }
        .badge-C { background: #ff980030; color: #ff9800; }
        .badge-D, .badge-A, .badge-F, .badge-I, .badge-R { background: #f4433630; color: #f44336; }
        .badge-filtro { display: inline-block; padding: 1px 4px; border-radius: 3px; font-size: 0.7em; font-weight: 700; margin-left: 3px; letter-spacing: 0.3px; }
        .badge-perd { background: #f4433630; color: #f44336; }
        .badge-aleat { background: #e91e6330; color: #e91e63; }
        .badge-2min { background: #9c27b030; color: #ce93d8; }

        /* Auto-lance select */
        .auto-select { padding: 3px 4px; border-radius: 4px; border: 1px solid #444; cursor: pointer; font-size: 0.78em; font-weight: 600; background: #1a1a2e; color: #666; appearance: auto; }
        .auto-select.continuo { color: #4caf50; border-color: #4caf50; background: #4caf5015; }
        .auto-select.sniper { color: #ff9800; border-color: #ff9800; background: #ff980015; }
        .auto-select:focus { outline: none; }

        /* Countdown */
        .countdown { font-size: 0.75em; font-weight: 600; font-variant-numeric: tabular-nums; }
        .countdown.verde { color: #4caf50; }
        .countdown.amarelo { color: #ff9800; }
        .countdown.vermelho { color: #f44336; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }

        /* Auto-log area */
        .auto-log-area { background: #0f0f1e; border: 1px solid #0f3460; border-radius: 6px; padding: 8px; margin-top: 8px; max-height: 200px; overflow-y: auto; font-size: 0.75em; font-family: monospace; }
        .auto-log-area .log-entry { color: #888; padding: 1px 0; }
        .auto-log-area .log-entry .ts { color: #555; }

        /* Buttons */
        .btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85em; font-weight: 500; transition: all 0.2s; }
        .btn-success { background: #4caf50; color: #fff; } .btn-success:hover { background: #43a047; }
        .btn-primary { background: #4dabf7; color: #000; } .btn-primary:hover { background: #339af0; }
        .btn-outline { background: transparent; border: 1px solid #4dabf7; color: #4dabf7; } .btn-outline:hover { background: #4dabf710; }
        .btn-warning { background: #ff9800; color: #000; } .btn-warning:hover { background: #f57c00; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-sm { padding: 3px 8px; font-size: 0.78em; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-group { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

        .result-msg { padding: 6px 10px; border-radius: 4px; margin-top: 6px; font-size: 0.82em; }
        .result-sucesso { background: #4caf5018; border: 1px solid #4caf50; color: #4caf50; }
        .result-erro { background: #f4433618; border: 1px solid #f44336; color: #f44336; }
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #4dabf740; border-top: 2px solid #4dabf7; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; border-radius: 8px; font-size: 0.85em; z-index: 999; color: #fff; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        .info-msg { color: #888; text-align: center; padding: 12px; font-size: 0.85em; }
        .contagem { font-size: 0.72em; color: #888; margin-top: 2px; }

        /* Custo / Lucro */
        .valor-lucro { font-weight: 600; font-size: 0.9em; }
        .valor-lucro.positivo { color: #4caf50; }
        .valor-lucro.negativo { color: #f44336; }
        .valor-lucro.zero { color: #888; }
        .config-imposto { display: inline-flex; align-items: center; gap: 6px; background: #16213e; padding: 6px 12px; border-radius: 6px; font-size: 0.82em; margin-left: 12px; }
        .config-imposto label { color: #ccc; font-weight: 500; }
        .config-imposto input { width: 65px; padding: 3px 6px; border-radius: 4px; border: 1px solid #0f3460; background: #1a1a2e; color: #ff9800; font-size: 0.95em; font-weight: 600; text-align: center; }
        .config-imposto input:focus { outline: none; border-color: #ff9800; }
        .mv-cell { color: #888; font-size: 0.9em; }
        .sugerido-cell { color: #4dabf7; font-weight: 600; font-size: 0.9em; cursor: pointer; }
        .sugerido-cell:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="app-container">
<main class="main-content">
    <h1>🎯 Sniper de Lances</h1>
    <p class="subtitle">Disputas ativas do Comprasnet → clique para ver itens → configure e envie</p>

    <div class="status-bar">
        <div class="status-item"><div class="label">Extensão</div><div class="value" id="stExt">--</div></div>
        <div class="status-item"><div class="label">Electron</div><div class="value" id="stElectron">--</div></div>
        <div class="status-item"><div class="label">Bearer</div><div class="value" id="stBearer">--</div></div>
        <div class="status-item"><div class="label">Brasília</div><div class="value azul" id="hora">--:--:--</div></div>
        <div class="status-item"><div class="label">Disputas</div><div class="value azul" id="stDisp">0</div></div>
        <div class="status-item"><div class="label">Lances</div><div class="value azul" id="stLances">0</div></div>
        <div class="status-item" style="cursor:pointer" onclick="toggleAutoEngine()" title="Clique para ligar/desligar engine"><div class="label">Auto</div><div class="value" id="stAuto"><span class="vermelho">OFF</span></div></div>
    </div>

    <!-- Electron Status (collapsible) -->
    <div class="panel" id="panelElectron" style="display:none">
        <h3 style="cursor:pointer" onclick="document.getElementById('electronBody').style.display=document.getElementById('electronBody').style.display==='none'?'block':'none'">
            🖥️ Electron Remoto <span style="font-weight:normal;font-size:0.85em;color:#888">(clique para expandir)</span>
        </h3>
        <div id="electronBody">
            <div id="electronInfo" style="font-size:0.82em;color:#aaa;margin-bottom:10px"></div>
            <div id="electronLogs" style="max-height:150px;overflow-y:auto;font-family:monospace;font-size:0.75em;color:#aaa;background:#111;padding:6px;border-radius:4px;display:none"></div>
            <button class="btn btn-outline btn-sm" style="margin-top:6px;font-size:0.75em" onclick="document.getElementById('electronLogs').style.display=document.getElementById('electronLogs').style.display==='none'?'block':'none'">Ver logs</button>
        </div>
    </div>

    <div class="panel">
        <h3>🔥 Compras — Minhas Participações</h3>
        <div class="filtros">
            <label><input type="radio" name="filtroEtapa" value="ativa" checked onchange="aplicarFiltro()"> Disputa Ativa</label>
            <label><input type="radio" name="filtroEtapa" value="disputa" onchange="aplicarFiltro()"> Em Andamento</label>
            <label><input type="radio" name="filtroEtapa" value="todas" onchange="aplicarFiltro()"> Todas</label>
            <input type="text" id="buscaTexto" placeholder="Filtrar por objeto, órgão ou compraId..." oninput="aplicarFiltro()">
            <input type="date" id="filtroData" onchange="aplicarFiltro()" title="Filtrar por data da sessão" style="padding:4px 6px;border-radius:6px;border:1px solid #0f3460;background:#1a1a2e;color:#eee;font-size:0.85em">
            <button class="btn btn-outline btn-sm" onclick="document.getElementById('filtroData').value='';aplicarFiltro()" title="Limpar filtro de data" style="padding:4px 6px;font-size:0.75em">X</button>
            <button class="btn btn-outline btn-sm" onclick="recarregarDados()">🔄</button>
            <span class="config-imposto">
                <label>Imposto %</label>
                <input type="number" id="impostoPercent" step="0.1" min="0" max="100" value="15" onchange="salvarImposto();recalcTodosLucros()" title="Percentual de imposto sobre o lance">
            </span>
            <span class="config-imposto">
                <label>Margem %</label>
                <input type="number" id="margemPercent" step="0.1" min="0" max="1000" value="20" onchange="salvarMargem();recalcTodosLucros()" title="Margem de lucro desejada sobre o custo" style="color:#4dabf7;border-color:#4dabf7">
            </span>
        </div>
        <div id="listaCompras"><p class="info-msg"><span class="spinner"></span> Carregando participações...</p></div>
    </div>

    <div id="toastArea"></div>
</main>
</div>
<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('lances');</script>
<script>
var API = '';
var participacoes = [];
var disputasLive = {};  // compraId -> { itens: [...] } from extension cache
var itensConfig = {};   // compraId -> [sniper_itens rows] from DB
var abertas = new Set();  // compraIds expandidas (múltiplas)

function esc(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function fmtR$(v) { return v != null && v !== '' && !isNaN(v) ? 'R$ ' + parseFloat(v).toFixed(2) : '--'; }
function fmtHora(iso) { if(!iso)return'--'; try{var s=iso.endsWith('Z')||iso.includes('+')?iso:iso+'Z';var d=new Date(s);return d.toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo'})+'.'+String(d.getMilliseconds()).padStart(3,'0');}catch(e){return iso;} }

var MOD_NOMES = {'05':'Concorrência','06':'PE','07':'Pregão','08':'Dispensa','09':'Inexigibilidade','10':'Credenciamento'};
function fmtCompraId(cid) {
    if(!cid || cid.length < 17) return cid||'';
    var uasg = cid.substring(0,6);
    var mod = cid.substring(6,8);
    var num = cid.substring(8,13);
    var ano = cid.substring(13,17);
    var modNome = MOD_NOMES[mod] || 'Mod'+mod;
    return modNome + ' ' + parseInt(num) + '/' + ano + ' — UASG ' + parseInt(uasg);
}

// ==================== STATUS ====================
async function atualizarStatus() {
    try {
        var r = await fetch(API+'/api/sniper/fila-status'); var d = await r.json();
        if(d.success){
            document.getElementById('stExt').innerHTML = d.extensaoConectada?'<span class="verde">OK</span>':'<span class="vermelho">OFF</span>';
            // Bearer com cor baseada na idade
            if(d.temBearer) {
                var idadeS = d.bearerIdade||0;
                var corBearer = idadeS < 300 ? 'verde' : idadeS < 600 ? 'amarelo' : 'vermelho';
                var labelBearer = d.tokenExpirado ? 'EXPIRADO' : Math.floor(idadeS/60)+'m';
                document.getElementById('stBearer').innerHTML = '<span class="'+corBearer+'">'+labelBearer+'</span>';
            } else {
                document.getElementById('stBearer').innerHTML = '<span class="vermelho">SEM</span>';
            }
            document.getElementById('stLances').textContent = d.totalResultados||0;
            // Disputas com idade do cache
            if(d.disputasCache && d.disputasCache.atualizadoEm) {
                var idadeDisp = d.disputasCache.idadeSegundos||0;
                var corDisp = idadeDisp < 180 ? 'verde' : idadeDisp < 600 ? 'amarelo' : 'vermelho';
                document.getElementById('stDisp').innerHTML = '<span class="'+corDisp+'">'+d.disputasCache.total+'</span>';
            }
        }
    }catch(e){}
}

// ==================== LOAD DATA ====================
async function recarregarDados() {
    await Promise.all([carregarParticipacoes(), carregarDisputasLive()]);
    aplicarFiltro();
}

async function carregarParticipacoes() {
    try {
        var r = await fetch(API+'/api/sniper/participacoes');
        var d = await r.json();
        participacoes = d.success ? d.participacoes : [];
    } catch(e) { participacoes = []; }
}

async function carregarDisputasLive() {
    try {
        var r = await fetch(API+'/api/sniper/disputas-ativas');
        var d = await r.json();
        disputasLive = {};
        if(d.success && d.disputas) {
            d.disputas.forEach(function(disp) { disputasLive[disp.compraId] = disp; });
        }
        document.getElementById('stDisp').textContent = Object.keys(disputasLive).length;
    } catch(e) {}
}

// ==================== FILTER & RENDER ====================
function aplicarFiltro() {
    var filtro = document.querySelector('input[name=filtroEtapa]:checked').value;
    var busca = document.getElementById('buscaTexto').value.toLowerCase().trim();
    var filtroData = document.getElementById('filtroData').value; // YYYY-MM-DD or ''

    var lista = participacoes.filter(function(p) {
        // Filtro por data da sessão
        if(filtroData && p.dataSessao) {
            if((p.dataSessao||'').substring(0,10) !== filtroData) return false;
        }

        var fase = p.faseCompra||'';
        var live = disputasLive[p.compraId];
        var sit = (p.situacao||'').toUpperCase();

        if(filtro === 'ativa') {
            if(sit==='FR'||sit==='EN'||sit==='SU') return false;
            if(fase==='4'||fase==='encerrada'||fase==='99') return false;
            if(!live) return false;
            var algumAtivo = (live.itens||[]).some(function(i) {
                var f = (i.fase||'').toUpperCase();
                return f==='LA'||f==='D1'||f==='D2'||i.podeEnviar;
            });
            return algumAtivo;
        }

        if(filtro === 'disputa') {
            if(sit==='FR'||sit==='EN'||sit==='SU') return false;
            if(fase==='4'||fase==='encerrada'||fase==='99') return false;
            if(live && live.totalItens > 0 && live.itensAtivos === 0) {
                var algumAtivo2 = (live.itens||[]).some(function(i) {
                    var f = (i.fase||'').toUpperCase();
                    return f==='LA'||f==='D1'||f==='D2'||i.podeEnviar;
                });
                if(!algumAtivo2) return false;
            }
            var temDisputaLive = live && live.itensAtivos > 0;
            if(fase !== '3' && !temDisputaLive) return false;
        }
        if(busca) {
            return (p.objeto||'').toLowerCase().indexOf(busca)>=0 ||
                   (p.orgao||'').toLowerCase().indexOf(busca)>=0 ||
                   (p.compraId||'').toLowerCase().indexOf(busca)>=0;
        }
        return true;
    });

    renderLista(lista);
}

function etapaInfo(p) {
    var fase = p.faseCompra||'';
    var live = disputasLive[p.compraId];
    var sit = (p.situacao||'').toUpperCase();

    // Dados do banco indicam encerrada/inativa
    if(sit==='FR') return { label: 'Fracassada', cls: 'etapa-encerrada' };
    if(sit==='EN') return { label: 'Encerrada', cls: 'etapa-encerrada' };
    if(sit==='SU') return { label: 'Suspensa', cls: 'etapa-encerrada' };
    if(fase==='4'||fase==='encerrada') return { label: 'Encerrada', cls: 'etapa-encerrada' };
    if(fase==='99') return { label: 'Concluída', cls: 'etapa-encerrada' };

    // Dados live: se tem itens e NENHUM ativo → encerrada (live)
    if(live && live.totalItens > 0 && live.itensAtivos === 0) {
        var algumAtivo = (live.itens||[]).some(function(i) {
            var f = (i.fase||'').toUpperCase();
            return f==='LA'||f==='D1'||f==='D2'||i.podeEnviar;
        });
        if(!algumAtivo) return { label: 'Encerrada (live)', cls: 'etapa-encerrada' };
    }

    // Dados live: se tem itens ativos, é disputa
    if(live && live.itensAtivos > 0) return { label: 'Disputa', cls: 'etapa-disputa' };
    if(fase==='3') return { label: 'Disputa', cls: 'etapa-disputa' };
    if(fase==='1') return { label: 'Cadastrada', cls: 'etapa-outra' };
    if(fase==='2') return { label: 'Publicada', cls: 'etapa-outra' };
    return { label: fase||sit||'Em andamento', cls: 'etapa-outra' };
}

function renderLista(lista) {
    var div = document.getElementById('listaCompras');
    if(!lista.length) { div.innerHTML='<p class="info-msg">Nenhuma participação encontrada.</p>'; return; }

    div.innerHTML = '<div style="color:#888;font-size:0.75em;margin-bottom:6px">'+lista.length+' participações</div>' +
        lista.map(function(p) {
            var et = etapaInfo(p);
            var isAberta = abertas.has(p.compraId);
            return '<div class="lic-row" id="lic-'+p.compraId+'">' +
                '<div class="lic-header'+(isAberta?' aberta':'')+'" onclick="toggleLic(\''+p.compraId+'\')">' +
                    '<div class="lic-left">' +
                        '<div class="lic-id">'+esc(fmtCompraId(p.compraId))+' <span style="color:#666;font-weight:400;font-size:0.85em">'+p.compraId+'</span></div>' +
                        '<div class="lic-obj" title="'+esc(p.objeto)+'">'+esc((p.objeto||'(sem objeto)').substring(0,120))+'</div>' +
                        '<div class="lic-org">'+esc(p.orgao||'')+'</div>' +
                    '</div>' +
                    '<div class="lic-right">' +
                        '<span class="lic-etapa '+et.cls+'">'+et.label+'</span>' +
                        (p.dataSessao?'<div class="lic-data">'+esc((p.dataSessao||'').substring(0,16))+'</div>':'') +
                    '</div>' +
                    '<span class="lic-arrow'+(isAberta?' aberta':'')+'">▼</span>' +
                '</div>' +
                '<div class="lic-body'+(isAberta?' aberta':'')+'" id="body-'+p.compraId+'">'+(isAberta?'<span class="spinner"></span>':'')+'</div>' +
            '</div>';
        }).join('');

    abertas.forEach(function(cid) { carregarItensLic(cid); });
}

// ==================== TOGGLE / EXPAND ====================
function toggleLic(compraId) {
    if(abertas.has(compraId)) {
        abertas.delete(compraId);
        aplicarFiltro();
        return;
    }
    abertas.add(compraId);
    aplicarFiltro();
    carregarItensLic(compraId);
}

async function carregarItensLic(compraId) {
    var body = document.getElementById('body-'+compraId);
    if(!body) return;
    body.innerHTML = '<p style="color:#888;padding:8px"><span class="spinner"></span> Carregando itens...</p>';

    // 1. Dados live da extensão (cache)
    var live = disputasLive[compraId];
    var itensLive = live ? live.itens : [];

    // 1.5. Se não tem dados live no cache, buscar direto da API Comprasnet
    if (itensLive.length === 0) {
        try {
            var rl = await fetch(API+'/api/sniper/itens-live?compraId='+compraId);
            var dl = await rl.json();
            if (dl.success && dl.itens && dl.itens.length > 0) {
                itensLive = dl.itens;
                // Salvar no cache local para não buscar de novo
                disputasLive[compraId] = { compraId: compraId, itens: itensLive, totalItens: itensLive.length, itensAtivos: itensLive.filter(function(i){return i.podeEnviar;}).length };
            }
        } catch(e) {}
    }

    // 2. Config salva no banco (sniper_itens)
    try {
        var r = await fetch(API+'/api/sniper/itens?compraId='+compraId);
        var d = await r.json();
        itensConfig[compraId] = d.success ? d.itens : [];
    } catch(e) { itensConfig[compraId] = []; }

    // 3. Se não tem config, buscar itens do PNCP (tabela itens/licitacoes)
    if(itensConfig[compraId].length === 0) {
        try {
            var rp = await fetch(API+'/api/sniper/itens-pncp?compraId='+compraId);
            var dp = await rp.json();
            if(dp.success && dp.itens && dp.itens.length > 0) {
                // Criar sniper_itens a partir dos dados PNCP
                var bulkPncp = dp.itens.map(function(i) {
                    return { itemNumero: i.itemNumero, descricao: i.descricao||'', faseItem: 'LA', valorEstimado: i.valorEstimado };
                });
                var rbp = await fetch(API+'/api/sniper/itens/bulk', {method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({compraId:compraId, itens:bulkPncp})});
                var dbp = await rbp.json();
                if(dbp.success) itensConfig[compraId] = dbp.itens;
            }
        } catch(e){}
    }

    // 4. Se tem itens live mas não no banco, criar a partir do live
    if(itensLive.length > 0 && itensConfig[compraId].length === 0) {
        var bulk = itensLive.map(function(i) {
            return { itemNumero: i.numero||1, descricao: i.descricao||'', faseItem: i.fase||'LA', valorEstimado: i.valorEstimado };
        });
        try {
            var rb = await fetch(API+'/api/sniper/itens/bulk', {method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({compraId:compraId, itens:bulk})});
            var db2 = await rb.json();
            if(db2.success) itensConfig[compraId] = db2.itens;
        } catch(e){}
    }

    // 5. Último recurso: consultar via extensão
    if(itensLive.length === 0 && itensConfig[compraId].length === 0) {
        try {
            var rc = await fetch(API+'/api/sniper/consultar-itens?compraId='+compraId);
            var dc = await rc.json();
            if(dc.success && dc.itens && dc.itens.length > 0) {
                itensLive = dc.itens;
                var bulk2 = itensLive.map(function(i){return{itemNumero:i.numero||1,descricao:i.descricao||'',faseItem:i.fase||'LA',valorEstimado:i.valorEstimado};});
                var rb2 = await fetch(API+'/api/sniper/itens/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({compraId:compraId,itens:bulk2})});
                var db3 = await rb2.json();
                if(db3.success) itensConfig[compraId]=db3.itens;
            }
        } catch(e){}
    }

    renderItens(compraId, itensLive);
}

// ==================== RENDER ITENS TABLE ====================
function renderItens(compraId, itensLive) {
    var body = document.getElementById('body-'+compraId);
    if(!body) return;
    var config = itensConfig[compraId]||[];

    // Merge: for each item, combine live data with saved config
    var merged = [];
    // Start with live items
    var liveMap = {};
    itensLive.forEach(function(il) { liveMap[il.numero] = il; });
    // Start with config items (they have all saved data)
    var seen = {};
    config.forEach(function(cfg) {
        var lv = liveMap[cfg.itemNumero] || {};
        merged.push({
            numero: cfg.itemNumero,
            tipo: lv.tipo || null,
            descricao: cfg.descricao || lv.descricao || '',
            fase: lv.fase || cfg.faseItem || '',
            melhorValor: lv.melhorValor,
            nossoValor: lv.nossoValor != null ? lv.nossoValor : cfg.valorLance,
            situacaoParticipante: lv.situacaoParticipante || null,
            tipoVariacao: lv.tipoVariacao || 'V',
            podeEnviar: lv.podeEnviar !== undefined ? lv.podeEnviar : true,
            valorEstimado: cfg.valorEstimado || lv.valorEstimado,
            fimContagem: lv.fimContagem,
            // Filtros Comprasnet
            estaPerdendo: !!lv.estaPerdendo,
            emEncAleatoria: !!lv.emEncAleatoria,
            nosDoisMinFinais: !!lv.nosDoisMinFinais,
            // Config salva
            custo: cfg.custo,
            variacaoMinima: cfg.variacaoMinima != null ? cfg.variacaoMinima : (lv.variacaoMinima != null ? lv.variacaoMinima : null),
            valorLance: cfg.valorLance,
            valorMinimo: cfg.valorMinimo,
            descontoMinimo: cfg.descontoMinimo,
            descontoMaximo: cfg.descontoMaximo,
            horarioAlvo: cfg.horarioAlvo,
            antecedenciaMs: cfg.antecedenciaMs,
            maxLances: cfg.maxLances,
            ativo: cfg.ativo,
            modoAuto: cfg.modoAuto || null,
            ultimoResultado: cfg.ultimoResultado,
            ultimoEnvio: cfg.ultimoEnvio,
            status: cfg.status,
        });
        seen[cfg.itemNumero] = true;
    });
    // Add live items not in config
    itensLive.forEach(function(il) {
        if(!seen[il.numero]) {
            merged.push({ numero:il.numero, tipo:il.tipo||null, descricao:il.descricao, fase:il.fase, melhorValor:il.melhorValor, nossoValor:il.nossoValor, situacaoParticipante:il.situacaoParticipante||null, variacaoMinima:il.variacaoMinima!=null?il.variacaoMinima:null, tipoVariacao:il.tipoVariacao||'V', podeEnviar:il.podeEnviar, valorEstimado:il.valorEstimado, fimContagem:il.fimContagem, estaPerdendo:!!il.estaPerdendo, emEncAleatoria:!!il.emEncAleatoria, nosDoisMinFinais:!!il.nosDoisMinFinais, valorLance:null, valorMinimo:null, descontoMinimo:null, descontoMaximo:null, horarioAlvo:null, antecedenciaMs:3000, ativo:1, modoAuto:null });
            // Auto-salvar variacaoMinima do live no servidor
            if(il.variacaoMinima != null) {
                salvar(compraId, il.numero, 'variacaoMinima', il.variacaoMinima);
            }
        }
    });

    if(merged.length === 0) {
        body.innerHTML = '<p class="info-msg">Sem dados de itens. Aguardando sync da extensão ou adicione manualmente.</p><div class="btn-group"><button class="btn btn-outline btn-sm" onclick="adicionarItemManual(\''+compraId+'\')">+ Adicionar Item</button></div><div id="resultado-'+compraId+'"></div>';
        return;
    }

    var html = '<table class="itens-table"><thead><tr>' +
        '<th>#</th><th>Descrição</th>' +
        '<th>Melhor / Nosso</th><th>Custo / Mín / Sug</th>' +
        '<th>Auto</th><th>Mín</th><th>Var</th><th>Lance</th><th>Ações</th>' +
        '</tr></thead><tbody>';

    merged.forEach(function(m) {
        var isGrupo = m.tipo === 'G' || m.numero < 0;

        var nossoClass = 'valor-nosso';
        if(m.nossoValor && m.melhorValor && m.nossoValor <= m.melhorValor) nossoClass += ' melhor';
        var nossoLabel = fmtR$(m.nossoValor);
        if(m.situacaoParticipante) {
            var sitLabels = {'G':'Ganhando','P':'Participando','C':'Reafirmado','D':'Desclassif.','I':'Excluída','A':'Desclassif.','F':'Desclassif.','R':'Recusada'};
            nossoLabel += ' <span class="badge-sit badge-'+m.situacaoParticipante+'">'+(sitLabels[m.situacaoParticipante]||m.situacaoParticipante)+'</span>';
        }
        if(m.estaPerdendo) nossoLabel += ' <span class="badge-filtro badge-perd">PERD</span>';
        if(m.emEncAleatoria) nossoLabel += ' <span class="badge-filtro badge-aleat">ALEAT</span>';
        if(m.nosDoisMinFinais) nossoLabel += ' <span class="badge-filtro badge-2min">2MIN</span>';

        // Grupo header row — sem inputs, só totais
        if(isGrupo) {
            html += '<tr style="background:#0f346030;border-top:2px solid #4dabf7">' +
                '<td colspan="2"><strong style="color:#4dabf7">Grupo '+esc(m.descricao||'')+'</strong></td>' +
                '<td class="stacked-cell"><span class="valor-melhor">'+fmtR$(m.melhorValor)+'</span><br><span class="'+nossoClass+'">'+nossoLabel+'</span></td>' +
                '<td colspan="6" style="color:#888;font-size:0.8em">Total do grupo</td>' +
                '</tr>';
            return;
        }

        // Auto select
        var autoClass = m.modoAuto ? m.modoAuto : '';
        var selOpts = [['','OFF'],['continuo','Contínuo'],['sniper','Sniper']];
        var selectHtml = '<select class="auto-select '+autoClass+'" onchange="setAuto(\''+compraId+'\','+m.numero+',this.value,this)">';
        selOpts.forEach(function(o){ selectHtml += '<option value="'+o[0]+'"'+(m.modoAuto===o[0]||((!m.modoAuto)&&o[0]==='')?' selected':'')+'>'+o[1]+'</option>'; });
        selectHtml += '</select>';
        if(m.modoAuto === 'sniper') {
            var sniperSeg = Math.round((m.antecedenciaMs || 60000) / 1000);
            selectHtml += ' <input type="number" min="5" max="300" step="5" value="'+sniperSeg+'" style="width:45px;padding:2px 3px;border-radius:4px;border:1px solid #ff9800;background:#ff980015;color:#ff9800;font-size:0.78em;font-weight:600;text-align:center" onchange="salvarSniperSeg(\''+compraId+'\','+m.numero+',this.value)" title="Segundos antes do fim">s';
        }

        html += '<tr>' +
            '<td><strong>'+m.numero+'</strong>'+(m.tipo==='S'?' <span style="color:#4dabf7;font-size:0.7em">SUB</span>':'')+'</td>' +
            '<td class="desc-cell" title="'+esc(m.descricao)+'">'+esc((m.descricao||'').substring(0,50))+'</td>' +
            '<td class="stacked-cell"><span class="valor-melhor">'+fmtR$(m.melhorValor)+'</span><br><span class="'+nossoClass+'">'+nossoLabel+'</span><br><span class="sub" title="V.Estimado">Est '+fmtR$(m.valorEstimado)+'</span></td>' +
            '<td class="stacked-cell"><input type="number" step="0.01" value="'+(m.custo||'')+'" onchange="salvar(\''+compraId+'\','+m.numero+',\'custo\',this.value);recalcLucro(\''+compraId+'\','+m.numero+')" placeholder="Custo" style="width:72px"><br><span class="sub mv-cell" id="mv-'+compraId+'-'+m.numero+'">--</span> · <span class="sugerido-cell" id="sg-'+compraId+'-'+m.numero+'" style="font-size:0.85em">--</span></td>' +
            '<td>'+selectHtml+'</td>' +
            '<td><input type="number" step="0.01" id="vm-'+compraId+'-'+m.numero+'" value="'+(m.valorMinimo||'')+'" onchange="salvar(\''+compraId+'\','+m.numero+',\'valorMinimo\',this.value)" placeholder="Mín" style="width:72px"></td>' +
            '<td><input type="number" step="0.01" value="'+(m.variacaoMinima||'')+'" onchange="salvar(\''+compraId+'\','+m.numero+',\'variacaoMinima\',this.value)" placeholder="Var" style="width:55px" title="Variação mínima entre lances (R$)"></td>' +
            '<td><input type="number" step="0.01" id="vl-'+compraId+'-'+m.numero+'" value="'+(m.valorLance||'')+'" onchange="salvar(\''+compraId+'\','+m.numero+',\'valorLance\',this.value);recalcLucro(\''+compraId+'\','+m.numero+')" placeholder="Lance" style="width:72px"></td>' +
            '<td>' +
                '<div style="display:flex;gap:3px;align-items:center">' +
                    '<button class="btn btn-success btn-sm" onclick="enviar(\''+compraId+'\','+m.numero+')" '+(m.podeEnviar?'':'disabled')+' title="Enviar agora">⚡</button>' +
                    '<button class="btn btn-sm" style="background:#ff6b00;color:#fff;border:none;padding:3px 5px" onclick="dispararBlitz(\''+compraId+'\','+m.numero+')" title="Disparar blitz">🚀</button>' +
                    '<button class="btn btn-outline btn-sm" style="padding:3px 5px" onclick="toggleHistorico(\''+compraId+'\')" title="Histórico">📋</button>' +
                '</div>' +
                '<div class="blitz-row">' +
                    '<input type="time" step="1" id="agendar-hora-'+compraId+'-'+m.numero+'" style="font-size:0.75em;padding:1px 3px;font-family:monospace;border:1px solid #0f3460;background:#1a1a2e;color:#eee;border-radius:3px;width:90px" title="Horário agendamento">' +
                    '<input type="number" min="1" max="50" id="max-lances-'+compraId+'-'+m.numero+'" value="'+(m.maxLances||5)+'" style="width:36px;font-size:0.75em;padding:1px 2px;border:1px solid #ff6b00;background:#1a1a2e;color:#ff6b00;border-radius:3px;text-align:center" title="Máx lances na rajada" onchange="salvar(\''+compraId+'\','+m.numero+',\'maxLances\',this.value)">' +
                    '<button class="btn btn-sm" style="background:#8b5cf6;color:#fff;border:none;padding:2px 4px;font-size:0.75em" onclick="agendarLanceUnico(\''+compraId+'\','+m.numero+')" title="Agendar lance único">⏰⚡</button>' +
                    '<button class="btn btn-sm" style="background:#ff6b00;color:#fff;border:none;padding:2px 4px;font-size:0.75em" onclick="agendarBlitz(\''+compraId+'\','+m.numero+')" title="Agendar blitz (rajada)">⏰🚀</button>' +
                '</div>' +
                '<div id="agendado-'+compraId+'-'+m.numero+'" style="font-size:0.78em;color:#8b5cf6;margin-top:2px"></div>' +
            '</td>' +
            '</tr>';

    });

    html += '</tbody></table>';
    html += '<div id="historico-'+compraId+'" style="display:none"></div>';
    html += '<div id="resultado-'+compraId+'"></div>';

    body.innerHTML = html;
    // Recalcular lucros após render
    setTimeout(function(){ recalcTodosLucros(); }, 0);
}

// ==================== SAVE CONFIG ====================
function salvar(compraId, itemNumero, campo, valor) {
    var body = { compraId: compraId, itemNumero: itemNumero };
    if(campo === 'maxLances') { body[campo] = parseInt(valor)||null; }
    else if(campo === 'valorLance' || campo === 'valorMinimo' || campo === 'custo' || campo === 'variacaoMinima') body[campo] = parseFloat(valor)||null;
    else if(campo === 'descontoMinimo' || campo === 'descontoMaximo') body[campo] = parseFloat(valor)||null;
    else body[campo] = valor || null;
    fetch(API+'/api/sniper/itens',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    // Update local cache
    var cfg = (itensConfig[compraId]||[]).find(function(c){return c.itemNumero===itemNumero;});
    if(cfg) cfg[campo] = body[campo];
}

// ==================== ENVIAR LANCE ====================
function enviar(compraId, itemNumero) {
    var el = document.getElementById('vl-'+compraId+'-'+itemNumero);
    var valor = parseFloat(el?el.value:0);
    if(!valor||valor<=0){alert('Informe o valor do lance para o item '+itemNumero);if(el)el.focus();return;}
    if(!confirm('Enviar R$ '+valor.toFixed(2)+' no item '+itemNumero+'?'))return;

    var resDiv = document.getElementById('resultado-'+compraId);
    resDiv.innerHTML = '<div class="result-msg" style="color:#ff9800"><span class="spinner"></span> Enviando item '+itemNumero+'...</div>';

    fetch(API+'/api/sniper/lance',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({compraId:compraId,itemNumero:itemNumero,valor:valor})
    }).then(function(r){return r.json();}).then(function(d){
        if(!d.success){resDiv.innerHTML='<div class="result-msg result-erro">'+esc(d.error)+'</div>';return;}
        var lanceId=d.id; var tent=0;
        var poll=setInterval(function(){
            tent++;
            fetch(API+'/api/sniper/fila-status').then(function(r){return r.json();}).then(function(ds){
                var lance=(ds.resultados||[]).find(function(r){return r.id===lanceId;});
                if(lance){clearInterval(poll);
                    if(lance.sucesso){resDiv.innerHTML='<div class="result-msg result-sucesso">✅ Item '+itemNumero+' — R$ '+valor.toFixed(2)+' ('+lance.tempoMs+'ms)</div>';toast('✅ #'+itemNumero+' R$ '+valor.toFixed(2),'sucesso');}
                    else resDiv.innerHTML='<div class="result-msg result-erro">❌ HTTP '+lance.status+' ('+lance.tempoMs+'ms)</div>';
                }
            }).catch(function(){});
            if(tent>30){clearInterval(poll);resDiv.innerHTML='<div class="result-msg result-erro">Timeout</div>';}
        },1000);
    }).catch(function(e){resDiv.innerHTML='<div class="result-msg result-erro">'+esc(e.message)+'</div>';});
}

function enviarTodos(compraId) {
    var config = itensConfig[compraId]||[];
    var ativos = config.filter(function(c){return c.ativo && c.valorLance>0;});
    if(!ativos.length){alert('Configure valor nos itens primeiro');return;}
    var lista = ativos.map(function(c){return'  #'+c.itemNumero+': R$ '+parseFloat(c.valorLance).toFixed(2);}).join('\n');
    if(!confirm('Enviar '+ativos.length+' lances?\n\n'+lista))return;
    ativos.forEach(function(c){
        fetch(API+'/api/sniper/lance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({compraId:compraId,itemNumero:c.itemNumero,valor:c.valorLance})});
    });
    toast('🎯 '+ativos.length+' lances enfileirados','sucesso');
}

// ==================== DISPARAR BLITZ MANUAL ====================
function dispararBlitz(compraId, itemNumero) {
    var cfg = (itensConfig[compraId]||[]).find(function(c){return c.itemNumero===itemNumero;});
    if(!cfg || !cfg.valorMinimo) {
        alert('Defina o Valor Minimo antes de disparar blitz no item '+itemNumero);
        return;
    }
    if(!confirm('Disparar rajada blitz REAL no item '+itemNumero+'?\n\nLances reais serao enviados ao Comprasnet ate R$ '+parseFloat(cfg.valorMinimo).toFixed(2)))return;

    var resDiv = document.getElementById('resultado-'+compraId);
    resDiv.innerHTML = '<div class="result-msg" style="color:#ff6b00"><span class="spinner"></span> Calculando blitz item '+itemNumero+'...</div>';

    var maxEl = document.getElementById('max-lances-'+compraId+'-'+itemNumero);
    var maxLances = maxEl ? parseInt(maxEl.value)||50 : 50;
    fetch(API+'/api/sniper/disparar-blitz',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({compraId:compraId,itemNumero:itemNumero,maxLances:maxLances})
    }).then(function(r){return r.json();}).then(function(d){
        if(!d.success){resDiv.innerHTML='<div class="result-msg result-erro">'+esc(d.error||d.message||'Erro')+'</div>';return;}
        if(d.totalLances===0){resDiv.innerHTML='<div class="result-msg" style="color:#888">Nenhum lance a enviar (ja no minimo ou sem variacao)</div>';return;}

        var primeiro = d.lances[0], ultimo = d.lances[d.lances.length-1];
        resDiv.innerHTML = '<div class="result-msg" style="color:#ff6b00;border:1px solid #ff6b0030;padding:8px;border-radius:6px">' +
            '<strong>Blitz:</strong> '+d.totalLances+' lances, R$ '+primeiro.valor.toFixed(2)+' &rarr; R$ '+ultimo.valor.toFixed(2)+
            ' (~'+(d.estimativaMs/1000).toFixed(1)+'s)' +
            '<div id="blitz-progress-'+compraId+'-'+itemNumero+'" style="margin-top:6px;font-size:0.85em;color:#aaa"></div></div>';

        // Poll fila-status para mostrar progresso lance a lance
        var lanceIds = d.lances.map(function(l){return l.id;});
        var concluidos = 0;
        var progDiv = document.getElementById('blitz-progress-'+compraId+'-'+itemNumero);
        var tent = 0;
        var poll = setInterval(function(){
            tent++;
            fetch(API+'/api/sniper/fila-status').then(function(r){return r.json();}).then(function(ds){
                var resultados = ds.resultados || [];
                var novosConcluidos = 0;
                var tempoTotal = 0;
                var sucessos = 0;
                var falhas = 0;
                for(var i=0;i<lanceIds.length;i++){
                    var r = resultados.find(function(x){return x.id===lanceIds[i];});
                    if(r){novosConcluidos++;tempoTotal+=(r.tempoMs||0);if(r.sucesso)sucessos++;else falhas++;}
                }
                if(novosConcluidos > concluidos) {
                    concluidos = novosConcluidos;
                    var pct = Math.round(concluidos/d.totalLances*100);
                    progDiv.innerHTML = concluidos+'/'+d.totalLances+' ('+pct+'%) — '+tempoTotal+'ms total' +
                        (falhas?' <span style="color:#ff6b6b">'+falhas+' falha(s)</span>':'');
                }
                if(concluidos >= d.totalLances) {
                    clearInterval(poll);
                    var cor = falhas ? '#ff6b6b' : '#51cf66';
                    progDiv.innerHTML = '<span style="color:'+cor+'">Concluido: '+sucessos+'/'+d.totalLances+' OK em '+tempoTotal+'ms (media '+(tempoTotal/d.totalLances).toFixed(0)+'ms/lance)</span>';
                    toast('Blitz #'+itemNumero+': '+sucessos+'/'+d.totalLances+' OK', falhas?'erro':'sucesso');
                    setTimeout(function(){carregarItensLic(compraId);},2000);
                }
            }).catch(function(){});
            if(tent>120){clearInterval(poll);progDiv.innerHTML='<span style="color:#ff6b6b">Timeout no acompanhamento</span>';}
        },500);
    }).catch(function(e){resDiv.innerHTML='<div class="result-msg result-erro">'+esc(e.message)+'</div>';});
}

// ==================== AGENDAR LANCE ÚNICO ====================
function lerHorarioAgendamento(compraId, itemNumero) {
    var input = document.getElementById('agendar-hora-'+compraId+'-'+itemNumero);
    var horario = (input?input.value:'').trim();
    if(!horario) return null;
    if(horario.length === 5) horario += ':00.700';
    else if(horario.length === 8) horario += '.700';
    return horario;
}

function agendarLanceUnico(compraId, itemNumero) {
    var horario = lerHorarioAgendamento(compraId, itemNumero);
    if(!horario) { alert('Informe o horário para agendar o lance'); return; }

    var el = document.getElementById('vl-'+compraId+'-'+itemNumero);
    var valor = parseFloat(el?el.value:0);
    if(!valor||valor<=0){alert('Informe o valor do lance para o item '+itemNumero);if(el)el.focus();return;}

    if(!confirm('Agendar lance ÚNICO de R$ '+valor.toFixed(2)+' no item '+itemNumero+' para '+horario+'?')) return;

    var spanEl = document.getElementById('agendado-'+compraId+'-'+itemNumero);
    spanEl.innerHTML = '<span class="spinner"></span>';

    fetch(API+'/api/sniper/agendar-lance',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({compraId:compraId,itemNumero:itemNumero,valor:valor,horario:horario})
    }).then(function(r){return r.json();}).then(function(d){
        if(!d.success){spanEl.innerHTML='<span style="color:#ff6b6b">'+esc(d.error)+'</span>';return;}
        spanEl.innerHTML = '<span style="color:#8b5cf6">⚡ R$ '+d.valor.toFixed(2)+' às '+d.horario+' </span>' +
            '<button class="btn btn-sm" style="background:#ff6b6b;color:#fff;border:none;font-size:0.75em;padding:1px 5px" ' +
            'onclick="cancelarLanceAgendado(\''+compraId+'\','+itemNumero+')">X</button>';
        toast('Lance #'+itemNumero+' R$ '+d.valor.toFixed(2)+' agendado para '+d.horario, 'sucesso');
    }).catch(function(e){spanEl.innerHTML='<span style="color:#ff6b6b">Erro</span>';});
}

function cancelarLanceAgendado(compraId, itemNumero) {
    fetch(API+'/api/sniper/cancelar-lance-agendado',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({compraId:compraId,itemNumero:itemNumero})
    }).then(function(r){return r.json();}).then(function(d){
        var spanEl = document.getElementById('agendado-'+compraId+'-'+itemNumero);
        spanEl.innerHTML = '';
        toast(d.message || 'Lance cancelado', d.success?'sucesso':'erro');
    });
}

// ==================== AGENDAR BLITZ ====================
function agendarBlitz(compraId, itemNumero) {
    var horario = lerHorarioAgendamento(compraId, itemNumero);
    if(!horario) { alert('Informe o horário para agendar a blitz'); return; }

    var cfg = (itensConfig[compraId]||[]).find(function(c){return c.itemNumero===itemNumero;});
    if(!cfg || !cfg.valorMinimo) {
        alert('Defina o Valor Minimo antes de agendar blitz no item '+itemNumero);
        return;
    }
    if(!confirm('Agendar blitz REAL (rajada) no item '+itemNumero+' para '+horario+'?\n\nVários lances reais serão enviados ao Comprasnet.')) return;

    var spanEl = document.getElementById('agendado-'+compraId+'-'+itemNumero);
    spanEl.innerHTML = '<span class="spinner"></span>';

    var maxEl = document.getElementById('max-lances-'+compraId+'-'+itemNumero);
    var maxLances = maxEl ? parseInt(maxEl.value)||50 : 50;
    fetch(API+'/api/sniper/disparar-blitz',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({compraId:compraId,itemNumero:itemNumero,horario:horario,maxLances:maxLances})
    }).then(function(r){return r.json();}).then(function(d){
        if(!d.success){spanEl.innerHTML='<span style="color:#ff6b6b">'+esc(d.error)+'</span>';return;}
        spanEl.innerHTML = '<span style="color:#ff6b00">🚀 Blitz '+(d.maxLances||d.totalLances)+'x às '+d.horario+' </span>' +
            '<button class="btn btn-sm" style="background:#ff6b6b;color:#fff;border:none;font-size:0.75em;padding:1px 5px" ' +
            'onclick="cancelarBlitz(\''+compraId+'\','+itemNumero+')">X</button>';
        toast('Blitz #'+itemNumero+' agendada para '+d.horario, 'sucesso');
    }).catch(function(e){spanEl.innerHTML='<span style="color:#ff6b6b">Erro</span>';});
}

function cancelarBlitz(compraId, itemNumero) {

// ==================== AUTO-LANCE ====================
function setAuto(compraId, itemNumero, modo, selectEl) {
    // Require valorMinimo before enabling
    var cfg = (itensConfig[compraId]||[]).find(function(c){return c.itemNumero===itemNumero;});

    if(modo && (!cfg || !cfg.valorMinimo)) {
        alert('Defina o Valor Mínimo antes de ativar auto-lance no item '+itemNumero);
        if(selectEl) selectEl.value = cfg?.modoAuto || '';
        return;
    }

    // Save to server
    var payload = {compraId:compraId, itemNumero:itemNumero, modoAuto: modo||null};
    if(modo === 'sniper' && cfg && !cfg.antecedenciaMs) payload.antecedenciaMs = 60000; // default 60s
    fetch(API+'/api/sniper/itens', {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
    }).then(function(r){return r.json();}).then(function(d){
        if(d.success) {
            if(cfg) {
                cfg.modoAuto = modo||null;
                if(payload.antecedenciaMs) cfg.antecedenciaMs = payload.antecedenciaMs;
            }
            var labels = {continuo:'Contínuo',sniper:'Sniper'};
            toast('Auto #'+itemNumero+': '+(modo?labels[modo]:'OFF'), modo?'sucesso':'info');
            // Re-render to show/hide sniper seconds input
            if(abertas.has(compraId)) renderItens(compraId, disputasLive[compraId]?disputasLive[compraId].itens:[]);
        }
    });
}

}

// ==================== HISTÓRICO ====================
async function toggleHistorico(compraId) {
    var div = document.getElementById('historico-'+compraId);
    if(!div) return;
    if(div.style.display !== 'none') { div.style.display = 'none'; return; }

    div.style.display = 'block';
    div.innerHTML = '<p style="color:#888;padding:8px"><span class="spinner"></span> Carregando histórico...</p>';

    var html = '';
    // 1. Histórico de lances (banco)
    try {
        var r = await fetch(API+'/api/sniper/historico?compraId='+compraId+'&limit=30');
        var d = await r.json();
        if(d.success && d.historico && d.historico.length > 0) {
            html += '<div style="margin-top:8px"><strong style="color:#4dabf7;font-size:0.82em">Histórico de Lances</strong>';
            html += '<table class="itens-table" style="margin-top:4px"><thead><tr><th>Hora</th><th>Item</th><th>Valor</th><th>Resultado</th><th>Tempo</th><th>Fonte</th></tr></thead><tbody>';
            d.historico.forEach(function(h) {
                var cor = h.sucesso ? '#4caf50' : '#f44336';
                html += '<tr style="color:'+cor+'">' +
                    '<td>'+fmtHora(h.timestamp)+'</td>' +
                    '<td>'+h.itemNumero+'</td>' +
                    '<td>'+fmtR$(h.valor)+'</td>' +
                    '<td>'+(h.sucesso?'✅':'❌')+' HTTP '+(h.httpStatus||h.status||'--')+'</td>' +
                    '<td>'+(h.tempoMs||'--')+'ms</td>' +
                    '<td>'+esc(h.fonte||'--')+'</td>' +
                '</tr>';
            });
            html += '</tbody></table></div>';
        } else {
            html += '<div style="color:#888;font-size:0.8em;padding:6px">Nenhum lance registrado.</div>';
        }
    } catch(e) {
        html += '<div style="color:#f44336;font-size:0.8em;padding:6px">Erro ao carregar histórico: '+esc(e.message)+'</div>';
    }

    // 2. Log do auto-lance — mostra entradas desta compra + últimas gerais
    try {
        var ra = await fetch(API+'/api/sniper/auto/status');
        var da = await ra.json();
        if(da.success && da.log && da.log.length > 0) {
            var destaCompra = da.log.filter(function(l){ return (l.msg||'').indexOf(compraId) >= 0; });
            var gerais = da.log.slice(0, 30);
            html += '<div style="margin-top:8px"><strong style="color:#ff9800;font-size:0.82em">Log Auto-Lance</strong>';
            if(da.filaLances > 0) html += ' <span style="color:#f44336;font-size:0.78em">(fila: '+da.filaLances+' lances)</span>';
            html += '<div class="auto-log-area" style="max-height:300px;overflow-y:auto">';
            if(destaCompra.length > 0) {
                html += '<div style="color:#4dabf7;font-size:0.78em;padding:2px 4px">— Esta compra ('+destaCompra.length+' entradas) —</div>';
                destaCompra.forEach(function(l) {
                    html += '<div class="log-entry"><span class="ts">'+fmtHora(l.ts)+'</span> '+esc(l.msg)+'</div>';
                });
            }
            html += '<div style="color:#888;font-size:0.78em;padding:2px 4px;margin-top:4px">— Log geral (últimas 30) —</div>';
            gerais.forEach(function(l) {
                var isThis = (l.msg||'').indexOf(compraId) >= 0;
                html += '<div class="log-entry" style="'+(isThis?'color:#4dabf7':'')+'"><span class="ts">'+fmtHora(l.ts)+'</span> '+esc(l.msg)+'</div>';
            });
            html += '</div></div>';
        }
    } catch(e) {}

    if(!html) html = '<div style="color:#888;font-size:0.8em;padding:6px">Sem dados de histórico.</div>';
    div.innerHTML = html;
}

function toast(msg,tipo){var d=document.createElement('div');d.className='toast';d.style.background=tipo==='sucesso'?'#4caf50':tipo==='erro'?'#f44336':'#4dabf7';d.textContent=msg;document.getElementById('toastArea').appendChild(d);setTimeout(function(){d.remove();},4000);}

// ==================== IMPOSTO / MARGEM / LUCRO ====================
function carregarImposto() {
    var saved = localStorage.getItem('lancesImpostoPercent');
    if(saved !== null) document.getElementById('impostoPercent').value = saved;
    var savedM = localStorage.getItem('lancesMargemPercent');
    if(savedM !== null) document.getElementById('margemPercent').value = savedM;
}
function salvarImposto() {
    localStorage.setItem('lancesImpostoPercent', document.getElementById('impostoPercent').value);
}
function salvarMargem() {
    localStorage.setItem('lancesMargemPercent', document.getElementById('margemPercent').value);
}
function getImposto() {
    return parseFloat(document.getElementById('impostoPercent').value) || 0;
}
function getMargem() {
    return parseFloat(document.getElementById('margemPercent').value) || 0;
}
function usarSugerido(compraId, num) {
    var sgEl = document.getElementById('sg-'+compraId+'-'+num);
    if(!sgEl || sgEl.textContent === '--') return;
    var valor = parseFloat(sgEl.textContent.replace('R$ ',''));
    if(!valor || valor <= 0) return;
    var vmInput = document.getElementById('vm-'+compraId+'-'+num);
    if(vmInput) {
        vmInput.value = valor.toFixed(2);
        salvar(compraId, num, 'valorMinimo', valor);
        recalcLucro(compraId, num);
        toast('Mínimo #'+num+' → R$ '+valor.toFixed(2), 'info');
    }
}
function recalcLucro(compraId, num) {
    var imposto = getImposto();
    var margem = getMargem();
    // Find custo input: look in the row that has this item number
    var custo = NaN;
    var table = document.querySelector('#body-'+compraId+' .itens-table');
    if(table) {
        var rows = table.querySelectorAll('tbody tr');
        for(var i=0;i<rows.length;i++) {
            var strong = rows[i].querySelector('td:first-child strong');
            if(strong && parseInt(strong.textContent) === num) {
                var custoInput = rows[i].cells[3] ? rows[i].cells[3].querySelector('input') : null;
                if(custoInput) custo = parseFloat(custoInput.value);
                break;
            }
        }
    }
    var vlInput = document.getElementById('vl-'+compraId+'-'+num);
    var valorLance = vlInput ? parseFloat(vlInput.value) : NaN;
    var mvEl = document.getElementById('mv-'+compraId+'-'+num);
    var lcEl = document.getElementById('lc-'+compraId+'-'+num);
    var sgEl = document.getElementById('sg-'+compraId+'-'+num);
    // Mín.Viável = custo / (1 - imposto/100)
    if(mvEl) {
        if(!isNaN(custo) && custo > 0 && imposto < 100) {
            var mv = custo / (1 - imposto/100);
            mvEl.textContent = 'R$ ' + mv.toFixed(2);
        } else {
            mvEl.textContent = '--';
        }
    }
    // Lucro = valorLance - (valorLance * imposto/100) - custo
    if(lcEl) {
        if(!isNaN(valorLance) && valorLance > 0 && !isNaN(custo) && custo > 0) {
            var lucro = valorLance - (valorLance * imposto/100) - custo;
            lcEl.textContent = 'R$ ' + lucro.toFixed(2);
            lcEl.className = 'valor-lucro ' + (lucro > 0.005 ? 'positivo' : lucro < -0.005 ? 'negativo' : 'zero');
        } else {
            lcEl.textContent = '--';
            lcEl.className = 'valor-lucro';
        }
    }
    // Sugerido = custo * (1 + margem/100) / (1 - imposto/100)
    if(sgEl) {
        if(!isNaN(custo) && custo > 0 && imposto < 100) {
            var sg = custo * (1 + margem/100) / (1 - imposto/100);
            sgEl.textContent = 'R$ ' + sg.toFixed(2);
            sgEl.title = 'Clique para usar este valor como lance';
            sgEl.onclick = function(){ usarSugerido(compraId, num); };
        } else {
            sgEl.textContent = '--';
            sgEl.onclick = null;
        }
    }
}
function recalcTodosLucros() {
    if(abertas.size === 0) return;
    abertas.forEach(function(cid) {
        var config = itensConfig[cid]||[];
        config.forEach(function(c) { recalcLucro(cid, c.itemNumero); });
    });
}

// ==================== PUPPETEER ====================

function atualizarElectronStatus() {
    fetch(API+'/api/electron/status')
        .then(function(r){return r.json()})
        .then(function(d) {
            var el = document.getElementById('stElectron');
            var panel = document.getElementById('panelElectron');
            var info = document.getElementById('electronInfo');

            if (!d.lastSeen) {
                el.innerHTML = '<span style="color:#666">OFF</span>';
                return;
            }

            panel.style.display = 'block';
            var ago = Math.round((Date.now() - new Date(d.lastSeen).getTime()) / 1000);
            var online = ago < 30;

            if (d.state === 'logged_in' && online) {
                el.innerHTML = '<span class="verde">ATIVO</span>';
                info.innerHTML = 'Bearer: '+(d.bearerAge != null ? d.bearerAge+'s' : '--')+' | Sync: '+(d.logCount || 0)+' logs | Sinal: '+ago+'s';
            } else if (online) {
                el.innerHTML = '<span class="amarelo">'+d.state.toUpperCase()+'</span>';
                info.innerHTML = 'Sinal: '+ago+'s';
            } else {
                el.innerHTML = '<span class="vermelho">OFFLINE</span>';
                info.innerHTML = 'Ultimo sinal: '+ago+'s atras';
            }

            // Logs
            var logsEl = document.getElementById('electronLogs');
            if (logsEl.style.display !== 'none' && d.logs) {
                var recent = d.logs.slice(-30);
                logsEl.innerHTML = recent.map(function(l) {
                    return '<div>['+l.time.substring(11,19)+'] '+l.msg+'</div>';
                }).join('');
                logsEl.scrollTop = logsEl.scrollHeight;
            }
        })
        .catch(function() {
            document.getElementById('stElectron').innerHTML = '<span style="color:#666">--</span>';
        });
}

function atualizarValoresLive(compraId, itensLive) {
    var table = document.querySelector('#body-'+compraId+' .itens-table');
    if(!table) { renderItens(compraId, itensLive); return; } // fallback: render completo se não há tabela
    var rows = table.querySelectorAll('tbody tr');
    var liveMap = {};
    itensLive.forEach(function(il) { liveMap[il.numero] = il; });
    rows.forEach(function(row) {
        var numCell = row.querySelector('td:first-child strong');
        if(!numCell) return;
        var num = parseInt(numCell.textContent);
        var lv = liveMap[num];
        if(!lv) return;
        // Melhor / Nosso stacked cell (col 3)
        var stackedTd = row.cells[2];
        if(stackedTd) {
            var nossoClass = 'valor-nosso' + (lv.nossoValor && lv.melhorValor && lv.nossoValor <= lv.melhorValor ? ' melhor' : '');
            var nossoHtml = fmtR$(lv.nossoValor);
            if(lv.situacaoParticipante) {
                var sitLabels = {'G':'Ganhando','P':'Participando','C':'Reafirmado','D':'Desclassif.','I':'Excluída','A':'Desclassif.','F':'Desclassif.','R':'Recusada'};
                nossoHtml += ' <span class="badge-sit badge-'+lv.situacaoParticipante+'">'+(sitLabels[lv.situacaoParticipante]||lv.situacaoParticipante)+'</span>';
            }
            if(lv.estaPerdendo) nossoHtml += ' <span class="badge-filtro badge-perd">PERD</span>';
            if(lv.emEncAleatoria) nossoHtml += ' <span class="badge-filtro badge-aleat">ALEAT</span>';
            if(lv.nosDoisMinFinais) nossoHtml += ' <span class="badge-filtro badge-2min">2MIN</span>';
            // Preserve the Est line from original render
            var subSpan = stackedTd.querySelector('.sub');
            var estHtml = subSpan ? subSpan.outerHTML : '';
            stackedTd.innerHTML = '<span class="valor-melhor">'+fmtR$(lv.melhorValor)+'</span><br><span class="'+nossoClass+'">'+nossoHtml+'</span>'+(estHtml?'<br>'+estHtml:'');
        }
    });
}
