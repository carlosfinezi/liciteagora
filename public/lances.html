<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper de Lances - LiciteAgora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .main-content { background: #1a1a2e; padding: 20px; }
        h1 { color: #4dabf7; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 20px; }
        .status-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .status-item { background: #16213e; padding: 12px 16px; border-radius: 8px; flex: 1; min-width: 110px; text-align: center; }
        .status-item .label { color: #888; font-size: 0.8em; margin-bottom: 4px; }
        .status-item .value { font-size: 1.1em; font-weight: 600; }
        .verde { color: #4caf50; } .vermelho { color: #f44336; } .amarelo { color: #ff9800; } .azul { color: #4dabf7; }
        .panel { background: #16213e; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
        .panel h3 { color: #4dabf7; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid #0f3460; font-size: 1em; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; color: #aaa; font-size: 0.85em; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 0.95em; }
        .form-group input:focus { outline: none; border-color: #4dabf7; }
        .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
        .form-row .form-group { flex: 1; min-width: 120px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9em; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #4dabf7; color: #000; } .btn-primary:hover { background: #339af0; }
        .btn-success { background: #4caf50; color: #fff; } .btn-success:hover { background: #43a047; }
        .btn-danger { background: #f44336; color: #fff; } .btn-danger:hover { background: #e53935; }
        .btn-outline { background: transparent; border: 1px solid #4dabf7; color: #4dabf7; } .btn-outline:hover { background: #4dabf710; }
        .btn-warning { background: #ff9800; color: #000; } .btn-warning:hover { background: #f57c00; }
        .btn-sm { padding: 4px 10px; font-size: 0.8em; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .item-card { background: #1a1a2e; border: 1px solid #0f3460; border-radius: 8px; padding: 14px; margin-bottom: 10px; }
        .item-card.ativo { border-color: #4caf50; }
        .item-card.inativo { opacity: 0.5; }
        .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .item-num { font-size: 1.3em; font-weight: 700; color: #4dabf7; }
        .item-fase { padding: 2px 8px; border-radius: 4px; font-size: 0.8em; font-weight: 600; }
        .fase-la { background: #4caf5030; color: #4caf50; }
        .fase-outro { background: #88888830; color: #888; }
        .item-desc { color: #ccc; font-size: 0.9em; margin-bottom: 10px; }
        .item-config { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
        .item-config .form-group { margin-bottom: 0; }
        .item-config input { width: 120px; padding: 6px 8px; font-size: 0.85em; }
        .item-config .narrow { width: 90px; }
        .item-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .item-status { font-size: 0.8em; margin-top: 6px; }
        .result-msg { padding: 8px 12px; border-radius: 6px; margin-top: 8px; font-size: 0.85em; }
        .result-sucesso { background: #4caf5020; border: 1px solid #4caf50; color: #4caf50; }
        .result-erro { background: #f4433620; border: 1px solid #f44336; color: #f44336; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th { color: #888; text-align: left; padding: 6px; border-bottom: 1px solid #0f3460; }
        td { padding: 6px; border-bottom: 1px solid #0f346030; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #4dabf740; border-top: 2px solid #4dabf7; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .add-item-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #0f3460; }
        .add-item-form input { padding: 6px 8px; font-size: 0.85em; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 0.9em; z-index: 999; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .bulk-actions { display: flex; gap: 8px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="main-content">
        <h1>🎯 Sniper de Lances</h1>
        <p class="subtitle">Configuração e envio de lances por item</p>

        <div class="status-bar" id="statusBar">
            <div class="status-item"><div class="label">Extensão</div><div class="value" id="stExtensao">--</div></div>
            <div class="status-item"><div class="label">Bearer</div><div class="value" id="stBearer">--</div></div>
            <div class="status-item"><div class="label">Último Sync</div><div class="value" id="stSync">--</div></div>
            <div class="status-item"><div class="label">Lances Enviados</div><div class="value azul" id="stLances">0</div></div>
        </div>

        <div class="panel">
            <h3>🔎 Selecionar Compra</h3>
            <div class="form-row">
                <div class="form-group" style="flex:3"><label>CompraId</label><input type="text" id="compraId" placeholder="Ex: 07001206000152026"></div>
                <div class="form-group" style="flex:0;align-self:flex-end"><button class="btn btn-primary" onclick="carregarItens()">📋 Carregar Itens</button></div>
            </div>
            <div id="disputasAtivas" style="margin-top:10px;display:none"></div>
        </div>

        <div class="panel" id="itensPanel" style="display:none">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:8px;border-bottom:1px solid #0f3460">
                <h3 style="border:none;margin:0;padding:0">📦 Itens — <span id="itensCompraId" class="azul"></span></h3>
                <div class="bulk-actions">
                    <button class="btn btn-success btn-sm" onclick="enviarTodos()">⚡ Enviar Todos</button>
                    <button class="btn btn-warning btn-sm" onclick="agendarTodos()">⏰ Agendar Todos</button>
                </div>
            </div>
            <div id="itensList"></div>
            <div class="add-item-form">
                <div class="form-group"><label>Nº Item</label><input type="number" id="novoItemNum" min="1" style="width:70px"></div>
                <div class="form-group" style="flex:1"><label>Descrição</label><input type="text" id="novoItemDesc" placeholder="Descrição do item"></div>
                <div class="form-group"><label>Valor R$</label><input type="number" id="novoItemValor" step="0.01" style="width:110px"></div>
                <button class="btn btn-outline btn-sm" onclick="adicionarItem()">+ Adicionar Item</button>
            </div>
        </div>

        <div class="panel" id="historicoPanel" style="display:none">
            <h3>📜 Histórico de Lances</h3>
            <div id="historicoLista"></div>
        </div>

        <div id="toastArea"></div>
    </div>

<script>
var API = window.location.origin;
var currentCompraId = '';
var itensDB = [];

function esc(s) { var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function fmtVal(v) { return v != null ? 'R$ ' + parseFloat(v).toFixed(2) : '--'; }
function fmtHora(iso) {
    if (!iso) return '--';
    try { return new Date(iso).toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch(e) { return iso; }
}

async function atualizarStatus() {
    try {
        var r = await fetch(API + '/api/sniper/fila-status');
        var d = await r.json();
        if (d.success) {
            document.getElementById('stExtensao').innerHTML = d.extensaoConectada ? '<span class="verde">✅ Online</span>' : '<span class="vermelho">❌ Offline</span>';
            document.getElementById('stBearer').innerHTML = d.temBearer ? '<span class="verde">✅ ' + (d.bearerIdade||'') + 's</span>' : '<span class="vermelho">❌</span>';
            document.getElementById('stSync').textContent = d.ultimoSync ? fmtHora(d.ultimoSync) : '--';
            document.getElementById('stLances').textContent = d.totalResultados || 0;
        }
    } catch(e) {}
}

async function carregarItens() {
    var compraId = document.getElementById('compraId').value.trim();
    if (!compraId) { alert('Informe o CompraId'); return; }
    currentCompraId = compraId;

    document.getElementById('itensPanel').style.display = 'block';
    document.getElementById('itensCompraId').textContent = compraId;
    document.getElementById('itensList').innerHTML = '<p style="color:#888"><span class="spinner"></span> Carregando itens...</p>';

    try {
        var rDB = await fetch(API + '/api/sniper/itens?compraId=' + compraId);
        var dDB = await rDB.json();
        itensDB = dDB.success ? dDB.itens : [];
        renderizarItens();
        carregarHistorico();
    } catch(e) {
        document.getElementById('itensList').innerHTML = '<div class="result-msg result-erro">Erro: ' + esc(e.message) + '</div>';
    }
}

function renderizarItens() {
    var div = document.getElementById('itensList');
    if (itensDB.length === 0) {
        div.innerHTML = '<p style="color:#ff9800">Nenhum item cadastrado. Adicione itens abaixo.</p>';
        return;
    }

    div.innerHTML = itensDB.map(function(item) {
        var faseClass = (item.faseItem === 'LA' || item.faseItem === 'D1' || item.faseItem === 'D2') ? 'fase-la' : 'fase-outro';
        var ativoClass = item.ativo ? 'ativo' : 'inativo';
        var statusHtml = item.ultimoEnvio ? '<div class="item-status">' + (item.status === 'enviado' ? '✅' : '❌') + ' ' + esc(item.ultimoResultado||'') + ' — ' + fmtHora(item.ultimoEnvio) + '</div>' : '';

        return '<div class="item-card ' + ativoClass + '" id="item-' + item.itemNumero + '">' +
            '<div class="item-header">' +
                '<div><span class="item-num">#' + item.itemNumero + '</span> <span class="item-fase ' + faseClass + '">' + esc(item.faseItem||'--') + '</span></div>' +
                '<label style="font-size:0.8em;color:#888;cursor:pointer">' +
                    '<input type="checkbox" ' + (item.ativo ? 'checked' : '') + ' onchange="toggleAtivo(' + item.itemNumero + ', this.checked)"> Ativo' +
                '</label>' +
            '</div>' +
            '<div class="item-desc">' + esc(item.descricao || 'Sem descrição') + '</div>' +
            '<div class="item-config">' +
                '<div class="form-group"><label>Valor R$</label>' +
                    '<input type="number" step="0.01" id="valor-' + item.itemNumero + '" value="' + (item.valorLance || '') + '" placeholder="0.00" onchange="salvarValor(' + item.itemNumero + ', this.value)">' +
                '</div>' +
                '<div class="form-group"><label>Horário Alvo</label>' +
                    '<input type="time" step="1" id="hora-' + item.itemNumero + '" value="' + (item.horarioAlvo || '') + '" onchange="salvarHorario(' + item.itemNumero + ', this.value)" class="narrow">' +
                '</div>' +
                '<div class="form-group"><label>Antecedência ms</label>' +
                    '<input type="number" id="antec-' + item.itemNumero + '" value="' + (item.antecedenciaMs || 3000) + '" class="narrow" onchange="salvarAntecedencia(' + item.itemNumero + ', this.value)">' +
                '</div>' +
            '</div>' +
            '<div class="item-actions">' +
                '<button class="btn btn-success btn-sm" onclick="enviarLanceItem(' + item.itemNumero + ')" ' + (!item.ativo ? 'disabled' : '') + '>⚡ Enviar Agora</button>' +
                '<button class="btn btn-primary btn-sm" onclick="agendarItem(' + item.itemNumero + ')" ' + (!item.ativo ? 'disabled' : '') + '>⏰ Agendar</button>' +
                '<button class="btn btn-outline btn-sm" onclick="editarDescricao(' + item.itemNumero + ')">✏️ Editar</button>' +
                '<button class="btn btn-danger btn-sm" onclick="removerItem(' + item.itemNumero + ')">🗑️</button>' +
            '</div>' +
            statusHtml +
            '<div id="result-' + item.itemNumero + '"></div>' +
        '</div>';
    }).join('');
}

async function salvarCampo(itemNumero, campo, valor) {
    try {
        var body = { compraId: currentCompraId, itemNumero: itemNumero };
        body[campo] = valor;
        await fetch(API + '/api/sniper/itens', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    } catch(e) {}
}

function salvarValor(n, v) { salvarCampo(n, 'valorLance', parseFloat(v) || null); }
function salvarHorario(n, v) { salvarCampo(n, 'horarioAlvo', v || null); }
function salvarAntecedencia(n, v) { salvarCampo(n, 'antecedenciaMs', parseInt(v) || 3000); }

async function toggleAtivo(itemNumero, ativo) {
    await salvarCampo(itemNumero, 'ativo', ativo ? 1 : 0);
    var card = document.getElementById('item-' + itemNumero);
    if (card) card.className = 'item-card ' + (ativo ? 'ativo' : 'inativo');
}

async function enviarLanceItem(itemNumero) {
    var valorEl = document.getElementById('valor-' + itemNumero);
    var valor = parseFloat(valorEl ? valorEl.value : 0);
    if (!valor || valor <= 0) { alert('Informe o valor do lance para o item ' + itemNumero); if(valorEl) valorEl.focus(); return; }
    if (!confirm('Enviar R$ ' + valor.toFixed(2) + ' no item ' + itemNumero + '?')) return;

    var resultDiv = document.getElementById('result-' + itemNumero);
    resultDiv.innerHTML = '<div class="result-msg" style="color:#ff9800"><span class="spinner"></span> Enviando...</div>';

    try {
        var r = await fetch(API + '/api/sniper/lance', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ compraId: currentCompraId, itemNumero: itemNumero, valor: valor })
        });
        var d = await r.json();
        if (!d.success) { resultDiv.innerHTML = '<div class="result-msg result-erro">' + esc(d.error) + '</div>'; return; }

        var lanceId = d.id;
        var tentativas = 0;
        var poll = setInterval(async function() {
            tentativas++;
            try {
                var rs = await fetch(API + '/api/sniper/fila-status');
                var ds = await rs.json();
                var lance = (ds.resultados||[]).find(function(r) { return r.id === lanceId; });
                if (lance) {
                    clearInterval(poll);
                    if (lance.sucesso) {
                        resultDiv.innerHTML = '<div class="result-msg result-sucesso">✅ LANCE ENVIADO! R$ ' + valor.toFixed(2) + ' (' + lance.tempoMs + 'ms)</div>';
                        toast('✅ Lance item ' + itemNumero + ' enviado!', 'sucesso');
                    } else {
                        resultDiv.innerHTML = '<div class="result-msg result-erro">❌ Falha HTTP ' + lance.status + ' (' + lance.tempoMs + 'ms)</div>';
                    }
                    carregarHistorico();
                }
            } catch(e) {}
            if (tentativas > 30) { clearInterval(poll); resultDiv.innerHTML = '<div class="result-msg result-erro">Timeout aguardando resultado</div>'; }
        }, 1000);
    } catch(e) {
        resultDiv.innerHTML = '<div class="result-msg result-erro">' + esc(e.message) + '</div>';
    }
}

async function agendarItem(itemNumero) {
    var valor = parseFloat((document.getElementById('valor-' + itemNumero)||{}).value);
    var horario = (document.getElementById('hora-' + itemNumero)||{}).value;
    var antecedencia = parseInt((document.getElementById('antec-' + itemNumero)||{}).value) || 3000;
    var item = itensDB.find(function(i) { return i.itemNumero === itemNumero; });

    if (!valor || valor <= 0) { alert('Informe o valor'); return; }
    if (!horario) { alert('Informe o horário alvo'); return; }

    var hoje = new Date().toISOString().split('T')[0];
    var horaLocal = new Date(hoje + 'T' + horario + '-03:00');
    var agora = new Date();
    if (horaLocal <= agora) { alert('Horário já passou.'); return; }
    var minutos = Math.round((horaLocal - agora) / 60000);

    if (!confirm('Agendar sniper:\n\nItem: ' + itemNumero + ' — ' + (item ? item.descricao : '') + '\nValor: R$ ' + valor.toFixed(2) + '\nAlvo: ' + horario + ' BRT (em ~' + minutos + ' min)\nAntecedência: ' + antecedencia + 'ms')) return;

    try {
        var r = await fetch(API + '/api/sniper/agendar', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                compraId: currentCompraId, itemNumero: itemNumero, valor: valor,
                horarioAlvo: horaLocal.toISOString(),
                antecedenciaMs: antecedencia,
                tentativas: item ? (item.tentativas || 3) : 3,
                intervaloTentativasMs: item ? (item.intervaloMs || 500) : 500,
            })
        });
        var d = await r.json();
        if (d.success) { toast('⏰ Item ' + itemNumero + ' agendado para ' + horario, 'sucesso'); }
        else { alert('Erro: ' + d.error); }
    } catch(e) { alert('Erro: ' + e.message); }
}

function editarDescricao(itemNumero) {
    var item = itensDB.find(function(i) { return i.itemNumero === itemNumero; });
    var novaDesc = prompt('Descrição do item ' + itemNumero + ':', item ? item.descricao : '');
    if (novaDesc === null) return;
    salvarCampo(itemNumero, 'descricao', novaDesc);
    if (item) item.descricao = novaDesc;
    renderizarItens();
}

async function removerItem(itemNumero) {
    if (!confirm('Remover item ' + itemNumero + '?')) return;
    try {
        await fetch(API + '/api/sniper/itens/' + currentCompraId + '/' + itemNumero, {method:'DELETE'});
        itensDB = itensDB.filter(function(i) { return i.itemNumero !== itemNumero; });
        renderizarItens();
        toast('🗑️ Item ' + itemNumero + ' removido', 'info');
    } catch(e) {}
}

async function adicionarItem() {
    var num = parseInt(document.getElementById('novoItemNum').value);
    var desc = document.getElementById('novoItemDesc').value.trim();
    var valor = parseFloat(document.getElementById('novoItemValor').value) || null;

    if (!num) { alert('Informe o número do item'); return; }
    if (!currentCompraId) { alert('Carregue uma compra primeiro'); return; }

    try {
        var r = await fetch(API + '/api/sniper/itens', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ compraId: currentCompraId, itemNumero: num, descricao: desc, valorLance: valor, faseItem: 'LA' })
        });
        var d = await r.json();
        if (d.success) {
            var rDB = await fetch(API + '/api/sniper/itens?compraId=' + currentCompraId);
            var dDB = await rDB.json();
            itensDB = dDB.success ? dDB.itens : itensDB;
            renderizarItens();
            document.getElementById('novoItemNum').value = '';
            document.getElementById('novoItemDesc').value = '';
            document.getElementById('novoItemValor').value = '';
            toast('✅ Item ' + num + ' adicionado', 'sucesso');
        } else { alert('Erro: ' + d.error); }
    } catch(e) { alert('Erro: ' + e.message); }
}

async function enviarTodos() {
    var ativos = itensDB.filter(function(i) { return i.ativo && i.valorLance > 0; });
    if (ativos.length === 0) { alert('Nenhum item ativo com valor configurado'); return; }
    var lista = ativos.map(function(i) { return '  Item ' + i.itemNumero + ': R$ ' + parseFloat(i.valorLance).toFixed(2); }).join('\n');
    if (!confirm('Enviar ' + ativos.length + ' lances agora?\n\n' + lista)) return;

    for (var j = 0; j < ativos.length; j++) {
        try {
            await fetch(API + '/api/sniper/lance', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ compraId: currentCompraId, itemNumero: ativos[j].itemNumero, valor: ativos[j].valorLance })
            });
        } catch(e) {}
    }
    toast('🎯 ' + ativos.length + ' lances enfileirados', 'sucesso');
}

async function agendarTodos() {
    var ativos = itensDB.filter(function(i) { return i.ativo && i.valorLance > 0 && i.horarioAlvo; });
    if (ativos.length === 0) { alert('Nenhum item ativo com valor e horário configurados'); return; }
    var lista = ativos.map(function(i) { return '  Item ' + i.itemNumero + ': R$ ' + parseFloat(i.valorLance).toFixed(2) + ' às ' + i.horarioAlvo; }).join('\n');
    if (!confirm('Agendar ' + ativos.length + ' lances?\n\n' + lista)) return;

    for (var j = 0; j < ativos.length; j++) {
        var it = ativos[j];
        var hoje = new Date().toISOString().split('T')[0];
        var horaLocal = new Date(hoje + 'T' + it.horarioAlvo + '-03:00');
        try {
            await fetch(API + '/api/sniper/agendar', {
                method: 'POST', headers: {'Content-Type':'application/json'},
                body: JSON.stringify({
                    compraId: currentCompraId, itemNumero: it.itemNumero, valor: it.valorLance,
                    horarioAlvo: horaLocal.toISOString(),
                    antecedenciaMs: it.antecedenciaMs || 3000,
                    tentativas: it.tentativas || 3,
                    intervaloTentativasMs: it.intervaloMs || 500,
                })
            });
        } catch(e) {}
    }
    toast('⏰ ' + ativos.length + ' lances agendados', 'sucesso');
}

async function carregarHistorico() {
    if (!currentCompraId) return;
    var div = document.getElementById('historicoLista');
    document.getElementById('historicoPanel').style.display = 'block';
    try {
        var r = await fetch(API + '/api/sniper/historico?compraId=' + currentCompraId + '&limit=20');
        var d = await r.json();
        if (!d.success || !d.historico || d.historico.length === 0) { div.innerHTML = '<p style="color:#888">Nenhum lance enviado ainda.</p>'; return; }
        div.innerHTML = '<table><tr><th>Hora</th><th>Item</th><th>Valor</th><th>Status</th><th>Tempo</th></tr>' +
            d.historico.map(function(h) {
                return '<tr><td>' + fmtHora(h.timestamp) + '</td><td class="azul">' + h.itemNumero + '</td><td>' + fmtVal(h.valor) + '</td>' +
                    '<td class="' + (h.sucesso ? 'verde' : 'vermelho') + '">' + (h.sucesso ? '✅' : '❌') + ' HTTP ' + h.httpStatus + '</td>' +
                    '<td>' + h.tempoMs + 'ms</td></tr>';
            }).join('') + '</table>';
    } catch(e) { div.innerHTML = '<p style="color:#f44336">Erro: ' + esc(e.message) + '</p>'; }
}

async function carregarDisputasAtivas() {
    try {
        var r = await fetch(API + '/api/sync/disputas');
        var d = await r.json();
        if (!d.success || !d.disputas || d.disputas.length === 0) return;
        var ativas = d.disputas.filter(function(d) { return d.itensAtivos > 0; });
        if (ativas.length === 0) return;
        var div = document.getElementById('disputasAtivas');
        div.style.display = 'block';
        div.innerHTML = '<div style="font-size:0.85em;color:#888;margin-bottom:6px">Disputas ativas:</div>' +
            ativas.slice(0, 10).map(function(d) {
                return '<button class="btn btn-outline btn-sm" style="margin:2px" onclick="document.getElementById(\'compraId\').value=\'' + d.compraId + '\';carregarItens()">' +
                    esc(d.compraId) + ' — ' + esc((d.objeto||d.orgao||'').substring(0,50)) + ' (' + d.itensAtivos + ' itens)</button>';
            }).join('');
    } catch(e) {}
}

function toast(msg, tipo) {
    var div = document.createElement('div');
    div.className = 'toast';
    div.style.background = tipo === 'sucesso' ? '#4caf50' : tipo === 'erro' ? '#f44336' : '#4dabf7';
    div.style.color = '#fff';
    div.textContent = msg;
    document.getElementById('toastArea').appendChild(div);
    setTimeout(function() { div.remove(); }, 4000);
}

// Init
var params = new URLSearchParams(window.location.search);
if (params.get('compraId')) {
    document.getElementById('compraId').value = params.get('compraId');
    carregarItens();
}
atualizarStatus();
setInterval(atualizarStatus, 10000);
carregarDisputasAtivas();
</script>
