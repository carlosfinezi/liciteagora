<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sniper de Lances - LiciteAgora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .main-content { background: #1a1a2e; padding: 20px; }
        h1 { color: #4dabf7; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 20px; }

        /* Status bar */
        .status-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .status-item { background: #16213e; padding: 10px 14px; border-radius: 8px; flex: 1; min-width: 100px; text-align: center; }
        .status-item .label { color: #888; font-size: 0.75em; margin-bottom: 3px; }
        .status-item .value { font-size: 1em; font-weight: 600; }
        .verde { color: #4caf50; } .vermelho { color: #f44336; } .amarelo { color: #ff9800; } .azul { color: #4dabf7; }

        /* Panel */
        .panel { background: #16213e; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .panel h3 { color: #4dabf7; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #0f3460; font-size: 1em; }

        /* Filters */
        .filtros { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .filtros label { font-size: 0.85em; cursor: pointer; display: flex; align-items: center; gap: 4px; color: #ccc; }
        .filtros label:hover { color: #4dabf7; }
        .filtros input[type=text] { flex: 1; min-width: 200px; padding: 6px 10px; border-radius: 6px; border: 1px solid #0f3460; background: #1a1a2e; color: #eee; font-size: 0.85em; }
        .filtros input[type=text]:focus { outline: none; border-color: #4dabf7; }

        /* Licitação rows */
        .lic-row { border: 1px solid #0f3460; border-radius: 6px; margin-bottom: 4px; overflow: hidden; }
        .lic-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; transition: background 0.15s; }
        .lic-header:hover { background: #0f346040; }
        .lic-header.aberta { background: #0f346060; border-bottom: 1px solid #0f3460; }
        .lic-left { flex: 1; min-width: 0; }
        .lic-id { font-size: 0.85em; font-weight: 600; color: #4dabf7; }
        .lic-obj { font-size: 0.8em; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 550px; margin-top: 2px; }
        .lic-org { font-size: 0.72em; color: #888; margin-top: 1px; }
        .lic-right { text-align: right; flex-shrink: 0; margin-left: 12px; }
        .lic-etapa { font-size: 0.8em; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
        .etapa-disputa { background: #4caf5025; color: #4caf50; }
        .etapa-encerrada { background: #88888825; color: #888; }
        .etapa-outra { background: #ff980025; color: #ff9800; }
        .lic-data { font-size: 0.72em; color: #888; margin-top: 3px; }
        .lic-body { display: none; padding: 12px 14px; background: #1a1a2e; }
        .lic-body.aberta { display: block; }
        .lic-arrow { color: #888; font-size: 0.8em; transition: transform 0.2s; margin-left: 8px; }
        .lic-arrow.aberta { transform: rotate(180deg); }

        /* Item table */
        .itens-table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
        .itens-table th { color: #888; text-align: left; padding: 6px 8px; border-bottom: 1px solid #0f3460; font-weight: 500; white-space: nowrap; }
        .itens-table td { padding: 6px 8px; border-bottom: 1px solid #0f346030; vertical-align: middle; }
        .itens-table tr:hover { background: #0f346020; }
        .itens-table input[type=number] { width: 90px; padding: 4px 6px; border-radius: 4px; border: 1px solid #0f3460; background: #16213e; color: #eee; font-size: 0.9em; }
        .itens-table input:focus { outline: none; border-color: #4dabf7; }
        .itens-table .desc-cell { max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .valor-melhor { color: #4caf50; font-weight: 600; }
        .valor-nosso { color: #4dabf7; font-weight: 600; }
        .valor-nosso.melhor { color: #ffd700; }

        /* Buttons */
        .btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85em; font-weight: 500; transition: all 0.2s; }
        .btn-success { background: #4caf50; color: #fff; } .btn-success:hover { background: #43a047; }
        .btn-primary { background: #4dabf7; color: #000; } .btn-primary:hover { background: #339af0; }
        .btn-outline { background: transparent; border: 1px solid #4dabf7; color: #4dabf7; } .btn-outline:hover { background: #4dabf710; }
        .btn-warning { background: #ff9800; color: #000; } .btn-warning:hover { background: #f57c00; }
        .btn-danger { background: #f44336; color: #fff; }
        .btn-sm { padding: 3px 8px; font-size: 0.78em; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-group { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

        .result-msg { padding: 6px 10px; border-radius: 4px; margin-top: 6px; font-size: 0.82em; }
        .result-sucesso { background: #4caf5018; border: 1px solid #4caf50; color: #4caf50; }
        .result-erro { background: #f4433618; border: 1px solid #f44336; color: #f44336; }
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #4dabf740; border-top: 2px solid #4dabf7; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; border-radius: 8px; font-size: 0.85em; z-index: 999; color: #fff; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        .info-msg { color: #888; text-align: center; padding: 12px; font-size: 0.85em; }
        .contagem { font-size: 0.72em; color: #888; margin-top: 2px; }
    </style>
</head>
<body>
<div class="app-container">
<main class="main-content">
    <h1>🎯 Sniper de Lances</h1>
    <p class="subtitle">Disputas ativas do Comprasnet → clique para ver itens → configure e envie</p>

    <div class="status-bar">
        <div class="status-item"><div class="label">Extensão</div><div class="value" id="stExt">--</div></div>
        <div class="status-item"><div class="label">Bearer</div><div class="value" id="stBearer">--</div></div>
        <div class="status-item"><div class="label">Brasília</div><div class="value azul" id="hora">--:--:--</div></div>
        <div class="status-item"><div class="label">Disputas</div><div class="value azul" id="stDisp">0</div></div>
        <div class="status-item"><div class="label">Lances</div><div class="value azul" id="stLances">0</div></div>
    </div>

    <div class="panel">
        <h3>🔥 Compras — Minhas Participações</h3>
        <div class="filtros">
            <label><input type="radio" name="filtroEtapa" value="disputa" checked onchange="aplicarFiltro()"> Em Disputa</label>
            <label><input type="radio" name="filtroEtapa" value="todas" onchange="aplicarFiltro()"> Todas</label>
            <input type="text" id="buscaTexto" placeholder="Filtrar por objeto, órgão ou compraId..." oninput="aplicarFiltro()">
            <button class="btn btn-outline btn-sm" onclick="recarregarDados()">🔄</button>
        </div>
        <div id="listaCompras"><p class="info-msg"><span class="spinner"></span> Carregando participações...</p></div>
    </div>

    <div id="toastArea"></div>
</main>
</div>
<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('lances');</script>
<script>
var API = '';
var participacoes = [];
var disputasLive = {};  // compraId -> { itens: [...] } from extension cache
var itensConfig = {};   // compraId -> [sniper_itens rows] from DB
var aberta = null;      // compraId atualmente expandida

function esc(s) { var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function fmtR$(v) { return v != null && v !== '' && !isNaN(v) ? 'R$ ' + parseFloat(v).toFixed(2) : '--'; }
function fmtHora(iso) { if(!iso)return'--'; try{return new Date(iso).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo'});}catch(e){return iso;} }

// ==================== STATUS ====================
async function atualizarStatus() {
    try {
        var r = await fetch(API+'/api/sniper/fila-status'); var d = await r.json();
        if(d.success){
            document.getElementById('stExt').innerHTML = d.extensaoConectada?'<span class="verde">OK</span>':'<span class="vermelho">OFF</span>';
            // Bearer com cor baseada na idade
            if(d.temBearer) {
                var idadeS = d.bearerIdade||0;
                var corBearer = idadeS < 300 ? 'verde' : idadeS < 600 ? 'amarelo' : 'vermelho';
                var labelBearer = d.tokenExpirado ? 'EXPIRADO' : Math.floor(idadeS/60)+'m';
                document.getElementById('stBearer').innerHTML = '<span class="'+corBearer+'">'+labelBearer+'</span>';
            } else {
                document.getElementById('stBearer').innerHTML = '<span class="vermelho">SEM</span>';
            }
            document.getElementById('stLances').textContent = d.totalResultados||0;
            // Disputas com idade do cache
            if(d.disputasCache && d.disputasCache.atualizadoEm) {
                var idadeDisp = d.disputasCache.idadeSegundos||0;
                var corDisp = idadeDisp < 180 ? 'verde' : idadeDisp < 600 ? 'amarelo' : 'vermelho';
                document.getElementById('stDisp').innerHTML = '<span class="'+corDisp+'">'+d.disputasCache.total+'</span>';
            }
        }
    }catch(e){}
}

// ==================== LOAD DATA ====================
async function recarregarDados() {
    await Promise.all([carregarParticipacoes(), carregarDisputasLive()]);
    aplicarFiltro();
}

async function carregarParticipacoes() {
    try {
        var r = await fetch(API+'/api/sniper/participacoes');
        var d = await r.json();
        participacoes = d.success ? d.participacoes : [];
    } catch(e) { participacoes = []; }
}

async function carregarDisputasLive() {
    try {
        var r = await fetch(API+'/api/sniper/disputas-ativas');
        var d = await r.json();
        disputasLive = {};
        if(d.success && d.disputas) {
            d.disputas.forEach(function(disp) { disputasLive[disp.compraId] = disp; });
        }
        document.getElementById('stDisp').textContent = Object.keys(disputasLive).length;
    } catch(e) {}
}

// ==================== FILTER & RENDER ====================
function aplicarFiltro() {
    var filtro = document.querySelector('input[name=filtroEtapa]:checked').value;
    var busca = document.getElementById('buscaTexto').value.toLowerCase().trim();

    var lista = participacoes.filter(function(p) {
        if(filtro === 'disputa') {
            var et = etapaInfo(p);
            // Esconder encerradas (banco + live)
            if(et.cls === 'etapa-encerrada') return false;
        }
        if(busca) {
            return (p.objeto||'').toLowerCase().indexOf(busca)>=0 ||
                   (p.orgao||'').toLowerCase().indexOf(busca)>=0 ||
                   (p.compraId||'').toLowerCase().indexOf(busca)>=0;
        }
        return true;
    });

    renderLista(lista);
}

function etapaInfo(p) {
    var fase = p.faseCompra||'';
    var live = disputasLive[p.compraId];
    var sit = (p.situacao||'').toUpperCase();

    // Dados do banco indicam encerrada/inativa
    if(sit==='FR') return { label: 'Fracassada', cls: 'etapa-encerrada' };
    if(sit==='EN') return { label: 'Encerrada', cls: 'etapa-encerrada' };
    if(sit==='SU') return { label: 'Suspensa', cls: 'etapa-encerrada' };
    if(fase==='4'||fase==='encerrada') return { label: 'Encerrada', cls: 'etapa-encerrada' };
    if(fase==='99') return { label: 'Concluída', cls: 'etapa-encerrada' };

    // Dados live: se tem itens e NENHUM ativo → encerrada (live)
    if(live && live.totalItens > 0 && live.itensAtivos === 0) {
        var algumAtivo = (live.itens||[]).some(function(i) {
            var f = (i.fase||'').toUpperCase();
            return f==='LA'||f==='D1'||f==='D2'||i.podeEnviar;
        });
        if(!algumAtivo) return { label: 'Encerrada (live)', cls: 'etapa-encerrada' };
    }

    // Dados live: se tem itens ativos, é disputa
    if(live && live.itensAtivos > 0) return { label: 'Disputa', cls: 'etapa-disputa' };
    if(fase==='3') return { label: 'Disputa', cls: 'etapa-disputa' };
    if(fase==='1') return { label: 'Cadastrada', cls: 'etapa-outra' };
    if(fase==='2') return { label: 'Publicada', cls: 'etapa-outra' };
    return { label: fase||sit||'Em andamento', cls: 'etapa-outra' };
}

function renderLista(lista) {
    var div = document.getElementById('listaCompras');
    if(!lista.length) { div.innerHTML='<p class="info-msg">Nenhuma participação encontrada.</p>'; return; }

    div.innerHTML = '<div style="color:#888;font-size:0.75em;margin-bottom:6px">'+lista.length+' participações</div>' +
        lista.map(function(p) {
            var et = etapaInfo(p);
            var isAberta = aberta === p.compraId;
            return '<div class="lic-row" id="lic-'+p.compraId+'">' +
                '<div class="lic-header'+(isAberta?' aberta':'')+'" onclick="toggleLic(\''+p.compraId+'\')">' +
                    '<div class="lic-left">' +
                        '<div class="lic-id">'+p.compraId+'</div>' +
                        '<div class="lic-obj" title="'+esc(p.objeto)+'">'+esc((p.objeto||'(sem objeto)').substring(0,120))+'</div>' +
                        '<div class="lic-org">'+esc(p.orgao||'')+'</div>' +
                    '</div>' +
                    '<div class="lic-right">' +
                        '<span class="lic-etapa '+et.cls+'">'+et.label+'</span>' +
                        (p.dataSessao?'<div class="lic-data">'+esc((p.dataSessao||'').substring(0,16))+'</div>':'') +
                    '</div>' +
                    '<span class="lic-arrow'+(isAberta?' aberta':'')+'">▼</span>' +
                '</div>' +
                '<div class="lic-body'+(isAberta?' aberta':'')+'" id="body-'+p.compraId+'">'+(isAberta?'<span class="spinner"></span>':'')+'</div>' +
            '</div>';
        }).join('');

    if(aberta) carregarItensLic(aberta);
}

// ==================== TOGGLE / EXPAND ====================
function toggleLic(compraId) {
    if(aberta === compraId) {
        aberta = null;
        aplicarFiltro();
        return;
    }
    aberta = compraId;
    aplicarFiltro();
    carregarItensLic(compraId);
}

async function carregarItensLic(compraId) {
    var body = document.getElementById('body-'+compraId);
    if(!body) return;
    body.innerHTML = '<p style="color:#888;padding:8px"><span class="spinner"></span> Carregando itens...</p>';

    // 1. Dados live da extensão
    var live = disputasLive[compraId];
    var itensLive = live ? live.itens : [];

    // 2. Config salva no banco (sniper_itens)
    try {
        var r = await fetch(API+'/api/sniper/itens?compraId='+compraId);
        var d = await r.json();
        itensConfig[compraId] = d.success ? d.itens : [];
    } catch(e) { itensConfig[compraId] = []; }

    // 3. Se não tem config, buscar itens do PNCP (tabela itens/licitacoes)
    if(itensConfig[compraId].length === 0) {
        try {
            var rp = await fetch(API+'/api/sniper/itens-pncp?compraId='+compraId);
            var dp = await rp.json();
            if(dp.success && dp.itens && dp.itens.length > 0) {
                // Criar sniper_itens a partir dos dados PNCP
                var bulkPncp = dp.itens.map(function(i) {
                    return { itemNumero: i.itemNumero, descricao: i.descricao||'', faseItem: 'LA', valorEstimado: i.valorEstimado };
                });
                var rbp = await fetch(API+'/api/sniper/itens/bulk', {method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({compraId:compraId, itens:bulkPncp})});
                var dbp = await rbp.json();
                if(dbp.success) itensConfig[compraId] = dbp.itens;
            }
        } catch(e){}
    }

    // 4. Se tem itens live mas não no banco, criar a partir do live
    if(itensLive.length > 0 && itensConfig[compraId].length === 0) {
        var bulk = itensLive.map(function(i) {
            return { itemNumero: i.numero||1, descricao: i.descricao||'', faseItem: i.fase||'LA', valorEstimado: i.valorEstimado };
        });
        try {
            var rb = await fetch(API+'/api/sniper/itens/bulk', {method:'POST',headers:{'Content-Type':'application/json'},
                body:JSON.stringify({compraId:compraId, itens:bulk})});
            var db2 = await rb.json();
            if(db2.success) itensConfig[compraId] = db2.itens;
        } catch(e){}
    }

    // 5. Último recurso: consultar via extensão
    if(itensLive.length === 0 && itensConfig[compraId].length === 0) {
        try {
            var rc = await fetch(API+'/api/sniper/consultar-itens?compraId='+compraId);
            var dc = await rc.json();
            if(dc.success && dc.itens && dc.itens.length > 0) {
                itensLive = dc.itens;
                var bulk2 = itensLive.map(function(i){return{itemNumero:i.numero||1,descricao:i.descricao||'',faseItem:i.fase||'LA',valorEstimado:i.valorEstimado};});
                var rb2 = await fetch(API+'/api/sniper/itens/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({compraId:compraId,itens:bulk2})});
                var db3 = await rb2.json();
                if(db3.success) itensConfig[compraId]=db3.itens;
            }
        } catch(e){}
    }

    renderItens(compraId, itensLive);
}

// ==================== RENDER ITENS TABLE ====================
function renderItens(compraId, itensLive) {
    var body = document.getElementById('body-'+compraId);
    if(!body) return;
    var config = itensConfig[compraId]||[];

    // Merge: for each item, combine live data with saved config
    var merged = [];
    // Start with live items
    var liveMap = {};
    itensLive.forEach(function(il) { liveMap[il.numero] = il; });
    // Start with config items (they have all saved data)
    var seen = {};
    config.forEach(function(cfg) {
        var lv = liveMap[cfg.itemNumero] || {};
        merged.push({
            numero: cfg.itemNumero,
            descricao: cfg.descricao || lv.descricao || '',
            fase: lv.fase || cfg.faseItem || '',
            melhorValor: lv.melhorValor,
            nossoValor: lv.nossoValor,
            podeEnviar: lv.podeEnviar !== undefined ? lv.podeEnviar : true,
            valorEstimado: cfg.valorEstimado || lv.valorEstimado,
            fimContagem: lv.fimContagem,
            // Config salva
            valorLance: cfg.valorLance,
            valorMinimo: cfg.valorMinimo,
            descontoMinimo: cfg.descontoMinimo,
            descontoMaximo: cfg.descontoMaximo,
            horarioAlvo: cfg.horarioAlvo,
            antecedenciaMs: cfg.antecedenciaMs,
            ativo: cfg.ativo,
            ultimoResultado: cfg.ultimoResultado,
            ultimoEnvio: cfg.ultimoEnvio,
            status: cfg.status,
        });
        seen[cfg.itemNumero] = true;
    });
    // Add live items not in config
    itensLive.forEach(function(il) {
        if(!seen[il.numero]) {
            merged.push({ numero:il.numero, descricao:il.descricao, fase:il.fase, melhorValor:il.melhorValor, nossoValor:il.nossoValor, podeEnviar:il.podeEnviar, valorEstimado:il.valorEstimado, fimContagem:il.fimContagem, valorLance:null, valorMinimo:null, descontoMinimo:null, descontoMaximo:null, horarioAlvo:null, antecedenciaMs:3000, ativo:1 });
        }
    });

    if(merged.length === 0) {
        body.innerHTML = '<p class="info-msg">Sem dados de itens. Aguardando sync da extensão ou adicione manualmente.</p><div class="btn-group"><button class="btn btn-outline btn-sm" onclick="adicionarItemManual(\''+compraId+'\')">+ Adicionar Item</button></div><div id="resultado-'+compraId+'"></div>';
        return;
    }

    var html = '<table class="itens-table"><thead><tr>' +
        '<th>#</th><th>Descrição</th><th>Fase</th>' +
        '<th>Melhor R$</th><th>Nosso R$</th><th>V.Estimado</th>' +
        '<th>Valor Mínimo</th><th>Desc.Mín%</th><th>Desc.Máx%</th>' +
        '<th>Valor Lance</th><th>Ações</th>' +
        '</tr></thead><tbody>';

    merged.forEach(function(m) {
        var nossoClass = 'valor-nosso';
        if(m.nossoValor && m.melhorValor && m.nossoValor <= m.melhorValor) nossoClass += ' melhor';

        html += '<tr>' +
            '<td><strong>'+m.numero+'</strong></td>' +
            '<td class="desc-cell" title="'+esc(m.descricao)+'">'+esc((m.descricao||'').substring(0,60))+'</td>' +
            '<td><span class="lic-etapa '+(m.podeEnviar?'etapa-disputa':'etapa-outra')+'">'+esc(m.fase||'--')+'</span></td>' +
            '<td class="valor-melhor">'+fmtR$(m.melhorValor)+'</td>' +
            '<td class="'+nossoClass+'">'+fmtR$(m.nossoValor)+'</td>' +
            '<td style="color:#888">'+fmtR$(m.valorEstimado)+'</td>' +
            '<td><input type="number" step="0.01" value="'+(m.valorMinimo||'')+'" onchange="salvar(\''+compraId+'\','+m.numero+',\'valorMinimo\',this.value)" placeholder="Min"></td>' +
            '<td><input type="number" step="0.1" value="'+(m.descontoMinimo||'')+'" onchange="salvar(\''+compraId+'\','+m.numero+',\'descontoMinimo\',this.value)" placeholder="%" style="width:65px"></td>' +
            '<td><input type="number" step="0.1" value="'+(m.descontoMaximo||'')+'" onchange="salvar(\''+compraId+'\','+m.numero+',\'descontoMaximo\',this.value)" placeholder="%" style="width:65px"></td>' +
            '<td><input type="number" step="0.01" id="vl-'+compraId+'-'+m.numero+'" value="'+(m.valorLance||'')+'" onchange="salvar(\''+compraId+'\','+m.numero+',\'valorLance\',this.value)" placeholder="Lance"></td>' +
            '<td style="white-space:nowrap">' +
                '<button class="btn btn-success btn-sm" onclick="enviar(\''+compraId+'\','+m.numero+')" '+(m.podeEnviar?'':'disabled')+' title="Enviar agora">⚡</button> ' +
                '<button class="btn btn-primary btn-sm" onclick="agendar(\''+compraId+'\','+m.numero+')" title="Agendar">⏰</button>' +
            '</td>' +
            '</tr>';

        if(m.ultimoEnvio) {
            html += '<tr><td colspan="11" style="padding:2px 8px;font-size:0.75em;color:'+(m.status==='enviado'?'#4caf50':'#f44336')+'">' +
                (m.status==='enviado'?'✅':'❌')+' '+esc(m.ultimoResultado||'')+' — '+fmtHora(m.ultimoEnvio)+'</td></tr>';
        }
    });

    html += '</tbody></table>';
    html += '<div class="btn-group">' +
        '<button class="btn btn-success btn-sm" onclick="enviarTodos(\''+compraId+'\')">⚡ Enviar Todos</button>' +
        '<button class="btn btn-warning btn-sm" onclick="agendarTodos(\''+compraId+'\')">⏰ Agendar Todos</button>' +
        '<button class="btn btn-outline btn-sm" onclick="adicionarItemManual(\''+compraId+'\')">+ Item</button>' +
        '</div>';
    html += '<div id="resultado-'+compraId+'"></div>';

    body.innerHTML = html;
}

// ==================== SAVE CONFIG ====================
function salvar(compraId, itemNumero, campo, valor) {
    var body = { compraId: compraId, itemNumero: itemNumero };
    if(campo === 'valorLance' || campo === 'valorMinimo') body[campo] = parseFloat(valor)||null;
    else if(campo === 'descontoMinimo' || campo === 'descontoMaximo') body[campo] = parseFloat(valor)||null;
    else body[campo] = valor || null;
    fetch(API+'/api/sniper/itens',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    // Update local cache
    var cfg = (itensConfig[compraId]||[]).find(function(c){return c.itemNumero===itemNumero;});
    if(cfg) cfg[campo] = body[campo];
}

// ==================== ENVIAR LANCE ====================
function enviar(compraId, itemNumero) {
    var el = document.getElementById('vl-'+compraId+'-'+itemNumero);
    var valor = parseFloat(el?el.value:0);
    if(!valor||valor<=0){alert('Informe o valor do lance para o item '+itemNumero);if(el)el.focus();return;}
    if(!confirm('Enviar R$ '+valor.toFixed(2)+' no item '+itemNumero+'?'))return;

    var resDiv = document.getElementById('resultado-'+compraId);
    resDiv.innerHTML = '<div class="result-msg" style="color:#ff9800"><span class="spinner"></span> Enviando item '+itemNumero+'...</div>';

    fetch(API+'/api/sniper/lance',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({compraId:compraId,itemNumero:itemNumero,valor:valor})
    }).then(function(r){return r.json();}).then(function(d){
        if(!d.success){resDiv.innerHTML='<div class="result-msg result-erro">'+esc(d.error)+'</div>';return;}
        var lanceId=d.id; var tent=0;
        var poll=setInterval(function(){
            tent++;
            fetch(API+'/api/sniper/fila-status').then(function(r){return r.json();}).then(function(ds){
                var lance=(ds.resultados||[]).find(function(r){return r.id===lanceId;});
                if(lance){clearInterval(poll);
                    if(lance.sucesso){resDiv.innerHTML='<div class="result-msg result-sucesso">✅ Item '+itemNumero+' — R$ '+valor.toFixed(2)+' ('+lance.tempoMs+'ms)</div>';toast('✅ #'+itemNumero+' R$ '+valor.toFixed(2),'sucesso');}
                    else resDiv.innerHTML='<div class="result-msg result-erro">❌ HTTP '+lance.status+' ('+lance.tempoMs+'ms)</div>';
                }
            }).catch(function(){});
            if(tent>30){clearInterval(poll);resDiv.innerHTML='<div class="result-msg result-erro">Timeout</div>';}
        },1000);
    }).catch(function(e){resDiv.innerHTML='<div class="result-msg result-erro">'+esc(e.message)+'</div>';});
}

function enviarTodos(compraId) {
    var config = itensConfig[compraId]||[];
    var ativos = config.filter(function(c){return c.ativo && c.valorLance>0;});
    if(!ativos.length){alert('Configure valor nos itens primeiro');return;}
    var lista = ativos.map(function(c){return'  #'+c.itemNumero+': R$ '+parseFloat(c.valorLance).toFixed(2);}).join('\n');
    if(!confirm('Enviar '+ativos.length+' lances?\n\n'+lista))return;
    ativos.forEach(function(c){
        fetch(API+'/api/sniper/lance',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({compraId:compraId,itemNumero:c.itemNumero,valor:c.valorLance})});
    });
    toast('🎯 '+ativos.length+' lances enfileirados','sucesso');
}

// ==================== AGENDAR ====================
function agendar(compraId, itemNumero) {
    var cfg = (itensConfig[compraId]||[]).find(function(c){return c.itemNumero===itemNumero;});
    var valor = parseFloat((document.getElementById('vl-'+compraId+'-'+itemNumero)||{}).value);
    if(!valor||valor<=0){alert('Informe o valor');return;}
    var horario = prompt('Horário alvo (HH:MM:SS, Brasília):', cfg&&cfg.horarioAlvo||'16:00:00');
    if(!horario)return;
    var hoje = new Date().toISOString().split('T')[0];
    var horaLocal = new Date(hoje+'T'+horario+'-03:00');
    if(horaLocal<=new Date()){alert('Horário já passou');return;}
    fetch(API+'/api/sniper/agendar',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({compraId:compraId,itemNumero:itemNumero,valor:valor,horarioAlvo:horaLocal.toISOString(),antecedenciaMs:(cfg&&cfg.antecedenciaMs)||3000,tentativas:3,intervaloTentativasMs:500})
    }).then(function(r){return r.json();}).then(function(d){
        if(d.success) toast('⏰ #'+itemNumero+' agendado '+horario,'sucesso');
        else alert('Erro: '+d.error);
    });
    salvar(compraId,itemNumero,'horarioAlvo',horario);
}

function agendarTodos(compraId) {
    var config = itensConfig[compraId]||[];
    var ativos = config.filter(function(c){return c.ativo && c.valorLance>0;});
    if(!ativos.length){alert('Configure valor nos itens primeiro');return;}
    var horario = prompt('Horário alvo para todos (HH:MM:SS, Brasília):','16:00:00');
    if(!horario)return;
    var hoje = new Date().toISOString().split('T')[0];
    var horaLocal = new Date(hoje+'T'+horario+'-03:00');
    if(horaLocal<=new Date()){alert('Horário já passou');return;}
    ativos.forEach(function(c){
        fetch(API+'/api/sniper/agendar',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({compraId:compraId,itemNumero:c.itemNumero,valor:c.valorLance,horarioAlvo:horaLocal.toISOString(),antecedenciaMs:c.antecedenciaMs||3000,tentativas:3,intervaloTentativasMs:500})});
    });
    toast('⏰ '+ativos.length+' agendados '+horario,'sucesso');
}

// ==================== ADD ITEM ====================
function adicionarItemManual(compraId) {
    var num = prompt('Número do item:');
    if(!num) return;
    var desc = prompt('Descrição:','');
    fetch(API+'/api/sniper/itens',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({compraId:compraId,itemNumero:parseInt(num),descricao:desc,faseItem:'LA'})
    }).then(function(){carregarItensLic(compraId);});
}

// ==================== TOAST ====================
function toast(msg,tipo){var d=document.createElement('div');d.className='toast';d.style.background=tipo==='sucesso'?'#4caf50':tipo==='erro'?'#f44336':'#4dabf7';d.textContent=msg;document.getElementById('toastArea').appendChild(d);setTimeout(function(){d.remove();},4000);}

// ==================== INIT ====================
recarregarDados();
atualizarStatus();
setInterval(atualizarStatus,10000);
setInterval(function(){document.getElementById('hora').textContent=new Date().toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo'});},500);
// Refresh live data every 30s
setInterval(function(){carregarDisputasLive().then(function(){if(aberta)carregarItensLic(aberta);});},30000);
</script>
