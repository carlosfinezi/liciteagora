<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
<style>
  /* O grid (largura ajustável, corte das células, coluna do lápis) vem do
     /js/grid.js, igual às demais listagens. Aqui fica só o que é desta tela:
     o cabeçalho que ordena e a coluna-sobra do fim da linha. */
  .tbl-wrap th.sortable { cursor: pointer; user-select: none; }
  .tbl-wrap th.sortable:hover { background: var(--bg-2); }
  .tbl-wrap th .sort-arrow { opacity: 0.5; font-size: 10px; margin-left: 4px; }
  .tbl-wrap th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  .col-spacer { width: auto; padding: 0; }
</style>
</head>
<body>
<div class="layout">
<main class="main-content">

  <div class="page-header">
    <div>
      <h1 id="pgTitulo">Pedidos</h1>
      <small id="pgSubtitulo">Gestão de pedidos — manuais e originados de licitação</small>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="abrirModalImport()">Importar de licitação</button>
      <button class="btn btn-secondary" onclick="criarOrcamentoVazio()">+ Novo orçamento</button>
      <button class="btn btn-primary" onclick="criarPedidoVazio()">+ Novo pedido</button>
    </div>
  </div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="toolbar">
    <input type="text" id="filtBusca" placeholder="Buscar por número, cliente, compraId…" oninput="carregar()" style="flex:1;min-width:240px;">
    <select id="filtStatus" onchange="carregar()">
      <option value="">Todos status</option>
      <option value="rascunho">Rascunho</option>
      <option value="confirmado">Confirmado</option>
      <option value="em_separacao">Em separação</option>
      <option value="entregue">Entregue</option>
      <option value="faturado">Faturado</option>
      <option value="cancelado">Cancelado</option>
    </select>
    <select id="filtTipo" onchange="carregar()">
      <option value="">Todos tipos</option>
      <option value="manual">Manual</option>
      <option value="licitacao">Licitação</option>
    </select>
    <select id="filtModo" onchange="trocarModo(this.value)">
      <option value="">Pedidos e orçamentos</option>
      <option value="pedido">Apenas pedidos</option>
      <option value="orcamento">Apenas orçamentos</option>
    </select>
    <div style="position:relative;">
      <button class="btn btn-ghost btn-sm" onclick="toggleColunasMenu(event)"><svg class="ic-sm"><use href="#i-settings"/></svg> Colunas</button>
      <div id="colunasMenu" style="display:none;position:absolute;right:0;top:calc(100% + 4px);background:var(--bg-1);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:10px;z-index:50;min-width:200px;box-shadow:0 8px 20px rgba(0,0,0,0.4);"></div>
    </div>
    <span id="totalPedidos" style="font-size:0.85em; color:var(--text-3);"></span>
  </div>

  <!-- Ações em massa: só aparece com pedido selecionado, para não poluir a
       tela de quem está só consultando. -->
  <div class="toolbar" id="barraMassa" style="display:none; border-color:var(--accent);">
    <strong id="massaContagem" style="font-size:0.9em;"></strong>
    <select id="massaAcao" style="width:auto;">
      <option value="vendedor">Definir vendedor…</option>
      <option value="confirmar">Confirmar (reserva estoque)</option>
      <option value="cancelar">Cancelar…</option>
      <option value="excluir-rascunho">Excluir rascunhos</option>
    </select>
    <select id="massaVendedor" style="width:auto;display:none;"><option value="">— vendedor —</option></select>
    <button class="btn btn-primary btn-sm" onclick="aplicarAcaoMassa()">Aplicar</button>
    <button class="btn btn-ghost btn-sm" onclick="limparSelecao()">Limpar seleção</button>
  </div>

  <div class="tbl-wrap" data-grid="pedidos">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>

</main>
</div>

<div id="toasts"></div>

<!-- Modal Importar Licitação -->
<div class="modal-bg" id="modalImport">
  <div class="modal" style="max-width:960px;display:flex;flex-direction:column;gap:0;">
    <div class="modal-header">
      <div>
        <h3 style="margin:0;">Importar de licitação</h3>
        <small class="muted">Selecione uma participação para gerar o pedido com os itens da licitação.</small>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="fecharImport()" title="Fechar" style="font-size:1.2em;line-height:1;padding:4px 10px;">×</button>
    </div>

    <div style="position:relative;margin-bottom:14px;">
      <input type="text" id="impBusca" placeholder="Buscar por objeto, órgão ou número…"
             oninput="buscarPart()" autocomplete="off"
             style="padding-left:34px;">
      <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;">🔍</span>
    </div>

    <div id="impRes" style="flex:1;min-height:260px;max-height:56vh;overflow-y:auto;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-1);"></div>

    <div class="modal-actions"><button class="btn btn-ghost" onclick="fecharImport()">Fechar</button></div>
  </div>
</div>

<style>
  .imp-list { display:flex; flex-direction:column; }
  .imp-item {
    display:grid;
    grid-template-columns: 1fr auto;
    gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    align-items: start;
  }
  .imp-item:last-child { border-bottom: none; }
  .imp-item:hover { background: var(--bg-2); }
  .imp-item .imp-head { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:4px; }
  .imp-item .imp-num { font-family: var(--font-mono, ui-monospace, monospace); font-weight:600; color: var(--text-0); }
  .imp-item .imp-orgao { color: var(--text-1); font-size: 0.9em; }
  .imp-item .imp-obj { color: var(--text-2); font-size: 0.88em; line-height:1.4; margin-top:2px; }
  .imp-item .imp-meta { color: var(--text-3); font-size: 0.78em; margin-top:4px; display:flex; gap:10px; flex-wrap:wrap; }
  .imp-empty { text-align:center; padding:40px 20px; color:var(--text-3); }
  .imp-loading { text-align:center; padding:30px; color:var(--text-3); }
</style>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/grid.js"></script>
<script>
  const __modoUrl = new URLSearchParams(location.search).get('modo');
  initSidebar(__modoUrl === 'orcamento' ? 'orcamentos' : 'pedidos');
</script>
<script>
function showAlert(m,t='success'){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (t==='error'?'error':'success');
  el.innerHTML = `<span class="toast-close" onclick="this.parentElement.remove()">×</span>${m}`;
  box.appendChild(el);
  setTimeout(()=>el.remove(), t==='error'?8000:4000);
}
function fmt(v){ return (v==null||isNaN(v))?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function val(id){ const e=document.getElementById(id); return e?e.value:''; }
function esc(s){ return (s||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

async function carregarResumo(){
  try {
    const q = val('filtModo') ? '?modoDocumento=' + val('filtModo') : '';
    const r = await fetch('/api/pedidos/resumo' + q);
    const d = await r.json();
    if(!d.success) return;
    const k = d.resumo;
    document.getElementById('kpis').innerHTML = `
      <div class="kpi"><div class="label">Total</div><div class="value">${k.total}</div></div>
      <div class="kpi warn"><div class="label">Rascunhos</div><div class="value">${k.rascunho}</div></div>
      <div class="kpi success"><div class="label">Entregues</div><div class="value">${k.entregue}</div></div>
      <div class="kpi"><div class="label">Valor ativo</div><div class="value">R$ ${fmt(k.valorTotalAtivo)}</div></div>
      <div class="kpi danger"><div class="label">A receber</div><div class="value">R$ ${fmt(k.valorAReceber)}</div></div>`;
  } catch {}
}

// ==================== COLUNAS / ORDENAÇÃO ====================
const COLUNAS = [
  { key:'numero',         label:'Número',     default:true,  tipo:'txt' },
  { key:'modoDocumento',  label:'Modo',       default:true,  tipo:'badge' },
  { key:'tipo',           label:'Tipo',       default:true,  tipo:'badge' },
  { key:'tipoOperacaoCodigo', label:'Operação', default:false, tipo:'tipoOp' },
  { key:'clienteNome',    label:'Cliente',    default:true,  tipo:'txt' },
  { key:'dataPedido',     label:'Data',       default:true,  tipo:'date' },
  { key:'dataEntregaPrevista', label:'Entrega prev.', default:false, tipo:'date' },
  { key:'dataFaturamentoPrevista', label:'Fat. previsto', default:false, tipo:'date' },
  { key:'codigoPedidoCliente', label:'Cód. cliente', default:false, tipo:'txt' },
  { key:'valorTotal',     label:'Total',       default:true,  tipo:'money' },
  { key:'crValorPago',    label:'Pago',        default:false, tipo:'money' },
  { key:'status',         label:'Status',      default:true,  tipo:'badge' },
  { key:'statusRecebimento', label:'Recebimento', default:true, tipo:'badge' },
  { key:'faturaNumero',   label:'Fatura',      default:false, tipo:'txt' },
  { key:'meioPagamento',  label:'Meio pgto',   default:false, tipo:'txt' },
];

let cache = [];
let sortKey = 'dataPedido';
let sortDir = -1;
let colunasVisiveis = JSON.parse(localStorage.getItem('pedidos_colunas') || 'null')
  || COLUNAS.filter(c => c.default).map(c => c.key);

function salvarColunas(){ localStorage.setItem('pedidos_colunas', JSON.stringify(colunasVisiveis)); }

// O menu do botão "Colunas" fica escondido por style inline (não por classe),
// então alterna o próprio display em vez de usar .open como em produtos.html.
function toggleColunasMenu(ev){
  ev.stopPropagation();
  const m = document.getElementById('colunasMenu');
  const abrir = !m.style.display || m.style.display === 'none';
  m.style.display = abrir ? 'block' : 'none';
  if (!abrir) return;
  m.innerHTML = COLUNAS.map(c => `
    <label style="display:flex;align-items:center;gap:8px;padding:5px;cursor:pointer;font-size:0.88em;text-transform:none;">
      <input type="checkbox" ${colunasVisiveis.includes(c.key)?'checked':''} onchange="alternarColuna('${c.key}', this.checked)" style="width:auto;">
      <span>${c.label}</span>
    </label>`).join('');
}
// Clique fora fecha. O parentElement do menu é o wrapper que também tem o botão.
document.addEventListener('click', e => {
  const m = document.getElementById('colunasMenu');
  if (m && !m.parentElement.contains(e.target)) m.style.display = 'none';
});

function alternarColuna(key, on){
  if (on && !colunasVisiveis.includes(key)) colunasVisiveis.push(key);
  else if (!on) colunasVisiveis = colunasVisiveis.filter(k => k!==key);
  salvarColunas();
  render();
}

function sortBy(key){
  if (sortKey === key) sortDir = -sortDir;
  else { sortKey = key; sortDir = 1; }
  render();
}

async function carregar(){
  const p = new URLSearchParams();
  if (val('filtBusca')) p.set('busca', val('filtBusca'));
  if (val('filtStatus')) p.set('status', val('filtStatus'));
  if (val('filtTipo')) p.set('tipo', val('filtTipo'));
  if (val('filtModo')) p.set('modoDocumento', val('filtModo'));
  try {
    const r = await fetch('/api/pedidos?'+p);
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    cache = d.pedidos;
    render();
  } catch(e) { showAlert('Erro: '+e.message, 'error'); }
}

function trocarModo(modo){
  const u = new URL(location.href);
  if (modo) u.searchParams.set('modo', modo);
  else u.searchParams.delete('modo');
  history.replaceState(null, '', u);
  aplicarModoVisual();
  carregar();
  carregarResumo();
}

function aplicarModoVisual(){
  const modo = val('filtModo');
  const ehOrc = modo === 'orcamento';
  document.getElementById('pgTitulo').textContent = ehOrc ? 'Orçamentos'
    : modo === 'pedido' ? 'Pedidos' : 'Pedidos e orçamentos';
  document.getElementById('pgSubtitulo').textContent = ehOrc
    ? 'Propostas e cotações — sem baixa de estoque nem faturamento'
    : 'Gestão de pedidos — manuais e originados de licitação';
}

function renderCell(p, col){
  const v = p[col.key];
  if (v == null || v === '') return '<span class="muted">—</span>';
  if (col.tipo === 'money') return 'R$ ' + fmt(v);
  // Sem pílula na listagem: com Modo, Tipo, Status e Recebimento marcados ao
  // mesmo tempo, a linha virava um varal de badges e nenhum destacava nada.
  if (col.tipo === 'badge') return String(v).replace('_',' ');
  if (col.tipo === 'tipoOp') {
    // Texto, como as demais — mas o documento que NÃO emite NF-e continua
    // marcado: é a informação que muda a decisão de quem lê a lista.
    const interno = !p.tipoOperacaoEmiteNFe;
    const title = p.tipoOperacaoDescricao || '';
    return `<span title="${title}${interno?' (sem NF-e)':''}">${v}${interno?' 📄':''}</span>`;
  }
  if (col.tipo === 'date') return `<span class="muted">${v}</span>`;
  if (col.key === 'numero') return `<strong class="mono">${v}</strong>`;
  return String(v);
}

// ==================== SELEÇÃO / AÇÕES EM MASSA ====================
const SELECIONADOS = new Set();
let VENDEDORES_MASSA = null;

function alternarPedido(id, on){
  if (on) SELECIONADOS.add(id); else SELECIONADOS.delete(id);
  atualizarBarraMassa();
}

function marcarTodos(on){
  // Age sobre o que está na tela (filtro atual), nunca sobre a base inteira:
  // cancelar em massa o que não se vê é o tipo de acidente que não se desfaz.
  cache.forEach(p => on ? SELECIONADOS.add(p.id) : SELECIONADOS.delete(p.id));
  render();
}

function limparSelecao(){ SELECIONADOS.clear(); render(); }

function atualizarBarraMassa(){
  const barra = document.getElementById('barraMassa');
  if (!barra) return;
  barra.style.display = SELECIONADOS.size ? '' : 'none';
  const c = document.getElementById('massaContagem');
  if (c) c.textContent = `${SELECIONADOS.size} selecionado(s)`;
  const todos = document.getElementById('selTodos');
  if (todos) todos.checked = cache.length > 0 && cache.every(p => SELECIONADOS.has(p.id));
}

// O seletor de vendedor só aparece na ação que o usa
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'massaAcao') {
    const ehVend = e.target.value === 'vendedor';
    const sel = document.getElementById('massaVendedor');
    sel.style.display = ehVend ? '' : 'none';
    if (ehVend && !VENDEDORES_MASSA) carregarVendedoresMassa();
  }
});

async function carregarVendedoresMassa(){
  try {
    const d = await fetch('/api/usuarios?vendedor=1').then(r => r.json());
    VENDEDORES_MASSA = d.usuarios || [];
    document.getElementById('massaVendedor').innerHTML = '<option value="">— vendedor —</option>' +
      VENDEDORES_MASSA.map(u => `<option value="${u.id}">${u.nome || u.username}</option>`).join('');
  } catch { VENDEDORES_MASSA = []; }
}

async function aplicarAcaoMassa(){
  if (!SELECIONADOS.size) return;
  const acao = document.getElementById('massaAcao').value;
  const body = { ids: [...SELECIONADOS], acao };
  const rotulo = document.getElementById('massaAcao').selectedOptions[0].textContent;

  if (acao === 'vendedor') {
    body.vendedorId = document.getElementById('massaVendedor').value;
    if (!body.vendedorId) return showAlert('Escolha o vendedor', 'error');
  }
  if (acao === 'cancelar') {
    // Motivo é obrigatório no backend — perguntar aqui evita o lote inteiro voltar em erro.
    const motivo = prompt(`Motivo do cancelamento de ${SELECIONADOS.size} pedido(s):`);
    if (!motivo || !motivo.trim()) return;
    body.motivo = motivo.trim();
  }
  const aviso = acao === 'excluir-rascunho' ? '\n\nApaga em definitivo. Não há como desfazer.'
    : acao === 'confirmar' ? '\n\nCria reserva de estoque para cada item.' : '';
  if (!confirm(`${rotulo}\n\nAplicar a ${SELECIONADOS.size} pedido(s)?${aviso}`)) return;

  try {
    const d = await fetch('/api/pedidos/acao-massa', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
    }).then(r => r.json());
    if (!d.success) return showAlert(d.error, 'error');
    SELECIONADOS.clear();
    await carregar();
    carregarResumo();
    // Falha individual não some: sem isto o usuário veria "8 de 10" e nunca
    // saberia quais dois ficaram para trás nem por quê.
    if (d.falhas && d.falhas.length) {
      const lista = d.falhas.slice(0, 10).map(f => `• ${f.numero || '#'+f.id}: ${f.erro}`).join('\n');
      const resto = d.falhas.length > 10 ? `\n… e mais ${d.falhas.length - 10}` : '';
      alert(`${d.aplicados} de ${d.total} aplicado(s).\n\nNão foi possível em ${d.falhas.length}:\n${lista}${resto}`);
    } else {
      showAlert(`${d.aplicados} de ${d.total} aplicado(s).`);
    }
  } catch (e) { showAlert('Erro: ' + e.message, 'error'); }
}

function render(){
  const tb = document.getElementById('tb');
  const th = document.getElementById('thead');
  const cols = COLUNAS.filter(c => colunasVisiveis.includes(c.key));

  const total = document.getElementById('totalPedidos');
  if (total) total.textContent = cache.length ? `${cache.length} registro${cache.length !== 1 ? 's' : ''}` : '';

  // Header: ordena no clique, arrasta na divisória da direita
  const arrow = (key) => key === sortKey ? (sortDir > 0 ? '▲' : '▼') : '↕';
  th.innerHTML = '<th class="col-sel"><input type="checkbox" id="selTodos" onchange="marcarTodos(this.checked)" style="width:auto;" title="Marcar os que estão na tela"></th>'
    + '<th class="col-editar"></th>' + cols.map(c => `
    <th class="sortable ${c.key === sortKey ? 'sorted' : ''}" data-key="${c.key}">
      ${c.label} <span class="sort-arrow">${arrow(c.key)}</span>
    </th>`).join('') + '<th class="col-spacer"></th>';

  th.querySelectorAll('th.sortable').forEach(el => {
    el.addEventListener('click', (e) => {
      // Arrastar a divisória não pode ordenar junto.
      if (e.target.classList.contains('grid-resizer')) return;
      sortBy(el.dataset.key);
    });
  });

  if (!cache.length) {
    tb.innerHTML = `<tr><td colspan="${cols.length+3}" style="text-align:center;color:var(--text-3);padding:40px;">Nenhum pedido</td></tr>`;
    atualizarBarraMassa();
    return;
  }

  const dados = [...cache].sort((a,b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (va == null) va = '';
    if (vb == null) vb = '';
    if (typeof va === 'number' || typeof vb === 'number') return (Number(va)-Number(vb)) * sortDir;
    return String(va).localeCompare(String(vb), 'pt-BR', { numeric:true }) * sortDir;
  });

  tb.innerHTML = dados.map(p => {
    const sel = `<td class="col-sel" onclick="event.stopPropagation();"><input type="checkbox" class="selPedido"
      ${SELECIONADOS.has(p.id) ? 'checked' : ''} onchange="alternarPedido(${p.id}, this.checked)" style="width:auto;"></td>`;
    const editar = `<td class="col-editar"><button class="btn btn-ghost btn-sm btn-icon-only" title="Abrir pedido"
      onclick="event.stopPropagation(); abrirPedido(${p.id})"><svg class="ic-sm"><use href="#i-edit"/></svg></button></td>`;
    const tds = cols.map(c => `<td>${renderCell(p, c)}</td>`).join('');
    return `<tr style="cursor:pointer;" onclick="abrirPedido(${p.id})">${sel}${editar}${tds}<td class="col-spacer"></td></tr>`;
  }).join('');
  atualizarBarraMassa();
}

function abrirPedido(id){ location.href = '/comercial/pedido.html?id=' + id; }

// ==================== NOVO PEDIDO / ORÇAMENTO ====================
async function criarPedidoVazio(){ return criarVazio('pedido'); }
async function criarOrcamentoVazio(){ return criarVazio('orcamento'); }

async function criarVazio(modoDocumento){
  try {
    const r = await fetch('/api/pedidos', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ modoDocumento })
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    location.href = '/comercial/pedido.html?id=' + d.pedido.id + '&aba=cliente';
  } catch(e) { showAlert('Erro: '+e.message, 'error'); }
}

// ==================== IMPORT PARTICIPAÇÃO ====================
function abrirModalImport(){
  document.getElementById('modalImport').classList.add('open');
  document.getElementById('impBusca').value = '';
  setTimeout(() => document.getElementById('impBusca').focus(), 50);
  buscarPart();
}
function fecharImport(){ document.getElementById('modalImport').classList.remove('open'); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modalImport').classList.contains('open')) fecharImport();
});
document.getElementById('modalImport').addEventListener('click', e => {
  if (e.target.id === 'modalImport') fecharImport();
});

let buscarPartTimer = null;
function buscarPart(){
  clearTimeout(buscarPartTimer);
  document.getElementById('impRes').innerHTML = '<div class="imp-loading">Buscando…</div>';
  buscarPartTimer = setTimeout(buscarPartAgora, 220);
}

async function buscarPartAgora(){
  const q = val('impBusca');
  try {
    const r = await fetch('/api/pedidos/lookup/participacoes?'+(q?'q='+encodeURIComponent(q):''));
    const d = await r.json();
    if (!d.success) throw new Error(d.error || 'Erro ao buscar');
    const box = document.getElementById('impRes');
    if (!d.participacoes.length) {
      box.innerHTML = `<div class="imp-empty">
        <div style="font-size:2em;margin-bottom:8px;">🔎</div>
        <div><strong>Nenhuma participação encontrada</strong></div>
        <small class="muted">${q ? 'Tente outro termo de busca.' : 'Nenhuma participação disponível para importação.'}</small>
      </div>`;
      return;
    }
    box.innerHTML = `<div class="imp-list">` + d.participacoes.map(p => {
      const objeto = (p.objeto || '').trim();
      const objetoCurto = objeto.length > 200 ? objeto.slice(0, 200) + '…' : objeto;
      return `<div class="imp-item">
        <div>
          <div class="imp-head">
            <span class="imp-num">${p.numero || '—'}</span>
            ${p.situacao ? `<span class="badge">${p.situacao}</span>` : ''}
            ${p.orgao ? `<span class="imp-orgao">${p.orgao}</span>` : ''}
          </div>
          ${objetoCurto ? `<div class="imp-obj">${objetoCurto}</div>` : ''}
          ${p.dataSessao ? `<div class="imp-meta"><span>📅 ${p.dataSessao}</span></div>` : ''}
        </div>
        <div>
          <button class="btn btn-primary btn-sm" onclick="importarPart(${p.id}, this)">Importar →</button>
        </div>
      </div>`;
    }).join('') + `</div>`;
  } catch(e) {
    document.getElementById('impRes').innerHTML = `<div class="imp-empty">
      <div style="color:var(--danger);"><strong>Erro:</strong> ${e.message}</div>
    </div>`;
  }
}

async function importarPart(pid, btn){
  if (btn) { btn.disabled = true; btn.textContent = 'Importando…'; }
  try {
    const body = {};
    const modo = val('filtModo');
    if (modo === 'orcamento' || modo === 'pedido') body.modoDocumento = modo;
    const r = await fetch('/api/pedidos/importar-participacao/'+pid, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    location.href = '/comercial/pedido.html?id=' + d.pedido.id;
  } catch(e) {
    showAlert('Erro: '+e.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Importar →'; }
  }
}

(function bootModo(){
  const m = new URLSearchParams(location.search).get('modo');
  if (m === 'pedido' || m === 'orcamento') document.getElementById('filtModo').value = m;
  aplicarModoVisual();
})();
carregar();
carregarResumo();
</script>
</body>
</html>
