<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contratos · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Contratos</h1>
      <small>Vigência, renovação e reajuste — receita recorrente</small>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="abrirNovo()">+ Novo contrato</button>
    </div>
  </div>

  <div id="alertGlobal"></div>
  <div class="kpi-grid" id="kpis"></div>

  <div class="toolbar">
    <input type="text" id="fQ" placeholder="Buscar número, descrição ou cliente…" oninput="debounce(carregar)" style="flex:1;min-width:240px;">
    <select id="fStatus" onchange="carregar()">
      <option value="">Todos status</option>
      <option value="ativo">Ativo</option>
      <option value="suspenso">Suspenso</option>
      <option value="encerrado">Encerrado</option>
    </select>
  </div>

  <div class="tbl-wrap">
    <table>
      <thead><tr>
        <th>Número</th>
        <th>Cliente</th>
        <th>Descrição</th>
        <th class="num">Valor mensal</th>
        <th>Vigência</th>
        <th>Status</th>
        <th></th>
      </tr></thead>
      <tbody id="tb"><tr><td colspan="7" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main></div>

<!-- Modal Novo -->
<div class="modal-bg" id="modal">
  <div class="modal" style="max-width:600px;">
    <div class="modal-header">
      <div>
        <h3 style="margin:0;">Novo contrato</h3>
        <small class="muted">Vigência, valor mensal e índices de reajuste</small>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="fecharModal()" title="Fechar" style="font-size:1.2em;line-height:1;padding:4px 10px;">×</button>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1;position:relative;">
        <label>Cliente *</label>
        <input type="text" id="fCliBusca" placeholder="Razão social…" oninput="acCli()" autocomplete="off">
        <input type="hidden" id="fClienteId">
        <div id="acCliList" class="ac-list"></div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Descrição *</label>
        <input type="text" id="fDesc" placeholder="Ex.: Locação mensal de equipamentos">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Valor mensal (R$) *</label>
        <input type="number" id="fValor" step="0.01" min="0">
      </div>
      <div class="form-group">
        <label>Dia de vencimento</label>
        <input type="number" id="fDia" min="1" max="28" value="10">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Início *</label>
        <input type="date" id="fIni">
      </div>
      <div class="form-group">
        <label>Fim (opcional, indeterminado se vazio)</label>
        <input type="date" id="fFim">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Renovação automática</label>
        <select id="fRenov">
          <option value="1">Sim</option>
          <option value="0">Não</option>
        </select>
      </div>
      <div class="form-group">
        <label>Prazo de renovação (meses)</label>
        <input type="number" id="fRenovMeses" value="12" min="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Índice de reajuste</label>
        <select id="fIndice">
          <option value="">—</option>
          <option>IPCA</option>
          <option>IGPM</option>
          <option>INPC</option>
          <option>IGPDI</option>
          <option>Fixo</option>
        </select>
      </div>
      <div class="form-group">
        <label>% reajuste</label>
        <input type="number" id="fPercReajuste" step="0.01" placeholder="ex.: 5">
      </div>
      <div class="form-group">
        <label>Próximo reajuste</label>
        <input type="date" id="fDataReajuste">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group full-width">
        <label>Observações</label>
        <textarea id="fObs" rows="2"></textarea>
      </div>
    </div>

    <!-- Integração (1) 2026-04-22: criar recorrência NFSe junto -->
    <div class="form-row" style="border-top:1px solid #2a3a5c;padding-top:12px;margin-top:8px;">
      <div class="form-group full-width">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="fCriarRec" onchange="toggleRecFields()">
          <span><strong>Gerar NFSe recorrente automaticamente</strong>
                <small class="muted" style="display:block;margin-top:2px;">Cria uma recorrência mensal já vinculada a este contrato. Valor e vencimento acompanham o contrato.</small></span>
        </label>
      </div>
    </div>
    <div id="recFields" style="display:none;">
      <div class="form-row">
        <div class="form-group">
          <label>Cód. Tributação Nacional *</label>
          <input type="text" id="fRecCodTrib" placeholder="ex.: 01.01.01">
        </div>
        <div class="form-group">
          <label>Alíquota ISS (%)</label>
          <input type="number" id="fRecAliquota" step="0.01" placeholder="ex.: 2.00">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Gerar boleto MP</label>
          <select id="fRecBoleto"><option value="0">Não</option><option value="1">Sim</option></select>
        </div>
        <div class="form-group">
          <label>Enviar email</label>
          <select id="fRecEmail"><option value="0">Não</option><option value="1">Sim</option></select>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Criar contrato</button>
    </div>
  </div>
</div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('contratos');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
let debTimer; function debounce(fn){ clearTimeout(debTimer); debTimer=setTimeout(fn,300); }
function fmtBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }

async function carregar(){
  const p = new URLSearchParams();
  const q = document.getElementById('fQ').value.trim(); if (q) p.set('q', q);
  const s = document.getElementById('fStatus').value;   if (s) p.set('status', s);
  const r = await fetch('/api/contratos?'+p);
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Total</div><div class="value">${d.kpis.total||0}</div></div>
    <div class="kpi success"><div class="label">Ativos</div><div class="value">${d.kpis.ativos||0}</div></div>
    <div class="kpi"><div class="label">MRR (Receita Recorrente)</div><div class="value">${fmtBRL(d.kpis.receitaMensalRecorrente)}</div></div>
    <div class="kpi warn"><div class="label">Vencendo em 30d</div><div class="value">${d.kpis.vencendo30d||0}</div></div>
  `;
  const tb = document.getElementById('tb');
  tb.innerHTML = d.contratos.length ? d.contratos.map(c=>`<tr>
    <td class="mono"><strong>${c.numero}</strong></td>
    <td>${c.clienteNome}</td>
    <td>${c.descricao}</td>
    <td class="num">${fmtBRL(c.valorMensal)}</td>
    <td>${c.dataInicio} → ${c.dataFim||'—'}</td>
    <td><span class="badge ${c.status==='ativo'?'ativo':c.status==='suspenso'?'pendente':'inativo'}">${c.status}</span></td>
    <td style="text-align:right;"><a class="btn btn-ghost btn-sm" href="/comercial/contrato.html?id=${c.id}" style="text-decoration:none;">Abrir →</a></td>
  </tr>`).join('') : '<tr><td colspan="7" class="empty">Nenhum contrato</td></tr>';
}

function abrirNovo(){
  ['fCliBusca','fClienteId','fDesc','fValor','fIni','fFim','fPercReajuste','fDataReajuste','fObs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fDia').value='10';
  document.getElementById('fRenov').value='1';
  document.getElementById('fRenovMeses').value='12';
  document.getElementById('fIndice').value='';
  document.getElementById('modal').classList.add('open');
}
function fecharModal(){ document.getElementById('modal').classList.remove('open'); }

let acTimer;
function acCli(){
  clearTimeout(acTimer);
  const q = document.getElementById('fCliBusca').value.trim();
  if (q.length<2){ document.getElementById('acCliList').innerHTML=''; return; }
  acTimer = setTimeout(async()=>{
    const r=await fetch('/api/pessoas?q='+encodeURIComponent(q));
    const d=await r.json();
    const lista = d.pessoas || d.data || [];
    document.getElementById('acCliList').innerHTML = lista.slice(0,10).map(p=>
      `<div onclick='selCli(${p.id}, ${JSON.stringify(p.razaoSocial)})'>${p.razaoSocial} <small class="muted">${p.cpfCnpj||''}</small></div>`
    ).join('');
  },200);
}
function selCli(id, nome){
  document.getElementById('fClienteId').value=id;
  document.getElementById('fCliBusca').value=nome;
  document.getElementById('acCliList').innerHTML='';
}

function toggleRecFields(){
  const on = document.getElementById('fCriarRec').checked;
  document.getElementById('recFields').style.display = on ? '' : 'none';
}

async function salvar(){
  const body = {
    clienteId: Number(document.getElementById('fClienteId').value),
    descricao: document.getElementById('fDesc').value.trim(),
    valorMensal: Number(document.getElementById('fValor').value),
    diaVencimento: Number(document.getElementById('fDia').value)||10,
    dataInicio: document.getElementById('fIni').value,
    dataFim: document.getElementById('fFim').value||null,
    renovacaoAutomatica: Number(document.getElementById('fRenov').value),
    prazoRenovacaoMeses: Number(document.getElementById('fRenovMeses').value)||12,
    indiceReajuste: document.getElementById('fIndice').value || null,
    percentualReajuste: document.getElementById('fPercReajuste').value ? Number(document.getElementById('fPercReajuste').value) : null,
    dataProximoReajuste: document.getElementById('fDataReajuste').value || null,
    observacoes: document.getElementById('fObs').value || null
  };
  if (!body.clienteId || !body.descricao || !body.valorMensal || !body.dataInicio) {
    return showAlert('Preencha cliente, descrição, valor e início','error');
  }
  // Integração (1): flag para criar recorrência junto
  if (document.getElementById('fCriarRec').checked) {
    const cod = document.getElementById('fRecCodTrib').value.trim();
    if (!cod) return showAlert('Código de Tributação Nacional é obrigatório para gerar recorrência','error');
    body.criarRecorrencia = true;
    body.recorrencia = {
      codigoTributacaoNacional: cod,
      aliquota: document.getElementById('fRecAliquota').value ? Number(document.getElementById('fRecAliquota').value) : null,
      gerarBoleto: Number(document.getElementById('fRecBoleto').value) === 1,
      enviarEmail: Number(document.getElementById('fRecEmail').value) === 1,
    };
  }
  const r = await fetch('/api/contratos', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  showAlert(body.criarRecorrencia ? 'Contrato criado e recorrência vinculada' : 'Contrato criado');
  fecharModal();
  carregar();
}

carregar();
</script>
</body></html>
