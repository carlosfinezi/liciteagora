<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas de Vendas · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div><h1>Metas de Vendas</h1>
    <small>Meta por vendedor × mês; realizado = pedidos do vendedor no mês (fora rascunho/cancelado)</small></div>
  </div>
  <div id="alertGlobal"></div>
  <div class="toolbar">
    <input type="month" id="comp" onchange="carregar()">
    <select id="mVend" style="min-width:200px;"></select>
    <input type="number" id="mValor" placeholder="Meta (R$)" step="0.01" style="width:140px;">
    <button class="btn btn-primary btn-sm" onclick="salvarMeta()">Definir meta</button>
  </div>
  <div class="tbl-wrap"><table>
    <thead><tr><th>Vendedor</th><th style="text-align:right;">Meta</th>
      <th style="text-align:right;">Realizado</th><th style="text-align:right;">Atingimento</th><th style="width:220px;"></th></tr></thead>
    <tbody id="tb"><tr><td colspan="5" class="empty">Carregando…</td></tr></tbody>
  </table></div>
</main></div>
<div id="toasts"></div>
<script src="/js/menu-config.js"></script><script src="/js/sidebar.js"></script>
<script>initSidebar('comercial-metas');</script>
<script>
function showAlert(m,t='success'){const e=document.getElementById('alertGlobal');e.className='alert '+t;e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',5000);}
function fmt(v){return (v==null||isNaN(v))?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
async function carregar(){
  const comp=document.getElementById('comp').value;
  const r=await fetch('/api/metas/atingimento?competencia='+comp);const d=await r.json();
  if(!d.success)return showAlert(d.error,'error');
  document.getElementById('tb').innerHTML=d.linhas.length?d.linhas.map(l=>{
    const pct=l.atingimento;
    const cor=pct==null?'var(--text-3)':(pct>=100?'var(--success)':(pct>=70?'var(--warn,orange)':'var(--danger)'));
    const barra=pct!=null?`<div style="background:var(--border);border-radius:6px;height:10px;overflow:hidden;">
      <div style="width:${Math.min(pct,100)}%;height:100%;background:${cor};"></div></div>`:'';
    return `<tr><td>${l.vendedor}</td>
      <td style="text-align:right;">${fmt(l.meta)}</td>
      <td style="text-align:right;"><strong>${fmt(l.realizado)}</strong></td>
      <td style="text-align:right;color:${cor};font-weight:700;">${pct!=null?pct+'%':'sem meta'}</td>
      <td>${barra}</td></tr>`;
  }).join(''):'<tr><td colspan="5" class="empty">Sem metas nem vendas na competência</td></tr>';
}
async function salvarMeta(){
  const body={vendedorUserId:Number(document.getElementById('mVend').value),
    competencia:document.getElementById('comp').value,
    valorMeta:Number(document.getElementById('mValor').value)};
  if(!body.vendedorUserId)return showAlert('Selecione o vendedor','error');
  const r=await fetch('/api/metas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();if(!d.success)return showAlert(d.error,'error');
  showAlert('Meta salva');carregar();
}
(async()=>{
  document.getElementById('comp').value=new Date().toISOString().slice(0,7);
  const r=await fetch('/api/usuarios').catch(()=>null);
  let users=[];
  if(r){const d=await r.json().catch(()=>({}));users=d.usuarios||d.users||[];}
  document.getElementById('mVend').innerHTML='<option value="">— vendedor —</option>'+
    users.map(u=>`<option value="${u.id}">${u.nome||u.username}</option>`).join('');
  carregar();
})();
</script>
</body></html>
