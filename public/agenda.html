<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - PNCP</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 220px;
            background: #16213e;
            padding: 20px 0;
            border-right: 1px solid #0f3460;
        }
        .sidebar h2 {
            color: #4dabf7;
            padding: 0 20px 20px;
            border-bottom: 1px solid #0f3460;
            margin-bottom: 10px;
        }
        .sidebar a {
            display: block;
            color: #adb5bd;
            text-decoration: none;
            padding: 12px 20px;
            transition: all 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            background: #0f3460;
            color: #4dabf7;
            border-left: 3px solid #4dabf7;
        }
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        h1 { color: #4dabf7; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .calendar-nav button {
            background: #0f3460;
            color: #4dabf7;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1em;
        }
        .calendar-nav button:hover { background: #4dabf7; color: #000; }
        .calendar-nav .current-month {
            font-size: 1.3em;
            font-weight: 600;
            min-width: 200px;
            text-align: center;
        }
        .btn-hoje {
            background: #4dabf7 !important;
            color: #000 !important;
        }

        .calendar {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
        }
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: #0f3460;
        }
        .calendar-weekdays div {
            padding: 15px;
            text-align: center;
            font-weight: 600;
            color: #4dabf7;
        }
        .calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }
        .calendar-day {
            min-height: 120px;
            border: 1px solid #0f3460;
            padding: 8px;
            position: relative;
        }
        .calendar-day.other-month { background: #12192a; }
        .calendar-day.today { border: 2px solid #4dabf7; }
        .day-number {
            font-weight: 600;
            margin-bottom: 5px;
            color: #888;
        }
        .calendar-day.today .day-number { color: #4dabf7; }
        .calendar-day.other-month .day-number { color: #555; }

        .day-events {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 90px;
            overflow-y: auto;
        }
        .day-event {
            background: #4dabf7;
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .day-event:hover { background: #74c0fc; }
        .day-event.status-analise { background: #ffd43b; color: #000; }
        .day-event.status-proposta { background: #4dabf7; color: #000; }
        .day-event.status-enviada { background: #51cf66; color: #000; }
        .day-event.status-vencida { background: #868e96; color: #fff; }

        .event-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .event-modal.show { display: flex; }
        .event-modal-content {
            background: #16213e;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .event-modal h3 {
            color: #4dabf7;
            margin-bottom: 20px;
        }
        .event-detail {
            margin-bottom: 15px;
        }
        .event-detail label {
            color: #888;
            font-size: 0.9em;
            display: block;
            margin-bottom: 5px;
        }
        .event-detail span {
            color: #fff;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .modal-actions button {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-fechar { background: #495057; color: #fff; }
        .btn-abrir { background: #ff9800; color: #000; }
        .btn-kanban { background: #4dabf7; color: #000; }

        .legenda {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .legenda-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
        }
        .legenda-cor {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .loading { text-align: center; padding: 60px; color: #888; }
    
        .sidebar {
            width: 220px;
            background: #16213e;
            padding: 0;
            border-right: 1px solid #0f3460;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #0f3460;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4dabf7;
            text-decoration: none;
            font-size: 1.3em;
            font-weight: 700;
        }
        .sidebar-menu {
            padding: 15px 0;
            flex: 1;
        }
        .menu-section {
            color: #666;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 20px 5px;
            margin-top: 10px;
        }
        .menu-section:first-child {
            margin-top: 0;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #adb5bd;
            text-decoration: none;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        .menu-item:hover {
            background: #0f3460;
            color: #4dabf7;
        }
        .menu-item.active {
            background: #0f3460;
            color: #4dabf7;
            border-left-color: #4dabf7;
        }
        .menu-item .icon {
            font-size: 1.1em;
        }
        </style>
</head>
<body>
    <div class="layout">
        

        <main class="main-content">
            <h1>Agenda de Licitações</h1>
            <p class="subtitle">Visualize as datas de encerramento das propostas dos seus interesses</p>

            <div class="calendar-header">
                <div class="calendar-nav">
                    <button onclick="mesAnterior()">◀</button>
                    <span class="current-month" id="currentMonth">Dezembro 2025</span>
                    <button onclick="proximoMes()">▶</button>
                    <button class="btn-hoje" onclick="irParaHoje()">Hoje</button>
                </div>
            </div>

            <div class="calendar">
                <div class="calendar-weekdays">
                    <div>Dom</div>
                    <div>Seg</div>
                    <div>Ter</div>
                    <div>Qua</div>
                    <div>Qui</div>
                    <div>Sex</div>
                    <div>Sáb</div>
                </div>
                <div class="calendar-days" id="calendarDays">
                    <!-- Dias serão gerados via JS -->
                </div>
            </div>

            <div class="legenda">
                <div class="legenda-item">
                    <div class="legenda-cor" style="background: #ffd43b;"></div>
                    <span>Em análise</span>
                </div>
                <div class="legenda-item">
                    <div class="legenda-cor" style="background: #4dabf7;"></div>
                    <span>Preparando proposta</span>
                </div>
                <div class="legenda-item">
                    <div class="legenda-cor" style="background: #51cf66;"></div>
                    <span>Proposta enviada</span>
                </div>
                <div class="legenda-item">
                    <div class="legenda-cor" style="background: #868e96;"></div>
                    <span>Encerrada</span>
                </div>
            </div>
        </main>
    </div>

    <div class="event-modal" id="eventModal">
        <div class="event-modal-content">
            <h3 id="modalTitle">Detalhes da Licitação</h3>
            <div class="event-detail">
                <label>Objeto</label>
                <span id="modalObjeto"></span>
            </div>
            <div class="event-detail">
                <label>Órgão</label>
                <span id="modalOrgao"></span>
            </div>
            <div class="event-detail">
                <label>Modalidade</label>
                <span id="modalModalidade"></span>
            </div>
            <div class="event-detail">
                <label>Encerramento</label>
                <span id="modalData"></span>
            </div>
            <div class="event-detail">
                <label>Itens de Interesse</label>
                <span id="modalItens"></span>
            </div>
            <div class="event-detail">
                <label>Status</label>
                <span id="modalStatus"></span>
            </div>
            <div class="modal-actions">
                <button class="btn-fechar" onclick="fecharModal()">Fechar</button>
                <button class="btn-kanban" onclick="abrirKanban()">Ver no Kanban</button>
                <button class="btn-abrir" id="btnAbrirSistema" onclick="abrirSistema()">Abrir no Sistema</button>
            </div>
        </div>
    </div>

    <script src="agenda.js"></script>
    <script src="/js/menu-config.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>initSidebar('agenda');</script>
</body>
</html>
