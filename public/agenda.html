<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - Licite Agora</title>
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/app-modern.css">
    <style>
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-nav { display: flex; gap: 10px; align-items: center; }
        .calendar-nav button { background: var(--bg-1); color: var(--accent); border: none; padding: 10px 20px; border-radius: var(--r-sm); cursor: pointer; font-size: 1.1em; }
        .calendar-nav button:hover { background: var(--accent); color: #000; }
        .calendar-nav .current-month { font-size: 1.3em; font-weight: 600; min-width: 200px; text-align: center; }
        .btn-hoje { background: var(--accent) !important; color: #000 !important; }

        .calendar { background: var(--bg-2); border-radius: var(--r-lg); overflow: hidden; }
        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--bg-1); }
        .calendar-weekdays div { padding: 15px; text-align: center; font-weight: 600; color: var(--accent); }
        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); }
        .calendar-day { min-height: 120px; border: 1px solid var(--border); padding: 8px; position: relative; }
        .calendar-day.other-month { background: #12192a; }
        .calendar-day.today { border: 2px solid var(--accent); }
        .day-number { font-weight: 600; margin-bottom: 5px; color: var(--text-3); }
        .calendar-day.today .day-number { color: var(--accent); }
        .calendar-day.other-month .day-number { color: var(--text-3); }

        .day-events { display: flex; flex-direction: column; gap: 4px; max-height: 90px; overflow-y: auto; }
        .day-event { background: var(--accent); color: #000; padding: 4px 8px; border-radius: 4px; font-size: 0.75em; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .day-event:hover { background: #74c0fc; }
        .day-event.status-analise { background: var(--warn); color: #000; }
        .day-event.status-proposta { background: var(--accent); color: #000; }
        .day-event.status-enviada { background: var(--success); color: #000; }
        .day-event.status-vencida { background: #868e96; color: var(--text-0); }

        .event-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .event-modal.show { display: flex; }
        .event-modal-content { background: var(--bg-2); border-radius: var(--r-lg); padding: 30px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .event-modal h3 { color: var(--accent); margin-bottom: 20px; }
        .event-detail { margin-bottom: 15px; }
        .event-detail label { color: var(--text-3); font-size: 0.9em; display: block; margin-bottom: 5px; }
        .event-detail span { color: var(--text-0); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .modal-actions button { padding: 10px 20px; border-radius: var(--r-sm); border: none; cursor: pointer; font-weight: 600; }
        .btn-fechar { background: #495057; color: var(--text-0); }
        .btn-abrir { background: var(--warn); color: #000; }
        .btn-kanban { background: var(--accent); color: #000; }

        .legenda { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .legenda-item { display: flex; align-items: center; gap: 8px; font-size: 0.9em; }
        .legenda-cor { width: 16px; height: 16px; border-radius: 4px; }

        .loading { text-align: center; padding: 60px; color: var(--text-3); }
        </style>
</head>
<body>
    <div class="layout">
        

        <main class="main-content">
            <h1>Agenda de Licitações</h1>
            <p class="subtitle">Visualize as datas de encerramento das propostas dos seus interesses</p>

            <div class="calendar-header">
                <div class="calendar-nav">
                    <button onclick="mesAnterior()">◀</button>
                    <span class="current-month" id="currentMonth">Dezembro 2025</span>
                    <button onclick="proximoMes()">▶</button>
                    <button class="btn-hoje" onclick="irParaHoje()">Hoje</button>
                </div>
            </div>

            <div class="calendar">
                <div class="calendar-weekdays">
                    <div>Dom</div>
                    <div>Seg</div>
                    <div>Ter</div>
                    <div>Qua</div>
                    <div>Qui</div>
                    <div>Sex</div>
                    <div>Sáb</div>
                </div>
                <div class="calendar-days" id="calendarDays">
                    <!-- Dias serão gerados via JS -->
                </div>
            </div>

            <div class="legenda">
                <div class="legenda-item">
                    <div class="legenda-cor" style="background: #ffd43b;"></div>
                    <span>Em análise</span>
                </div>
                <div class="legenda-item">
                    <div class="legenda-cor" style="background: #4dabf7;"></div>
                    <span>Preparando proposta</span>
                </div>
                <div class="legenda-item">
                    <div class="legenda-cor" style="background: #51cf66;"></div>
                    <span>Proposta enviada</span>
                </div>
                <div class="legenda-item">
                    <div class="legenda-cor" style="background: #868e96;"></div>
                    <span>Encerrada</span>
                </div>
            </div>
        </main>
    </div>

    <div class="event-modal" id="eventModal">
        <div class="event-modal-content">
            <h3 id="modalTitle">Detalhes da Licitação</h3>
            <div class="event-detail">
                <label>Objeto</label>
                <span id="modalObjeto"></span>
            </div>
            <div class="event-detail">
                <label>Órgão</label>
                <span id="modalOrgao"></span>
            </div>
            <div class="event-detail">
                <label>Modalidade</label>
                <span id="modalModalidade"></span>
            </div>
            <div class="event-detail">
                <label>Encerramento</label>
                <span id="modalData"></span>
            </div>
            <div class="event-detail">
                <label>Itens de Interesse</label>
                <span id="modalItens"></span>
            </div>
            <div class="event-detail">
                <label>Status</label>
                <span id="modalStatus"></span>
            </div>
            <div class="modal-actions">
                <button class="btn-fechar" onclick="fecharModal()">Fechar</button>
                <button class="btn-kanban" onclick="abrirKanban()">Ver no Kanban</button>
                <button class="btn-abrir" id="btnAbrirSistema" onclick="abrirSistema()">Abrir no Sistema</button>
            </div>
        </div>
    </div>

    <script src="agenda.js"></script>
    <script src="/js/menu-config.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>initSidebar('agenda');</script>
</body>
</html>
