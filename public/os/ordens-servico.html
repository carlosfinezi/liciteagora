<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordens de Serviço · Licite Agora</title>
<script src="/js/theme-boot.js"></script>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
<script src="/js/os-rotulos.js"></script>
<style>
  /* page-local: são 9 KPIs. No tamanho global eles ocupavam duas faixas e
     empurravam a tabela para fora da primeira dobra. Aqui viram uma faixa
     compacta — mesma informação, ~40% da altura. */
  .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .kpi { padding: 7px 10px; }
  .kpi .label { font-size: var(--text-xs); letter-spacing: 0.04em; }
  .kpi .value { font-size: 1.02em; margin-top: 1px; }
  /* Menu do seletor de colunas */
  #ddColunas { position: relative; }
  #colunasMenu {
    display: none; position: absolute; right: 0; top: calc(100% + 4px);
    background: var(--bg-1); border: 1px solid var(--border-strong);
    border-radius: var(--r-md); padding: 10px; z-index: 50; min-width: 190px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  #ddColunas.open #colunasMenu { display: block; }
  /* O grid.js dimensiona a coluna pela largura do CABEÇALHO e respeita o
     min-width que a página declarar no <th>. Sem estes pisos, "Número" media
     94px e cortava OS-2026-0075 em "OS-202…", e Total cortava o valor. */
  /* O orçamento é a largura do wrapper em 1440px (1128px, descontados o menu e
     os respiros). A soma dos pisos tem de caber nele: estourar joga a última
     coluna (Total) para fora da vista, atrás de uma rolagem horizontal que
     ninguém percebe que existe. Lápis 40 + 132 + 150 + 140 + 110 + 134 + 146
     + 148 + 108 = 1126, com folga para o encaixe final do grid.js. A coluna
     do lápis mede 60px, e não 40 — é ela que faz a conta fechar no limite. */
  th.c-numero  { min-width: 132px; }   /* OS-2026-0075 inteiro */
  th.c-cliente { min-width: 138px; }   /* quebra linha, então o piso é menor */
  th.c-titulo  { min-width: 128px; }   /* idem */
  th.c-tipo    { min-width: 110px; }
  th.c-tecnico { min-width: 134px; }   /* "Marcos Ferreira" */
  th.c-status  { min-width: 146px; }   /* "Aguardando peça" */
  th.c-sla     { min-width: 148px; }   /* "✖ Fora do prazo" */
  th.c-total   { min-width: 108px; }   /* R$ 37.506,00 */
  /* Nome de cliente e título são longos e variáveis: em vez de cortar, quebram
     linha. O .grid-on do grid.js põe nowrap em toda td — daqui para baixo
     vence por especificidade. */
  .tbl-wrap table.grid-on td.q-quebra {
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    line-height: 1.3;
  }
</style>
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Ordens de Serviço</h1>
      <small>Assistência, manutenção e instalação</small>
    </div>
    <div class="actions">
      <a class="btn btn-primary" href="/os/nova-os.html">+ Nova OS</a>
    </div>
  </div>

  <div id="alertGlobal"></div>
  <div class="kpi-grid" id="kpis"></div>

  <div class="toolbar">
    <input type="text" id="fQ" placeholder="Buscar nº, título ou equipamento…" oninput="debounce(carregar)" style="flex:1;min-width:240px;">
    <select id="fStatus" onchange="carregar()">
      <option value="">Todos status</option>
      <option value="aberta">Aberta</option>
      <option value="em-andamento">Em andamento</option>
      <option value="aguardando-peca">Aguardando peça</option>
      <option value="concluida">Concluída</option>
      <option value="faturada">Faturada</option>
      <option value="cancelada">Cancelada</option>
    </select>
    <select id="fTecnico" onchange="carregar()" style="min-width:160px;"><option value="">Todos técnicos</option></select>
    <select id="fSla" onchange="carregar()" style="min-width:140px;">
      <option value="">SLA: todos</option>
      <option value="atrasado">🚨 Atrasados</option>
      <option value="risco">⚠ Em risco</option>
      <option value="no-prazo">✓ No prazo</option>
    </select>
    <select id="fTipoFiltro" onchange="carregar()" style="min-width:150px;">
      <option value="">Todos os tipos</option>
    </select>
    <div id="ddColunas">
      <button class="btn btn-ghost btn-sm" onclick="toggleColunasMenu(event)"><svg class="ic-sm"><use href="#i-settings"/></svg> Colunas</button>
      <div id="colunasMenu"></div>
    </div>
  </div>

  <div class="toolbar" style="margin-top:-4px;">
    <div style="position:relative;min-width:230px;flex:1;">
      <input type="text" id="fCliFiltro" placeholder="Filtrar por cliente…" oninput="acCliFiltro()" autocomplete="off">
      <input type="hidden" id="fClienteIdFiltro">
      <div id="acCliFiltroList" class="ac-list"></div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--text-2);">Aberta de
      <input type="date" id="fDataIni" onchange="carregar()"></label>
    <label style="display:flex;align-items:center;gap:6px;font-size:var(--text-xs);color:var(--text-2);">até
      <input type="date" id="fDataFim" onchange="carregar()"></label>
    <button class="btn btn-ghost btn-sm" onclick="limparFiltros()">Limpar</button>
    <button class="btn btn-secondary btn-sm" onclick="exportarCSV()"><svg class="ic-sm"><use href="#i-download"/></svg> Exportar CSV</button>
  </div>

  <div class="tbl-wrap" data-grid="ordens-servico">
    <table>
      <thead><tr id="th"></tr></thead>
      <tbody id="tb"><tr><td class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>

  <div id="paginacao" style="display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:10px;font-size:var(--text-xs);color:var(--text-2);"></div>
</main></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/aviso-sistema.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/grid.js"></script>
<script>initSidebar('ordens-servico');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
let debTimer; function debounce(fn){ clearTimeout(debTimer); debTimer=setTimeout(fn,300); }
function fmtBRL(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
// Data sempre dd/mm/aaaa: o banco guarda ISO, o usuário lê o formato daqui.
function fmtData(v){
  if (!v) return '';
  const d = String(v).slice(0,10).split('-');
  return d.length === 3 ? `${d[2]}/${d[1]}/${d[0]}` : String(v);
}

async function carregarTecnicos(){
  const r = await fetch('/api/usuarios').catch(()=>null);
  if (!r) return;
  const d = await r.json();
  if (!d.success) return;
  const opts = d.usuarios.map(u=>`<option value="${u.id}">${u.nome||u.username}</option>`).join('');
  document.getElementById('fTecnico').innerHTML = '<option value="">Todos técnicos</option>' + opts;
}

// Filtros que, quando mudam, invalidam a página atual: continuar na página 7
// depois de estreitar o resultado para 2 páginas devolveria lista vazia.
function montarFiltros(){
  const p = new URLSearchParams();
  const q = document.getElementById('fQ').value.trim();     if (q) p.set('q', q);
  const s = document.getElementById('fStatus').value;       if (s) p.set('status', s);
  const t = document.getElementById('fTecnico').value;      if (t) p.set('tecnicoId', t);
  const sla = document.getElementById('fSla').value;        if (sla) p.set('sla', sla);
  const tipo = document.getElementById('fTipoFiltro').value; if (tipo) p.set('tipoId', tipo);
  const cli = document.getElementById('fClienteIdFiltro').value; if (cli) p.set('clienteId', cli);
  const di = document.getElementById('fDataIni').value;     if (di) p.set('dataIni', di);
  const df = document.getElementById('fDataFim').value;     if (df) p.set('dataFim', df);
  if (ordemAtual) { p.set('ordem', ordemAtual); p.set('dir', dirAtual); }
  return p;
}

let paginaAtual = 1;
let ordemAtual = '';   // vazio = ordem natural do backend (o.id DESC)
let dirAtual = 'desc';

function irParaPagina(n){ paginaAtual = n; carregar(true); }

// Ordenação server-side: com paginação, ordenar só a página na tela daria uma
// ordem que muda de página para página.
function ordenarPor(chave){
  if (ordemAtual === chave) dirAtual = (dirAtual === 'asc' ? 'desc' : 'asc');
  else { ordemAtual = chave; dirAtual = 'asc'; }
  carregar();
}

function limparFiltros(){
  ['fQ','fStatus','fTecnico','fSla','fTipoFiltro','fCliFiltro','fClienteIdFiltro','fDataIni','fDataFim']
    .forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
  document.getElementById('acCliFiltroList').innerHTML = '';
  carregar();
}

async function carregar(manterPagina){
  if (!manterPagina) paginaAtual = 1;
  const p = montarFiltros();
  p.set('pagina', paginaAtual);
  const r = await fetch('/api/os?'+p);
  const d = await r.json();
  if (!d.success) return showAlert(d.error,'error');
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Total</div><div class="value">${d.kpis.total||0}</div></div>
    <div class="kpi warn"><div class="label">Abertas</div><div class="value">${d.kpis.abertas||0}</div></div>
    <div class="kpi"><div class="label">Em andamento</div><div class="value">${d.kpis.execucao||0}</div></div>
    <div class="kpi danger"><div class="label">Atrasadas (SLA)</div><div class="value">${d.kpis.atrasadas||0}</div></div>
    <div class="kpi warn"><div class="label">Em risco (SLA)</div><div class="value">${d.kpis.risco||0}</div></div>
    <div class="kpi success"><div class="label">No prazo</div><div class="value">${d.kpis.noPrazo||0}</div></div>
    <div class="kpi success"><div class="label">Receita</div><div class="value">${fmtBRL(d.kpis.receita)}</div></div>
    ${d.kpis.faturadasSemNota ? `<div class="kpi warn"><div class="label">Faturadas sem nota</div><div class="value">${d.kpis.faturadasSemNota}</div></div>` : ''}
    ${d.kpis.emiteNota ? `<div class="kpi danger"><div class="label">Notas rejeitadas</div><div class="value">${d.kpis.rejeitadas||0}</div></div>` : ''}
  `;
  ordensCache = d.ordens;
  render();
  renderPaginacao(d);
}

// Sem isto a lista mostrava as N primeiras e omitia o resto em silêncio.
function renderPaginacao(d){
  const el = document.getElementById('paginacao');
  const total = d.total || 0;
  if (!total) { el.innerHTML = ''; return; }
  const ini = (d.pagina - 1) * d.porPagina + 1;
  const fim = Math.min(total, ini + d.ordens.length - 1);
  const btn = (rot, alvo, ativo) =>
    `<button class="btn btn-sm ${ativo?'btn-primary':'btn-ghost'}" ${alvo?`onclick="irParaPagina(${alvo})"`:'disabled'}>${rot}</button>`;
  el.innerHTML =
    `<span>${ini}–${fim} de ${total}</span>` +
    btn('‹ anterior', d.pagina > 1 ? d.pagina - 1 : 0) +
    `<span>página ${d.pagina} de ${d.paginas}</span>` +
    btn('próxima ›', d.pagina < d.paginas ? d.pagina + 1 : 0);
}

// ==================== COLUNAS ====================
// A coluna do lápis é fixa (é o acesso à OS) e fica fora da lista.
// `ord` = chave aceita pelo backend (whitelist em os-routes). Coluna sem `ord`
// não é ordenável — SLA e Equipamento são derivados, não têm coluna no banco.
const COLUNAS = [
  { key:'numero',      label:'Número',      default:true,  ord:'numero',  cls:'c-numero',  cel: o=>`<td class="mono"><strong>${o.numero}</strong></td>` },
  { key:'cliente',     label:'Cliente',     default:true,  ord:'cliente', cls:'c-cliente', cel: o=>`<td class="q-quebra">${o.clienteNome}</td>` },
  { key:'titulo',      label:'Título',      default:true,  ord:'titulo',  cls:'c-titulo',  cel: o=>`<td class="q-quebra">${o.titulo}</td>` },
  { key:'tipo',        label:'Tipo de OS',  default:true,  ord:'tipo', cls:'c-tipo', cel: o=>o.tipoNome
      ? `<td><span class="badge" style="background:${o.tipoCor||'#4dabf7'}22;color:${o.tipoCor||'#4dabf7'};border:1px solid ${o.tipoCor||'#4dabf7'}55;">${o.tipoNome}</span></td>`
      : '<td><small class="muted">—</small></td>' },
  { key:'equipamento', label:'Equipamento', default:false, cel: o=>`<td><small>${o.equipamento||''} ${o.marca||''} ${o.modelo||''}</small></td>` },
  { key:'tecnico',     label:'Técnico',     default:true,  ord:'tecnico', cls:'c-tecnico', cel: o=>`<td>${o.tecnicoNomeExibicao||o.tecnicoNome||'<small class="muted">—</small>'}</td>` },
  { key:'status',      label:'Status',      default:true,  ord:'status',  cls:'c-status', cel: o=>`<td><span class="badge badge-os ${badgeClass(o.status)}">${OsRotulos.status(o.status)}</span>${o.statusFiscal?`<br><small class="muted" style="font-size:var(--text-xs);">${OsRotulos.fiscal(o.statusFiscal)}</small>`:''}</td>` },
  { key:'sla',         label:'SLA',         default:true,  cls:'c-sla', cel: o=>`<td>${slaBadge(o.slaStatus)}</td>` },
  { key:'prazo',       label:'Prazo',       default:false, ord:'prazo',   cel: o=>`<td>${o.dataPromessa ? `<small>${fmtData(o.dataPromessa)}</small>` : '<small class="muted">—</small>'}</td>` },
  { key:'aberta',      label:'Aberta',      default:false, ord:'aberta',  cel: o=>`<td>${fmtData(o.dataAbertura)}</td>` },
  { key:'total',       label:'Total',       default:true,  num:true, ord:'total', cls:'c-total', cel: o=>`<td class="num">${fmtBRL(o.valorTotal)}</td>` },
];

let ordensCache = [];
// Chave versionada: a escolha salva é uma lista fechada, então coluna nova
// (Tipo de OS) ficaria invisível para quem já tinha preferência gravada.
// O bump reseta para o default uma vez; a partir daí a escolha volta a valer.
let colunasVisiveis = JSON.parse(localStorage.getItem('os_colunas_v2') || 'null')
  || COLUNAS.filter(c=>c.default).map(c=>c.key);

function salvarColunas(){ localStorage.setItem('os_colunas_v2', JSON.stringify(colunasVisiveis)); }

function toggleColunasMenu(ev){
  ev.stopPropagation();
  document.getElementById('ddColunas').classList.toggle('open');
  document.getElementById('colunasMenu').innerHTML = COLUNAS.map(c => `
    <label style="display:flex;align-items:center;gap:8px;padding:5px;cursor:pointer;font-size:0.88em;text-transform:none;">
      <input type="checkbox" ${colunasVisiveis.includes(c.key)?'checked':''} onchange="alternarColuna('${c.key}', this.checked)" style="width:auto;">
      <span>${c.label}</span>
    </label>`).join('');
}
document.addEventListener('click', e => {
  if (!e.target.closest('#ddColunas')) document.getElementById('ddColunas').classList.remove('open');
});

function alternarColuna(key, on){
  if (on && !colunasVisiveis.includes(key)) colunasVisiveis.push(key);
  else if (!on) colunasVisiveis = colunasVisiveis.filter(k => k!==key);
  salvarColunas();
  render();
}

function render(){
  // Preserva a ordem declarada em COLUNAS: colunasVisiveis guarda só o que
  // está ligado, e marcar de novo empurraria a coluna para o fim da lista.
  const cols = COLUNAS.filter(c => colunasVisiveis.includes(c.key));
  document.getElementById('th').innerHTML = '<th class="col-editar"></th>'
    + cols.map(c => {
        const klass = [c.num ? 'num' : '', c.cls || ''].filter(Boolean).join(' ');
        const attrClass = klass ? ` class="${klass}"` : '';
        if (!c.ord) return `<th${attrClass}>${c.label}</th>`;
        const ativa = ordemAtual === c.ord;
        const seta = ativa ? (dirAtual === 'asc' ? ' ▲' : ' ▼') : '';
        return `<th${attrClass} style="cursor:pointer;user-select:none;${ativa?'color:var(--accent);':''}"
                 onclick="ordenarPor('${c.ord}')" title="Ordenar por ${c.label}">${c.label}${seta}</th>`;
      }).join('');
  const tb = document.getElementById('tb');
  const span = cols.length + 1;
  tb.innerHTML = ordensCache.length ? ordensCache.map(o=>`<tr>
    <td class="col-editar" style="white-space:nowrap;">
      <a class="btn btn-ghost btn-sm btn-icon-only" title="Abrir OS" href="/os/ordem-servico.html?id=${o.id}"><svg class="ic-sm"><use href="#i-edit"/></svg></a>
    </td>
    ${cols.map(c=>c.cel(o)).join('')}
  </tr>`).join('') : `<tr><td colspan="${span}" class="empty">Nenhuma OS</td></tr>`;
}

function badgeClass(s){
  return ({
    'aberta':'pendente',
    'em-andamento':'em_separacao',
    'aguardando-peca':'pendente',
    'concluida':'entregue',
    'faturada':'faturado',
    'cancelada':'cancelado'
  })[s] || '';
}
function slaBadge(s){
  if (!s) return '<small class="muted">—</small>';
  const map = {
    'atrasado':  { cls: 'cancelado',   txt: '🚨 Atrasado' },
    'risco':     { cls: 'pendente',    txt: '⚠ Em risco' },
    'no-prazo':  { cls: 'entregue',    txt: '✓ No prazo' },
    'cumprido':  { cls: 'faturado',    txt: '✓ Cumprido' },
    'estourado': { cls: 'cancelado',   txt: '✖ Fora do prazo' },
  };
  const c = map[s] || { cls: '', txt: OsRotulos.sla(s) };
  return `<span class="badge badge-os ${c.cls}" style="font-size:var(--text-xs);">${c.txt}</span>`;
}

let tiposOS = [];
async function carregarTipos(){
  try {
    const r = await fetch('/api/os-tipos');
    const d = await r.json();
    tiposOS = d.tipos || [];
    document.getElementById('fTipoFiltro').innerHTML = '<option value="">Todos os tipos</option>'
      + tiposOS.map(t => `<option value="${t.id}">${t.nome}</option>`).join('');
  } catch (e) {
    console.error('[tipos]', e);
  }
}

// ==================== FILTRO DE CLIENTE ====================
let acFiltroTimer;
function acCliFiltro(){
  clearTimeout(acFiltroTimer);
  const cx = document.getElementById('fCliFiltro');
  const lista = document.getElementById('acCliFiltroList');
  // Apagar o texto tem de soltar o filtro, senão o clienteId fica preso.
  if (!cx.value.trim()) {
    lista.innerHTML = '';
    if (document.getElementById('fClienteIdFiltro').value) {
      document.getElementById('fClienteIdFiltro').value = '';
      carregar();
    }
    return;
  }
  if (cx.value.trim().length < 2) { lista.innerHTML = ''; return; }
  acFiltroTimer = setTimeout(async () => {
    const r = await fetch('/api/pessoas?q=' + encodeURIComponent(cx.value.trim()));
    const d = await r.json();
    lista.innerHTML = (d.pessoas || d.data || []).slice(0,10).map(p =>
      `<div onclick='selCliFiltro(${p.id}, ${JSON.stringify(p.razaoSocial)})'>${p.razaoSocial} <small class="muted">${p.cpfCnpj||""}</small></div>`
    ).join('');
  }, 200);
}
function selCliFiltro(id, nome){
  document.getElementById('fClienteIdFiltro').value = id;
  document.getElementById('fCliFiltro').value = nome;
  document.getElementById('acCliFiltroList').innerHTML = '';
  carregar();
}

// ==================== CSV ====================
// Exporta o resultado inteiro do filtro, não só a página na tela — senão o
// arquivo herda o recorte da paginação sem avisar.
async function exportarCSV(){
  const p = montarFiltros();
  p.set('limit', '500');
  let linhas = [], pagina = 1, paginas = 1;
  do {
    p.set('pagina', pagina);
    const d = await fetch('/api/os?'+p).then(r=>r.json());
    if (!d.success) return showAlert(d.error,'error');
    linhas = linhas.concat(d.ordens);
    paginas = d.paginas || 1;
    pagina++;
  } while (pagina <= paginas);

  if (!linhas.length) return showAlert('Nada para exportar','error');

  const cols = [
    ['Número','numero'], ['Cliente','clienteNome'], ['Título','titulo'],
    ['Tipo de OS','tipoNome'], ['Equipamento','equipamento'], ['Marca','marca'],
    ['Modelo','modelo'], ['Série','numeroSerieEquipamento'],
    ['Técnico', o=>o.tecnicoNomeExibicao||o.tecnicoNome||''],
    ['Status','status'], ['SLA','slaStatus'],
    ['Abertura', o=>(o.dataAbertura||'').slice(0,10)],
    ['Prazo','dataPromessa'], ['Conclusão', o=>(o.dataConclusao||'').slice(0,10)],
    ['Peças','valorPecas'], ['Serviços','valorServicos'], ['Total','valorTotal'],
    ['Defeito relatado','defeitoRelatado'], ['Diagnóstico','diagnostico'], ['Solução','solucao'],
  ];
  const escapaCSV = v => {
    const s = v == null ? '' : String(v);
    return /[";\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  // ; como separador e BOM: é o que o Excel em pt-BR abre sem jogar tudo
  // numa coluna só. Mesmo formato de os-relatorios.html.
  const csv = '﻿' + [
    cols.map(c=>c[0]).join(';'),
    ...linhas.map(o => cols.map(c =>
      escapaCSV(typeof c[1] === 'function' ? c[1](o) : o[c[1]])).join(';')),
  ].join('\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
  a.download = `ordens-servico-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  showAlert(`${linhas.length} OS exportada(s)`);
}
