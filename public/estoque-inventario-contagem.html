<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem de Inventário · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
<style>
  /* Modo contagem: foco no input, layout mobile-friendly */
  .contador-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 24px;
    margin-bottom: 16px;
  }
  .contador-card .sku { font-size: 0.85em; color: var(--text-2); font-family: monospace; }
  .contador-card .desc { font-size: 1.1em; font-weight: 600; color: var(--text-0); margin: 4px 0 8px; }
  .contador-card .meta { color: var(--text-2); font-size: 0.88em; margin-bottom: 14px; display: flex; gap: 14px; flex-wrap: wrap; }
  .contador-card .input-gigante input {
    font-size: 2em;
    padding: 18px 20px;
    text-align: center;
    font-weight: 700;
    font-family: inherit;
  }
  .contador-card .meta .sys-saldo { color: var(--accent); font-weight: 700; }
  .nav-buttons { display:flex; gap:10px; justify-content: space-between; margin-top: 16px; }
  .nav-buttons .btn { min-width: 120px; }
  .progresso-bar {
    background: var(--bg-3); border-radius: 999px; height: 8px;
    overflow: hidden; margin-bottom: 14px;
  }
  .progresso-bar .fill { background: var(--accent); height: 100%; transition: width 0.2s; }
  .item-lista { max-height: 380px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--r-md); margin-top: 12px; }
  .item-lista .item-row {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    cursor: pointer; display: flex; gap: 10px; align-items: center;
    font-size: 0.9em;
  }
  .item-lista .item-row:last-child { border-bottom: none; }
  .item-lista .item-row:hover { background: var(--bg-hover); }
  .item-lista .item-row.atual { background: rgba(96,165,250,0.15); border-left: 3px solid var(--accent); }
  .item-lista .item-row.contado { color: var(--text-2); }
  .item-lista .item-row.divergente { background: rgba(251,191,36,0.08); }
  .item-lista .item-row.divergente.atual { background: rgba(251,191,36,0.18); }
  .div-badge {
    padding: 1px 6px; border-radius: 10px; font-size: 0.72em; font-weight: 700;
  }
  .div-badge.ok { background: rgba(52,211,153,0.15); color: var(--success); }
  .div-badge.pos { background: rgba(52,211,153,0.15); color: var(--success); }
  .div-badge.neg { background: rgba(239,68,68,0.15); color: var(--danger); }
</style>
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1 id="invCodigo">Contagem de Inventário</h1>
      <small id="invDesc"></small>
    </div>
    <div class="actions">
      <a class="btn btn-secondary" href="/estoque-inventario.html">← Inventários</a>
      <button class="btn btn-primary" id="btnFinalizar" onclick="finalizar()" disabled>Finalizar inventário</button>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div class="kpi-grid" id="kpis"></div>

  <div class="progresso-bar"><div class="fill" id="progressoFill" style="width:0%"></div></div>

  <!-- Contador atual (único item em foco) -->
  <div id="contadorAtual"></div>

  <div class="nav-buttons">
    <button class="btn btn-secondary" onclick="anterior()">← Anterior</button>
    <button class="btn btn-secondary" onclick="pularNaoContado()">Próximo não contado →</button>
    <button class="btn btn-secondary" onclick="proximo()">Próximo →</button>
  </div>

  <!-- Lista de todos os itens -->
  <h3 style="margin-top: 30px; font-size: 1em; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.08em;">Todos os itens</h3>
  <div class="toolbar">
    <input type="text" id="filtItem" placeholder="Filtrar por SKU ou descrição…" oninput="renderLista()" style="flex:1;min-width:220px;">
    <select id="filtContagem" onchange="renderLista()">
      <option value="">Todos</option>
      <option value="pendentes">Pendentes</option>
      <option value="contados">Contados</option>
      <option value="divergentes">Com divergência</option>
    </select>
  </div>
  <div class="item-lista" id="itemLista"></div>
</main></div>

<div id="toasts"></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('estoque-inventario');</script>
<script>
function showAlert(m,t='success'){ const e=document.getElementById('alertGlobal'); e.className='alert '+t; e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',5000); }
function fmt(v){ return (v==null||isNaN(v))?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

const params = new URLSearchParams(window.location.search);
const INVENTARIO_ID = Number(params.get('id'));
if (!INVENTARIO_ID) { alert('ID do inventário não informado'); window.location.href = '/estoque-inventario.html'; }

let inventario = null;
let itens = [];         // array completo
let indiceAtual = 0;    // índice do item em foco
let somenteLeitura = false;

async function carregar(){
  const r = await fetch('/api/inventarios/'+INVENTARIO_ID);
  const d = await r.json();
  if(!d.success) { showAlert(d.error,'error'); return; }
  inventario = d.inventario;
  itens = d.itens;
  somenteLeitura = inventario.status === 'finalizado' || inventario.status === 'cancelado';

  document.getElementById('invCodigo').textContent = 'Inventário ' + inventario.codigo;
  document.getElementById('invDesc').textContent =
    (inventario.descricao || '') + ' · status: ' + inventario.status +
    (inventario.usuarioResponsavel ? ' · resp: '+inventario.usuarioResponsavel : '');

  renderKpis(d.estatisticas);

  // Se há itens não contados, posiciona no primeiro pendente; senão no 0
  if (!somenteLeitura) {
    const idx = itens.findIndex(i => i.saldoContado == null);
    indiceAtual = idx >= 0 ? idx : 0;
  } else {
    indiceAtual = 0;
  }

  document.getElementById('btnFinalizar').disabled =
    somenteLeitura || !itens.some(i => i.saldoContado != null);

  renderAtual();
  renderLista();
}

function renderKpis(e){
  const pct = e.total > 0 ? Math.round(100*e.contados/e.total) : 0;
  document.getElementById('progressoFill').style.width = pct+'%';
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="label">Total de itens</div><div class="value">${e.total}</div></div>
    <div class="kpi success"><div class="label">Contados</div><div class="value">${e.contados} <small>(${pct}%)</small></div></div>
    <div class="kpi warn"><div class="label">Pendentes</div><div class="value">${e.pendentes}</div></div>
    <div class="kpi danger"><div class="label">Divergências</div><div class="value">${e.comDivergencia} <small>R$ ${fmt(e.valorDivergencia)}</small></div></div>
  `;
}

function renderAtual(){
  const box = document.getElementById('contadorAtual');
  if (!itens.length) { box.innerHTML = '<div class="empty">Inventário sem itens</div>'; return; }
  if (indiceAtual < 0) indiceAtual = 0;
  if (indiceAtual >= itens.length) indiceAtual = itens.length - 1;

  const it = itens[indiceAtual];
  const posicao = `${indiceAtual+1} / ${itens.length}`;
  const loteInfo = it.loteNumero ? `<span>Lote: <strong>${it.loteNumero}</strong>${it.loteValidade?' (val '+it.loteValidade+')':''}</span>` : '';
  const difInfo = it.saldoContado != null ? `<span>Contado: <strong>${fmt(it.saldoContado)}</strong> · Diferença: <strong style="color:${Math.abs(it.diferenca)<0.001?'var(--success)':it.diferenca>0?'var(--success)':'var(--danger)'}">${it.diferenca>0?'+':''}${fmt(it.diferenca)}</strong></span>` : '';

  box.innerHTML = `
    <div class="contador-card">
      <div class="sku">${it.sku} · item ${posicao}</div>
      <div class="desc">${it.descricao}</div>
      <div class="meta">
        <span>Unidade: <strong>${it.unidade||'—'}</strong></span>
        <span>Saldo sistema: <span class="sys-saldo">${fmt(it.saldoSistema)}</span></span>
        <span>Custo unit.: R$ ${fmt(it.custoUnitario)}</span>
        ${loteInfo}
        ${difInfo}
      </div>
      <div class="input-gigante">
        <label style="color:var(--text-2);font-size:0.85em;">Saldo contado (físico)</label>
        <input type="number" step="0.01" id="inputContagem"
               value="${it.saldoContado != null ? it.saldoContado : ''}"
               ${somenteLeitura?'disabled':'autofocus'}
               onkeydown="if(event.key==='Enter') salvarEAvancar()">
      </div>
      <div class="form-row" style="margin-top:14px;">
        <div class="form-group full-width">
          <label>Observação (opcional)</label>
          <input type="text" id="inputObs" value="${(it.observacoes||'').replace(/"/g,'&quot;')}" ${somenteLeitura?'disabled':''}>
        </div>
      </div>
      ${!somenteLeitura ? `<div class="actions-bar"><button class="btn btn-primary" onclick="salvarEAvancar()">Salvar e avançar (Enter)</button></div>` : ''}
    </div>
  `;
}

async function salvarEAvancar(){
  const it = itens[indiceAtual];
  const val = document.getElementById('inputContagem').value;
  if (val === '' || isNaN(Number(val))) return showAlert('Informe o saldo contado', 'error');
  const obs = document.getElementById('inputObs').value || null;

  try {
    const r = await fetch(`/api/inventarios/${INVENTARIO_ID}/itens/${it.id}/contar`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ saldoContado: Number(val), observacoes: obs })
    });
    const d = await r.json();
    if (!d.success) return showAlert(d.error, 'error');

    // Atualiza item local
    itens[indiceAtual] = { ...itens[indiceAtual], ...d.item };
    // Recarrega KPIs (simples: volta a pegar do server)
    const rk = await fetch('/api/inventarios/'+INVENTARIO_ID);
    const dk = await rk.json();
    if (dk.success) {
      renderKpis(dk.estatisticas);
      document.getElementById('btnFinalizar').disabled = !itens.some(i => i.saldoContado != null);
    }

    renderLista();
    // Avança pro próximo não contado (ou simplesmente próximo)
    pularNaoContado();
  } catch(e){ showAlert('Erro: '+e.message, 'error'); }
}

function anterior(){
  if (indiceAtual > 0) indiceAtual--;
  renderAtual();
}
function proximo(){
  if (indiceAtual < itens.length-1) indiceAtual++;
  renderAtual();
}
function pularNaoContado(){
  // Procura a partir do próximo até o fim, depois reinicia do começo
  let idx = -1;
  for (let i = indiceAtual+1; i < itens.length; i++) if (itens[i].saldoContado == null) { idx = i; break; }
  if (idx < 0) for (let i = 0; i < itens.length; i++) if (itens[i].saldoContado == null) { idx = i; break; }
  if (idx < 0) { showAlert('Todos os itens contados. Pode finalizar.', 'success'); return; }
  indiceAtual = idx;
  renderAtual();
}

function renderLista(){
  const filtQ = document.getElementById('filtItem').value.toLowerCase();
  const filtC = document.getElementById('filtContagem').value;
  const filtered = itens.map((it, idx) => ({ ...it, __idx: idx })).filter(it => {
    if (filtQ && !((it.sku||'').toLowerCase().includes(filtQ) || (it.descricao||'').toLowerCase().includes(filtQ))) return false;
    if (filtC === 'pendentes' && it.saldoContado != null) return false;
    if (filtC === 'contados' && it.saldoContado == null) return false;
    if (filtC === 'divergentes' && (it.diferenca == null || Math.abs(it.diferenca) < 0.001)) return false;
    return true;
  });

  const box = document.getElementById('itemLista');
  if (!filtered.length) { box.innerHTML = '<div class="empty">Nenhum item</div>'; return; }
  box.innerHTML = filtered.map(it => {
    let difBadge = '<span class="div-badge ok">pendente</span>';
    if (it.saldoContado != null) {
      if (Math.abs(it.diferenca) < 0.001) difBadge = '<span class="div-badge ok">OK</span>';
      else if (it.diferenca > 0) difBadge = `<span class="div-badge pos">+${fmt(it.diferenca)}</span>`;
      else difBadge = `<span class="div-badge neg">${fmt(it.diferenca)}</span>`;
    }
    const classes = ['item-row'];
    if (it.__idx === indiceAtual) classes.push('atual');
    if (it.saldoContado != null) classes.push('contado');
    if (it.diferenca != null && Math.abs(it.diferenca) > 0.001) classes.push('divergente');
    return `<div class="${classes.join(' ')}" onclick="irPara(${it.__idx})">
      <strong style="font-family:monospace;min-width:140px;">${it.sku}</strong>
      <span style="flex:1;">${it.descricao}${it.loteNumero?' · lote '+it.loteNumero:''}</span>
      <span style="color:var(--text-2);">sist: ${fmt(it.saldoSistema)}</span>
      ${it.saldoContado != null ? `<span>cont: ${fmt(it.saldoContado)}</span>` : ''}
      ${difBadge}
    </div>`;
  }).join('');
}
function irPara(idx){ indiceAtual = idx; renderAtual(); renderLista(); }

async function finalizar(){
  const pendentes = itens.filter(i => i.saldoContado == null).length;
  let msg = `Finalizar inventário? Isso gerará ajustes automáticos no estoque para todos os itens divergentes.`;
  if (pendentes > 0) msg += `\n\n⚠️ ${pendentes} item(ns) não foram contados. Eles serão ignorados (nenhum ajuste gerado).`;
  if (!confirm(msg)) return;

  try {
    const r = await fetch('/api/inventarios/'+INVENTARIO_ID+'/finalizar', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ ignorarNaoContados: pendentes > 0 })
    });
    const d = await r.json();
    if (!d.success) return showAlert(d.error, 'error');
    showAlert(`Inventário finalizado. ${d.totalDivergencias} ajuste(s) gerado(s), valor divergência R$ ${fmt(d.valorDivergencia)}.`);
    setTimeout(() => carregar(), 1000);
  } catch(e){ showAlert('Erro: '+e.message, 'error'); }
}

carregar();
</script>
</body></html>
