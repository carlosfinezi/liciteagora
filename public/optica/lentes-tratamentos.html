<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tratamentos de lente · Licite Agora</title>
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/app-modern.css">
</head>
<body>
<div class="layout"><main class="main-content">
  <div class="page-header">
    <div>
      <h1>Tratamentos de lente</h1>
      <small>Cadastro de tratamentos aplicáveis (antirreflexo, blue cut, fotossensível etc.)</small>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="novo()">+ Novo tratamento</button>
    </div>
  </div>

  <div id="alertGlobal"></div>

  <div id="moduleOff" class="panel" style="display:none;text-align:center;padding:40px 20px;">
    <h3 style="margin:0 0 8px 0;">Módulo Ótica desativado</h3>
    <p class="muted" style="margin:0;">Este módulo é liberado pela equipe Licite Agora. Fale com o suporte para ativar.</p>
  </div>

  <div id="conteudo" style="display:none;">
    <div class="panel" style="margin-bottom:16px;">
      <h3 style="margin:0 0 12px 0;" id="formTitulo">Adicionar item</h3>
      <div class="form-row">
        <div class="form-group" style="flex:0 0 100px;">
          <label>Ordem</label>
          <input type="number" id="fOrdem" min="0" value="999">
        </div>
        <div class="form-group">
          <label>Código *</label>
          <input type="text" id="fCodigo" placeholder="ex.: antirreflexo">
        </div>
        <div class="form-group" style="flex:2;">
          <label>Rótulo *</label>
          <input type="text" id="fLabel" placeholder="ex.: Antirreflexo (AR)">
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-ghost" id="btnCancelar" onclick="novo()" style="display:none;">Cancelar</button>
        <button class="btn btn-primary" id="btnSalvar" onclick="salvar()">Adicionar</button>
      </div>
    </div>

    <div class="panel">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th style="width:80px;">Ordem</th>
            <th>Código</th>
            <th>Rótulo</th>
            <th>Status</th>
            <th></th>
          </tr></thead>
          <tbody id="tb"><tr><td colspan="5" class="empty">Carregando…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main></div>

<script src="/js/menu-config.js"></script>
<script src="/js/sidebar.js"></script>
<script>initSidebar('lentes-tratamentos');</script>
<script src="/optica/lentes-lookup.js"></script>
<script>
initLookupPage({
  tipo: 'tratamentos',
  codigoPlaceholder: 'ex.: antirreflexo',
  labelPlaceholder: 'ex.: Antirreflexo (AR)',
});
</script>
</body>
</html>
